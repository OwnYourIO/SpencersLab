# Renovate on Forgejo Actions: one daily scheduled pass opening dependency
# PRs against this repo, running in a container job on the official Renovate
# image. No action steps: Renovate clones and pushes the repository itself
# with its own token, and the actions mirror carries no proven inventory
# beyond actions/checkout to rely on.
#
# The job fires where the instance-side repo variable ROLE lists dev. Guards
# test ROLE membership with contains(), the repo-wide shape, so a list value
# like dev,prod fires this job too — that instance then runs the daily pass
# and opens dependency PRs of its own. An unset ROLE renders empty and fires
# nothing — the same fail-safe class as main-sync's header; containers-build
# guards widen on unset and this one deliberately does not. Moving execution
# to the other instance is a one-word flip of the job guard plus mirroring
# the instance-minted variable and secrets there.
#
# The file carries no token value and no instance host: endpoints and repo
# come from run contexts, and the bot PAT and the GitHub read-only donor
# token arrive as Actions secrets minted in the repo's settings — so it is
# identical-safe to host on both instances.
#
# The image pin is an immutable full-patch tag: these runners never re-pull a
# tag they have already cached, so a floating tag or a minor rollup would
# stick at its first-pull content forever.
#
# Self-update: that pin is tracked by Renovate's own built-in github-actions
# manager, which reads container image lines in workflow files natively — so
# there is deliberately no annotation above the image line and no config-side
# leg or suppression rule for this file (owner ruling, ticket DECISIONS
# D12/D13): a second manager claiming the same line would double-match. The
# same manager also proposes runs-on label and uses-pin bumps repo-wide; the
# owner accepted that churn, guarded by the suites' label whitelists and the
# human-merge posture (neither class is in any automerge list).
#
# The job-env RENOVATE_GIT_AUTHOR stamp pins the commit identity independently
# of platform /user discovery. Its value is minted instance-side as a
# repo-scoped Actions variable — D21's pairing-law address, Renovate
# <tms@spencerslab.com>, the running PAT account's commit email — a variable
# not a secret because the identity is public in every commit header
# (DECISIONS D23). Guard arithmetic per D17/D21: the variable's value ∪
# renovate.json's gitIgnoredAuthors covers every author email on an open
# PR-head, so orphaned pipeline-bot commits stay ignorable and drift of the
# forge account's real name or email cannot silently change what the guard
# authorizes. With the variable absent, its env value renders empty, empty
# env values are skipped, and discovery silently takes effect again: recovery
# still holds — the discovered email is the one open PR-heads carry — but the
# stamp no-ops without a signal, voiding the determinism it exists for;
# hence the variable is created on the executing instance before this file
# merges (owner action UA12).
#
# Schedules are read from the default branch only, so branch testing rides a
# manual dispatch run.

name: Renovate

on:
  schedule:
    - cron: '17 6 * * *'  # 06:17 UTC daily — a quiet minute on the capacity:1 runner
  workflow_dispatch: {}

jobs:
  renovate:
    if: contains(vars.ROLE, 'dev')
    runs-on: ubuntu-24.04
    # No timeout-minutes: the lab runner's own 30m job ceiling bounds the
    # pass, and a restated value would drift from the runner config.
    container:
      image: ghcr.io/renovatebot/renovate:44.181.5-full
      # Image-index digest of the tag, read anonymously at implementation
      # time: sha256:9dc90dea9a6fd0c6f0ee86a138817aa48fb01b9e57c321687e4ba35de64444f4
    env:
      LOG_LEVEL: info
      RENOVATE_PLATFORM: forgejo
      RENOVATE_ENDPOINT: ${{ github.server_url }}
      RENOVATE_REPOSITORIES: ${{ github.repository }}
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
      RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
      RENOVATE_GIT_AUTHOR: ${{ vars.RENOVATE_GIT_AUTHOR }}
      # Declared, not inherited: without this key a base-image default flip
      # back to install mode silently re-arms the PR #112/#113 class, where
      # the sandbox could not run helm and chart-dep PRs shipped stale locks
      # (cf-55 C12, 2026-11-25).
      RENOVATE_BINARY_SOURCE: global
    steps:
      - name: diag
        run: |
          set -euo pipefail
          echo "ROLE=${{ vars.ROLE }}"
          renovate --version
      - name: renovate
        run: |
          set -euo pipefail
          renovate
