# Renovate on Forgejo Actions: one daily scheduled pass opening dependency
# PRs against this repo, running in a container job on the official Renovate
# image. No action steps: Renovate clones and pushes the repository itself
# with its own token, and the actions mirror carries no proven inventory
# beyond actions/checkout to rely on.
#
# The job fires only where the instance-side repo variable ROLE is dev (the
# dev-stage instance); an unset ROLE renders empty and fires nothing — the
# same fail-safe class as main-sync's header. Moving execution to the other
# instance is a one-word flip of the job guard plus mirroring the
# instance-minted variable and secrets there.
#
# The file carries no token value and no instance host: endpoints and repo
# come from run contexts, and the bot PAT and the GitHub read-only donor
# token arrive as Actions secrets minted in the repo's settings — so it is
# identical-safe to host on both instances.
#
# The image pin is an immutable full-patch tag: these runners never re-pull a
# tag they have already cached, so a floating tag or a minor rollup would
# stick at its first-pull content forever.
#
# Self-update: that pin is tracked by Renovate's own built-in github-actions
# manager, which reads container image lines in workflow files natively — so
# there is deliberately no annotation above the image line and no config-side
# leg or suppression rule for this file (owner ruling, ticket DECISIONS
# D12/D13): a second manager claiming the same line would double-match. The
# same manager also proposes runs-on label and uses-pin bumps repo-wide; the
# owner accepted that churn, guarded by the suites' label whitelists and the
# human-merge posture (neither class is in any automerge list).
#
# Schedules are read from the default branch only, so branch testing rides a
# manual dispatch run.

name: Renovate

on:
  schedule:
    - cron: '17 6 * * *'  # 06:17 UTC daily — a quiet minute on the capacity:1 runner
  workflow_dispatch: {}

jobs:
  renovate:
    if: vars.ROLE == 'dev'
    runs-on: ubuntu-24.04
    # No timeout-minutes: the lab runner's own 30m job ceiling bounds the
    # pass, and a restated value would drift from the runner config.
    container:
      image: ghcr.io/renovatebot/renovate:44.239.1
      # Image-index digest of the tag, read anonymously at implementation
      # time: sha256:611eac05a6ee11c06d23157ae2ca11364f5b4a096c12d7f82a65aec2b6ec8a48
    env:
      LOG_LEVEL: info
      RENOVATE_PLATFORM: forgejo
      RENOVATE_ENDPOINT: ${{ github.server_url }}
      RENOVATE_REPOSITORIES: ${{ github.repository }}
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
      RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
    steps:
      - name: diag
        run: |
          set -euo pipefail
          echo "ROLE=${{ vars.ROLE }}"
          renovate --version
      - name: renovate
        run: |
          set -euo pipefail
          renovate
