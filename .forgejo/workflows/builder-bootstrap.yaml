# Single-purpose recovery lane: a bare dispatch (re)mints the lab's build
# image, containers/forgejo-runner — the baked job image every other
# workflow in this family schedules on.
#
# It exists because of a bootstrap paradox, dated 2026-11-22
# (cf-6-feat-builder-bootstrap): every other workflow runs on the baked
# job image this very pipeline publishes, so the moment that image is
# missing or stale the normal lanes cannot start and cannot heal
# themselves. This lane breaks the circle by running on the PUBLIC act
# image (the ubuntu-22.04 label, which maps outside this repo to an
# upstream act-22.04 that is schedulable without anything from here
# having been published first) and using the live in-pod dind socket,
# exactly like the baked lanes do.
#
# Scope ruling (owner, 2026-11-22, cf-6-feat-builder-bootstrap-1): the
# lane is responsible ONLY for the build image. The earlier general shape
# — a dispatch naming containers for a rebuild — was superseded after the
# owner hit its blank-field silent-empty no-op. A dispatch takes no input:
# this lane exists to mint exactly one image, so the button IS the whole
# answer and the trap is structurally gone.
#
# Trigger: workflow_dispatch ONLY, by ruling (P1). A second auto-push arm
# would double-publish against containers-build on every bump merge once
# the paradox is healed, and it would need a per-run existence check to
# avoid clobbering legitimate baked-lane builds. Collision with
# containers-build cannot race a publish anyway: this lane fires only on
# human dispatch and the lab runner has capacity 1, so every job of every
# workflow serializes through one pod; the queue-waiting concurrency
# block below keeps even two dispatches honest. containers-build stays
# the automatic lane.
#
# ROLE guard is NARROW on unset: this lane MINTS calendar tags, so it
# belongs to the fail-safe class with main-sync/renovate/release, not to
# containers-build's builder-class widen. A widen here would let an
# unset-ROLE dev-role instance mint calendar releases — the role-law
# violation the design pre-rejected. A dispatch on a dev-role instance is
# therefore inert by guard, not by accident: the recovery story is
# prod-role-only.
#
# Targets (owner rulings 2026-11-22, R-B + OQ-1=B): the building
# instance's own registry ONLY — the lane neither pushes nor reads ghcr
# (the bootstrap build goes to the Forgejo instance, not github, and its
# calendar number is walked from that registry alone). NO third target
# of any shape, NO ghcr credential: the credential surface is closed by
# contract suite b6 to the forge push PAT; a future cross-host arm must
# earn a fresh owner ruling first.
#
# Calendar law, single-registry (OQ-1=B): N is one past the highest
# yy.mm.* tag ON THE INSTANCE REGISTRY, advanced past any manifest it
# already holds, the walk finished before the first push; one fixed
# month per job; the one push chain carries the trio. The lane's N may
# legitimately differ from what containers-build's two-registry union
# would mint for the same content — the fleet consumes instance-registry
# refs for this image, so that divergence is accepted by ruling, not
# overlooked. There is NO skip-if-exists mode: every successful publish
# mints a fresh N, and a re-dispatch of unchanged content mints N+1 too
# — gaps, never clobbers. Expect the first cold mint of the ~10GB-class
# build image to run near the 30-minute runner ceiling; a timeout red is
# retry-safe under this law and each retry resumes warm.
#
# Renovate churn warning: the runs-on line below is the paradox guard.
# The built-in runs-on manager proposes repo-wide bumps; one auto-PR
# flipping this file to a baked label re-arms the paradox — the suite
# reddens it, and label-bump PRs stay human-merged.
#
# Steps are plain shell; the instance registry host is derived from the
# server URL inside steps, never a literal; the Actions job token cannot
# write packages, so the pushes use the human-minted forge PAT.

on:
  workflow_dispatch:

concurrency:
  cancel-in-progress: false

jobs:
  publish:
    if: contains(vars.ROLE, 'prod')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: diag
        run: |
          set -euo pipefail
          echo "ROLE=[${{ vars.ROLE }}]"
          echo "event=${{ forgejo.event_name }} run=${{ forgejo.run_number }}"
          # First-fire recorder for the runner's Actions-cache env and the
          # buildx the job never uses; neither may fail the job.
          env | grep ACTIONS_ || true
          docker buildx version || true
          # The plain docker build below talks to the in-pod dind daemon
          # (chart socket contract); if it is unreachable, nothing after
          # this point is worth logging.
          docker info

      - name: log in to the forge registry and derive its calendar N
        env:
          FORGE_SERVER_URL: ${{ forgejo.server_url }}
        run: |
          set -euo pipefail
          # The registry host derives from the env server_url, never from a
          # literal; the server URL is stored with a trailing slash, and
          # host//owner/img is an invalid reference, so every strip trims it.
          # The /v2/ reads below wear an explicit TLS scheme (curl defaults a
          # scheme-less URL to http, and these reads carry the push PAT);
          # docker login and the image refs stay bare hostnames, where a
          # scheme would itself be an invalid reference.
          forge_registry=${FORGE_SERVER_URL#https://}
          forge_registry=${forge_registry%/}
          forge_pat='${{ secrets.FORGE_PUSH_TOKEN }}' && printf '%s' "$forge_pat" | docker login "$forge_registry" -u forge-push --password-stdin
          forge_api="https://$forge_registry/v2/curatedforest/forgejo-runner"
          month=$(date +%y.%m)
          n_forge=1
          # Mirrored tolerance posture: absence must arrive as an HTTP
          # status, never a transport failure — 404 NAME_UNKNOWN is this
          # registry's answer for a package nobody has pushed. 401/403/404
          # contribute no tags and earn no walk; any other code is a
          # malfunction and stays fatal. The walk runs only under a 200
          # list, where the manifest 200/404 semantics hold.
          forge_list=$(curl -sS -w '\n%{http_code}' -u "forge:$forge_pat" "$forge_api/tags/list")
          forge_list_code=${forge_list##*$'\n'}
          if [ "$forge_list_code" = 200 ]; then
            n_forge=$(printf '%s' "${forge_list%$'\n'*}" | YYMM="$month" bash scripts/forgejo-container-detect.sh next-n)
            forge_manifest_code() {
              curl -s -o /dev/null -w '%{http_code}' -I \
                -u "forge:$forge_pat" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
                "$forge_api/manifests/$1"
            }
            forge_code=$(forge_manifest_code "$month.$n_forge")
            forge_advance=0
            while [ "$forge_code" != 404 ]; do
              if [ "$forge_code" != 200 ]; then
                echo "unexpected HTTP $forge_code for $forge_api/manifests/$month.$n_forge" >&2
                exit 1
              fi
              forge_advance=$((forge_advance + 1))
              if [ "$forge_advance" -gt 50 ]; then
                echo "no free $month.N tag on the forge registry within 50 of its maximum" >&2
                exit 1
              fi
              n_forge=$((n_forge + 1))
              forge_code=$(forge_manifest_code "$month.$n_forge")
            done
          elif [ "$forge_list_code" != 401 ] && [ "$forge_list_code" != 403 ] && [ "$forge_list_code" != 404 ]; then
            echo "unexpected HTTP $forge_list_code from $forge_api/tags/list" >&2
            exit 1
          fi
          # Log the tolerated codes: a list read that answered 401/403/404
          # left N at its default with no existence walk, and the run log
          # is where that degraded read stays visible.
          echo "n_forge=$n_forge list=$forge_list_code"
          # Fix the calendar month once for the whole job: the walk and the
          # push trio must use the same month even when the run straddles
          # the month boundary.
          echo "month=$month" > calendar.env
          echo "n_forge=$n_forge" > forge-n.env

      - name: build and push
        env:
          FORGE_SERVER_URL: ${{ forgejo.server_url }}
        run: |
          set -euo pipefail
          forge_registry=${FORGE_SERVER_URL#https://}
          forge_registry=${forge_registry%/}
          . ./calendar.env
          . ./forge-n.env
          # One calendar number for the build: the instance registry's own
          # walked value — the single-registry walk is the ruling (OQ-1=B).
          n=$n_forge
          forge_image="$forge_registry/curatedforest/forgejo-runner"
          forge_tags="$forge_image:$month.$n $forge_image:latest $forge_image:main"
          build_args=()
          for tag in $forge_tags; do
            build_args+=(-t "$tag")
          done
          # No buildx cache flags: the runner's docker-data volume persists
          # the daemon's layer store across jobs, which already warms the
          # classic-store build. This lane pulls its (large) base once onto
          # that volume and every later dispatch resumes warm, which is what
          # keeps the 30-minute ceiling survivable on a cold mint.
          docker build "${build_args[@]}" "containers/forgejo-runner"
          for tag in $forge_tags; do
            docker push "$tag"
          done
