# Dispatch-only recovery lane that (re)mints any container's calendar tags.
# It exists because of a bootstrap paradox, dated 2026-11-22
# (cf-6-feat-builder-bootstrap): every other workflow in this family runs on
# the baked job image this very pipeline publishes, so the moment that image
# is missing or stale the normal lanes cannot start and cannot heal
# themselves. This lane breaks the circle by running on the PUBLIC act image
# (the ubuntu-22.04 label, which maps outside this repo to an upstream
# act-22.04 that is schedulable without anything from here having been
# published first) and using the live in-pod dind socket, exactly like the
# baked lanes do.
#
# Trigger: workflow_dispatch ONLY, by ruling (P1). A second auto-push arm
# would double-publish against containers-build on every bump merge once the
# paradox is healed, and it would need a per-run existence check to avoid
# clobbering legitimate baked-lane builds. Collision with containers-build
# cannot race a publish anyway: this lane fires only on human dispatch and
# the lab runner has capacity 1, so every job of every workflow serializes
# through one pod; the queue-waiting concurrency block below keeps even two
# dispatches honest. containers-build stays the automatic lane.
#
# ROLE guard is NARROW on unset: this lane MINTS calendar tags, so it belongs
# to the fail-safe class with main-sync/renovate/release, not to
# containers-build's builder-class widen. A widen here would let an
# unset-ROLE dev-role instance mint calendar releases — the role-law
# violation the design pre-rejected. A dispatch on a dev-role instance is
# therefore inert by guard, not by accident: the recovery story is
# prod-role-only; the dev instance's own lane stays the automatic build path.
#
# Targets (owner ruling 2026-11-22, P4'): ghcr.io/ownyourio AND the building
# instance's own registry, the same three tags on both — NO third target of
# any shape, no extra credential or variable (the credential surface is
# closed by contract suite b6; a future cross-host arm must earn a fresh
# owner ruling first).
#
# Calendar law, mirrored from containers-build exactly: N is one past the
# highest yy.mm.* tag across BOTH registries, each side advanced past any
# manifest it already holds, every walk finished before the first push; one
# fixed month per job; push order ghcr then own so a half-failed run gaps
# the side the fleet has not pinned. There is NO skip-if-exists mode: every
# successful publish mints a fresh N, and a re-dispatch of unchanged content
# mints N+1 too — gaps, never clobbers. Expect the first cold mint of a
# ~10GB-class image to run near the 30-minute runner ceiling; a timeout red
# is retry-safe under this law and each retry resumes warm.
#
# Renovate churn warning: every runs-on line below is the paradox guard. The
# built-in runs-on manager proposes repo-wide bumps; one auto-PR flipping
# this file to a baked label re-arms the paradox — the suite reddens it, and
# label-bump PRs stay human-merged.
#
# Steps are plain shell; the instance registry host is derived from the
# server URL inside steps, never a literal; the Actions job token cannot
# write packages, so pushes use the two human-minted PATs.

on:
  workflow_dispatch:
    inputs:
      containers:
        description: 'Container names to (re)mint (comma/space separated), or the literal all for every containers/<name> dir carrying a Dockerfile. An empty list builds nothing.'
        required: false
        default: ''
        type: string

concurrency:
  cancel-in-progress: false

jobs:
  detect:
    if: contains(vars.ROLE, 'prod')
    runs-on: ubuntu-22.04
    outputs:
      containers: ${{ steps.pick.outputs.containers }}
    steps:
      - uses: actions/checkout@v7

      - name: diag
        run: |
          set -euo pipefail
          echo "ROLE=[${{ vars.ROLE }}]"
          echo "event=${{ forgejo.event_name }} run=${{ forgejo.run_number }}"

      - name: resolve the dispatch list
        id: pick
        env:
          EVENT_NAME: workflow_dispatch
          MANUAL_CONTAINERS: ${{ forgejo.event.inputs.containers }}
        run: |
          set -euo pipefail
          # The all keyword expands HERE, before the call: the shipped
          # detector gates names and stays byte-untouched (P6). Enumerating
          # the Dockerfile-bearing dirs only feeds the detector's own gates;
          # it is not a second name filter.
          if [ "$MANUAL_CONTAINERS" = "all" ]; then
            MANUAL_CONTAINERS=$(for d in containers/*/; do
              n=${d#containers/}
              if [ -f "containers/${n%/}/Dockerfile" ]; then printf '%s\n' "${n%/}"; fi
            done | sort -u | tr '\n' ' ')
          fi
          # Assign before emitting: a substitution inside echo's argument
          # reports echo's exit status, so a failed detection would write an
          # empty output (and the publish matrix would be built from an
          # empty list) instead of failing this job on the detector's exit.
          picked=$(bash scripts/forgejo-container-detect.sh detect)
          # The verdict and the raw input go to the job log: a green run that
          # published nothing must read differently from one whose list
          # silently resolved to nothing. An empty dispatch list is the
          # documented no-op intent (family silent-empty law), so unlike a
          # push or PR it earns no warning here.
          echo "dispatch containers: $picked (input [$MANUAL_CONTAINERS])"
          # Forgejo exports the GITHUB_* compatibility family; the FORGEJO_*
          # name is the fallback per the v15.0 reference.
          echo "containers=$picked" >> "${GITHUB_OUTPUT:-$FORGEJO_OUTPUT}"

  publish:
    if: contains(vars.ROLE, 'prod') && needs.detect.outputs.containers != '[]'
    needs: detect
    runs-on: ubuntu-22.04
    name: bootstrap ${{ matrix.container }}
    strategy:
      # One container's failure must not cancel its siblings'.
      fail-fast: false
      matrix:
        container: ${{ fromJSON(needs.detect.outputs.containers) }}
    steps:
      - uses: actions/checkout@v7

      - name: diag
        run: |
          set -euo pipefail
          echo "ROLE=[${{ vars.ROLE }}]"
          echo "event=${{ forgejo.event_name }} run=${{ forgejo.run_number }}"
          # First-fire recorder for the runner's Actions-cache env and the
          # buildx the job never uses; neither may fail the job.
          env | grep ACTIONS_ || true
          docker buildx version || true
          # The plain docker build below talks to the in-pod dind daemon
          # (chart socket contract); if it is unreachable, nothing after
          # this point is worth logging.
          docker info

      - name: log in to ghcr
        # The forge's per-run token is forge-scoped and cannot write ghcr;
        # this PAT (write:packages) is the only credential that can.
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.GHCR_PUSH_PAT }}' | docker login ghcr.io -u OwnYourIO --password-stdin

      - name: log in to the forge registry and derive its calendar N
        env:
          FORGE_SERVER_URL: ${{ forgejo.server_url }}
        run: |
          set -euo pipefail
          # The registry host derives from the env server_url, never from a
          # literal; the server URL is stored with a trailing slash, and
          # host//owner/img is an invalid reference, so every strip trims it.
          # The /v2/ reads below wear an explicit TLS scheme (curl defaults a
          # scheme-less URL to http, and these reads carry the push PAT);
          # docker login and the image refs stay bare hostnames, where a
          # scheme would itself be an invalid reference.
          forge_registry=${FORGE_SERVER_URL#https://}
          forge_registry=${forge_registry%/}
          forge_pat='${{ secrets.FORGE_PUSH_TOKEN }}' && printf '%s' "$forge_pat" | docker login "$forge_registry" -u forge-push --password-stdin
          forge_api="https://$forge_registry/v2/curatedforest/${{ matrix.container }}"
          month=$(date +%y.%m)
          n_forge=1
          # Mirrored tolerance posture: absence must arrive as an HTTP
          # status, never a transport failure — 404 NAME_UNKNOWN is this
          # registry's answer for a package nobody has pushed. 401/403/404
          # contribute no tags to the union max and earn no walk; any other
          # code is a malfunction and stays fatal. The walk runs only under
          # a 200 list, where the manifest 200/404 semantics hold.
          forge_list=$(curl -sS -w '\n%{http_code}' -u "forge:$forge_pat" "$forge_api/tags/list")
          forge_list_code=${forge_list##*$'\n'}
          if [ "$forge_list_code" = 200 ]; then
            n_forge=$(printf '%s' "${forge_list%$'\n'*}" | YYMM="$month" bash scripts/forgejo-container-detect.sh next-n)
            forge_manifest_code() {
              curl -s -o /dev/null -w '%{http_code}' -I \
                -u "forge:$forge_pat" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
                "$forge_api/manifests/$1"
            }
            forge_code=$(forge_manifest_code "$month.$n_forge")
            forge_advance=0
            while [ "$forge_code" != 404 ]; do
              if [ "$forge_code" != 200 ]; then
                echo "unexpected HTTP $forge_code for $forge_api/manifests/$month.$n_forge" >&2
                exit 1
              fi
              forge_advance=$((forge_advance + 1))
              if [ "$forge_advance" -gt 50 ]; then
                echo "no free $month.N tag on the forge registry within 50 of its maximum" >&2
                exit 1
              fi
              n_forge=$((n_forge + 1))
              forge_code=$(forge_manifest_code "$month.$n_forge")
            done
          elif [ "$forge_list_code" != 401 ] && [ "$forge_list_code" != 403 ] && [ "$forge_list_code" != 404 ]; then
            echo "unexpected HTTP $forge_list_code from $forge_api/tags/list" >&2
            exit 1
          fi
          # Log the tolerated codes: a side that derived N without readable
          # tags contributed nothing to the union max, and the run log is
          # where a degraded side stays visible.
          echo "n_forge=$n_forge list=$forge_list_code"
          # Fix the calendar month once for the whole job: both walks and
          # both pushes must use the same month even when the run straddles
          # the month boundary.
          echo "month=$month" > calendar.env
          echo "n_forge=$n_forge" > forge-n.env

      - name: derive the ghcr-side calendar N
        run: |
          set -euo pipefail
          . ./calendar.env
          ghcr_api="https://ghcr.io/v2/ownyourio/${{ matrix.container }}"
          n_ghcr=1
          # The anonymous pull-scoped token is enough to read a published
          # image's tag list and manifests. Neither read may fail on status:
          # GHCR answers DENIED (403), not 404, on the token endpoint for a
          # repository nobody has pushed, and 401/403/404 all mean the month
          # has no readable calendar tag — the image's first publish,
          # starting at N=1. The existence walk below runs only under a pull
          # token: the manifest endpoint answers 401 to every anonymous
          # request, so its 200/404 semantics hold only for a
          # read-authenticated check. Any other code is a registry
          # malfunction, not an absence, and stays fatal; transport errors,
          # as everywhere here, are fatal via curl's exit code.
          ghcr_token_resp=$(curl -sS -w '\n%{http_code}' "https://ghcr.io/token?scope=repository:ownyourio/${{ matrix.container }}:pull")
          ghcr_token_code=${ghcr_token_resp##*$'\n'}
          if [ "$ghcr_token_code" = 200 ]; then
            ghcr_token=$(printf '%s' "${ghcr_token_resp%$'\n'*}" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
            # A 200 whose body carries no token is a malfunction, not an
            # absence: an empty bearer would make tags/list answer 401 —
            # the tolerated no-tags code — and the release would publish
            # at N=1 over a taken tag with no existence walk to stop it.
            if [ -z "$ghcr_token" ]; then
              echo "ghcr token endpoint answered 200 without a token" >&2
              exit 1
            fi
            ghcr_list=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $ghcr_token" "$ghcr_api/tags/list")
            ghcr_list_code=${ghcr_list##*$'\n'}
            if [ "$ghcr_list_code" = 200 ]; then
              n_ghcr=$(printf '%s' "${ghcr_list%$'\n'*}" | YYMM="$month" bash scripts/forgejo-container-detect.sh next-n)
              ghcr_manifest_code() {
                curl -s -o /dev/null -w '%{http_code}' -I \
                  -H "Authorization: Bearer $ghcr_token" \
                  -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
                  "$ghcr_api/manifests/$1"
              }
              # A taken N means a re-run, a concurrent publish, or an
              # earlier dispatch already minted it; the registries have no
              # tag immutability and would silently overwrite, so advance
              # until the manifest is free — a re-dispatch of unchanged
              # content mints N+1 by design. Any other HTTP answer is a
              # registry malfunction, not a free tag. The bound stops the
              # walk if tag pagination ever hides the true maximum.
              ghcr_code=$(ghcr_manifest_code "$month.$n_ghcr")
              ghcr_advance=0
              while [ "$ghcr_code" != 404 ]; do
                if [ "$ghcr_code" != 200 ]; then
                  echo "unexpected HTTP $ghcr_code for $ghcr_api/manifests/$month.$n_ghcr" >&2
                  exit 1
                fi
                ghcr_advance=$((ghcr_advance + 1))
                if [ "$ghcr_advance" -gt 50 ]; then
                  echo "no free $month.N tag on ghcr within 50 of the registry maximum" >&2
                  exit 1
                fi
                n_ghcr=$((n_ghcr + 1))
                ghcr_code=$(ghcr_manifest_code "$month.$n_ghcr")
              done
            elif [ "$ghcr_list_code" != 401 ] && [ "$ghcr_list_code" != 403 ] && [ "$ghcr_list_code" != 404 ]; then
              echo "unexpected HTTP $ghcr_list_code from $ghcr_api/tags/list" >&2
              exit 1
            fi
          elif [ "$ghcr_token_code" != 401 ] && [ "$ghcr_token_code" != 403 ] && [ "$ghcr_token_code" != 404 ]; then
            echo "unexpected HTTP $ghcr_token_code from the ghcr token endpoint" >&2
            exit 1
          fi
          # Log the tolerated codes (see the forge-N step): a side that read
          # no tags contributed nothing to the union max, and the run log is
          # where a degraded side stays visible. ghcr_list_code is unset when
          # the token read was itself the tolerated absence.
          echo "n_ghcr=$n_ghcr token=$ghcr_token_code list=${ghcr_list_code:-none}"
          echo "n_ghcr=$n_ghcr" > ghcr-n.env

      - name: build and push
        env:
          FORGE_SERVER_URL: ${{ forgejo.server_url }}
        run: |
          set -euo pipefail
          forge_registry=${FORGE_SERVER_URL#https://}
          forge_registry=${forge_registry%/}
          . ./calendar.env
          . ./forge-n.env
          . ./ghcr-n.env
          # One calendar number for the build: the union maximum of the two
          # walked per-side values, so neither registry can be pushed at an
          # N the other side has already taken.
          n=$n_ghcr
          if [ "$n_forge" -gt "$n" ]; then n=$n_forge; fi
          ghcr_image="ghcr.io/ownyourio/${{ matrix.container }}"
          forge_image="$forge_registry/curatedforest/${{ matrix.container }}"
          ghcr_tags="$ghcr_image:$month.$n $ghcr_image:latest $ghcr_image:main"
          forge_tags="$forge_image:$month.$n $forge_image:latest $forge_image:main"
          build_args=()
          for tag in $ghcr_tags $forge_tags; do
            build_args+=(-t "$tag")
          done
          # No buildx cache flags: the runner's docker-data volume persists
          # the daemon's layer store across jobs, which already warms the
          # classic-store build. This lane pulls its (large) base once onto
          # that volume and every later dispatch resumes warm, which is what
          # keeps the 30-minute ceiling survivable on a cold mint.
          docker build "${build_args[@]}" "containers/${{ matrix.container }}"
          # ghcr first: a half-failed run leaves the gap on the forge side,
          # the newer line the fleet's pins have not adopted.
          for tag in $ghcr_tags; do
            docker push "$tag"
          done
          for tag in $forge_tags; do
            docker push "$tag"
          done
