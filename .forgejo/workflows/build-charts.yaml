# Build Charts — the chart bump+publish pipeline running on Forgejo Actions
# (cf-55), INVOKED BY main-sync.yaml on the prod-main fan (C15/D56 — the
# push arm is retired; path filtering lives in the marker..sha detection on
# the shared ci/last-built marker). The prod instance's runner is the single
# chart-version authority:
# it detects changed charts, test-builds them, commits Chart.yaml calendar
# bumps (Y.M.N) to Forgejo main, then publishes the changed set DUAL: GitHub Releases + gh-pages index (the
# byte-stable consumer contract) and this instance's Helm package registry.
#
# Both instances receive the synced copy, so EVERY job guards on the
# instance-side repo variable ROLE — the repo-scoped comma-list membership
# variable of the AGENTS.md Hard rule (Forge Actions guards are ROLE
# membership, never instance URLs): the guards test membership with
# contains(), so a list value like dev,prod passes, and a non-prod value
# renders the guard false and nothing fires — an unguarded twin would
# double-publish from the dev copy (D8). Unset stays narrow here BY
# DELIBERATE choice, beside build-containers.yaml's widen: this pipeline
# commits to main and mints releases, so it must never fire unconfigured.
# Substring caveat: no future role word may contain prod as a substring —
# "production" would silently widen these guards. has-changes gating belongs
# at step level.
#
# Toolchain: the act job image is containers/forgejo-runner — helm and cr
# bake into it at image-build time (D33: the pipeline's first fire died on a
# run-time tool download, the flaky-egress class the bake retires). No step
# installs anything here, and no presence-check step stands in for one
# (D43): the plain helm/cr calls below ARE the toolchain check — a mis-baked
# image dies at its first command-not-found, loud and early. The bake retires
# TOOL downloads, not DATA ones: the bump leg still reads the published index
# (bounded --retry, D37), and the helm dependency updates — the test-build
# smoke and the bump leg's lock self-heal — fetch repo indexes and subchart
# tarballs, the same upstream-egress class cr's Build() already pays per
# chart per fire (D47).
name: Build Charts
on:
  workflow_call:
    outputs:
      bump_sha:
        value: ${{ jobs.bump.outputs.bump_sha }}

jobs:
  changes:
    if: contains(vars.ROLE, 'prod')
    runs-on: ubuntu-24.04
    outputs:
      charts: ${{ steps.detect.outputs.CHARTS }}
      has_changes: ${{ steps.detect.outputs.HAS_CHANGES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The default one-commit checkout would make the event-range diff
          # below return an empty change set — a silently green "nothing
          # changed" run, the loudest shallow-clone failure (V-6-1).
          fetch-depth: 0
      - name: resolve last-built marker
        id: marker
        env:
          EVENT_NAME: ${{ forgejo.event_name }}
        run: |
          set -euo pipefail
          # The marker is call-side (C15/D56: main-sync's called runs read
          # it; the push arm is gone — C04 unifies the three builders on
          # this workflow_call-only gate shape). Non-marker-side events
          # still emit the output key: a step output that goes missing would
          # reach detect() unset rather than empty, and an empty sha= is
          # exactly the state the payload arms are specified against.
          if [ "$EVENT_NAME" != workflow_call ]; then
            echo "sha=" >> "${GITHUB_OUTPUT:-$FORGEJO_OUTPUT}"
            exit 0
          fi
          marker=$(git ls-remote origin refs/heads/ci/last-built | cut -f1)
          if [ -z "$marker" ]; then
            # No marker yet: the payload arms answer, and this run's own
            # green advance creates it.
            echo "sha=" >> "${GITHUB_OUTPUT:-$FORGEJO_OUTPUT}"
            exit 0
          fi
          if ! printf '%s' "$marker" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "build-charts: the marker ref answered a non-sha value: $marker" >&2
            exit 1
          fi
          if ! git cat-file -e "$marker^{commit}"; then
            # A history rewrite can orphan the marker: silently downgrading
            # this fire to before..sha would re-open the hole the marker
            # exists to close, so the run stops here with the owner verbs.
            echo "build-charts: marker $marker is unreachable from this checkout — reset the marker ref to a reachable commit or delete it to fall back" >&2
            exit 1
          fi
          echo "sha=$marker" >> "${GITHUB_OUTPUT:-$FORGEJO_OUTPUT}"
      - name: Detect changed charts
        id: detect
        env:
          EVENT_BEFORE: ${{ forgejo.event.before }}
          EVENT_SHA: ${{ forgejo.sha }}
          EVENT_MARKER: ${{ steps.marker.outputs.sha }}
        run: |
          set -euo pipefail
          # Pure-git detection (D3), marker-anchored (C14/D53): whenever the
          # resolver found a marker it is the base — marker..sha wins over
          # every payload fallback, so a chart change a dead run lost stays
          # inside the next fire's range instead of being skipped forever.
          # All-zero before (first push, marker absent) diffs HEAD^ and says
          # so; an EMPTY before is fatal — no push payload sends one, and the
          # silent HEAD^ fallback that used to hide it is buried (the
          # containers law mirrored; D53 records the behavior change).
          if [ -n "${EVENT_MARKER}" ]; then
            CHANGED_FILES=$(git diff --name-only "${EVENT_MARKER}" "${EVENT_SHA}" -- charts/ || true)
          elif [ "${EVENT_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            echo "::warning::first push on the branch (all-zero before, no marker yet) — diffing HEAD^ only" >&2
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD -- charts/ || true)
          elif [ -z "${EVENT_BEFORE}" ]; then
            echo "build-charts: EVENT_BEFORE is empty and no marker exists — the payload chain cannot resolve a base; no push payload sends an empty before" >&2
            exit 1
          else
            CHANGED_FILES=$(git diff --name-only "${EVENT_BEFORE}" "${EVENT_SHA}" -- charts/ || true)
          fi
          # Only strict DNS-safe names with a Chart.yaml — the proven filter
          # of the container detect loop.
          CHARTS=$(echo "$CHANGED_FILES" | cut -d'/' -f2 | sort -u | \
            grep -E '^[a-z0-9]+(-[a-z0-9]+)*$' || true)
          RESULT="[]"
          for c in $CHARTS; do
            if [ -f "charts/$c/Chart.yaml" ]; then
              RESULT=$(echo "$RESULT" | jq -c --arg c "$c" '. + [$c]')
            fi
          done
          # Idempotence reads as data (C14 task 3): a marker-anchored run
          # with an empty set means the marker already covers the range —
          # the verified-empty info line, NOT an anomaly annotation. The
          # anomaly warning stays reserved for an empty set on a payload
          # range; a before==sha no-op push stays silent (containers'
          # :199-204 semantics, inline form).
          if [ -z "$CHANGED_FILES" ] && [ -n "${EVENT_MARKER}" ]; then
            echo "changed set verified empty: marker..sha (marker=${EVENT_MARKER} sha=${EVENT_SHA})"
          elif [ -z "$CHANGED_FILES" ] && [ -z "${EVENT_MARKER}" ] \
               && [ -n "${EVENT_BEFORE}" ] \
               && [ "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ] \
               && [ "${EVENT_BEFORE}" != "${EVENT_SHA}" ]; then
            echo "::warning::empty changed set on a real before..sha range — nothing under charts/ moved" >&2
          fi
          echo "CHARTS=$RESULT" >> "${GITHUB_OUTPUT:-$FORGEJO_OUTPUT}"
          if [ "$RESULT" = "[]" ]; then
            echo "HAS_CHANGES=false" >> "${GITHUB_OUTPUT:-$FORGEJO_OUTPUT}"
          else
            echo "HAS_CHANGES=true" >> "${GITHUB_OUTPUT:-$FORGEJO_OUTPUT}"
          fi

  test-build:
    if: contains(vars.ROLE, 'prod')
    needs: changes
    runs-on: ubuntu-24.04
    strategy:
      # A sibling chart's failure must not cancel the remaining smokes;
      # nothing publishes from this leg, so a matrix per chart is safe here.
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.changes.outputs.charts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # V-6-1 law for this workflow: no leg may rely on shallow-clone
          # semantics, so every checkout pins full depth (the one-commit
          # default is what silently empties git-based detection).
          fetch-depth: 0
      - name: Patch-bump Chart.yaml (local, never pushed)
        run: |
          set -euo pipefail
          python3 - "charts/${{ matrix.chart }}/Chart.yaml" <<'PY'
          import re, sys

          path = sys.argv[1]
          text = open(path).read()
          m = re.search(r"(?m)^version: (\d+)\.(\d+)\.(\d+)(?:[ \t]+#[^\n]*)?[ \t]*$", text)
          if not m:
              raise SystemExit(f"{path}: top-level version: is not MAJOR.MINOR.PATCH")
          new = f"{m.group(1)}.{m.group(2)}.{int(m.group(3)) + 1}"
          # Only the version: line is rewritten — appVersion stays untouched
          # (the old action's app_version: false semantics). The tolerated
          # tail is a # comment: it sits after m.end(3), so the group-sliced
          # write leaves it in the file (C13 — a comment on the line must not
          # kill the parse, the Nov-25 fire class; junk and #nospace tails
          # still refuse).
          print(f"test-bump {path}: {m.group(0)} -> version: {new}")
          open(path, "w").write(text[:m.start(1)] + new + text[m.end(3):])
          PY
      - name: Add repositories
        run: |
          set -euo pipefail
          # The per-row registration (the cf-77/D45 recipe) moved verbatim to
          # scripts/forgejo-helm-repo-add.sh — the triple duplication across
          # the three sites was the drift class the extraction kills (C04
          # task 3).
          bash scripts/forgejo-helm-repo-add.sh
      - name: Lint and package smoke
        run: |
          set -euo pipefail
          # dependency update, not the digest-checking build verb: build
          # aborts on a drifted lock BEFORE any download, and with job order
          # test-build → bump an aborting smoke on the drift-carrying push
          # would make the bump job's self-heal unreachable exactly when it
          # is needed (D47.2). The update re-negotiates and heals the matrix
          # copy ephemerally, never pushed; the pre-merge drift signal lives
          # in the contract suite's hermetic lock-consistency leg. lint +
          # package stay (consumer-shape smoke, no publish API call).
          mkdir -p /tmp/chart-smoke
          helm dependency update "charts/${{ matrix.chart }}"
          helm lint "charts/${{ matrix.chart }}"
          helm package "charts/${{ matrix.chart }}" --destination /tmp/chart-smoke

  bump:
    if: contains(vars.ROLE, 'prod')
    needs: [test-build, changes]
    outputs:
      bump_sha: ${{ steps.bump.outputs.sha }}
    runs-on: ubuntu-24.04
    concurrency:
      # Opportunistic only: Forgejo documents concurrency as best-effort and
      # two runners may interleave runs (RESEARCH A3/V-4) — the idempotent
      # re-check loop below, not this group, is the safety property.
      group: release-bump-main
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The push negotiation needs the real remote tip, not the
          # single-commit default checkout (V-6).
          fetch-depth: 0
      - name: Bump changed charts and fast-forward main
        id: bump
        env:
          CHARTS_JSON: ${{ needs.changes.outputs.charts }}
          PUBLISHED_INDEX: https://ownyourio.github.io/SpencersLab/index.yaml
        run: |
          set -euo pipefail
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          # ONE writer looping every changed chart: the matrix bump was the
          # known-broken commits-stepping-on-each-other shape (D4). Each
          # attempt re-derives versions from the REMOTE main tip — the
          # checkout is a detached HEAD, so only a remote-tracking fetch
          # refspec reads it correctly; a bare pull cannot (V-6-3) — with
          # N from the tree plus the run's clock stamp and the published
          # GitHub index only guarding collisions. The push is plain, so
          # git itself refuses a stale head: fast-forward-only, a refused
          # attempt re-loops and can never overwrite (V-4). No secret
          # reference: the checkout's automatic same-repo credential pushes
          # main. Loop guard (C15/D53): a re-fire of the same range reads
          # marker..sha EMPTY — the marker at-or-past the endpoint makes the
          # detection verified-empty and mints nothing, so even a triggering
          # re-run cannot double-bump; the marker idempotence IS the loop
          # guard (the retired push-era shape relied on main's own
          # non-re-trigger of a workflow push).
          # ONE clock stamp per run (the build-containers month= law): all
          # retry attempts share one Y.M, so a straddle of UTC midnight on
          # the 1st cannot split a release lineage across two months. The
          # month is UNPADDED here and int()-reformatted in the derivation:
          # a padded "2026.07.1" is invalid semver under Masterminds
          # NewVersion and dies at helm package (D15 class).
          STAMP=$(date -u +%Y.%-m)
          for attempt in $(seq 1 5); do
            echo "bump attempt ${attempt} of 5"
            git fetch origin refs/heads/main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            curl -fsSL --retry 3 -o /tmp/published-index.yaml "$PUBLISHED_INDEX"
            # Lock self-heal, full tree (D47.1): cr package Build()s EVERY
            # chart EVERY fire, so one drifted lock outside the changed
            # matrix poisons release + forgejo-publish whatever this push
            # touched — changed-set-only healing leaves that path open.
            # dependency update is the only regen verb, a byte-no-op on a
            # fresh lock, and auto-adds unknown repos, so no repo-add step
            # is needed and the pass is cheap on churn. It runs AFTER the
            # reset because heal decisions must ride the remote tip, never
            # the event checkout's stale tree. Locks land in the same commit
            # as the versions: the top-level version: is outside helm's
            # digest inputs, so the pair is digest-safe by construction.
            # No retries: an upstream egress blip reddens this bump loudly
            # and a re-fire is the recovery, the posture cr already has.
            for lock in charts/*/Chart.lock; do
              helm dependency update "charts/$(basename "$(dirname "$lock")")"
            done
            bumped=$(python3 - "${CHARTS_JSON}" /tmp/published-index.yaml "$STAMP" <<'PY'
          import json, re, sys

          def ver(s):
              parts = s.split(".")
              if len(parts) == 3 and all(p.isdigit() for p in parts):
                  return tuple(int(p) for p in parts)
              return None

          # Pair a dashless entry name: with a version: line at the SAME
          # INDENTATION only. A naive line scan resolves inline
          # dependencies: pins instead (wrapper charts re-use their
          # upstream dependency's name — traefik's dependency pin 42.1.3
          # shadows the real entry version 1.0.103 — the collision guard
          # below would then walk N past versions that were never
          # published); this pairing is exact on every key of the live
          # index.
          published = {}
          name = None
          name_indent = -1
          for raw in open(sys.argv[2]).read().splitlines():
              line = raw.lstrip(" ")
              if line.startswith("- "):
                  continue
              indent = len(raw) - len(line)
              m = re.match(r"name:\s*(\S+)\s*$", line)
              if m:
                  name, name_indent = m.group(1), indent
                  continue
              m = re.match(r"version:\s*(\S+)\s*$", line)
              if m and name is not None and indent == name_indent:
                  v = ver(m.group(1))
                  if v is not None and (name not in published or v > published[name]):
                      published[name] = v

          # The run's single clock stamp (argv 3), re-formatted
          # numerically: int() means no padded spelling of the stamp can
          # survive into a written version.
          Y, M = (int(p) for p in sys.argv[3].split("."))

          bumped = []
          for chart in json.loads(sys.argv[1]):
              path = f"charts/{chart}/Chart.yaml"
              text = open(path).read()
              m = re.search(r"(?m)^version: (\S+)(?:[ \t]+#[^\n]*)?[ \t]*$", text)
              if not m:
                  raise SystemExit(f"{path}: no top-level version: line")
              # The index keys and release names carry the Chart.yaml NAME,
              # which may differ from the directory (live example:
              # charts/traefik-zerotrust is named traefik); looking the
              # directory up would silently miss its published versions.
              n = re.search(r"(?m)^name: (\S+)$", text)
              key = n.group(1) if n else chart
              tree = ver(m.group(1))
              if tree is None:
                  raise SystemExit(f"{path}: version {m.group(1)!r} is not MAJOR.MINOR.PATCH")
              # Calendar walk (owner law R-Q1, D47.4): N derives from the
              # tree plus the clock stamp, never from a published version.
              # The stamp month walks the chart's own N+1; a tree below the
              # month floor — rollover, or a legacy 1.0.x chart's first
              # calendar fire — lands Y.M.1; a tree ahead of the clock
              # fails loud, the walk never moves released versions
              # backwards. The version: line only is rewritten — appVersion
              # stays untouched.
              if tree[:2] == (Y, M):
                  cand = (Y, M, tree[2] + 1)
              elif tree < (Y, M, 0):
                  cand = (Y, M, 1)
              else:
                  raise SystemExit(f"{path}: tree version {tree} is ahead of the clock stamp — refusing to walk backwards")
              # The published index is no longer a derivation term: it
              # guards only the skip-when-already-published law (D17's
              # second half) — a published version is never re-minted.
              # Bounded walk: an index more than 50 same-month versions
              # ahead of the candidate is a corruption signal to fail on,
              # not a queue to drain (build-containers's bounded-walk
              # precedent).
              steps = 0
              while published.get(key, (0, 0, 0)) >= cand:
                  cand = (Y, M, cand[2] + 1)
                  steps += 1
                  if steps > 50:
                      raise SystemExit(f"{path}: published index over 50 versions ahead of the calendar walk — refusing to mint")
              nxt = f"{cand[0]}.{cand[1]}.{cand[2]}"
              open(path, "w").write(text[:m.start(1)] + nxt + text[m.end(1):])
              bumped.append(chart)
          print(" ".join(bumped))
          PY
            )
            if [ -z "$bumped" ]; then
              echo "nothing to bump"
              exit 0
            fi
            for c in $bumped; do
              git add "charts/$c/Chart.yaml"
            done
            # The regenerated locks ride the same bump commit; a byte-no-op
            # update stages nothing.
            git add charts/*/Chart.lock
            healed=$(git diff --cached --name-only | grep 'Chart\.lock$' || true)
            message="chore(release): bump ${bumped}"
            if [ -n "$healed" ]; then
              message="${message} + heal $(echo "$healed" | tr '\n' ' ')"
            fi
            # Staged-content guard: a fresh-tree fire must not mint an
            # empty commit under set -euo pipefail.
            git diff --cached --quiet || git commit -m "$message"
            if git push origin HEAD:refs/heads/main; then
              echo "bumped and pushed: ${bumped}"
              # The landed commit — B1 or the re-looped one — is the marker
              # endpoint the interim advance rides (C14 task 4; D53: never
              # the event sha, that tail re-feeds the bump's own charts/**
              # edits into the next detection).
              echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT:-$FORGEJO_OUTPUT}"
              exit 0
            fi
            echo "push refused (main advanced mid-loop) — re-checking" >&2
          done
          echo "bump did not land after 5 attempts" >&2
          exit 1

  release:
    if: contains(vars.ROLE, 'prod')
    needs: [bump, changes]
    runs-on: ubuntu-24.04
    env:
      # The only GitHub-side credential of this workflow (D16): bound once at
      # job level, serving cr's Releases/Pages writes and the gh-pages push
      # remote's credential slot (main-sync's proven push shape). The
      # instance leg never sees it, and this leg never sees the instance pair
      # (D22) — cross-forge identities must not mix.
      CR_TOKEN: ${{ secrets.PUSH_TOKEN_GH }}
      PUSH_URL: ${{ vars.PUSH_URL_GH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # V-6-1 law for this workflow: full depth everywhere. Here it is
          # load-bearing for git negotiation itself — the main-tip re-read
          # and cr's pages worktree/pull sequence cannot run against a
          # one-commit clone (main-sync.yaml's paid lesson, same class).
          fetch-depth: 0
      - name: Configure Git
        run: |
          set -euo pipefail
          # cr's pages worktree commits the regenerated index locally — it
          # needs a committer identity in the job.
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Pick up the bump commits and release tags
        run: |
          set -euo pipefail
          # The event checkout predates the bump pushes; publish exactly
          # main's tip. Detached-HEAD checkout: re-read through the explicit
          # remote-tracking refspec, never a bare pull (V-6-3), and the tag
          # fetch precedes any cr invocation in cr-running legs (V-6-2 guard).
          git fetch origin refs/heads/main:refs/remotes/origin/main
          git reset --hard refs/remotes/origin/main
          git fetch --tags
      - name: Add repositories
        run: |
          set -euo pipefail
          # The per-row registration (the cf-77/D45 recipe) moved verbatim to
          # scripts/forgejo-helm-repo-add.sh — the triple duplication across
          # the three sites was the drift class the extraction kills (C04
          # task 3).
          bash scripts/forgejo-helm-repo-add.sh
      - name: Publish GitHub Releases and the Pages index
        if: needs.changes.outputs.has_changes == 'true'
        env:
          CHARTS_JSON: ${{ needs.changes.outputs.charts }}
        run: |
          set -euo pipefail
          # Explicit GitHub literals, never forge-context identity: the
          # consumer contract (index asset URLs, renovate, ArgoCD) is
          # OwnYourIO/SpencersLab (RESEARCH B1/X5).
          # No --commit: the bump commits live only on Forgejo main until
          # main-sync fans them out, so cr's default (empty target_commitish,
          # GitHub resolves the default-branch head) is the one shape that
          # can never reference a commit GitHub has not seen.
          # Package the changed set only (D3): the changes job's
          # DNS-safe, Chart.yaml-gated output drives one cr package per
          # changed chart in detection order. Unchanged charts cost
          # nothing — the upload de-duplicates with --skip-existing, and
          # cr index --push regenerates the gh-pages index from the
          # repository's release assets, so a chart skipped this fire
          # keeps its published tgz in the index.
          for c in $(echo "$CHARTS_JSON" | jq -r '.[]'); do
            cr package "charts/$c"
          done
          cr upload --owner OwnYourIO --git-repo SpencersLab --package-path .cr-release-packages --skip-existing --token "$CR_TOKEN"
          # gh-pages is pushed to GitHub through the credential slot (the
          # proven main-sync push shape) and cr's pages worktree is pointed
          # at that named remote: cr's default remote is origin, which here
          # is the Forgejo checkout — publishing the index there would be
          # silently wrong. cr builds its worktree from the LOCAL
          # remote-tracking ref and never fetches it, so fetch gh-pages
          # through the new remote before invoking cr index.
          rest="${PUSH_URL#https://}"
          git remote add publish "https://x-access-token:${CR_TOKEN}@${rest}"
          git fetch publish refs/heads/gh-pages:refs/remotes/publish/gh-pages
          cr index --owner OwnYourIO --git-repo SpencersLab --package-path .cr-release-packages --push --remote publish --token "$CR_TOKEN"

  forgejo-publish:
    if: contains(vars.ROLE, 'prod')
    needs: [bump, changes]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # V-6-1 law for this workflow: full depth everywhere — the
          # main-tip re-read below is a git negotiation that a one-commit
          # clone cannot serve.
          fetch-depth: 0
      - name: Pick up the bump commits and release tags
        run: |
          set -euo pipefail
          # Package exactly main's tip: explicit remote-tracking refspec on
          # the detached-HEAD checkout, never a bare pull (V-6-3), and the
          # tag fetch precedes any cr invocation in cr-running legs (V-6-2).
          git fetch origin refs/heads/main:refs/remotes/origin/main
          git reset --hard refs/remotes/origin/main
          git fetch --tags
      - name: Add repositories
        run: |
          set -euo pipefail
          # The per-row registration (the cf-77/D45 recipe) moved verbatim to
          # scripts/forgejo-helm-repo-add.sh — the triple duplication across
          # the three sites was the drift class the extraction kills (C04
          # task 3).
          bash scripts/forgejo-helm-repo-add.sh
      - name: Package charts
        if: needs.changes.outputs.has_changes == 'true'
        env:
          CHARTS_JSON: ${{ needs.changes.outputs.charts }}
        run: |
          set -euo pipefail
          # Package the changed set only (D3): the changes job's
          # DNS-safe, Chart.yaml-gated output drives one cr package per
          # changed chart in detection order. cr package is offline
          # (Chart.lock build + helm package); the tarballs feed the
          # registry curl below, whose skip-if-in-index guard narrows
          # naturally — unchanged charts cost nothing and a retry never
          # churns a published version.
          for c in $(echo "$CHARTS_JSON" | jq -r '.[]'); do
            cr package "charts/$c"
          done
      - name: Push packages to the instance Helm registry
        if: needs.changes.outputs.has_changes == 'true'
        env:
          # The Actions job token's package permission check is unimplemented
          # upstream — the same fact build-containers.yaml already pays with
          # FORGE_PUSH_TOKEN (a human-minted, non-admin write:package PAT on
          # the account owning the curatedforest namespace). The username
          # half of the basic-auth pair is cosmetic — the same
          # identity-from-the-password fact cf-6's docker login states — so
          # the curls below pair the literal "forge" with the token.
          FORGE_PKG_TOKEN: ${{ secrets.FORGE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          # Location from runner-injected env at runtime, credential from the
          # PAT: no instance URL literal enters the synced file (D14's
          # portable half). The owner is the literal lowercase curatedforest
          # namespace — registry names are lowercase-only, the law cf-6's
          # container pushes already carry with this same literal; the
          # repository context's capitalized owner string is not a valid
          # package namespace, so no derivation is attempted.
          pkg_api="${GITHUB_SERVER_URL}/api/packages/curatedforest/helm/api/charts"
          index_url="${GITHUB_SERVER_URL}/api/packages/curatedforest/helm/index.yaml"
          # Authenticated index read — private orgs serve no anonymous index
          # reads (V-3 [41]); a failure simply means nothing is published
          # on this instance yet.
          if curl -fsSL --user "forge:${FORGE_PKG_TOKEN}" "$index_url" -o /tmp/instance-helm-index.yaml; then
            published=1
          else
            published=0
          fi
          # A re-push of an existing version overwrites on chartmuseum-style
          # registries (RESEARCH B4, unverified on Forgejo) — skip versions
          # already in the instance index so a retry never churns. Name and
          # version must pair at the SAME INDENTATION: an entry's inline
          # dependencies pins would otherwise satisfy the lookup.
          for pkg in .cr-release-packages/*.tgz; do
            base="$(basename "$pkg" .tgz)"
            chart="${base%-*}"
            version="${base##*-}"
            if [ "$published" = 1 ] && awk -v c="$chart" -v v="$version" '
              $1 == "name:" { found = ($2 == c); match($0, /^ */); nind = RLENGTH }
              $1 == "version:" && found { match($0, /^ */); if (RLENGTH == nind && $2 == v) ok = 1 }
              END { exit ok ? 0 : 1 }
            ' /tmp/instance-helm-index.yaml; then
              echo "$chart $version already in the instance registry — skipping"
              continue
            fi
            curl -f -X POST --user "forge:${FORGE_PKG_TOKEN}" --upload-file "$pkg" "$pkg_api"
          done
