# Both Forgejo instances host this repo, but only the prod-stage one may
# fan main out to GitHub and to the dev instance. The jobs guard on the
# instance-side repo variable ROLE (prod on infra, a non-prod value on the
# dev server): there the guard is false for both, so nothing fires on dev
# and the pushes cannot ping-pong. An unset ROLE renders empty and fires
# nothing too (fail-safe).
#
# Guards test ROLE membership with contains(), the repo-wide shape, so a
# list value like dev,prod passes. Unlike containers-build.yaml, whose
# guards widen on unset, an unset ROLE stays fail-safe here on purpose.
#
# Every push is plain and non-force: a refused non-fast-forward or any
# error exits the step and fails the job, so a target is never overwritten;
# the instance's built-in push mirror, which overwrites its targets, is not
# used.
#
# Destinations and credentials live instance-side (PUSH_URL_* repo vars and
# PUSH_TOKEN_* secrets), not in this file — the file carries no repo URL and
# no token, so it is safe to host on both instances and review without
# secret exposure. The fan-out trigger's pair (vars.ARGOCD_HOOK_URL +
# secrets.ARGOCD_HOOK_SECRET) follows the same rule, prod instance only.
#
# The hook-relay job POSTs only after push-gh succeeded: the fleet's app
# sources read GitHub, so an earlier call would fan out the PREVIOUS
# revision — the ordering is the race resolution (cf-139 R1 option (c));
# no external webhook exists anywhere, this job IS the webhook. Its own
# failure posture is warn-not-break like this file's unset-ROLE one: unset
# keys skip, failures warn, the job ends green — the next push self-heals
# (the relay fan-out is SHA-agnostic) and manual sync covers otherwise.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  push-gh:
    if: contains(vars.ROLE, 'prod')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # A one-commit shallow clone cannot negotiate a non-force push.
          fetch-depth: 0
      - name: diag
        run: |
          set -euo pipefail
          echo "ROLE=${{ vars.ROLE }}"
      - name: push main to GitHub
        env:
          PUSH_URL: ${{ vars.PUSH_URL_GH }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN_GH }}
        run: |
          set -euo pipefail
          rest="${PUSH_URL#https://}"
          git push "https://x-access-token:${PUSH_TOKEN}@${rest}" HEAD:refs/heads/main

  push-dev:
    if: contains(vars.ROLE, 'prod')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # A one-commit shallow clone cannot negotiate a non-force push.
          fetch-depth: 0
      - name: diag
        run: |
          set -euo pipefail
          echo "ROLE=${{ vars.ROLE }}"
      - name: push main to the dev instance
        env:
          PUSH_URL: ${{ vars.PUSH_URL_DEV }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN_DEV }}
        run: |
          set -euo pipefail
          rest="${PUSH_URL#https://}"
          git push "https://x-access-token:${PUSH_TOKEN}@${rest}" HEAD:refs/heads/main

  hook-relay:
    # needs: [push-gh] IS the race resolution (cf-139 R1 option (c)): the
    # fleet's app sources track GitHub, so the fan-out may only fire once
    # GitHub already carries this push — earlier, every sync lands the
    # previous revision. GitHub-shaped delivery; the job signs it with
    # X-Forgejo-Signature plain hex (R3 — the hub-dialect prefix form
    # belongs to the R2 door, not to this file).
    needs: [push-gh]
    if: contains(vars.ROLE, 'prod')
    runs-on: ubuntu-24.04
    steps:
      - name: diag
        run: |
          set -euo pipefail
          echo "ROLE=${{ vars.ROLE }}"
      - name: trigger relay fan-out
        env:
          RELAY_URL: ${{ vars.ARGOCD_HOOK_URL }}
          RELAY_SECRET: ${{ secrets.ARGOCD_HOOK_SECRET }}
          EVT_REF: ${{ github.event.ref }}
          EVT_BEFORE: ${{ github.event.before }}
          EVT_AFTER: ${{ github.event.after }}
          EVT_FULL_NAME: ${{ github.event.repository.full_name }}
          GH_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref }}
          # run_id-run_attempt: a re-run of the same workflow is a distinct
          # delivery for the relay's audit trail.
          RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ -z "${RELAY_URL:-}" ] || [ -z "${RELAY_SECRET:-}" ]; then
            echo '::warning::hook-relay not configured (instance vars.ARGOCD_HOOK_URL / secrets.ARGOCD_HOOK_SECRET) — fan-out trigger skipped, manual sync or the next push covers it'
            exit 0
          fi
          # dispatch/first-push may lack event fields (release.yaml:54
          # precedent) — the fallbacks are the answer, not more guards.
          REF="${EVT_REF:-${GH_REF:-refs/heads/main}}"
          BEFORE="${EVT_BEFORE:-}"
          AFTER="${EVT_AFTER:-$GH_SHA}"
          FULL_NAME="${EVT_FULL_NAME:-$GH_REPO}"
          # json.dumps builds the JSON, the shell only passes argv — no
          # quoting hazards in payload values. The relay consumes only ref;
          # the rest is signature-covered delivery identity.
          BODY=$(python3 -c 'import json,sys; ref,before,after,full_name=sys.argv[1:5]; print(json.dumps({"ref": ref, "before": before, "after": after, "repository": {"full_name": full_name}}))' "$REF" "$BEFORE" "$AFTER" "$FULL_NAME") || BODY=""
          if [ -z "$BODY" ]; then
            echo "::warning::hook-relay payload build failed (delivery=$RUN_TAG) — fan-out trigger skipped, next push covers it"
            exit 0
          fi
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$RELAY_SECRET" | awk '{print $NF}') || SIG=""
          if [ -z "$SIG" ]; then
            echo "::warning::hook-relay HMAC signing failed (delivery=$RUN_TAG) — fan-out trigger skipped, next push covers it"
            exit 0
          fi
          # Bounded and captured: retries ride connection errors and 5xx,
          # the final HTTP code drives classification, and a curl that
          # cannot reach the relay still yields a code, never a dead job.
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --retry 3 --retry-delay 5 --retry-all-errors \
            -H 'Content-Type: application/json' \
            -H 'X-Forgejo-Event: push' \
            -H 'X-GitHub-Event: push' \
            -H "X-Forgejo-Delivery: $RUN_TAG" \
            -H "X-GitHub-Delivery: $RUN_TAG" \
            -H "X-Forgejo-Signature: $SIG" \
            --data "$BODY" "$RELAY_URL") || CODE=000
          case "$CODE" in
            2??) echo "ok: relay accepted code=$CODE delivery=$RUN_TAG" ;;
            401) echo "::warning::relay answered 401 for delivery=$RUN_TAG — the relay HMAC secret disagrees with the Actions vault secret; this push lands on no cluster until they match" ;;
            *)   echo "::warning::relay answered code=$CODE for delivery=$RUN_TAG — the fan-out trigger disagrees with this push; manual sync or the next push covers it" ;;
          esac
          exit 0
