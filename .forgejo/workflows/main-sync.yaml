# Both Forgejo instances host this repo, but only the prod-stage one may
# fan main out to GitHub and to the dev instance. The jobs guard on the
# instance-side repo variable ROLE (prod on infra, a non-prod value on the
# dev server): there the guard is false for both, so nothing fires on dev
# and the pushes cannot ping-pong. An unset ROLE renders empty and fires
# nothing too (fail-safe).
#
# Guards test ROLE membership with contains(), the repo-wide shape, so a
# list value like dev,prod passes. Unlike build-containers.yaml, whose
# guards widen on unset, an unset ROLE stays fail-safe here on purpose.
#
# Every push is plain and non-force: a refused non-fast-forward or any
# error exits the step and fails the job, so a target is never overwritten;
# the instance's built-in push mirror, which overwrites its targets, is not
# used.
#
# Destinations and credentials live instance-side (PUSH_URL_* repo vars and
# PUSH_TOKEN_* secrets), not in this file — the file carries no repo URL and
# no token, so it is safe to host on both instances and review without
# secret exposure. The fan-out's input follows the same rule as per-cluster
# key PAIRS (cf-139 R7): ARGOCD_SYNC_<CAT>_URL as org VARS and
# ARGOCD_SYNC_<CAT>_TOKEN as org SECRETS on the prod instance (owner ruling
# 2026-11-23: org-scoped key hygiene, inherited by the repository here).
# Scope resolution per source: vars run repo > org/user > global, secrets
# repo > owner (DECISIONS 2026-11-26, RESEARCH round 3) — moot under the
# no-repo-twin rule either way: a repo twin of either kind WINS silently, so
# pair keys must never be created repo-side, and this file only documents
# the placement the runbook creates. The job is FLEET-BLIND (cf-139 R8):
# the values surface is the org key pairs and this file carries none — the
# filter step below selects the pair-named keys out of the delivered blobs,
# so a fleet change is org-key work, never a workflow edit.
#
# The sync-fanout job IS the webhook: no external webhook exists. It drives
# every cluster's ArgoCD API directly with the per-cluster bearer tokens and
# fires only after push-gh succeeded AND the two release builders
# (build-containers + build-charts) came back green — the third called
# builder (push-coder-templates, cf-56 C04) is deliberately NOT in this
# gate: the fleet release does not hold over an external-service publish —
# because the fleet's app sources read
# GitHub — an earlier fan-out would land the PREVIOUS revision (the ordering
# is the race resolution, cf-139 R1 option (c); the builder wait is the
# owner's D59 ruling: sync waits until it BUILDS successfully — a red
# builder holds the fleet at the previous revision until the next green
# fan, and the unmoved marker re-covers the failed range by construction).
# Values never reach run
# bodies or argv: they arrive as step env (an interpolation lands in the
# step script file the runner writes), and only the filter step's env
# carries the serialized blobs. Its failure posture lives in the script
# (scripts/argocd-fanout.py owns both lanes): an unconfigured fleet is a
# designed warn-and-skip-green — the column-0 line comes from the script's
# own stdout — while setup errors (a half pair, a malformed org key, a
# broken roster) go RED through the unguarded call, because a typo'd key
# must not silently lose a cluster every push forever (DECISIONS
# exit-posture refinement, unchanged through R8).
# The push itself already landed in the completed push jobs, so a red
# fan-out job breaks nothing but hides nothing either; per-target runtime
# failures audit honestly and stay green (the fan-out is SHA-agnostic, the
# next push self-heals).
#
# The advance-marker job is the SHARED MARKER'S SINGLE WRITER (D54): it
# needs both builders (the plain success gate IS the aggregate rule), pushes
# the charts bump commit when this fan's range minted one — else the event
# sha —
# onto refs/heads/ci/last-built with the C14 ancestor tolerance (refusal is
# a CLASSIFY: already-advanced skip-green, divergence red). The marker
# stays Forgejo-local: this file mirrors refs/heads/main alone, so GitHub
# never receives it, and the push wears no PAT (the same-repo credential,
# the header law above, moved here with the job).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  push-gh:
    if: contains(vars.ROLE, 'prod')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # A one-commit shallow clone cannot negotiate a non-force push.
          fetch-depth: 0
      - name: diag
        run: |
          set -euo pipefail
          echo "ROLE=${{ vars.ROLE }}"
      - name: push main to GitHub
        env:
          PUSH_URL: ${{ vars.PUSH_URL_GH }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN_GH }}
        run: |
          set -euo pipefail
          rest="${PUSH_URL#https://}"
          git push "https://x-access-token:${PUSH_TOKEN}@${rest}" HEAD:refs/heads/main

  push-dev:
    if: contains(vars.ROLE, 'prod')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # A one-commit shallow clone cannot negotiate a non-force push.
          fetch-depth: 0
      - name: diag
        run: |
          set -euo pipefail
          echo "ROLE=${{ vars.ROLE }}"
      - name: push main to the dev instance
        env:
          PUSH_URL: ${{ vars.PUSH_URL_DEV }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN_DEV }}
        run: |
          set -euo pipefail
          rest="${PUSH_URL#https://}"
          git push "https://x-access-token:${PUSH_TOKEN}@${rest}" HEAD:refs/heads/main

  build-containers:
    # C15/D56: the containers builder is CALLED, not push-triggered — one
    # fan per prod-main push, its own ROLE guard inside stays the belt.
    if: contains(vars.ROLE, 'prod')
    runs-on: ubuntu-24.04
    uses: ./.forgejo/workflows/build-containers.yaml
    secrets: inherit

  build-charts:
    # Same for the chart builder (marker..sha detection inside replaces the
    # retired paths filter); its bump_sha output feeds the advance below.
    if: contains(vars.ROLE, 'prod')
    runs-on: ubuntu-24.04
    uses: ./.forgejo/workflows/build-charts.yaml
    secrets: inherit

  push-coder-templates:
    # Same for the coder-template publisher (cf-56 C04, the OQ10 fan
    # member, card #56): CALLED, not push-triggered — its push arm
    # retired with the C15 re-aim, the marker..sha detection inside does
    # the path work over charts/coder/coder-templates/ (the shared marker
    # is read-only there; this workflow never writes it). It mints no
    # commits, so the bump-sha endpoint rule's event-sha fallback covers
    # it. Deliberately NOT in sync-fanout's needs: a red coder leg
    # blocks the aggregate below but not the fleet release — the fleet
    # does not hold over an external-service publish (D59's hard gate is
    # about the registry releases).
    if: contains(vars.ROLE, 'prod')
    runs-on: ubuntu-24.04
    uses: ./.forgejo/workflows/coder-template-push.yaml
    secrets: inherit

  advance-marker:
    # D54 single writer: needs IS the aggregate rule — the builders green
    # (build-containers, build-charts, push-coder-templates; a red coder
    # leg holds the shared marker) or this job never runs; a red fan
    # leaves the marker put, so the next fan's marker..sha range still
    # carries the failed work (re-cover).
    needs: [build-containers, build-charts, push-coder-templates]
    if: contains(vars.ROLE, 'prod')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Push negotiation needs the real history, not the single-commit
          # default (the main-sync and builder precedent).
          fetch-depth: 0
      - name: advance the shared last-built marker
        run: |
          set -euo pipefail
          # The endpoint: the charts bump commit if this fan's range minted
          # one (D53 — an event-sha endpoint would re-enter the bump's own
          # charts/** edits into the next detection forever), else the
          # event sha — including when the called-workflow output arrives
          # unexpanded (act hands unresolved outputs through as literal
          # expression text, the no-bump fires). Fetch main so the bump
          # object is pushable from this
          # checkout. Plain push first, no force form anywhere; on a shared
          # branch a refusal is a CLASSIFY (C14/D54): already-advanced reads
          # calm-green, divergence goes red naming both sides and the owner
          # verbs. No PAT: the checkout's same-repo credential.
          git fetch origin refs/heads/main:refs/remotes/origin/main
          RAW='${{ needs.build-charts.outputs.bump_sha }}'
          TARGET="$GITHUB_SHA"
          # Unresolved called-workflow outputs reach bash as literal
          # expression text (act pass-through, no-bump fires) — anything
          # that is not a resolved 40-hex means no bump commit exists for
          # this fan, so the event-sha endpoint is correct (D53); a
          # resolved-but-malformed value stays loud red.
          case "$RAW" in
            ""|*'{{'*) : ;;
            *) if printf '%s' "$RAW" | grep -Eq '^[0-9a-f]{40}$'; then
                 TARGET="$RAW"
               else
                 echo "main-sync: bump_sha resolved to a non-sha value: $RAW" >&2
                 exit 1
               fi ;;
          esac
          if git push origin "${TARGET}:refs/heads/ci/last-built"; then
            echo "marker advanced to ${TARGET}"
            exit 0
          fi
          git fetch origin refs/heads/ci/last-built
          if git merge-base --is-ancestor "${TARGET}" FETCH_HEAD; then
            echo "marker already advanced past this run's endpoint — consistent"
            exit 0
          fi
          echo "main-sync: ci/last-built diverged from this fan's endpoint ${TARGET} (marker $(git rev-parse FETCH_HEAD) — not an ancestor either way) — reset the marker ref to a reachable commit or delete it to fall back to the payload chain" >&2
          exit 1

  sync-fanout:
    # needs: [push-gh, build-containers, build-charts] IS the race
    # resolution (cf-139 R1 option (c)) grown by the D59 owner ruling: the
    # fleet's app sources track GitHub, so the fan-out may only fire once
    # GitHub already carries this push, AND both builders came back green
    # (a red release holds the fleet; the unmoved marker re-covers the
    # failed range next fan). Anatomy (cf-139 R8): the filter step receives
    # the delivered merged maps as toJSON blobs in its OWN step env — the
    # vars merge carries the instance-global tier too (global+owner+repo),
    # the secrets merge is owner+repo — selects the pair-named keys into
    # the ephemeral pairs file, and the fan-out step hands the script only
    # that path — the checkout-running step's environment stays at the
    # pair floor (RESEARCH Agenda 4). The python
    # call is UN-guarded on purpose: the script owns the unset skip
    # (warn-green) and the config-RED lanes, and its exit code must reach
    # the job; per-target runtime failures stay soft inside its audit
    # contract.
    needs: [push-gh, build-containers, build-charts]
    if: contains(vars.ROLE, 'prod')
    runs-on: ubuntu-24.04
    steps:
      - name: diag
        run: |
          set -euo pipefail
          echo "ROLE=${{ vars.ROLE }}"
      - uses: actions/checkout@v7
      - name: resolve fan-out pairs
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          # Dumb serializer by ruling (DECISIONS 2026-11-26): select the
          # pair-named keys out of both delivered maps — the later secrets
          # loop wins a same-name collision — write the flat NAME->value
          # map, then print the count and nothing else. Pair completeness,
          # the configured/kill lanes and every validation belong to
          # scripts/argocd-fanout.py; the split is what keeps ONE validator
          # contract for both channels. Invalid JSON raises loud (fails the
          # step; an engine surprise must never half-write).
          mkdir -p "$RUNNER_TEMP"
          python3 -c '
          import json, os, re
          sel = re.compile("^ARGOCD_SYNC_(.+)_(URL|TOKEN)$")
          pairs = {}
          for key, value in json.loads(os.environ.get("VARS_JSON") or "{}").items():
              if sel.match(key):
                  pairs[key] = value
          for key, value in json.loads(os.environ.get("SECRETS_JSON") or "{}").items():
              if sel.match(key):
                  pairs[key] = value
          path = os.path.join(os.environ["RUNNER_TEMP"], "pairs.json")
          with open(path, "w") as f:
              json.dump(pairs, f, sort_keys=True)
          os.chmod(path, 0o600)
          print("filter: %d keys selected" % len(pairs))
          '
      - name: fan out ArgoCD syncs
        env:
          # The script discovers from this file; the blobs themselves stop
          # at the filter step.
          ARGOCD_PAIRS_FILE: ${{ runner.temp }}/pairs.json
          EVT_REF: ${{ forgejo.event.ref }}
          # GH_REF stays the github.ref compat name: no proven forgejo.ref
          # sibling on this fleet (DECISIONS D4 — the ref family keeps the
          # documented github.* fallback beside the fleet-proven event.*
          # sub-context).
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # dispatch/first-push may carry no event ref (build-charts.yaml:96
          # precedent) — the chain resolves main, never an empty ref.
          REF="${EVT_REF:-${GH_REF:-refs/heads/main}}"
          python3 scripts/argocd-fanout.py --config scripts/argocd-fanout.json --ref "$REF"
