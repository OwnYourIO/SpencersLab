# Both Forgejo instances host this repo, but only the prod-stage one may
# fan main out to GitHub and to the dev instance. The jobs guard on the
# instance-side repo variable ROLE (prod on infra, a non-prod value on the
# dev server): there the guard is false for both, so nothing fires on dev
# and the pushes cannot ping-pong. An unset ROLE renders empty and fires
# nothing too (fail-safe).
#
# Every push is plain and non-force: a refused non-fast-forward or any
# error exits the step and fails the job, so a target is never overwritten;
# the instance's built-in push mirror, which overwrites its targets, is not
# used.
#
# Destinations and credentials live instance-side (PUSH_URL_* repo vars and
# PUSH_TOKEN_* secrets), not in this file — the file carries no repo URL and
# no token, so it is safe to host on both instances and review without
# secret exposure.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  push-gh:
    if: vars.ROLE == 'prod'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          # A one-commit shallow clone cannot negotiate a non-force push.
          fetch-depth: 0
      - name: diag
        run: |
          set -euo pipefail
          echo "ROLE=${{ vars.ROLE }}"
      - name: push main to GitHub
        env:
          PUSH_URL: ${{ vars.PUSH_URL_GH }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN_GH }}
        run: |
          set -euo pipefail
          rest="${PUSH_URL#https://}"
          git push "https://x-access-token:${PUSH_TOKEN}@${rest}" HEAD:refs/heads/main

  push-dev:
    if: vars.ROLE == 'prod'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          # A one-commit shallow clone cannot negotiate a non-force push.
          fetch-depth: 0
      - name: diag
        run: |
          set -euo pipefail
          echo "ROLE=${{ vars.ROLE }}"
      - name: push main to the dev instance
        env:
          PUSH_URL: ${{ vars.PUSH_URL_DEV }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN_DEV }}
        run: |
          set -euo pipefail
          rest="${PUSH_URL#https://}"
          git push "https://x-access-token:${PUSH_TOKEN}@${rest}" HEAD:refs/heads/main
