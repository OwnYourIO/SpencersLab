apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-filer-3
  namespace: default
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: swfs-filer-grpc
      port: 18883
      protocol: TCP
      targetPort: 18888
    # Required by seaweedfs-csi-driver >= v1.4.32 (see filer-0 service for
    # the full rationale): the VAC store needs filer HTTP at the base port.
    - name: swfs-filer
      port: 8883
      protocol: TCP
      targetPort: 8888
  selector:
    app.kubernetes.io/component: filer
    app.kubernetes.io/name: seaweedfs
    apps.kubernetes.io/pod-index: "3"
