apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dev
spec:
  storageClassName: ""
  volumeName: dev
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 30Gi

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dev
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 30Ti
  csi:
    driver: seaweedfs-csi-driver
    # volumeHandle doesn't seem to have an impact, but is required. For now, just matching volume name.
    volumeHandle: dev
    volumeAttributes:
      collection: dev
      replication: "001"
      path: /buckets/dev
      diskType: "hdd"
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
