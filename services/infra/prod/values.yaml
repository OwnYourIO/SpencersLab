bitwardenIds:
  keycloak: OVERRIDE_VIA_CUSTOM_VALUES
  keycloak-pg: OVERRIDE_VIA_CUSTOM_VALUES
  smtp: OVERRIDE_VIA_CUSTOM_VALUES

domain: OVERRIDE_VIA_APPSET
clusterName: OVERRIDE_VIA_APPSET

charts:
  external-secrets-bitwarden:
    version: 1.0.10 # renovate: datasource=helm registryUrl=https://ownyourio.github.io/SpencersLab/
    repository: https://ownyourio.github.io/SpencersLab/
    namespace: default
    ServerSideApply: "true"
  # Internal chart (charts/forgejo) — versioned by CI, not renovate. The
  # chart's CNPG Cluster carries its own ServerSideApply=true sync-option
  # annotation; the app itself must not SSA (same as dev).
  forgejo:
    namespace: default
    ServerSideApply: "false"
  k8s-monitoring:
    #version: 1.0.13 # renovate: datasource=helm registryUrl=https://ownyourio.github.io/SpencersLab/
    #repository: https://ownyourio.github.io/SpencersLab/
    namespace: default
    ServerSideApply: "true"
  seaweedfs:
    #version: 1.0.13 # renovate: datasource=helm registryUrl=https://ownyourio.github.io/SpencersLab/
    #repository: https://ownyourio.github.io/SpencersLab/
    namespace: default
    ServerSideApply: "false"
  seaweedfs-csi-driver:
    #version: 1.0.1 # renovate: datasource=helm registryUrl=https://ownyourio.github.io/SpencersLab/
    #repository: https://ownyourio.github.io/SpencersLab/
    namespace: default
    ServerSideApply: "false"
  389ds:
    #version: 1.0.13 # renovate: datasource=helm registryUrl=https://ownyourio.github.io/SpencersLab/
    #repository: https://ownyourio.github.io/SpencersLab/
    namespace: default
    ServerSideApply: "true"
  keycloakx:
    #version: 1.0.13 # renovate: datasource=helm registryUrl=https://ownyourio.github.io/SpencersLab/
    #repository: https://ownyourio.github.io/SpencersLab/
    namespace: default
    ServerSideApply: "true"
  smtp-relay:
    #version: 1.0.13 # renovate: datasource=helm registryUrl=https://ownyourio.github.io/SpencersLab/
    #repository: https://ownyourio.github.io/SpencersLab/
    namespace: default
    ServerSideApply: "true"

ingress:
  subdomains:
    login:
      #serviceName: keycloakx
      service: infra-keycloakx-http
      port: 80

    seaweedfs-filer:
      serviceName: seaweedfs-filer.infra
      service: seadweedfs-filer
      port: 8888

    seaweedfs-volume:
      serviceName: seaweedfs-volume.infra
      service: seaweedfs-volume
      port: 8080
    
    seaweedfs-admin:
      serviceName: seaweedfs-admin.infra
      service: seaweedfs-admin
      port: 23646

    seaweedfs-master:
      serviceName: seaweedfs-master.infra
      service: seaweedfs-master
      port: 9333

    s3:
      #serviceName: seaweedfs-s3.infra
      service: seaweedfs-s3
      port: 8333

    # Forgejo (infra cluster): git is the canonical host (DOMAIN/ROOT_URL),
    # forgejo is an alias for the same instance.
    git:
      service: infra-forgejo-http
      port: 3000
    forgejo:
      service: infra-forgejo-http
      port: 3000

    cluster:
      clusterBase: true
      service: argocd-server
      port: 80
    traefik:
      clusterBase: true
      namespace: kube-system
      service: traefik
      port: 80

# This is needed to enable the seaweedfs port on 8080.
seaweedVolumePort: 8080

# Git-over-SSH exposure for the infra forgejo instance: opens the Gateway
# API gitssh listener + ServiceLB port on this node, consumed by
# charts/base's traefik HelmChartConfig; the matching tcproutes CRD is the
# adjacent gateway-api-crds block. Must equal the SSH port the forgejo chart
# advertises in clone URLs.
gitSshPort: 22222

# Companion wiring for gitSshPort (keep adjacent — the two move together):
# the gitssh gateway needs the experimental-channel tcproutes CRD (traefik
# 3.7 watches TCPRoute at v1alpha2), served by the base chart's
# gateway-api-crds dependency. Scoped to tcproutes only, so the ownership
# overlap with k3s's traefik-crd release stays at exactly 1 CRD (full
# overlap note: charts/base/values.yaml).
gateway-api-crds:
  enabled: true
  standard:
    enabled: false
  experimental:
    enabled: true
    crds:
      # experimental tcproutes ONLY (tcproutes stays at its chart default
      # true; every other toggle off) — all other gateway CRDs stay owned
      # by k3s's traefik-crd release.
      backendtlspolicies: false
      gatewayclasses: false
      gateways: false
      grpcroutes: false
      httproutes: false
      listenersets: false
      referencegrants: false
      tlsroutes: false
      udproutes: false
      xbackends: false
      xbackendtrafficpolicies: false
      xlistenersets: false   # no template in the chart today; explicit for forward-compat
      xmeshes: false
  global:
    resourcePolicy:
      keep: true   # uninstalling the base release must not cascade-delete a CRD that k3s also owns

prometheus:
  serviceMonitorSelectorNilUsesHelmValues: false

generic-device-plugin:
  app-template:
    configMaps:
      config:
        enabled: true
        data:
          devices.yaml: |-
            devices:
              - name: hdd
                groups:
                  - paths:
                      - path: /var/mnt/drive1
                        mountPath: /drive
                      - path: /var/mnt/drive2
                        mountPath: /drive
                      - path: /var/mnt/drive3
                        mountPath: /drive
                      - path: /var/mnt/drive4
                        mountPath: /drive
                      - path: /var/mnt/drive5
                        mountPath: /drive

samba:
  app-template:
    controllers:
      samba:
        containers:
          main:
            image:
              repository: ghcr.io/crazy-max/samba
              tag: 4.23.8@sha256:b37f7af97c773eddb593537f64da6389e5ee6695bcecf44f3ba1a8a6bcf34125
            env:
              TZ: America/Denver
              SAMBA_HOSTS_ALLOW: "127.0.0.0/8 10.0.0.0/16"
              SAMBA_SERVER_STRING: &serverstring "storage.spencerslab.com"
              #WSDD2_ENABLE: "1"
              #WSDD2_HOSTNAME: "storage"
              #WSDD2_NETBIOS_NAME: "storage"

    configMaps:
      samba-config:
        data:
          samba.yaml: |-
            ---
            auth:
              - user: spencer
                group: spencer
                uid: 1000
                gid: 1000
                password_file: /run/secrets/spencer_password
            share:
              - name: media
                path: /mnt/media
                browsable: yes
                writable: yes
                readonly: no
                guestok: no
                validusers: spencer
                writelist: spencer
                veto: no
                hidefiles: /_*/
                recycle: yes
                force user: 1000
              - name: backup-gpu
                path: /mnt/backup-gpu
                browsable: yes
                readonly: no
                guestok: no
                public: yes
                validusers: spencer
                writelist: spencer
                veto: no
                hidefiles: /_*/
                recycle: yes
                force user: spencer
              - name: dev
                security: user
                path: /mnt/dev
                browsable: yes
                readonly: no
                guestok: no
                validusers: spencer
                writelist: spencer
                veto: no
                hidefiles: /_*/
                recycle: yes
              - name: documents
                security: user
                path: /mnt/documents
                browsable: yes
                readonly: no
                guestok: no
                validusers: spencer
                writelist: spencer
                veto: no
                hidefiles: /_*/
                recycle: yes
              - name: pictures
                path: /mnt/pictures
                browsable: yes
                readonly: no
                guestok: no
                validusers: spencer
                writelist: spencer
                veto: no
                hidefiles: /_*/
                recycle: yes
              - name: backups
                create mask: 666
                directory mask: 777
                path: /mnt/backups
                browsable: yes
                readonly: no
                guestok: no
                validusers: spencer
                writelist: spencer
                veto: no
                hidefiles: /_*/
                recycle: yes

    persistence:
      users:
        type: secret
        name: keycloak-secret
        advancedMounts:
          samba:
            main:
              - path: /run/secrets/spencer_password
                subPath: KEYCLOAK_ADMIN_PASSWORD
                readOnly: true

      config:
        name: "infra-samba"
        type: configMap
        advancedMounts:
          samba:
            main:
              - path: /data/config.yml
                subPath: samba.yaml
                readOnly: true
      media:
        existingClaim: media
        globalMounts:
          - path: /mnt/media
      player:
        existingClaim: backup-gpu
        globalMounts:
          - path: /mnt/backup-gpu
      pictures:
        existingClaim: pictures
        globalMounts:
          - path: /mnt/pictures
      documents:
        existingClaim: documents
        globalMounts:
          - path: /mnt/documents
      backups:
        existingClaim: backups
        globalMounts:
          - path: /mnt/backups
      dev:
        existingClaim: dev
        globalMounts:
          - path: /mnt/dev

# ToolHive MCP platform extension (base deploys hivetools on every cluster):
# read-only Postgres MCP servers for this cluster's CNPG databases, exposed at
# mcp.infra.<domain> (charts/hivetools generic-mcp-ingress). OIDC stays
# disabled until the rollout is re-enabled chart-wide.
hivetools:
  bitwardenIds:
    mcp-pg-keycloak: OVERRIDE_VIA_CUSTOM_VALUES
  postgresMcp:
    databases:
      # name must match the CNPG cluster name (pg-<name>) so the composed
      # AIRMAN_MCP_DATABASE_URL host pg-<name>-rw resolves.
      - name: keycloak
        bitwardenIdKey: mcp-pg-keycloak
        database: keycloak
