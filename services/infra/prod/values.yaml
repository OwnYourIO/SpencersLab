bitwardenIds:
  keycloak: OVERRIDE_VIA_CUSTOM_VALUES
  keycloak-pg: OVERRIDE_VIA_CUSTOM_VALUES
  smtp: OVERRIDE_VIA_CUSTOM_VALUES

domain: OVERRIDE_VIA_APPSET
clusterName: OVERRIDE_VIA_APPSET

charts:
  external-secrets-bitwarden:
    version: 1.0.10 # renovate: datasource=helm registryUrl=https://ownyourio.github.io/SpencersLab/
    repository: https://ownyourio.github.io/SpencersLab/
    namespace: default
    ServerSideApply: "true"
  # Internal chart (charts/forgejo) — versioned by CI, not renovate. The
  # chart's CNPG Cluster carries its own ServerSideApply=true sync-option
  # annotation; the app itself must not SSA (same as dev).
  forgejo:
    namespace: default
    ServerSideApply: "false"
  k8s-monitoring:
    #version: 1.0.13 # renovate: datasource=helm registryUrl=https://ownyourio.github.io/SpencersLab/
    #repository: https://ownyourio.github.io/SpencersLab/
    namespace: default
    ServerSideApply: "true"
  seaweedfs:
    #version: 1.0.13 # renovate: datasource=helm registryUrl=https://ownyourio.github.io/SpencersLab/
    #repository: https://ownyourio.github.io/SpencersLab/
    namespace: default
    ServerSideApply: "false"
  seaweedfs-csi-driver:
    #version: 1.0.1 # renovate: datasource=helm registryUrl=https://ownyourio.github.io/SpencersLab/
    #repository: https://ownyourio.github.io/SpencersLab/
    namespace: default
    ServerSideApply: "false"
  389ds:
    #version: 1.0.13 # renovate: datasource=helm registryUrl=https://ownyourio.github.io/SpencersLab/
    #repository: https://ownyourio.github.io/SpencersLab/
    namespace: default
    ServerSideApply: "true"
  keycloakx:
    #version: 1.0.13 # renovate: datasource=helm registryUrl=https://ownyourio.github.io/SpencersLab/
    #repository: https://ownyourio.github.io/SpencersLab/
    namespace: default
    ServerSideApply: "true"
  smtp-relay:
    #version: 1.0.13 # renovate: datasource=helm registryUrl=https://ownyourio.github.io/SpencersLab/
    #repository: https://ownyourio.github.io/SpencersLab/
    namespace: default
    ServerSideApply: "true"

ingress:
  subdomains:
    login:
      #serviceName: keycloakx
      service: infra-keycloakx-http
      port: 80

    seaweedfs-filer:
      serviceName: seaweedfs-filer.infra
      service: seadweedfs-filer
      port: 8888

    seaweedfs-volume:
      serviceName: seaweedfs-volume.infra
      service: seaweedfs-volume
      port: 8080
    
    seaweedfs-admin:
      serviceName: seaweedfs-admin.infra
      service: seaweedfs-admin
      port: 23646

    seaweedfs-master:
      serviceName: seaweedfs-master.infra
      service: seaweedfs-master
      port: 9333

    s3:
      #serviceName: seaweedfs-s3.infra
      service: seaweedfs-s3
      port: 8333

    # Forgejo (infra cluster): git is the canonical host (DOMAIN/ROOT_URL),
    # forgejo is an alias for the same instance.
    git:
      service: infra-forgejo-http
      port: 3000
    forgejo:
      service: infra-forgejo-http
      port: 3000

    cluster:
      clusterBase: true
      service: argocd-server
      port: 80
    traefik:
      clusterBase: true
      namespace: kube-system
      service: traefik
      port: 80

# This is needed to enable the seaweedfs port on 8080.
seaweedVolumePort: 8080

# Git-over-SSH exposure for the infra forgejo instance: opens the Gateway
# API gitssh listener + ServiceLB port on this node, consumed by
# charts/base's traefik HelmChartConfig and its vendored tcproutes CRD gate.
# Must equal the SSH port the forgejo chart advertises in clone URLs.
gitSshPort: 22222

prometheus:
  serviceMonitorSelectorNilUsesHelmValues: false

generic-device-plugin:
  app-template:
    configMaps:
      config:
        enabled: true
        data:
          devices.yaml: |-
            devices:
              - name: hdd
                groups:
                  - paths:
                      - path: /var/mnt/drive1
                        mountPath: /drive
                      - path: /var/mnt/drive2
                        mountPath: /drive
                      - path: /var/mnt/drive3
                        mountPath: /drive
                      - path: /var/mnt/drive4
                        mountPath: /drive
                      - path: /var/mnt/drive5
                        mountPath: /drive

samba:
  app-template:
    controllers:
      samba:
        containers:
          main:
            image:
              repository: ghcr.io/crazy-max/samba
              tag: 4.21.4@sha256:75f5037770eab774b82f298268305af8a18a01a1daad679f8d2d17c54059c847
            env:
              TZ: America/Denver
              SAMBA_HOSTS_ALLOW: "127.0.0.0/8 10.0.0.0/16"
              SAMBA_SERVER_STRING: &serverstring "storage.spencerslab.com"
              #WSDD2_ENABLE: "1"
              #WSDD2_HOSTNAME: "storage"
              #WSDD2_NETBIOS_NAME: "storage"

    configMaps:
      samba-config:
        data:
          samba.yaml: |-
            ---
            auth:
              - user: spencer
                group: spencer
                uid: 1000
                gid: 1000
                password_file: /run/secrets/spencer_password
            share:
              - name: media
                path: /mnt/media
                browsable: yes
                writable: yes
                readonly: no
                guestok: no
                validusers: spencer
                writelist: spencer
                veto: no
                hidefiles: /_*/
                recycle: yes
                force user: 1000
              - name: backup-gpu
                path: /mnt/backup-gpu
                browsable: yes
                readonly: no
                guestok: no
                public: yes
                validusers: spencer
                writelist: spencer
                veto: no
                hidefiles: /_*/
                recycle: yes
                force user: spencer
              - name: dev
                security: user
                path: /mnt/dev
                browsable: yes
                readonly: no
                guestok: no
                validusers: spencer
                writelist: spencer
                veto: no
                hidefiles: /_*/
                recycle: yes
              - name: documents
                security: user
                path: /mnt/documents
                browsable: yes
                readonly: no
                guestok: no
                validusers: spencer
                writelist: spencer
                veto: no
                hidefiles: /_*/
                recycle: yes
              - name: pictures
                path: /mnt/pictures
                browsable: yes
                readonly: no
                guestok: no
                validusers: spencer
                writelist: spencer
                veto: no
                hidefiles: /_*/
                recycle: yes
              - name: backups
                create mask: 666
                directory mask: 777
                path: /mnt/backups
                browsable: yes
                readonly: no
                guestok: no
                validusers: spencer
                writelist: spencer
                veto: no
                hidefiles: /_*/
                recycle: yes

    persistence:
      users:
        type: secret
        name: keycloak-secret
        advancedMounts:
          samba:
            main:
              - path: /run/secrets/spencer_password
                subPath: KEYCLOAK_ADMIN_PASSWORD
                readOnly: true

      config:
        name: "infra-samba"
        type: configMap
        advancedMounts:
          samba:
            main:
              - path: /data/config.yml
                subPath: samba.yaml
                readOnly: true
      media:
        existingClaim: media
        globalMounts:
          - path: /mnt/media
      player:
        existingClaim: backup-gpu
        globalMounts:
          - path: /mnt/backup-gpu
      pictures:
        existingClaim: pictures
        globalMounts:
          - path: /mnt/pictures
      documents:
        existingClaim: documents
        globalMounts:
          - path: /mnt/documents
      backups:
        existingClaim: backups
        globalMounts:
          - path: /mnt/backups
      dev:
        existingClaim: dev
        globalMounts:
          - path: /mnt/dev

# ToolHive MCP platform extension (base deploys hivetools on every cluster):
# read-only Postgres MCP servers for this cluster's CNPG databases, exposed at
# mcp.infra.<domain> (charts/hivetools generic-mcp-ingress). OIDC stays
# disabled until the rollout is re-enabled chart-wide.
hivetools:
  bitwardenIds:
    mcp-pg-keycloak: OVERRIDE_VIA_CUSTOM_VALUES
  postgresMcp:
    databases:
      # name must match the CNPG cluster name (pg-<name>) so the composed
      # AIRMAN_MCP_DATABASE_URL host pg-<name>-rw resolves.
      - name: keycloak
        bitwardenIdKey: mcp-pg-keycloak
        database: keycloak
