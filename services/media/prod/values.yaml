jellyfin:
  global:
    nameOverride: jellyfin
  controllers:
    jellyfin:
      pod:
        securityContext:
          runAsUser: 1000
          # Using gid 2000 as "shared" group.
          runAsGroup: 2000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          supplementalGroups:
            - 44 # video
            - 109 # render
            - 105
            - 568
            - 1000
            - 2000
      containers:
        app:
          image:
            repository: jellyfin/jellyfin
            tag: 10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
          env:
            TZ: America/Denver
            JELLYFIN_DATA_DIR: /config/data
            JELLYFIN_CONFIG_DIR: /config
            JELLYFIN_SMTP_SERVER: "smtp-relay-mail"
            # TODO: Extract this.
            JELLYFIN_SMTP_FROM_ADDRESS: "player@spencerslab.com"
            #JELLYFIN_PublishedServerUrl: https://jellyfin.$.Values.domain
            #DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "true"
            #JELLYFIN_FFmpeg__probesize: "50000000"
            #JELLYFIN_FFmpeg__analyzeduration: "50000000"
  service:
    app:
      controller: jellyfin
      type: ClusterIP
      ports:
        http:
          port: 8096
  persistence:
    config:
      existingClaim: jellyfin
    share:
      existingClaim: jellyfin-share
    media:
      existingClaim: media

jellyseerr:
  env:
    - name: TZ
      value: America/Denver

  # Additional volumes on the output Deployment definition.
  volumes:
    - name: jellyseerr-config
      persistentVolumeClaim:
        claimName: jellyseerr

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts:
    - name: jellyseerr-config
      mountPath: "/config"

lidarr:
  # Nightly branch REQUIRED for the plugin system (Tubifarry, Brainarr).
  # ONE-WAY DB migration — /config PVC backed up first (plan phase 1a).
  # LSIO publishes pinnable nightly-version-* tags (repo pinning rule);
  # bump tag + plugins together (plugins declare Minimum Lidarr Version).
  image:
    repository: lscr.io/linuxserver/lidarr
    tag: nightly-version-3.1.6.5078
  env:
    - name: TZ
      value: America/Denver
    - name: PUID
      value: "1000"
    - name: PGID
      value: "1000"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  volumes:
    - name: lidarr-config
      persistentVolumeClaim:
        claimName: lidarr
    - name: media
      persistentVolumeClaim:
        claimName: media
    # betanin custom script + its API key (phases 2a/2c). optional: true keeps
    # this existing service running even before the betanin ExternalSecret is
    # ready (Bitwarden UUID not yet filled) — the script just won't find its
    # key file until then.
    - name: betanin-script
      configMap:
        name: lidarr-betanin-script
        defaultMode: 0755
    - name: betanin-secret
      secret:
        secretName: betanin
        optional: true
  volumeMounts:
    - name: lidarr-config
      mountPath: "/config"
    - name: media
      mountPath: /media/
    - name: betanin-script
      mountPath: /config/scripts/betanin.sh
      subPath: betanin.sh
    - name: betanin-secret
      mountPath: /config/secrets/betanin/api_key
      subPath: BETANIN_API_KEY

