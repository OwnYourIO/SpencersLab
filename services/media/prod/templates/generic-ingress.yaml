{{- range $name, $config := .Values.ingress.subdomains }}
{{- $subDomain := "" }} {{/* Initialize the variable */}}
{{- if $config.clusterBase | default false}}
{{- $subDomain = printf "%s.%s" $name $.Values.clusterName }}
{{- else }}
{{- $subDomain = $name }}
{{- end}}
{{- /* When serviceName equals the subdomain the two Ingresses below would
       collide on the same name/host; collapse them into one (with the
       external-dns label) instead of rendering a duplicate. */}}
{{- $sameAsService := and $config.serviceName (eq $config.serviceName $subDomain) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ $subDomain | replace "." "-" }}-ingress"
  namespace: default
  annotations:
    # If middlewares is set manually, use that.
    {{- if $config.middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ $config.middlewares }}
    {{- end }}
    #external-dns.alpha.kubernetes.io/target: "proxy-remote.{{ $.Values.domain }}"
  #labels:
  #  external-dns: "enabled"
  {{- if $sameAsService }}
  labels:
    external-dns: "enabled"
  {{- end }}
spec:
  tls:
    - hosts:
      - "{{ $subDomain }}.{{ $.Values.domain }}"
      secretName: wildcard-cert
  rules:
    - host: "{{ $subDomain }}.{{ $.Values.domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "{{ $config.service }}"
                port:
                  number: {{ $config.port }}

{{- if and $config.serviceName (not $sameAsService) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ $config.serviceName }}-ingress"
  namespace: default
  annotations:
    # If middlewares is set manually, use that.
    {{- if $config.middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ $config.middlewares }}
    {{- end }}
    #external-dns.alpha.kubernetes.io/target: "proxy-remote.{{ $.Values.domain }}"
  labels:
    external-dns: "enabled"
spec:
  tls:
    - hosts:
      - "{{ $config.serviceName }}.{{ $.Values.domain }}"
      secretName: wildcard-cert
  rules:
    - host: "{{ $config.serviceName }}.{{ $.Values.domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "{{ $config.service }}"
                port:
                  number: {{ $config.port }}
{{- end }}
{{- end }}
