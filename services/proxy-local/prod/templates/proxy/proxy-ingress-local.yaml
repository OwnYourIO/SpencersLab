# This is mostly used to detect local traffic and force it to use the local middleware rather than remote.
{{- range $name, $config := .Values.proxy.subdomains }}
{{- $basePath := coalesce $config.ssoRedirectPath  "/" }}
{{- $pathWithDomain := regexReplaceAll "\\$\\.Values\\.domain" $basePath $.Values.domain }}
{{- $finalSsoPath := regexReplaceAll "\\$\\.Values\\.authRealm" $pathWithDomain $.Values.authRealm }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ $name }}-local-ingress"
  namespace: default
spec:
  entryPoints:
    - web
    - websecure
  tls:
    secretName: wildcard-cert
  routes:
    # TODO: Turn the ClientIPCheck into a values list that generates ClientIP per 
    - match: Host(`{{ $name }}.{{ $.Values.domain }}`) && (ClientIP(`10.0.0.0/16`) || ClientIP(`192.168.0.0/16`))
      kind: Rule
      # Must beat the kubernetes-Ingress routers, whose DEFAULT priority is the
      # rule length (Host+PathPrefix grows with the subdomain name). 50 only
      # worked for names shorter than ~7 chars — llama-moe reached 52 and its
      # public router won, 403ing direct LAN clients (2026-10-11). Keep this
      # above any realistic rule length; local-sso below stays above it.
      priority: 100
      services:
        - name: "{{ $name }}-service"
          port: 443
      middlewares:
      {{- if dig "ingressRoute" "middlewares" false $config }}
      {{- range $config.ingressRoute.middlewares }}
        - name: {{ . }}
      {{- end }}
      {{- else if $config.ssoRedirectPath }}
        - name: {{ $.Values.proxy.middlewares.entrypoint }}
        - name: default-redirect-{{ $name }}@kubernetescrd
        - name: {{ $.Values.proxy.middlewares.allowList }}
      {{- else }}
        - name: {{ $.Values.proxy.middlewares.entrypoint }}
        - name: {{ $.Values.proxy.middlewares.userAuth }}
      {{- end }}
{{- if $config.ssoRedirectPath }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ $name }}-local-sso-ingress"
  namespace: default
spec:
  entryPoints:
    - web
    - websecure
  tls:
    secretName: wildcard-cert
  routes:
    # TODO: Turn the ClientIPCheck into a values list that generates ClientIP per 
    - match: Host(`{{ $name }}.{{ $.Values.domain }}`) && Path(`{{ $finalSsoPath }}`) && (ClientIP(`10.0.0.0/16`) || ClientIP(`192.168.0.0/16`))
      kind: Rule
      # Above the local route (100): the SSO path must win for LAN clients.
      priority: 150
      services:
        - name: "{{ $name }}-service"
          port: 443
      middlewares:
        - name: {{ $.Values.proxy.middlewares.entrypoint }}
{{- if $config.ssoAllowedPaths }}
{{- range $path := $config.ssoAllowedPaths }}
    - match: Host(`{{ $name }}.{{ $.Values.domain }}`) && PathPrefix(`{{ $path }}`) && (ClientIP(`10.0.0.0/16`) || ClientIP(`192.168.0.0/16`))
      kind: Rule
      # Above the local route (100): the SSO path must win for LAN clients.
      priority: 150
      services:
        - name: "{{ $name }}-service"
          port: 443
      middlewares:
        - name: {{ $.Values.proxy.middlewares.entrypoint }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
