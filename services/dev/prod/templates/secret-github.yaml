# GitHub PAT for dev agents' repo access (clone/push OwnYourIO repos from
# Coder workspaces / agent tooling). Bitwarden item `dev-github` — the PAT
# lives in the item's PASSWORD field (user decision 2026-10-12).
#
# Consumption is USER-OWNED Coder configuration (no in-repo consumer by
# design, decision 2026-10-12): wire the rendered `github-pat` secret into
# workspace templates/parameters (e.g. a coder template variable or
# provisioner env) when setting up the dev Coder instance.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-pat
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: github-pat
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GITHUB_PERSONAL_ACCESS_TOKEN: "{{ `{{ .token }}` }}"
  data:
    - secretKey: token
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "github-pat" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None