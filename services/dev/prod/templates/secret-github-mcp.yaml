# GitHub PAT for the renovate MCP server's repo-clone initContainer (the
# github MCP server itself was dropped; the name is historical). Source is
# the dev-github LOGIN item — the same item as github-pat — whose password
# field carries the PAT (user ruling 2026-10-24). secretKey stays `token`
# so the target Secret shape matches gpu's and the initContainer key holds.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-mcp
  namespace: default
spec:
  refreshInterval: 1h
  target:
    name: github-mcp
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GITHUB_PERSONAL_ACCESS_TOKEN: "{{ `{{ .token }}` }}"
  data:
    - secretKey: token
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "github-mcp" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
