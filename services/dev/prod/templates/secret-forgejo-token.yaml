# Forgejo access token for workspaces: https pushes to git.scifi.farm and
# `fj` auth. Bitwarden item `forgejo-token` — the token lives in the item's
# PASSWORD field (same convention as `dev-github`).
#
# Consumed by the kubernetes-hardened workspace template
# (charts/coder/coder-templates/kubernetes-hardened).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-token
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: forgejo-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        FORGEJO_TOKEN: "{{ `{{ .token }}` }}"
  data:
    - secretKey: token
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "forgejo-token" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
