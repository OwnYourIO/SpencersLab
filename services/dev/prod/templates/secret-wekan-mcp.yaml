# WeKan service-account credentials for the dev-boards MCP server. Dev logs
# in rather than pre-mints: username + password come from the LOGIN item and
# the wekan-mcp image exchanges them for a bearer in-pod, so there is no
# WEKAN_TOKEN here (gpu's template is token-only). The base URL is data, not
# config: it rides the item's URI field via bitwarden-uri, so retargeting the
# server is a Bitwarden edit, not a redeploy (user decision 2026-10-24).
# Multi-store pattern: secret-homeassistant-mcp.yaml on gpu.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wekan-mcp
  namespace: default
spec:
  refreshInterval: 1h
  target:
    name: wekan-mcp
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        WEKAN_USERNAME: "{{ `{{ .username }}` }}"
        WEKAN_PASSWORD: "{{ `{{ .password }}` }}"
        WEKAN_BASE_URL: "{{ `{{ .url }}` }}"
  data:
    - secretKey: username
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "wekan-mcp" }}'
        property: username
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "wekan-mcp" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: url
      sourceRef:
        storeRef:
          name: bitwarden-uri
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "wekan-mcp" }}'
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
