# dev — new dev cluster (public identity dev.scifi.farm).
# Deploys Coder, Forgejo (+ its Actions runner), GPT Researcher, and the
# parity extras (cloudnative-pg, external-secrets-bitwarden, k8s-monitoring).
# No Keycloak on dev (user decision 2026-10-12): SSO follows the lab pattern
# — ArgoCD SSO + hivetools MCP reuse the lab-wide shared client items on the
# lab Keycloak (realm SpencersLab); Coder + Forgejo get dev-specific clients
# in that realm (custom-values/dev/).
# No smtp-relay on dev either (user decision 2026-10-12), hence no
# CODER_EMAIL_* in charts/coder/templates/secret-coder.yaml and no Forgejo
# mailer config.
#
# Bitwarden UUIDs come from custom-values/dev/prod-values.yaml (loaded via
# the services.dev.customValuesUrls cluster annotation); the sentinels below
# are replaced at deploy time.

subDomain: dev
domain: OVERRIDE_VIA_APPSET
clusterName: OVERRIDE_VIA_APPSET

# Git-over-SSH exposure for the dev forgejo instance: opens the Gateway API
# gitssh listener + ServiceLB port on this node, consumed by charts/base's
# traefik HelmChartConfig; the matching tcproutes CRD is the adjacent
# gateway-api-crds block. Must equal the SSH port the forgejo chart
# advertises in clone URLs.
gitSshPort: 22222

# Companion wiring for gitSshPort (keep adjacent — the two move together):
# the gitssh gateway needs the experimental-channel tcproutes CRD (traefik
# 3.7 watches TCPRoute at v1alpha2), served by the base chart's
# gateway-api-crds dependency. Scoped to tcproutes only, so the ownership
# overlap with k3s's traefik-crd release stays at exactly 1 CRD (full
# overlap note: charts/base/values.yaml).
gateway-api-crds:
  enabled: true
  standard:
    enabled: false
  experimental:
    enabled: true
    crds:
      # experimental tcproutes ONLY (tcproutes stays at its chart default
      # true; every other toggle off) — all other gateway CRDs stay owned
      # by k3s's traefik-crd release.
      backendtlspolicies: false
      gatewayclasses: false
      gateways: false
      grpcroutes: false
      httproutes: false
      listenersets: false
      referencegrants: false
      tlsroutes: false
      udproutes: false
      xbackends: false
      xbackendtrafficpolicies: false
      xlistenersets: false   # no template in the chart today; explicit for forward-compat
      xmeshes: false
  global:
    resourcePolicy:
      keep: true   # uninstalling the base release must not cascade-delete a CRD that k3s also owns

bitwardenIds:
  cert-manager-solver-token: OVERRIDE_VIA_CUSTOM_VALUES
  argocd-sso-secret: OVERRIDE_VIA_CUSTOM_VALUES
  github-pat: OVERRIDE_VIA_CUSTOM_VALUES
  # Bitwarden item `forgejo-token` — Forgejo access token (PASSWORD field).
  forgejo-token: OVERRIDE_VIA_CUSTOM_VALUES
  # Consumed by the dev MCP ExternalSecret templates in templates/: github-mcp
  # backs the renovate server's repo-clone initContainer, wekan-mcp carries the
  # boards service account (template headers document each item's shape).
  github-mcp: OVERRIDE_VIA_CUSTOM_VALUES
  wekan-mcp: OVERRIDE_VIA_CUSTOM_VALUES
  # Bitwarden item `forgejo-token-canonical` — access token for
  # git.spencerslab.com (PASSWORD field).
  forgejo-token-canonical: OVERRIDE_VIA_CUSTOM_VALUES

# Chart definitions for appset-charts.yaml (rendered by the base chart).
# Each chart can have: namespace, ServerSideApply, version, repository
charts:
  # Internal charts (no version/repository - uses charts/ directory)
  forgejo:
    namespace: default
    ServerSideApply: "false"
  gpt-researcher:
    namespace: default
    ServerSideApply: "false"
  external-secrets-bitwarden:
    namespace: default
    ServerSideApply: "true"
  k8s-monitoring:
    namespace: default
    ServerSideApply: "true"
  coder:
    namespace: default
    ServerSideApply: "false"
  # Dev-local instance rather than reusing gpu's searxng (user decision
  # 2026-10-24: self-contained dev cluster).
  searxng:
    namespace: default
    ServerSideApply: "false"
  # Client-only service: the runner dials out (forgejo-runner-dev
  # in-cluster to dev-forgejo-http:3000), so it deliberately gets NO
  # ingress.subdomains entry — the service trio's proxy leg is N/A by
  # design, not an oversight. The infra-instance runner was un-wired from
  # dev by user decision 2026-10-25; its registration relocation is
  # pending, so the chart keeps the aliased-instance capability.
  forgejo-runner-dev:
    namespace: default
    ServerSideApply: "false"
    chart: forgejo-runner

  # External charts (with version and repository)
  cloudnative-pg:
    version: 0.29.1
    repository: https://cloudnative-pg.github.io/charts
    namespace: default
    ServerSideApply: "true"

ingress:
  subdomains:
    coder:
      clusterBase: true
      service: coder
      port: 80
    # Public-facing hosts: top-level *.scifi.farm (wildcard-cert), NOT
    # cluster-scoped (user decision 2026-10-13).
    git:
      service: dev-forgejo-http
      port: 3000
    research:
      service: dev-gpt-researcher
      port: 3000
    # LAN-only host: deliberately NOT routed via proxy-remote (user decision
    # 2026-10-24). gpu's entry adds serviceName: searxng; dev omits it because
    # the key-derived host here already equals searxng.<domain>.
    searxng:
      service: dev-searxng
      port: 8080
    cluster:
      clusterBase: true
      service: argocd-server
      port: 80

# Per-app runner slices: appset-charts.yaml merges ONLY the top-level
# <appName>: key into each release (nothing under charts.<appName> ever
# reaches it), so the per-instance URL must ride here — the chart's
# runner.url default is a render-time stand-in.
forgejo-runner-dev:
  runner:
    url: http://dev-forgejo-http:3000   # in-cluster, co-located (dev-forgejo runs in default on the same cluster — live-verified)

# Coder is a wrapper chart (charts/coder): its subchart config, OIDC/PG
# ExternalSecrets and the pg-coder CNPG cluster live in the chart itself.
# Dev-specific values ride custom-values/dev/prod-values.yaml under `coder:`
# (bitwardenIds), matching the gpu pattern.
coder:
  # Three `coder` levels by necessity: this slice → wrapper chart's
  # subchart key → the official coder chart's own `coder.` values key.
  coder:
    coder:
      # Wildcard ingress so workspace app subdomains reach coderd — driven
      # here by the dev service (generic, same mechanism gpu uses from
      # custom-values) instead of being hardcoded in the chart. On dev the
      # wildcard *.dev.scifi.farm is cluster-scoped → cluster-wildcard-cert.
      # The plain coder.dev.scifi.farm host stays with the generic-ingress.
      ingress:
        enable: true
        host: "*.dev.scifi.farm"
        tls:
          enable: true
          secretName: cluster-wildcard-cert

# Forgejo and Coder are wrapper charts (charts/forgejo, charts/coder): their
# subchart config, ExternalSecrets and CNPG clusters live in the charts
# themselves. Dev-specific Bitwarden UUIDs ride custom-values/dev/
# prod-values.yaml under the `forgejo:` / `coder:` keys.

# ToolHive MCP platform (cluster-wide via base): the kubernetes readonly+admin
# servers ship from base's chart defaults; the four utility servers below are
# dev-specific `mcp` entries Helm deep-merges on top, so the defaults stay.
# Routing to https://mcp.dev.<domain>/<name> is chart-owned
# (generic-mcp-ingress.yaml) — no ApplicationSet or ingress.subdomains entry
# per server. Recipe: skills/helm-chart-creation/references/mcp-servers.md.
# postgres-MCP for the dev DBs is a follow-up.
hivetools:
  bitwardenIds:
    mcp-sso: OVERRIDE_VIA_CUSTOM_VALUES
  mcp:
    # Copied from the gpu sources in services/gpu/prod/values.yaml; dev-local
    # differences are commented per entry.
    playwright:
      enabled: true
      image: mcr.microsoft.com/playwright/mcp:v0.0.83
      transport: streamable-http
      mcpPort: 8931
      proxyPort: 8080
      # OIDC temporarily disabled (2026-09) — uncomment to re-enable.
      # oidc:
      #   audience: playwright
      resources:
        limits:
          cpu: '200m'
          memory: '4Gi'
        requests:
          cpu: '100m'
          memory: '128Mi'
      podTemplateSpec:
        spec:
          securityContext:
            fsGroup: 1000
          containers:
          - name: mcp
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
            env:
              - name: XDG_CONFIG_HOME
                value: /home/node/.cache
              - name: XDG_CACHE_HOME
                value: /home/node/.cache
            args:
              - "--headless"
              - "--port"
              - "8931"
              - "--host"
              - "0.0.0.0"
              - --allowed-hosts
              - "*"
              - "--output-dir"
              - "/home/node/.cache/"
              - "--isolated"
            volumeMounts:
              - name: tmp
                mountPath: /tmp
              - name: cache
                mountPath: /home/node/.cache
              - name: output
                mountPath: /output
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 512Mi
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
            - name: output
              emptyDir:
                sizeLimit: 500Mi
    renovate:
      enabled: true
      # Pinned to the first immutable build that includes supergateway (v31 ==
      # :main digest at 2026-09-28). Renovate bumps the :v<run> pin.
      image: ghcr.io/ownyourio/renovate-mcp:v31
      # streamable-http (2026-09-27): renovate-mcp is stdio-only upstream, so
      # the image bridges it with supergateway (stdio → Streamable HTTP).
      # Same reason as searxng: the stdio proxy attach dies permanently after
      # an apiserver blip. Revert = transport: stdio (image ENTRYPOINT still
      # runs renovate-mcp directly; supergateway is additive).
      transport: streamable-http
      mcpPort: 8080
      # OIDC temporarily disabled (2026-09) — uncomment to re-enable.
      # oidc:
      #   audience: renovate
      env:
        - name: RENOVATE_MCP_REQUIRE_CLI
          value: "true"
        - name: RENOVATE_BASE_DIR
          value: /cache
        - name: HOME
          value: /tmp
      resources:
        limits:
          cpu: '2'
          memory: '4Gi'
        requests:
          cpu: '500m'
          memory: '1Gi'
      podTemplateSpec:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
            - name: clone
              image: ghcr.io/ownyourio/renovate-mcp:v31  # same image ships git
              env:
                - name: HOME
                  value: /tmp
                - name: GITHUB_PERSONAL_ACCESS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: github-mcp
                      key: GITHUB_PERSONAL_ACCESS_TOKEN
              command: ["/bin/sh", "-c"]
              args:
                - |
                  # rm -rf first: the /workspace emptyDir survives container
                  # restarts within the same pod, and git clone refuses a
                  # non-empty destination (exit 128 -> CrashLoopBackOff).
                  rm -rf /workspace/SpencersLab
                  git clone --depth 1 --branch main \
                    "https://x-access-token:${GITHUB_PERSONAL_ACCESS_TOKEN}@github.com/OwnYourIO/SpencersLab.git" \
                    /workspace/SpencersLab
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              volumeMounts:
                - mountPath: /workspace
                  name: workspace
                - mountPath: /tmp
                  name: tmp
          containers:
            - name: mcp
              # Bridge: supergateway exposes the stdio renovate-mcp child as
              # Streamable HTTP on mcpPort. Stateless by default (no
              # --stateful): cross-request session state would only wedge the
              # bridge after a restart; renovate's real state lives in
              # /workspace, not in MCP sessions.
              command: ["supergateway"]
              args:
                - --stdio
                - renovate-mcp
                - --outputTransport
                - streamableHttp
                - --port
                - "8080"
              resources:
                requests:
                  cpu: '500m'
                  memory: '1Gi'
                limits:
                  cpu: '2'
                  memory: '4Gi'
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              volumeMounts:
                - mountPath: /workspace
                  name: workspace
                - mountPath: /tmp
                  name: tmp
                - mountPath: /cache
                  name: cache
          volumes:
            - name: workspace
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: cache
              emptyDir: {}
    searxng:
      enabled: true
      image: isokoliuk/mcp-searxng:2.7.0
      # streamable-http (2026-09-27): the stdio attach bridge dies permanently
      # after any transient apiserver outage (ToolHive re-attach gives up after
      # 10 retries and reports healthy anyway — see
      # .agents/plans/2026-09-27-debug-mcp-servers-longterm-fix.md). mcp-searxng
      # serves native Streamable HTTP when MCP_HTTP_PORT is set, so the
      # proxyrunner attach hop goes away entirely (same pattern as wekan/HA).
      transport: streamable-http
      mcpPort: 8080
      # OIDC temporarily disabled (2026-09) — uncomment to re-enable.
      # oidc:
      #   audience: searxng
      resources:
        limits:
          cpu: '100m'
          memory: '1128Mi'
        requests:
          cpu: '50m'
          memory: '64Mi'
      # gpu carries these in podTemplateSpec's container env; dev pins them on
      # the canonical top-level entry field instead (the operator injects
      # spec.env into the mcp container — same mechanism as boards/HA here and
      # on gpu; runtime is identical).
      env:
        - name: SEARXNG_URL
          # Dev-local searxng — the dev-searxng release of charts/searxng on
          # this cluster; gpu's entry points at gpu-searxng instead.
          value: "http://dev-searxng.default.svc.cluster.local:8080"
        # Switches mcp-searxng from stdio to native HTTP mode.
        - name: MCP_HTTP_PORT
          value: "8080"
        - name: MCP_HTTP_HOST
          value: "0.0.0.0"
    # WeKan board management. The target instance comes from the URI field of
    # the wekan-mcp Bitwarden LOGIN item — dev has no local wekan, so the base
    # URL stays data, never a values-pinned host (user decision 2026-10-24).
    # Admin tier: WEKAN_MCP_READ_ONLY is deliberately NOT set — server-side
    # read-only is not enforced on dev (user decision 2026-10-24). The image
    # mints the bearer in-pod from the credentials (containers/wekan-mcp).
    # :main + Always pull per user decision; pinning to a :v<run> build is a
    # renovate-managed follow-up.
    boards:
      enabled: true
      # :v60 = the 25-tool custom-field build (ticket 2026-10-feat-board-coord-intake, D17/M2).
      image: ghcr.io/ownyourio/wekan-mcp:v60
      transport: streamable-http
      mcpPort: 8080
      # OIDC temporarily disabled (2026-09) — uncomment to re-enable.
      # oidc:
      #   audience: boards
      resources:
        limits:
          cpu: '200m'
          memory: '256Mi'
        requests:
          cpu: '50m'
          memory: '64Mi'
      podTemplateSpec:
        spec:
          containers:
            - name: mcp
              # The MCPServer CRD keys spec.secrets as a list-map on Secret
              # name — one entry per Secret. A Secret contributing several env
              # vars lands via the container's envFrom instead (wekan-mcp
              # emits WEKAN_BASE_URL/USERNAME/PASSWORD; gpu homeassistant
              # pattern).
              envFrom:
                - secretRef:
                    name: wekan-mcp
              imagePullPolicy: Always   # retained on the pinned tag: the fleet test contract asserts it, harmless for immutable tags
              securityContext:
                runAsUser: 65532
                runAsGroup: 65532
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
