    # First boot downloads + hashes ONCE: the equality gate at 1000m
    # single-threaded puts the hash in the ~1-2 min class (§D4's 113.6-GiB
    # bound ~5.8-13.6 min SCALES with size — DERIVED; the boot prints the truth),
    # marker-skip after. Sub-minute-class engine load vs fn's minutes-class
    # boot: the asymmetry that makes q27 the nice swap citizen (§R19 VERDICT).
    radianceFetch:
      lfsSha: a4908940c568f5f9dd24e88f46aefe9ac2ae07dfec023a2eaa1d14dcaa3df4f8
      url: https://huggingface.co/StillDeadcode/qwen3.8-27b-mxfp4/resolve/main/qwen3.8-27b-mxfp4.rad
      marker: /models/radiance/.staged-$LFS_SHA
    controllers:
      radiance:
        # The pod-swap resting state (D54(1)): git renders 0 and the owner
        # scales up to flip the lane. The switch-discipline header above
        # states WHY replicas 0 — the three blockers, and the sync law that
        # makes a hand-scale a parked state rather than a defect.
        replicas: 0
        containers:
          radiance:
            # The lane's serving SPECIFICS (owner ruling D43): env entries
            # the chart-owned compose FORM reads, one per profile value it
            # does not fix — the cf-143 D54-ratified profile byte-for-byte as the
            # retired args array shipped it. That profile is the owner's
            # recipe MINUS the api-key rider (cf-143 D54(2): keyless, the dropped
            # rider's env token is banned repo-wide) PLUS the honest served
            # id (cf-143 D7 pattern: qwen3.8-27b-radiance, the id peers + the
            # catalog rows route by). Host :: and the other FORM-fixed flags
            # come from the wrapper (OQ-15: the fn idiom won over the
            # recipe's literal); RADIANCE_TP "1" EQUALS this pod's claim pin.
            # The suite executes the shipped FORM against THIS rendered env
            # and requires the composed vector to equal the cf-143 D54 profile — an
            # extra or missing entry is as red as a drifted value, and the
            # startup echo (D43(2)) is the boot receipt in place of argv.
            #
            # ABSENCES stay contract, env-shaped (each a named bar, §R19): a
            # flag stays out of the vector because its env entry stays out of
            # this list — no RADIANCE_KV_RESIDENT (the arch REFUSES it with a
            # warning; dense attention reads the whole history every step, it
            # cannot stream, §R19-Q1(iii)); no RADIANCE_PLACEMENT /
            # RADIANCE_HOST_POOL_MIB (dense, no experts to place, no host
            # pool to size, §R19-Q7); no RADIANCE_NGRAM_PLACEMENT (q27's
            # family carries no n-gram/PLE layer, §R19-Q7); no
            # RADIANCE_NUM_SPECULATIVE_TOKENS (the z-lab DFlash2 drafter is
            # compiled into the .rad — "the flag simply doesn't own the
            # drafter", §R19-Q5, and --draft-model is a parse error); no
            # RADIANCE_GPU_HEADROOM_MIB (co-residency etiquette, moot in a
            # pod-swap, §R19-Q6). Every number NOT shipped here is
            # engine-default-and-receipt-decides (D28(6) budget-line law).
            #
            # WHY the two shipped context numbers: RADIANCE_MAX_MODEL_LEN
            # 200000 is the PER-SESSION ceiling (what limit.context reports),
            # NOT an 8x200K promise — dense context is VRAM-only at ~32
            # KiB/token fp8 (16 full-attention layers, §R19-Q1), so the
            # pool funds ~335-409K AGGREGATE tokens and "8 at ~45K each" is
            # the honest envelope. RADIANCE_PREFIX_CACHE_MIB 4096 is WILDE'S
            # operational patch, not the model card's (§R19-Q2): ~131K
            # tokens of host-side resume pool at 32 KiB/token, and BELOW
            # one 200K fp8 conversation (~6.4 GiB) — the boot's
            # tier-smaller-than-one-conversation warning is EXPECTED,
            # partial retention IS the config. It ships as the given
            # recipe; nothing here is armed on a measured aggregate — the
            # owner's first boot of the .rad on OUR card prints the
            # VRAM-split receipt that confirms or corrects (C16 note hands
            # it up; limit.context moves only by a DECISIONS line then,
            # never by silent retarget).
            env:
              - name: RADIANCE_MODEL_PATH
                value: /models/radiance/qwen3.8-27b-mxfp4.rad
              - name: RADIANCE_SERVED_ID
                value: qwen3.8-27b-radiance
              - name: RADIANCE_TP
                value: "1"
              - name: RADIANCE_MAX_MODEL_LEN
                value: "200000"
              - name: RADIANCE_PREFIX_CACHE_MIB
                value: "4096"
            resources:
              # 24 GiB request==limit — the D54(3) Guaranteed pair (the D15
              # pod-class law is chart-commented: the serve map below and the
              # init's pair both stay equal).
              # Justification at the scalar (§R19-Q3, receipts not vibes):
              # two INDEPENDENT legs, neither an addend of the other. The
              # band leg — the cgroup-total for this recipe is 16-20 GiB and
              # already CONTAINS the 80 slots x 144 MiB checkpoint store
              # (11.25 GiB) plus the 4 GiB host tier, so 24 clears the band
              # with the engine's 4 GiB slack (24 >= 20 + 4). The pinned
              # leg — the ~8.5 GiB Wilde measured at --placement all_vram
              # feeds the limit-minus-printed-pinned >= 4 law
              # (24 - 8.5 = 15.5 >= 4). cpu "8" is written here too: the chart
              # ships no resources map, so nothing is inherited (the
              # deep-merge add/update law, cf-143 D26). The amd.com/gpu-r9700
              # claim is now OVERLAY-PINNED at 1 in BOTH maps (cf-144
              # C01/P05): the chart pair moved to 2 with the fn TP2 flip
              # (shape A — one pod holding both cards while UP), and plain
              # inheritance would strand this release at claim 2, Pending
              # forever beside a live fn. An overlay UPDATE of the same key
              # is the lawful mechanism (D26: ADD/UPDATE yes, REMOVE no).
              # The boot receipt may correct the number; the repair is this
              # overlay one-edit ADD/UPDATE ruled forward (D28(6)), never a
              # chart parameterisation.
              # [2026-11-22 C06, D38(2) — annotate, never rewrite] same
              # carrier correction as the q27 header's claim-pin bullet: "the
              # chart pair moved to 2" and "plain inheritance would strand
              # this release at claim 2" priced pre-C03 mechanics — since the
              # claim split the chart ships no resources map, so inheritance
              # renders nothing and this block's 1 is the q27 claim's only
              # home. The cf-143 D26 ADD/UPDATE law still governs how the
              # pair crosses the appset.
              requests:
                cpu: "8"
                memory: "24Gi"
                amd.com/gpu-r9700: "1"
              limits:
                cpu: "8"
                memory: "24Gi"
                amd.com/gpu-r9700: "1"
        # No initContainers here (D35): the staging init is chart mechanism —
        # the pinned curl image, the hash budget, the stage posture and the
        # fetch FORM it runs, identical bytes to the fn lane's by construction
        # (cf-143 D27's grammar law guards one FORM, not two clones), with this lane's
        # pack facts under radianceFetch above.

# ---------------------------------------------------------------------------
# THE RESTING TWINS (landed C03 round-3; D46 corrects the earlier "(C05)"
# label): the roster's two lanes that ship at replicas 0 —
# git resting state, flipped only by an OWNER scale act, never a git default.
# While a lane rests its Service has no endpoints and its llama-swap peer hop
# answers a loud 502 (llama-swap neither health-checks nor hides peers), which
# is the opt-in signature the tables promise, never a silent route to a dead
# id. The switch law, the sync-over-hand-scale rule and the memory math that
# forbids co-booting these two live are the header block at radiance: above —
# read it before touching either replicas value.
radiance-flash-tp1:
  app-template:
    # THE SINGLE-CARD TWIN (OQ-F): the cf-143 TP1-era recipe as a SECOND
    # release — the transcription is a named commit, not a re-derivation:
    # git e7536b2c9^ charts/radiance/values.yaml, the serve array byte-for-byte
    # with EXACTLY one value swapped, its own served id below. The pack is the
    # fn pack (RESEARCH RQ0 ledger, transcribed): HF
    # StillDeadcode/qwen3.8-next-flash-fp8-iq4r-moe, file
    # qwen3.8-next-flash-fp8-iq4r-moe.rad, 121969901568 bytes (113.60 GiB),
    # lfs sha256
    # 0af5e96244e80c21ac8edca1719dae49b8a201b94a2f3994c3e24026ceaa4d20,
    # ungated (gated:False verified against the HF API) — the same file the fn
    # lane already holds on the shared 500Gi claim.
    #
    # PACK-SKIP PARAGRAPH (the reader's only warning that a scale-up does NOT
    # re-download): the staging init verifies the marker file before fetching,
    # and this twin shares ONE pack and ONE marker with its TP2 sibling and the
    # fn lane on the one shared PVC — once the pack is staged, every later
    # boot skips the 113.6 GiB fetch and boots from the landed bytes.
    #
    # Like every lane since D43, the served path reaches the engine through the
    # env entry below (modelPath / env / composed --model move together on a
    # retarget; the dual-edit legs run per lane and red any half-move).
    modelPath: /models/radiance/qwen3.8-next-flash-fp8-iq4r-moe.rad
    # The fetch scalars (D35) clone the fn lane's verification envelope
    # verbatim — one pack, one sha, one URL, one marker idiom.
    radianceFetch:
      lfsSha: 0af5e96244e80c21ac8edca1719dae49b8a201b94a2f3994c3e24026ceaa4d20
      url: https://huggingface.co/StillDeadcode/qwen3.8-next-flash-fp8-iq4r-moe/resolve/main/qwen3.8-next-flash-fp8-iq4r-moe.rad
      marker: /models/radiance/.staged-$LFS_SHA
    controllers:
      radiance:
        # The RESTING state: replicas 0 is git law and only the owner flips it
        # (AC7: an editor who treats this as a tunable boots a lane the node
        # cannot fit — the header's 110 + 24 + ~5.3 > 125.08 arithmetic). The
        # scale act is the runbook's down-then-up dance, never a git default.
        replicas: 0
        containers:
          radiance:
            # The lane's serving SPECIFICS (D43): env entries the chart-owned
            # compose FORM reads — the cf-143 TP1-era profile projected onto
            # the env contract, byte-for-byte, with the single OQ-F swap: this
            # lane's OWN served id (the honest-id law — peers and the catalog
            # rows route by it; no lane may share another's). The suite drives
            # THIS rendered env through the shipped FORM and requires the
            # composed vector to equal the transcribed profile; the wrapper's
            # startup echo (D43(2)) is the boot receipt.
            #
            # WHY the single-card numbers differ from the TP2 lane's, in env
            # shape: RADIANCE_TP "1" equals this pod's claim pin and there is
            # NO RADIANCE_TP_WIRE (the wire is the TP2 tensor-split idiom —
            # one card splits nothing). RADIANCE_HOST_POOL_MIB 43000 is the
            # ONE-envelope number of the single-card era (the TP2 lane's
            # 12288 is per-rank x2; the same bytes were never two envelopes).
            # RADIANCE_KV_RESIDENT 32768 SHIPS HERE and nowhere else: the
            # cf-144 P04 polarity flip retires the mirror for the TP2 tier
            # recipe only — this array is the pre-flip single-card shape
            # verbatim, mirror included, and no RADIANCE_PREFIX_CACHE_MIB
            # rides with it (tier+mirror are mutually exclusive while a
            # group streams; here the tier simply stays absent, as in the
            # transcription). No api-key env (keyless cf-143 D8).
            env:
              - name: RADIANCE_MODEL_PATH
                value: /models/radiance/qwen3.8-next-flash-fp8-iq4r-moe.rad
              - name: RADIANCE_SERVED_ID
                value: qwen3.8-flash-next-radiance-tp1
              - name: RADIANCE_TP
                value: "1"
              - name: RADIANCE_MAX_MODEL_LEN
                value: "200000"
              - name: RADIANCE_PLACEMENT
                value: expert_tiered
              - name: RADIANCE_HOST_POOL_MIB
                value: "43000"
              - name: RADIANCE_GPU_HEADROOM_MIB
                value: "96"
              - name: RADIANCE_KV_RESIDENT
                value: "32768"
              - name: RADIANCE_NUM_SPECULATIVE_TOKENS
                value: "3"
              - name: RADIANCE_MAX_NUM_BATCHED_TOKENS
                value: "4096"
              - name: RADIANCE_CHECKPOINT_INTERVAL
                value: "4096"
              - name: RADIANCE_NGRAM_PLACEMENT
                value: disk
            resources:
              # 110 GiB request==limit — the fn pair held EXACTLY (the cf-143 D15
