              # claim is the QUOTED "1": one card of the renamed pool, the
              # lowest-KFD-NodeId free card (the header's placement rule);
              # an unquoted pair is a different Helm type and this file's
              # quoted form is the shipped shape since C01.
              requests:
                cpu: "8"
                memory: "110Gi"
                amd.com/gpu-r9700: "1"
              limits:
                cpu: "8"
                memory: "110Gi"
                amd.com/gpu-r9700: "1"
