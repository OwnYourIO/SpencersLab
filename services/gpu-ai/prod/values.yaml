# gpu-ai — dedicated AI inference cluster (carved out of gpu).
# Bitwarden IDs for this service come from the cluster annotation
# (metadata.annotations.services.gpu-ai.bitwardenIds) and from
# custom-values/gpu-ai/prod-values.yaml (loaded via the
# services.gpu-ai.customValuesUrls cluster annotation). gpu-ai itself has no
# app-level secrets today — base's IDs (cert-manager solver token, ArgoCD
# SSO) and hivetools' mcp-sso live in custom-values.

domain: OVERRIDE_VIA_APPSET
clusterName: OVERRIDE_VIA_APPSET

# Chart definitions for appset-charts.yaml (rendered by the base chart).
# Each chart can have: namespace, ServerSideApply, version, repository
charts:
  # Internal charts (no version/repository - uses charts/ directory)
  llama-swap:
    namespace: default
    ServerSideApply: "false"
  external-secrets-bitwarden:
    #version: 1.0.10 # renovate: datasource=helm registryUrl=https://ownyourio.github.io/SpencersLab/
    #repository: https://ownyourio.github.io/SpencersLab/
    namespace: default
    ServerSideApply: "true"
  k8s-monitoring:
    #version: 1.0.10 # renovate: datasource=helm registryUrl=https://ownyourio.github.io/SpencersLab/
    #repository: https://ownyourio.github.io/SpencersLab/
    namespace: default
    ServerSideApply: "true"

  # External charts (with version and repository)
  amd-gpu:
    version: 0.21.0
    repository: https://rocm.github.io/k8s-device-plugin/
    namespace: default
    ServerSideApply: "true"

ingress:
  subdomains:
    ai-llama-swap:
      service: gpu-ai-llama-swap
      port: 8080

    # 2026-10-10: endpoint reorg. clusterBase renders the cluster/local name
    # llama.gpu-ai.<domain> (replaces the old llama-cpp.<domain> internal hop
    # that gpu AND gpu-ai both claimed — DNS could only reach one).
    # serviceName llama renders the public llama.<domain> host — the same
    # Ingress name/host/cert as before, so the
    # proxy-remote → proxy-local (target: gpu-ai) chain is undisturbed.
    llama:
      clusterBase: true
      serviceName: llama
      service: gpu-ai-llama-swap
      port: 8080

    cluster:
      clusterBase: true
      service: argocd-server
      port: 80
    #traefik:
    #  clusterBase: true
    #  namespace: kube-system
    #  service: traefik
    #  port: 80

# gpu-ai model roster: the Qwen3.8-27B family. These values MERGE with the
# chart defaults (chart roster + matrix stay intact), so /v1/models here is
# the union of old + new by design (clean split = chart-fork follow-up).
#
# HF_TOKEN note: several of these repos are gated (orcarouter) or require
# login (aboliterant), so the main container gets HF_TOKEN from the hf-token
# ExternalSecret below — llama.cpp picks the token up from the env
# (common/arg.cpp --hf-token defaults to $HF_TOKEN). The app-template schema
# forbids optional secretKeyRefs, but on gpu-ai the secret is guaranteed
# (bitwardenIds.hf-token + custom-values/gpu-ai/prod-values.yaml).
llama-swap:
  modelsPvcSize: 500Gi
  bitwardenIds:
    hf-token: OVERRIDE_VIA_CUSTOM_VALUES
  app-template:
    controllers:
      llama-swap:
        containers:
          main:
            env:
              HF_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hf-token
                    key: token
          # Operator provisioning sidecar (LoRA conversion, artifact staging).
          # Scripts at /app/tools (llama-swap-tools ConfigMap); work happens
          # under /models/.tools; see charts/llama-swap/scripts/llama_tools.py.
          tools:
            enabled: true
            env:
              HF_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hf-token
                    key: token
  config:
    macros:
      q38-common: |
        -ngl 999
        --flash-attn on
        --load-mode none
        -np 1
        -b 2048
        -ub 2048
        --cache-type-k q8_0
        --cache-type-v q8_0
        --cache-reuse 1
        --no-context-shift
      q38-sampling: |
        --temp 0.7 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0
      # NOTE: --reasoning-effort is native since llama.cpp b11xxx (the image
      # rides v262-vulkan-b11515). It was NOT available on the previous
      # b10015 build — if the image is ever rolled back to <= b10015, replace
      # it with --chat-template-kwargs '{"reasoning_effort":"..."}' (the
      # kwarg path works on every build; only 'enable_thinking' was the
      # deprecated kwarg that --reasoning on replaces).
      q38-think: |
        --reasoning on
        --reasoning-preserve
        --reasoning-effort medium
      # Qwen3.6-35B-A3B uncensored entries (2026-10-18, plan 2026-10-11
      # gpu-ai-uncensored-qwen36-coder-next). VRAM unpinned → Variant B:
      # experts-on-CPU, a literal copy of the chart's ${moe} + ${threads}
      # flags plus the q38 perf flags. Literal because macro→macro reference
      # order across the chart merge isn't guaranteed, and attention must
      # never go all-CPU. Switching to full-GPU (-ngl 999) after a VRAM pin
      # ≥ 32 GB is a one-macro edit.
      q36-common: |
        -ngl 99
        -ot "\.ffn_.*_exps\.=CPU"
        --load-mode none
        -t 10
        -np 1
        -b 2048
        -ub 2048
        --flash-attn on
        --cache-type-k q8_0
        --cache-type-v q8_0
        --cache-reuse 1
        --no-context-shift
      # Qwen thinking-coding params (temp 0.6 — deliberately NOT
      # q38-sampling's 0.7): per Qwen3.6 card guidance from the STORM run.
      q36-sampling: |
        --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0
    # gpu-ai runs the ENTIRE catalog live (frozen ENABLEMENT table: 58 enabled,
    # zero echoes). Overrides at family level; per-rung data and tuned variants
    # stay chart-side / in the models layer below. flash-next q5/q6 are ENABLED
    # here per the operator's accepted OOM-churn decision 2026-10-22 (never
    # preloaded, no matrix var - run-alone).
    families:
      home-3b-v3: {enabled: true}
      ornith-1.5-122b: {enabled: true}
      ornith-1.5-35b-a3b: {enabled: true}
      qwen3-embedding: {enabled: true}
      qwen3-vl-2b: {enabled: true}
      qwen3-vl-30b-a3b: {enabled: true}
      qwen3-vl-30b-a3b-thinking: {enabled: true}
      qwen3-vl-4b: {enabled: true}
      qwen3-vl-4b-thinking: {enabled: true}
      qwen3-vl-8b: {enabled: true}
      qwen3.6-27b: {enabled: true}
      qwen3.6-35b-a3b: {enabled: true}
      qwen3.8-27b: {enabled: true}
      qwen3.8-flash-next: {enabled: true}
      qwen3.8-flash-next-orca: {enabled: true}
      qwen36: {enabled: true}
      qwen38: {enabled: true}
      whisper: {enabled: true}

    # The full ladder data now lives in the chart catalog
    # (charts/llama-swap values config.families, CA2); this models map is
    # only the per-ID override/escape-hatch layer merged OVER the expansion
    # (CR1.5). qwen38-rana stays the sole raw-cmd entry (schema test
    # test_c02_gpuai_block_escape_hatch_is_exactly_rana).
    models:
      # Chart-standard plain Qwen3.8-27B (unsloth), gpu-ai override with MTP.
      # The unsloth GGUFs carry no embedded MTP layers (verified: tensor scan
      # of the header), so the draft comes as a separate ggml-org MTP file via
      # -hfd; cached on the models PVC like the main weights.
      qwen3.8-27b-q4:
        hf: unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
        draft: ggml-org/Qwen3.8-27B-GGUF:mtp-Qwen3.8-27B-Q8_0.gguf
        spec: {type: draft-mtp, draft_n_max: 2}
        use: [q38-common]
        flags: |
          -c 262144
        name: "Qwen 3.8 27B (UD-Q4_K_XL, MTP)"
        description: "Plain Qwen 3.8 27B, UD-Q4_K_XL; ggml-org Q8_0 MTP draft, 256k ctx"
        ttl: 300

      qwen3.8-27b-q6:
        hf: unsloth/Qwen3.8-27B-GGUF:UD-Q6_K_XL
        draft: ggml-org/Qwen3.8-27B-GGUF:mtp-Qwen3.8-27B-Q8_0.gguf
        spec: {type: draft-mtp, draft_n_max: 2}
        use: [q38-common]
        flags: |
          -c 262144
        name: "Qwen 3.8 27B (UD-Q6_K_XL, MTP)"
        description: "Plain Qwen 3.8 27B, UD-Q6_K_XL; ggml-org Q8_0 MTP draft, 256k ctx"
        ttl: 300

      # Q8 split (2026-10-15): the base ID is the text-only CACHING daily
      # driver; the -visual sibling keeps the mmproj. llama.cpp hard-disables
      # cache_reuse in multimodal mode, so the two can't be combined.
      # --cache-reuse 256 = tolerate up to 256 tokens of prompt drift when
      # reusing the cached KV (K-shift), covering opencode's mutating
      # conversations (system reminders, tool schemas). The q38-common macro
      # carries --cache-reuse 1; the later flag wins.
      #
      # 2026-10-16 cache persistence + trio coexistence (operator request:
      # hour-long idle gaps between turns, concurrent subagents, and an
      # always-ready MoE + embedding sidecar):
      # - ttl key removed entirely: inherits globalTTL 0 = never auto-unload
      #   (was 300s — the cache-buster that killed all KV during idle gaps).
      #   The model stays resident until a matrix swap evicts it.
      # - Slots (-np) = the "live" cache tier: each concurrent session gets
      #   its own slot so sessions never evict each other (-np 1 shared one
      #   slot: the 0.34–0.52 LCP churn from the 2026-10-15 debug). Under
      #   kv_unified the pool = np × ctx. Sized against the measured 125 GiB
      #   node budget with the full trio resident (dense + MoE + embedding;
      #   matrix "main" set below): q38 np=1 → 256k pool ≈ 8.7 GiB KV
      #   (operator decision 2026-10-17: keep full decode speed for the
      #   active session; a second concurrent dense session rides the warm
      #   tier below instead of halving throughput); q35 np=2 → 512k pool
      #   ≈ 5.9 GiB KV (10.9 KB/token — its 32 GiB of experts live in RAM,
      #   not KV).
      # - --cache-ram (MiB) = the "warm" tier (llama.cpp PR #16391): idle
      #   sessions beyond -np are saved to host RAM on slot reassignment
      #   (cache_idle_slots, default on) and restored on prefix match instead
      #   of re-prefill. PER-PROCESS budget — NOT shared between models;
      #   within a process it LRU-evicts the oldest entry when full. Default
      #   is 8192 MiB — the cap where the observed 1.6–7 GiB entries evicted
      #   each other. Final split at full trio (weights+KV ≈ 81 GiB + 24+10 GiB
      #   cache + ~6 GiB system of 125 → ~6 GiB headroom with q38 np=1):
      #   q38 24 GiB + q35 10 GiB (operator decisions 2026-10-16/17). Soft
      #   caps: raise later if monitoring shows headroom.
      qwen3.8-27b-q8:
        hf: unsloth/Qwen3.8-27B-GGUF:Q8_0
        draft: ggml-org/Qwen3.8-27B-GGUF:mtp-Qwen3.8-27B-Q8_0.gguf
        spec: {type: draft-mtp, draft_n_max: 2}
        use: [q38-common]
        flags: |
          -c 262144
          --no-mmproj
          --cache-reuse 256
          -np 1
          --cache-ram 24576
        name: "Qwen 3.8 27B (Q8_0, MTP)"
        description: "Plain Qwen 3.8 27B, Q8_0; MTP draft, text-only (--no-mmproj), cache_reuse 256, 1 slot (256k pool), 24GiB RAM prompt cache, no idle unload, 256k ctx"

      # Same split for the MoE Q8: base = text-only + cache_reuse (full cmd
      # override), -visual = chart-default cmd (vision auto-loads).
      # 2026-10-16: same cache-persistence treatment as q38q8 above (ttl key
      # removed — inherits globalTTL 0 = no idle unload). np=2, --cache-ram
      # 10240 — budget derivation in the q38q8 comment; full trio (dense +
      # this MoE + embedding) preallocates ~90 GiB of the 125 GiB node.
      qwen3.6-35b-a3b-q8:
        hf: unsloth/Qwen3.6-35B-A3B-GGUF:Q8_0
        use: [threads, ctx-256k, moe, flash-and-q8]
        flags: |
          --no-mmproj
          --cache-reuse 256
          -np 2
          --cache-ram 10240
        name: "Qwen 3.6 35B A3B (Q8_0)"
        description: "Qwen 3.6 35B A3B (MoE), Q8_0; text-only (--no-mmproj), cache_reuse 256, experts on CPU, 2 slots (512k pool), 10GiB RAM prompt cache, no idle unload, 256k ctx"

      # Same story for the ggml-org BF16 reference build: no embedded MTP
      # tensors (verified in the header), so it takes the Q8_0 draft too.
      # ttl 180 like qwen38-orca-f16 — reference quality, evicts fast.
      qwen3.8-27b-bf16:
        hf: ggml-org/Qwen3.8-27B-GGUF:BF16
        draft: ggml-org/Qwen3.8-27B-GGUF:mtp-Qwen3.8-27B-Q8_0.gguf
        spec: {type: draft-mtp, draft_n_max: 2}
        use: [q38-common]
        flags: |
          -c 262144
        name: "Qwen 3.8 27B (BF16, MTP)"
        description: "Reference BF16 build; ggml-org Q8_0 MTP draft, 256k ctx"
        ttl: 180

      qwen38-rana:                  # public mirror + borrowed official MTP draft
        cmd: |
          /bin/sh -c "
            dl() {
              curl -fL --retry 3 --retry-all-errors -o \"$2.part\" \"$1\" && mv \"$2.part\" \"$2\"
            } &&
            mkdir -p /models/rana &&
            test -f /models/rana/mmproj-Qwen3.8-27B-RANA-abliterated-F16.gguf ||
            dl https://huggingface.co/mradermacher/Qwen3.8-27B-RANA-abliterated-GGUF/resolve/main/Qwen3.8-27B-RANA-abliterated.mmproj-f16.gguf /models/rana/mmproj-Qwen3.8-27B-RANA-abliterated-F16.gguf &&
            exec llama-server --port ${PORT} --host 0.0.0.0 --jinja -hf mradermacher/Qwen3.8-27B-RANA-abliterated-GGUF:Q6_K -hfd ggml-org/Qwen3.8-27B-GGUF:mtp-Qwen3.8-27B-Q8_0.gguf --mmproj /models/rana/mmproj-Qwen3.8-27B-RANA-abliterated-F16.gguf -c 262144 --spec-type draft-mtp --spec-draft-n-max 2 --spec-draft-p-min 0.75 -ngl 999 --flash-attn on --load-mode none -np 1 -b 2048 -ub 2048 --cache-type-k q8_0 --cache-type-v q8_0 --cache-reuse 1 --no-context-shift --temp 0.7 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0 --reasoning on --reasoning-preserve --reasoning-effort medium
          "
        # NOTE: the exec line above must stay ONE physical line. llama-swap's
        # SanitizeCommand strips trailing backslashes before shlex-splitting,
        # so inside this quoted script a backslash continuation silently breaks
        # (dash then runs each flag as its own command: "/bin/sh: 15: --port:
        # not found"). Same rule as the whisper bootstrap in the chart values.
        # The q38-* macros are inlined for the same reason (they expand to
        # multiple lines). Keep both inlined if editing.
        #
        # Source notes: abliterant/Qwen3.8-27B-RANA-abliterated-GGUF went
        # PRIVATE (no request-access flow for private repos), so the main
        # weights + mmproj come from the public mradermacher mirror (note its
        # dot-separated file naming). The MTP draft is the official base-model
        # module borrowed from ggml-org — EXPERIMENTAL: it was trained on
        # stock Qwen3.8-27B, not the RANA abliteration, so draft acceptance
        # may be poor; drop --spec-type/--hfd if it hurts more than it helps.
        name: "Qwen3.8 27B RANA abliterated (Q6_K, MTP)"
        description: "mradermacher mirror; borrowed ggml-org official MTP draft (experimental), 256k ctx"
        ttl: 300
        capabilities: { in: [text, image], out: [text] }


      # PHASE 2 — enable after sidecar provisioning (prepare → convert-cyber
      # → verify). Deliberately NO bootstrap here: a missing LoRA must fail
      # loudly, provisioning is operator-run via the tools container.
      # qwen38-cyber:
      #   cmd: |
      #     ${server-cmd}
      #     -hf orcarouter/Qwen3.8-27B-Uncensored-GGUF:Q6_K
      #     --lora /models/qwen38-cyber-lora-f16.gguf
      #     -c 131072
      #     --spec-type draft-mtp --spec-draft-n-max 2
      #     ${q38-common}
      #     ${q38-sampling}
      #     ${q38-think}
      #   name: "Qwen3.8 27B Uncensored + cyber LoRA (Q6_K, MTP)"
      #   description: "Orca Q6_K base + cyber PEFT LoRA (converted via tools sidecar)"
      #   proxy: http://localhost:${PORT}
      #   ttl: 300
      #   capabilities: { in: [text, image], out: [text] }

    # instead (matrix still permits trio coexistence at steady state).
    # Startup preload (2026-10-16): have the daily driver ready after
    # (re)starts instead of paying 1–3 min of load on first request.
    # Weights are PVC-cached; loads overlap.
    # 2026-10-20: qwen3.6-35b-a3b-q8 DROPPED from preload — loading it while
    # q38q8 was resident with an active KV pool exhausted VRAM and killed the
    # running q38q8 (amdgpu "Not enough memory for command submission" ->
    # Vulkan device-lost/coredump) on 2026-10-18 04:29 and 2026-10-19 07:07,
    # both right after restart preloads. It lazy-loads on first MoE request
    # instead (matrix still permits trio coexistence at steady state).
    hooks:
      on_startup:
        preload:
          - qwen3.8-27b-q8
          - qwen3-embedding-0.6b
    matrix:
      # vars moved chart-side with the catalog (CA2): one var per catalog
      # rung, names kept identical so the set expressions below resolve
      # unchanged. flash-next q5/q6 carry NO var on purpose (run-alone
      # semantics; the chart var section records the same ruling).
      sets:
        # Trio coexistence (2026-10-16): ONE dense + ONE MoE + embedding +
        # homecpu may all be resident at once; within the dense / MoE groups
        # models remain alternatives (switching dense evicts only the old
        # dense — the MoE, embedding, and their caches stay). Memory-sized on
        # the 125 GiB node: dense ~38 + MoE ~41 + embed ~1 GiB preallocated
        # + 34 GiB warm-cache caps + ~6 GiB system ≈ 119 GiB (~6 GiB buffer).
        # 2026-10-20: q38bf16 moved to solo — BF16 dense (~57 GiB incl. MTP
        # draft + 8.7 GiB KV pool) blows the ~38 GiB dense assumption and
        # overflows the node alongside any MoE (the ~80B-A3B coder-family
        # entries, ruled out of the roster 2026-10-24, overflowed it the same
        # way and were the reason the trio assumption got pinned).
        # 2026-10-23 (C04): the Ornith 1.5 35B A3B ladder (qwen35moe, same
        # expert-offload class as the q35* entries - header-verified) joins
        # the MoE alternation; it stays ONE MoE resident, IQ2..Q8 rungs.
        main: "(q38q4 | q38q6 | q38q8 | q38q8v | q27bq6 | q27bq8 | q38orca | q38ara | q38rana | q38hum | homegpu) & (q35q8 | q35q8v | q35q6 | q36her | q36hui | orniq2 | ornq3 | ornq4 | ornq5 | ornq6 | ornq8) & emb06 & homecpu"
        # Heavy / special models run alone (+ homecpu): requesting one evicts
        # the trio; requesting a trio member afterwards reloads it (weights
        # stay PVC-cached). F16 + 1M variants carry 34+ GiB KV of their own;
        # VL/whisper serve batch jobs; q38bf16 overflows the RAM budget if
        # co-resident with the dense trio (see main-set note 2026-10-20).
        # 2026-10-23 (C04): flash-next q3/q4 + orca-q6 + the 122B UD ladder
        # join here (55.7-156.1 GiB weight classes); ornqbf (Ornith 35B BF16,
        # 66.2 GiB) is solo - dense-weight resident too big for the trio.
        # flash-next q5/q6 are deliberately in NO set at all (see vars note).
        solo: "(q35bf16 | q35b1m | q38f16 | q38bf16 | q38q81m | fnq3 | fnq4 | fnorca | o122q3 | o122q4 | o122q5 | o122q6 | ornqbf | vl2bq8 | vl2bq4 | vl2bbf | vl4bq4 | vl4bq8 | vl4bbf | vl8bq4 | vl8bq8 | vl8bbf | vl30bq4 | vl30bq8 | vl30bbf | v4tq8 | v4tq4 | v4tbf | v30tq8 | v30tq4 | v30tbf | wsp) & homecpu"
