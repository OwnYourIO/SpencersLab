# gpu-ai — dedicated AI inference cluster (carved out of gpu).
# Bitwarden IDs for this service come from the cluster annotation
# (metadata.annotations.services.gpu-ai.bitwardenIds) and from
# custom-values/gpu-ai/prod-values.yaml (loaded via the
# services.gpu-ai.customValuesUrls cluster annotation). gpu-ai itself has no
# app-level secrets today — base's IDs (cert-manager solver token, ArgoCD
# SSO) and hivetools' mcp-sso live in custom-values.

domain: OVERRIDE_VIA_APPSET
clusterName: OVERRIDE_VIA_APPSET

# Chart definitions for appset-charts.yaml (rendered by the base chart).
# Each chart can have: namespace, ServerSideApply, version, repository
#
# cf-77 run 2 (Q-C consolidation): Strata is deliberately NOT a charts: entry
# here — it is a second controller of the llama-swap Application (enabled by
# the seven flags in the llama-swap block below). No ingress host by the Q4
# ruling, no appset entry by the consolidation ruling; the old standalone
# release prunes via GitOps at the next sync.
charts:
  # Internal charts (no version/repository - uses charts/ directory)
  llama-swap:
    namespace: default
    ServerSideApply: "false"
  external-secrets-bitwarden:
    #version: 1.0.10 # renovate: datasource=helm registryUrl=https://ownyourio.github.io/SpencersLab/
    #repository: https://ownyourio.github.io/SpencersLab/
    namespace: default
    ServerSideApply: "true"
  k8s-monitoring:
    #version: 1.0.10 # renovate: datasource=helm registryUrl=https://ownyourio.github.io/SpencersLab/
    #repository: https://ownyourio.github.io/SpencersLab/
    namespace: default
    ServerSideApply: "true"
  # cf-143 C01 (owner Q3 ruling, DECISIONS D6): the vllm lane — charts/vllm,
  # the magiccodingman/vllm-radiance FORK engine, NOT the cf-143 radiance
  # engine — is disabled here, commented out rather than deleted so the
  # re-enable stays a locate-and-uncomment. gpu-ai-vllm already sits at
  # replicas 0 out-of-band; commenting the entry is what makes that disable
  # declarative (an ArgoCD selfHeal sync could otherwise resurrect it).
  # vllm:
  #   namespace: default
  #   ServerSideApply: "false"

  # cf-143 C07 (DECISIONS D18/D21), first-party since C08 (D23): the
  # device-plugin chart is the internal charts/amd-gpu — a repo-owned
  # app-template 5.0.1 chart running the plugin at
  # -resource_naming_strategy=product and shipping the patched
  # amdgpu.ids ConfigMap (D24): the gpu-ai node advertises per-device
  # pools amd.com/gpu-r9700 + amd.com/gpu-8060s and bare amd.com/gpu
  # disappears THERE (per-cluster shield, D21: llama-swap's gpu-8060s flip is
  # the overlay below in this same file, same commit — the gpu cluster keeps
  # the external single-naming entry and the chart default's bare claim).
  # Versionless entry => the base appset renders a git-path source; the
  # Application keeps deriving gpu-ai-amd-gpu. C08's conversion renames the
  # plugin objects (charts/amd-gpu/values.yaml enumerates the set): the
  # DaemonSet lands under a new name, so the next sync is the documented
  # ONE prune+create swap — running GPU pods keep their allocations.
  amd-gpu:
    namespace: default
    # The image pin moved with the chart: the renovate tracking comment now
    # lives in charts/amd-gpu/values.yaml as a docker datasource (the helm
    # repository pin this entry carried is retired — D19). ServerSideApply
    # "true" is KEPT: it eases the one-time args field-ownership watch on the
    # source flip (plan Rollout notes).
    ServerSideApply: "true"

  # cf-143 C04 (DECISIONS D1, owner Q1=A): the radiance ENGINE chart (C02's
  # charts/radiance — the stilldeadcode one, not the vllm-radiance FORK
  # parked in comments above) joins the roster ADDITIVE beside strata; Q5
  # leaves every strata byte as-is. Internal shape (no version/repository):
  # the base appset renders a git-path source and derives the Application
  # name serviceName+appName = gpu-ai-radiance — the host of the peers.radiance
  # hop below; a release name drifting from it silently breaks that route.
  # ServerSideApply "false": the llama-swap-family shape (gotcha 6, like
  # the llama-swap entry). Keyless chart (D8): no bitwardenIds here, no
  # custom-values leg — the trio law's documented skip.
  radiance:
    namespace: default
    ServerSideApply: "false"

  # cf-143 C15 (DECISIONS D54/D56, owner "add support for 27b in radiance"):
  # the q27 pod-swap lane — a SECOND RELEASE of the SAME chart dir. The
  # `chart:` key renders this release from the existing charts/radiance
  # (the base appset's hasKey-"chart" path branch — the chart:-key branch of
  # charts/base/templates/appset-charts.yaml, :67-70 at 2026-11-22 (C01 fixed
  # this cite; it drifted from :83 — cite by content, line numbers move);
  # precedents chart: zigbee2mqtt / actualbudget) —
  # one chart, two releases (D56(1)); a sibling chart dir was REJECTED for
  # duplicating the image pin, the digest/pack ledgers and the BusyBox
  # hash-gate grammar, the drift class this ticket keeps paying for. The
  # base appset derives the Application name serviceName+appName =
  # gpu-ai-radiance-q27 — the host of the peers.radiance-q27 hop below; a
  # release name drifting from it silently breaks that route. What this
  # release renders, and why it rests at zero replicas, live in ONE place:
  # the radiance-q27 subtree's switch discipline at the foot of this file.
  # Keyless chart (D8/D54(2)): no bitwardenIds here, no custom-values leg —
  # the trio law's documented skip, same as fn. ServerSideApply "false": the
  # llama-swap-family shape (gotcha 6).
  radiance-q27:
    namespace: default
    ServerSideApply: "false"
    chart: radiance
  # cf-143 C05 (DECISIONS D19/D46): the tensor-parallel pair, same chart and
  # the same three fields as the two lanes above — everything lane-specific
  # (TP size, memory claim, parked replicas) lives in the per-app subtrees at
  # the foot of this file. The base ApplicationSet derives the Application
  # names gpu-ai-radiance-flash-tp1 and gpu-ai-radiance-q27-tp2 from these
  # keys; the peers hops below route to those names, so a key drift silently
  # breaks those routes. Both rest at zero replicas like the q27 lane.
  radiance-flash-tp1:
    namespace: default
    ServerSideApply: "false"
    chart: radiance
  radiance-q27-tp2:
    namespace: default
    ServerSideApply: "false"
    chart: radiance

ingress:
  subdomains:
    # cf-105 (D7/Q4 ruling): deliberately NO vllm host — the trio rule's
    # proxy leg is skipped, cluster-internal only: while the lane served, the
    # engine was reached only through the llama-swap peers.vllm hop (C03) on
    # the existing llama host below. A host of its own would publish the
    # surface the peers hop exists to keep private.
    # cf-143 C01 (owner Q3): the lane is dormant-commented now (charts.vllm
    # and peers.vllm are comments), so this skip has no client at all — but it
    # is not a disable artifact: a re-enable uncomments the hop and still adds
    # no host, same D7/Q4 ruling.
    # cf-77: deliberately NO strata host — the trio rule's proxy leg is
    # skipped by the operator's Q4 ruling (DECISIONS 2026-10-27): the engine
    # pod is cluster-internal, reached only through the llama-swap peers
    # route below (the existing llama/ai-llama-swap hosts already carry the
    # chain). A host of its own would publish the surface the peers hop
    # exists to keep private.
    # cf-143 C04: deliberately NO radiance host either — the same D7/Q4
    # internal-only ruling skips this trio leg (DECISIONS; charts/radiance is
    # the stilldeadcode ENGINE, not the vllm-radiance fork): the engine pod is
    # reached only through the llama-swap peers.radiance route below — the
    # existing llama/ai-llama-swap hosts already carry the chain, and a host
    # of its own would publish the surface the peers hop exists to keep
    # private.
    # cf-143 C15 (D56(8)): deliberately NO radiance-q27 host either — the
    # pod-swap release is internal-only under the SAME ruling, so the trio
    # law's proxy leg stays SKIPPED for it: its clients reach the engine only
    # through the llama-swap peers.radiance-q27 route below, and inventing a
    # host here would publish the very surface the peers hop exists to keep
    # private. Idle at rest the hop fails with a 502 peer proxy error (the
    # Service has no endpoints; llama-swap neither health-checks nor hides
    # peers) — loud, never silent, and still internal-only.
    ai-llama-swap:
      service: gpu-ai-llama-swap
      port: 8080

    # 2026-10-10: endpoint reorg. clusterBase renders the cluster/local name
    # llama.gpu-ai.<domain> (replaces the old llama-cpp.<domain> internal hop
    # that gpu AND gpu-ai both claimed — DNS could only reach one).
    # serviceName llama renders the public llama.<domain> host — the same
    # Ingress name/host/cert as before, so the
    # proxy-remote → proxy-local (target: gpu-ai) chain is undisturbed.
    llama:
      clusterBase: true
      serviceName: llama
      service: gpu-ai-llama-swap
      port: 8080

    cluster:
      clusterBase: true
      service: argocd-server
      port: 80
    #traefik:
    #  clusterBase: true
    #  namespace: kube-system
    #  service: traefik
    #  port: 80

# gpu-ai model roster: the Qwen3.8-27B family. These values MERGE with the
# chart defaults (chart roster + matrix stay intact), so /v1/models here is
# the union of old + new by design (clean split = chart-fork follow-up).
#
# HF_TOKEN note: several of these repos are gated (orcarouter) or require
# login (aboliterant), so the main container gets HF_TOKEN from the hf-token
# ExternalSecret below — llama.cpp picks the token up from the env
# (common/arg.cpp --hf-token defaults to $HF_TOKEN). The app-template schema
# forbids optional secretKeyRefs, but on gpu-ai the secret is guaranteed
# (bitwardenIds.hf-token + custom-values/gpu-ai/prod-values.yaml).
llama-swap:
  modelsPvcSize: 500Gi
  bitwardenIds:
    hf-token: OVERRIDE_VIA_CUSTOM_VALUES
  app-template:
    controllers:
      llama-swap:
        containers:
          main:
            env:
              HF_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hf-token
                    key: token
            # cf-143 C07 flip + C10 carrier law (DECISIONS D21 intent, D26):
            # product naming ships gpu-ai-only, so this cluster's APU claim
            # is an ADD here: limits amd.com/gpu-8060s plus an explicit
            # requests mirror (self-documentation — the scheduler mirrors
            # extended resources from limits anyway). The old shape — this
            # overlay carrying `amd.com/gpu: null` to retire the chart's
            # tree-global bare claim — is dead: the null NEVER reached helm.
            # The ApplicationSet→Application valuesObject chain drops
            # null-valued keys before helm sees them (live pair §D2.6: the
            # null is present in the ApplicationSet generator, absent from
            # the live Application's valuesObject; a helm-only reproduction
            # honors it — locally true, not production proof). The chart
            # default is claim-less now (C10), so nothing here needs
            # retiring; and extended resources take positive integers only —
            # never re-attempt `null` or `0` as a retirement on a claim.
            resources:
              limits:
                amd.com/gpu-8060s: 1
              requests:
                amd.com/gpu-8060s: 1
          # Operator provisioning sidecar (LoRA conversion, artifact staging).
          # Scripts at /app/tools (llama-swap-tools ConfigMap); work happens
          # under /models/.tools; see charts/llama-swap/scripts/llama_tools.py.
          tools:
            enabled: true
            env:
              HF_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hf-token
                    key: token
      # The second controller of this Application (cf-77 run 2, Q-C
      # consolidation). The chart ships it default-OFF; the SEVEN scalars
      # below flip it ON — controller + service + the five strata-*
      # persistence entries. They flip TOGETHER by design: advancedMounts
      # onto a disabled controller hard-fails the render, and the template-
      # side companion guard catches the reverse gap, so no partial set can
      # deploy a headless or configless pod (the suite's subset probes pin
      # both directions).
      # Scalars ONLY, never lists: Helm deep-merge REPLACES lists wholesale,
      # so overriding engineProfile args, model env lists or mount lists from
      # this block would silently truncate the chart's seed (run-1 warning,
      # relocated here). Scalars (e.g. a per-model unloadTimeout) may be
      # overridden from the strata data block below — keep the chart pod
      # block's 420 > 180 + 30 grace/unload invariant intact when doing so.
      # C04/D17 (2026-11-22): strata became a REAL claimant — the container
      # resources below carry the amd.com/gpu-r9700 claim pair (positive ADD,
      # the APU idiom on the main container above is the carrier precedent)
      # while the pod keeps its privileged + hostPath runtime posture, so two
      # carriers do two jobs (mechanism b1). Scheduler leg: the claim makes
      # strata an accounted claimant — allocations are exclusive, a free
      # single-card claim lands on the lowest-KFD-NodeId card, and competing
      # claim-1 pods stack by admission order, lower card to whoever is
      # admitted first. Container leg, unchanged: the /dev/dri hostPath sits
      # outside plugin accounting and inside the pod ROCr still enumerates
      # host ordinals, so rocrVisibleDevices keeps deciding the chip the
      # process sees — the claim does not pin which card the container uses,
      # it pins who else may be scheduled beside it.
      # Supersession by citation (annotate-never-rewrite): the 2026-10-27
      # device-access ruling keeps its runtime half and is superseded only at
      # its no-claim half, by the 2026-11-22 ruling D17 that added this claim.
      strata:
        enabled: true
        # Parked at 0 in the SAME wave as the claim (OQ-K). The steady-state
        # claim table for this node — one home, the C06 roster note points
        # here — is fn 2, q27 1, flash-TP1 1, q27-TP2 2, strata 1 over a pool
        # of 2: fn alone is the live steady state, strata(1) + fn(2) is 3 > 2,
        # so the claimed strata never co-boots with fn or with any TP2 lane,
        # and at most one TP2-class lane is UP.
        # [2026-11-22 C06, D44(i) completion — annotate, never rewrite] the two
        # strata combination rows the sentence above under-described, per the
        # plan's steady-state claim table (the single authority; full verdicts
        # incl. RAM and cost in .agents/notes/radiance-multi-instance-roster.md,
        # which this table and that one cross-cite) — row-for-row now: strata(1)
        # alone YES, lowest-KFD-NodeId card; flash-TP1(1) + strata(1)
        # = 2 of 2, schedulable — claim-1 lanes stack in NodeId order, lower
        # card to whoever is admitted first (scheduling order, never model
        # identity); RAM-wise the pair cannot co-boot at the held values
        # (110 + 110 + ~5.3 > 125.08) and only the boot-print re-pin moves that.
        # q27(1) + strata(1) = pool-wise YES, RAM-wise NO at held values
        # (110 + 24 + ~5.3 > 125.08) — never co-boot. q27-TP2(2) alone YES, it
        # takes both cards. The prohibitions above
        # stand; these rows complete the strata coverage.
        # Parked is not deleted: the
        # gpu-ai-strata provider stays registered and the hop answers 502-loud
        # like every resting lane. Owner MoE bring-up order (the C06 runbook):
        # scale fn to 0, wait for the fn pod to be gone, then raise strata to
        # 1 — and the reverse to restore.
        replicas: 0
        # cf-86 C02+C06: the strata provisioning set carries two routing
        # keys beyond the flagship — "orca" (orcarouter Uncensored IQ4_XS,
        # the U2 ruling's gated rung on the U9.2 ladder shift) and "q4"
        # (unsloth UD-Q4_K_XL, C06's Q4 rung). orca is branch B: the pinned
        # setup catalog carries no orca family (ORCA.md: "no --family
        # orca"), so the baked staging driver packs it manually and the env
        # value names the staged tier.
        # q4 is branch A, and that is an evidenced choice, not a default: the
        # pinned setup.py@v0.2.8 (639,798 B, sha256 0eba1327…c94079ae) DOES carry
        # an "unsloth" family (FAMILIES["unsloth"]: repo unsloth/Qwen3.8-Flash-
        # Next-GGUF, 4-shard file template, UNSLOTH_SHARDS byte+SHA256 pins),
        # MODELS["UD-Q4_K_XL"] lists families ("unsloth",), and RESEARCH Round
        # 2 [A1] records the anonymous catalog fetch — so this rung needs no
        # manual pack step, only the token + family/model mapping the driver
        # loop already understands ("[family/]model").
        # Token posture (R-d ruling, DECISIONS 2026-10-29): the orca bytes
        # are HF-gated (resolve/main answers 401 + Bearer challenge), so the
        # gated fetch consumes the EXISTING hf-token Secret via
        # secretKeyRef — DOWNLOAD-ONLY, on this init container alone. The
        # keyless C-A serve posture is untouched: no token, key or secret
        # reference reaches the strata container, the inner config or any
        # run-config profile; the suite pins both directions. The q4 pack is
        # public, so it takes no token of any kind — the one hf-token entry
        # below stays orca's alone.
        # orn (cf-86 C09) is the GGUF-direct q36 rung: unsloth's Ornith-1.5-122B
        # UD-Q4_K_XL trio, staged under its original repo names with no pack
        # step and no setup.sh catalog entry. Its bytes are UNGATED — the
        # anonymous tree read answered gated=false and a ranged resolve of the
        # middle shard answered 206 with GGUF magic and no Bearer challenge
        # (2026-10-31) — so the driver's legs ride hf_fetch's anon mode and the
        # hf-token secretKeyRef below stays orca's alone.
        # Scalars plus the one sanctioned secretKeyRef; the staging driver is
        # baked into the strata image (C07), this block sets the env entries.
        initContainers:
          model-fetch:
            env:
              STRATA_QUANTS: "q3,orca,q4,orn"
              STRATA_MODEL_ORCA: orca/IQ4_XS
              STRATA_MODEL_Q4: unsloth/UD-Q4_K_XL
              # Pseudo-family route like orca's: "orn" is not a setup catalog
              # name, it selects the GGUF-direct legs in the driver.
              STRATA_MODEL_ORN: orn/UD-Q4_K_XL
              HF_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hf-token
                    key: token
        # The claim itself (D17). The requests mirror is what makes an extended
        # resource accounted, and requests now carry the 110Gi cgroup ceiling
        # too: a pod that books a whole card stays Guaranteed on the memory it
        # can pin, so the scheduler stops packing a neighbour into the pressure
        # this cgroup owns (the chart keeps the 64Gi packing default for
        # claim-less clusters). Maps only — Helm deep-merges them, so the
        # chart's limits.memory 110Gi and requests.cpu 8 ride along untouched.
        containers:
          strata:
            resources:
              requests:
                memory: 110Gi
                amd.com/gpu-r9700: 1
              limits:
                amd.com/gpu-r9700: 1
    service:
      strata:
        enabled: true
    persistence:
      strata-config:
        enabled: true
      strata-profile:
        enabled: true
      strata-kfd:
        enabled: true
      strata-dri:
        enabled: true
      strata-shm:
        enabled: true
  # Workload DATA for that controller: deep-merged OVER the chart's strata:
  # container (pod shape, inner llama-swap config, run-config profiles,
  # (p | s | o | q | n) matrix — see charts/llama-swap/values.yaml). Peer
  # models route through config.peers below. Keyless by C-A: the run-config
  # profiles ship api_key "none" and no secret chain exists to re-add.
  strata:
    # ROCr device index hiding the 8060S (PR #3636 ran 0); the on-target
    # rocminfo gate retargets this key, never the template (C04 runbook).
    rocrVisibleDevices: "0"
    # RAM law (Q2): the shipped posture is time-share — ttl: 3600 on the
    # R9700 rungs, strix 1800 — and the inner matrix `(p | s | o | q | n)`
    # makes the five arenas alternatives, never co-resident; the fleet
    # obeys the serialized-deep-prompts traffic law (two concurrent ~99k
    # prefills on q4 is the 2026-11-10 SystemOOM shape). The llama.cpp trio
    # coexists only until the first Strata request pins the ~47 GiB arena;
    # the escape is POST /api/models/unload on the inner instance, and final
    # arena sizing is fixed by the on-target --plan gate (C04 human step 3),
    # not here.
  config:
    macros:
      q38-common: |
        -ngl 999
        --flash-attn on
        --load-mode none
        -np 1
        -b 2048
        -ub 2048
        --cache-type-k q8_0
        --cache-type-v q8_0
        --cache-reuse 1
        --no-context-shift
      q38-sampling: |
        --temp 0.7 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0
      # NOTE: --reasoning-effort is native since llama.cpp b11xxx (the image
      # rides v262-vulkan-b11515). It was NOT available on the previous
      # b10015 build — if the image is ever rolled back to <= b10015, replace
      # it with --chat-template-kwargs '{"reasoning_effort":"..."}' (the
      # kwarg path works on every build; only 'enable_thinking' was the
      # deprecated kwarg that --reasoning on replaces).
      q38-think: |
        --reasoning on
        --reasoning-preserve
        --reasoning-effort medium
      # Qwen3.6-35B-A3B uncensored entries (2026-10-18, plan 2026-10-11
      # gpu-ai-uncensored-qwen36-coder-next). VRAM unpinned → Variant B:
      # experts-on-CPU, a literal copy of the chart's ${moe} + ${threads}
      # flags plus the q38 perf flags. Literal because macro→macro reference
      # order across the chart merge isn't guaranteed, and attention must
      # never go all-CPU. Switching to full-GPU (-ngl 999) after a VRAM pin
      # ≥ 32 GB is a one-macro edit.
      q36-common: |
        -ngl 99
        -ot "\.ffn_.*_exps\.=CPU"
        --load-mode none
        -t 10
        -np 1
        -b 2048
        -ub 2048
        --flash-attn on
        --cache-type-k q8_0
        --cache-type-v q8_0
        --cache-reuse 1
        --no-context-shift
      # Qwen thinking-coding params (temp 0.6 — deliberately NOT
      # q38-sampling's 0.7): per Qwen3.6 card guidance from the STORM run.
      q36-sampling: |
        --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0
    # gpu-ai runs the ENTIRE catalog live (frozen ENABLEMENT table: 60 enabled,
    # zero echoes). Overrides at family level; per-rung data and tuned variants
    # stay chart-side / in the models layer below. flash-next q5/q6 are ENABLED
    # here per the operator's accepted OOM-churn decision 2026-10-22 (never
    # preloaded, no matrix var - run-alone).
    families:
      home-3b-v3:
        enabled: true
      ornith-1.5-122b:
        enabled: true
      ornith-1.5-35b-a3b:
        enabled: true
      qwen3-embedding:
        enabled: true
      qwen3-vl-2b:
        enabled: true
      qwen3-vl-30b-a3b:
        enabled: true
      qwen3-vl-30b-a3b-thinking:
        enabled: true
      qwen3-vl-4b:
        enabled: true
      qwen3-vl-4b-thinking:
        enabled: true
      qwen3-vl-8b:
        enabled: true
      qwen3.6-27b:
        enabled: true
      qwen3.6-35b-a3b:
        enabled: true
      qwen3.8-27b:
        enabled: true
      qwen3.8-flash-next:
        enabled: true
      qwen3.8-flash-next-heretic:
        enabled: true
      qwen3.8-flash-next-orca:
        enabled: true
      qwen36:
        enabled: true
      qwen38:
        enabled: true
      whisper:
        enabled: true

    # The full ladder data now lives in the chart catalog
    # (charts/llama-swap values config.families, CA2); this models map is
    # only the per-ID override/escape-hatch layer merged OVER the expansion
    # (CR1.5). qwen38-rana stays the sole raw-cmd entry (schema test
    # test_c02_gpuai_block_escape_hatch_is_exactly_rana).
    # None of these entries are catalog duplicates: deleting any one changes
    # the rendered config (sha-verified per entry, 2026-10-24) - they carry
    # the gpu-ai-only MTP drafts, cache-persistence tuning, and ttls.
    models:
      # Chart-standard plain Qwen3.8-27B (unsloth), gpu-ai override with MTP.
      # The unsloth GGUFs carry no embedded MTP layers (verified: tensor scan
      # of the header), so the draft comes as a separate ggml-org MTP file via
      # -hfd; cached on the models PVC like the main weights.
      qwen3.8-27b-q4:
        hf: unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
        draft: ggml-org/Qwen3.8-27B-GGUF:mtp-Qwen3.8-27B-Q8_0.gguf
        spec: {type: draft-mtp, draft_n_max: 2}
        use: [q38-common]
        flags: |
          -c 262144
        name: "Qwen 3.8 27B (UD-Q4_K_XL, MTP)"
        description: "Plain Qwen 3.8 27B, UD-Q4_K_XL; ggml-org Q8_0 MTP draft, 256k ctx"
        ttl: 300

      qwen3.8-27b-q6:
