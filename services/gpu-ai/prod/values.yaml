    # Startup preload (2026-10-16): have the daily driver ready after
    # (re)starts instead of paying 1–3 min of load on first request.
    # Weights are PVC-cached; loads overlap.
    # 2026-10-20: qwen3.6-35b-a3b-q8 DROPPED from preload — loading it while
    # q38q8 was resident with an active KV pool exhausted VRAM and killed the
    # running q38q8 (amdgpu "Not enough memory for command submission" ->
    # Vulkan device-lost/coredump) on 2026-10-18 04:29 and 2026-10-19 07:07,
    # both right after restart preloads. It lazy-loads on first MoE request
    # instead (matrix still permits trio coexistence at steady state).
    hooks:
      on_startup:
        preload:
          - qwen3.8-27b-q8
          - qwen3-embedding-0.6b

    matrix:
      vars:
        emb06: qwen3-embedding-0.6b
        q38orca: qwen38-orca
        q38ara: qwen38-ara
        q38rana: qwen38-rana
        q38hum: qwen38-humanlike
        q38f16: qwen38-orca-f16
        # 1M context variants (2026-10-13)
        q38q81m: qwen3.8-27b-q8-1m
        katq41m: kat-coder-q4-1m
        katq61m: kat-coder-q6-1m
        katq81m: kat-coder-q8-1m
        # Visual (mmproj) variants (2026-10-15); the base q38q8/q35q8 IDs
        # are the text-only caching versions (--no-mmproj + cache_reuse).
        q38q8v: qwen3.8-27b-q8-visual
        q35q8v: qwen3.6-35b-a3b-q8-visual
        # Uncensored MoE additions (2026-10-18): the two 35B entries join the
        # main MoE alternation; coder-next-ablit is solo-set (see below).
        q36her: qwen36-heretic
        q36hui: qwen36-huihui
        cnxabl: coder-next-ablit
        # C04 big families (2026-10-23) - all solo-set. flash-next q5/q6 get
        # NO var at all on purpose: a model in no matrix set can only run
        # alone and is never admitted under a co-residency promise (declared
        # ENABLED per the operator's accepted OOM risk, DECISIONS 2026-10-22).
        # The Ornith 35B ladder vars (orn*) come from the chart matrix and
        # merge in.
        fnq3: qwen3.8-flash-next-q3
        fnq4: qwen3.8-flash-next-q4
        fnorca: qwen3.8-flash-next-orca-q6
        o122q3: ornith-1.5-122b-q3
        o122q4: ornith-1.5-122b-q4
        o122q5: ornith-1.5-122b-q5
        o122q6: ornith-1.5-122b-q6
        # q38cyber: qwen38-cyber      # PHASE 2 (vars must not reference undefined models)
      sets:
        # Trio coexistence (2026-10-16): ONE dense + ONE MoE + embedding +
        # homecpu may all be resident at once; within the dense / MoE groups
        # models remain alternatives (switching dense evicts only the old
        # dense — the MoE, embedding, and their caches stay). Memory-sized on
        # the 125 GiB node: dense ~38 + MoE ~41 + embed ~1 GiB preallocated
        # + 34 GiB warm-cache caps + ~6 GiB system ≈ 119 GiB (~6 GiB buffer).
        # 2026-10-20: q38bf16 moved to solo — BF16 dense (~57 GiB incl. MTP
        # draft + 8.7 GiB KV pool) blows the ~38 GiB dense assumption and
        # overflows the node alongside any MoE. katq4/q6/q8 moved to solo:
        # ~80B-A3B experts-on-CPU co-resident with the dense trio exceeds the
        # 125 GiB budget (same reason cnxabl is solo).
        # 2026-10-23 (C04): the Ornith 1.5 35B A3B ladder (qwen35moe, same
        # expert-offload class as the q35* entries - header-verified) joins
        # the MoE alternation; it stays ONE MoE resident, IQ2..Q8 rungs.
        main: "(q38q4 | q38q6 | q38q8 | q38q8v | q27bq6 | q27bq8 | coderq6 | coderq8 | q38orca | q38ara | q38rana | q38hum | q8bq4 | q8bq8 | homegpu) & (q35q8 | q35q8v | q35q6 | q36her | q36hui | q30q4 | q30q8 | orniq2 | ornq3 | ornq4 | ornq5 | ornq6 | ornq8) & emb06 & homecpu"
        # Heavy / special models run alone (+ homecpu): requesting one evicts
        # the trio; requesting a trio member afterwards reloads it (weights
        # stay PVC-cached). F16 + 1M variants carry 34+ GiB KV of their own;
        # VL/whisper serve batch jobs; cnxabl's 48.6 GB experts-on-CPU would
        # overflow the node RAM budget if co-resident with the dense trio;
        # q38bf16 + kat trio overflow it too (see main-set note 2026-10-20).
        # 2026-10-23 (C04): flash-next q3/q4 + orca-q6 + the 122B UD ladder
        # join here (55.7-156.1 GiB weight classes); ornqbf (Ornith 35B BF16,
        # 66.2 GiB) is solo - dense-weight resident too big for the trio.
        # flash-next q5/q6 are deliberately in NO set at all (see vars note).
        solo: "(q35bf16 | q35b1m | q38f16 | q38bf16 | katq4 | katq6 | katq8 | q38q81m | katq41m | katq61m | katq81m | cnxabl | fnq3 | fnq4 | fnorca | o122q3 | o122q4 | o122q5 | o122q6 | ornqbf | vl2bq8 | vl2bq4 | vl2bbf | vl4bq4 | vl4bq8 | vl4bbf | vl8bq4 | vl8bq8 | vl8bbf | vl30bq4 | vl30bq8 | vl30bbf | v4tq8 | v4tq4 | v4tbf | v30tq8 | v30tq4 | v30tbf | wsp) & homecpu"
