apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-secrets
spec:
  refreshInterval: 1h
  target:
    name: coder-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CODER_PG_CONNECTION_URL: "postgresql://{{ `{{ .pg_username }}` }}:{{ `{{ .pg_password }}` }}@pg-coder-rw:5432/coder"
        CODER_ACCESS_URL: "https://coder.{{ $.Values.domain }}"
        CODER_WILDCARD_ACCESS_URL: "*-coder.{{ $.Values.domain }}"
        CODER_OIDC_ISSUER_URL: "{{ `{{ .provider_url }}` }}"
        CODER_OIDC_EMAIL_DOMAIN: "{{ $.Values.domain }}"
        CODER_OIDC_CLIENT_ID: "{{ `{{ .client_id }}` }}"
        CODER_OIDC_CLIENT_SECRET: "{{ `{{ .secret }}` }}"
        CODER_OIDC_SIGN_IN_TEXT: "Sign in"
        CODER_OIDC_ICON_URL: "https://gitlab.alexsaphir.com/-/pwa-icons/logo-512.png"
        CODER_OIDC_GROUP_AUTO_CREATE: "true"
        CODER_OIDC_EMAIL_FIELD: "email"
        CODER_OIDC_USERNAME_FIELD: "preferred_username"
        CODER_OIDC_SCOPES: "openid,profile,email"
        CODER_EMAIL_SMARTHOST: "smtp-relay-mail:587"
        CODER_EMAIL_FROM: "code@{{ .Values.domain }}"
        CODER_EMAIL_HELLO: "coder.{{ .Values.domain }}"
        CODER_EMAIL_TLS_SKIPVERIFY: "true"
        # Per-user git identity: coderd brokers an OAuth consent against the
        # CANONICAL Forgejo — this cluster's coder (coder.spencerslab.com)
        # spends its single community-license provider slot on
        # git.spencerslab.com. The ID is contractual, not cosmetic — coderd
        # serves the callback at /external-auth/<ID>/callback and the
        # forge-side OAuth app must whitelist that exact URI. TYPE=gitea makes
        # coderd's giteaDefaults() derive TOKEN_URL/VALIDATE_URL/REGEX from the
        # AUTH_URL host (v2.35.2 source), so setting them here would only drift.
        CODER_EXTERNAL_AUTH_0_ID: "forgejo"
        CODER_EXTERNAL_AUTH_0_TYPE: "gitea"
        CODER_EXTERNAL_AUTH_0_DISPLAY_NAME: "Forgejo"
        CODER_EXTERNAL_AUTH_0_AUTH_URL: "https://git.spencerslab.com/login/oauth/authorize"
        CODER_EXTERNAL_AUTH_0_CLIENT_ID: "{{ `{{ .ea_client_id }}` }}"
        CODER_EXTERNAL_AUTH_0_CLIENT_SECRET: "{{ `{{ .ea_secret }}` }}"
        # coderd keeps stored external tokens in plaintext in the database
        # unless this is set (v2.35.2 database-encryption doc). Value is
        # comma-separated base64 32-byte keys: the first encrypts, the rest
        # decrypt-only, so a rotated-out key still decrypts old tokens.
        CODER_EXTERNAL_TOKEN_ENCRYPTION_KEYS: "{{ `{{ .token_encryption_keys }}` }}"

  data:
    - secretKey: client_id
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "coder-sso-secret" }}'
        property: username
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: secret
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "coder-sso-secret" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: provider_url
      sourceRef:
        storeRef:
          name: bitwarden-uri
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "coder-sso-secret" }}'
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: pg_username
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "coder-pg" }}'
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: pg_password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "coder-pg" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # coder-external-auth — the Forgejo OAuth app registered for coderd
    # itself (username = client id, password = client secret), on the
    # canonical forge. Per-cluster vault item under the shared key name:
    # this cluster's item carries the client bound to
    # https://coder.spencerslab.com/external-auth/forgejo/callback (the
    # coder-pg precedent for same-key/different-item pairs).
    - secretKey: ea_client_id
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "coder-external-auth" }}'
        property: username
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ea_secret
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "coder-external-auth" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # coder-token-encryption — the base64 32-byte at-rest key; its generation
    # command is documented in custom-values/gpu/prod-values.yaml.
    - secretKey: token_encryption_keys
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "coder-token-encryption" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
