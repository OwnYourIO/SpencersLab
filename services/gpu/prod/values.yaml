llama-swap:
  # gpu working set (CA2 catalog enablement; frozen ENABLEMENT table
  # charts/llama-swap/tests/llama_swap_testlib.py): 34 of the 58-ID catalog
  # render live here, the rest stay the chart's default-disabled catalog
  # echoes (fail-fast "<id> is not enabled on this cluster"). Whole families
  # flip at family level; families with over-budget or gpu-ai-only rungs flip
  # per-rung. The 8GiB Radeon 780M budget is the filter (VRAM node-freeze
  # incidents 2026-10-11/18): flash-next/122B/qwen38/qwen36/embedding/
  # visual/1m/BF16 rungs never load on this box.
  config:
    families:
      qwen3.8-27b:
        quants:
          q4: {enabled: true}
          q6: {enabled: true}
          q8: {enabled: true}
          bf16: {enabled: true}
          # q8-visual / q8-1m: gpu-ai-only (q38 macro + RAM-class sizes).
      qwen3.6-27b: {enabled: true}
      qwen3.6-35b-a3b:
        quants:
          q6: {enabled: true}
          q8: {enabled: true}
          # 1m / bf16 / q8-visual: echo on this box - 1m/bf16 carry the
          # legacy byte-pinned disabled messages below, q8-visual the
          # gpu-ai-only default message.
      ornith-1.5-35b-a3b:
        quants:
          iq2xxs: {enabled: true}
          q3: {enabled: true}
          q4: {enabled: true}
          q5: {enabled: true}
          q6: {enabled: true}
          q8: {enabled: true}
          # bf16: echo (measured 66.2 GiB; see the disabled override below)
      home-3b-v3: {enabled: true}
      qwen3-vl-2b: {enabled: true}
      qwen3-vl-4b: {enabled: true}
      qwen3-vl-8b: {enabled: true}
      qwen3-vl-30b-a3b:
        quants:
          q4: {enabled: true}
          q8: {enabled: true}
          # bf16: echo with its legacy disabled message below.
      qwen3-vl-4b-thinking: {enabled: true}
      qwen3-vl-30b-a3b-thinking: {enabled: true}
      whisper: {enabled: true}
      # Default-disabled here: ornith-1.5-122b, qwen3-embedding, qwen36,
      # qwen38, qwen3.8-flash-next(-orca) - gpu-ai's set, echoed on this box.
    models:
      # ---- per-ID override layer (merged OVER the family expansion;
      # precedence disabled > cmd > composition unchanged from C02) ----
      # gpu-only override for the 8 GiB Radeon 780M. The chart-default cmd
      # OOMs here: llama.cpp's fit-params probe ("failed to fit params to free device
      # memory", fires before every load attempt) and then radv dies with
      # "Not enough memory for command submission" -> VK_ERROR_DEVICE_LOST ->
      # llama-swap "upstream command exited prematurely". Exact accounting from
      # the GGUF header (arch qwen35moe, 40 layers = 10x [3x Gated DeltaNet +
      # 1x Gated Attention], 256 experts): expert tensors matched by ${moe}'s
      # -ot regex = 31.88 GiB -> CPU; GPU-resident weights only 2.48 GiB; q8_0
      # KV for 262144 tokens across the 10 attention layers (2 kv heads x 256
      # dim) = 2.66 GiB; compute buffer ~0.75 GiB at ub 2048; and the HF repo
      # ships mmproj-BF16 (vision projector, auto-loaded, ~0.7-1 GiB on GPU).
      # Total ~7.5 GiB > ~7.4 GiB usable. Fix keeps 256k ctx + q8_0 KV +
      # expert-only offload (operator decision 2026-10-11; FA + cache types stay
      # in ${flash-and-q8}, chart untouched) and reclaims VRAM via
      # --no-mmproj (text-only on this box; gpu-ai keeps vision) and ub 1024
      # (smaller compute buffer; slower prompt processing — accepted, expect
      # slow generation overall). Full debug trail:
      # .agents/plans/2026-10-11-debug-gpu-moe-qwen36-35b-q8-vram-oom.md
      # Only the cmd composition (use/flags) and description are overridden;
      # name/proxy/ttl merge from chart defaults.
      qwen3.6-35b-a3b-q8:
        hf: unsloth/Qwen3.6-35B-A3B-GGUF:Q8_0
        # ${ctx-256k} is NOT reused here: it carries -ub 2048, this box
        # needs -ub 1024; the context flags below replace the macro.
        use: [threads, moe, flash-and-q8]
        flags: |
          --no-mmproj
          --ctx-size 262144
          -b 2048
          -ub 1024
          # 2026-10-15: text-only (--no-mmproj) so cache_reuse works; 256 =
          # tolerate that many tokens of prompt drift when reusing cached KV
          # (agentic conversations mutate: system reminders, tool schemas).
          --cache-reuse 256
          # 2026-10-16: -np MUST be pinned to 1 on this box — the unified KV
          # pool is np x ctx, so the llama-server default (4 slots) would
          # preallocate 4 x 262144 x ~10.9KB/token = ~10.6 GiB of KV, and
          # even np 2 (~5.7 GiB) plus the 2.48 GiB weights busts the 8 GiB
          # card. np 1 keeps the pool at ~2.66 GiB (the 2026-10-11 VRAM
          # budget). Concurrent agents here queue on the one slot instead.
          # --cache-ram deliberately left at the 8 GiB default: ~32 GiB
          # experts already resident in this box's 64 GiB RAM. ttl stays
          # chart-default 0 (never auto-unload).
          -np 1
        description: "Qwen 3.6 35B A3B (MoE), Q8_0; 8GiB-gpu fit: experts on CPU, q8_0 KV, no vision, cache_reuse 256, 1 slot (np pinned: pool = np x ctx), 256k ctx (slow)"

      # Fail-fast disables (2026-10-20): these ${moe}-macro entries set -ngl
      # by hand, so llama.cpp's fit-params probe aborts and the load exhausts
      # the 8 GiB card -> radv "Not enough memory for command submission" ->
      # VK_ERROR_DEVICE_LOST. An ~80B-A3B coder-family q6 entry (since removed
      # from the roster) doing exactly this froze the whole node 2026-10-18
      # (k3s + VM down ~27 min); the 2026-10-11 q35q8 incident is the same
      # class. Exiting instantly keeps the ID routable with a
      # logged reason instead of taking the cluster offline. They serve fine
      # on gpu-ai.
      # `disabled:` renders the fail-fast cmd the renderer composes as
      #   /bin/sh -c "echo '<id> <disabled>' >&2; exit 1"
      # (echo body byte-pinned by tests/golden/gpu.config.yaml).
      qwen3.6-35b-a3b-bf16:
        disabled: "disabled on the 8GiB gpu box: BF16 non-expert weights (~5 GiB) + 256k KV + mmproj exceed the card. Use qwen3.6-35b-a3b-q8 (tuned) or gpu-ai."
        description: "DISABLED on 8GiB gpu (cannot fit) — use the tuned q8 entry or gpu-ai"
      qwen3.6-35b-a3b-1m:
        disabled: "disabled on the 8GiB gpu box: 1M-token KV stays GPU-resident here (no --no-kv-offload), ~11 GiB alone. Use gpu-ai."
        description: "DISABLED on 8GiB gpu (1M KV off-card) — available on gpu-ai"
      qwen3-vl-30b-a3b-bf16:
        disabled: "disabled on the 8GiB gpu box: it uses the untuned expert-offload macro (the q4/q8 entries use the 8GB-measured moe-vl placement); BF16 non-experts + mmproj exceed the card. Use the q4/q8 variants."
        description: "DISABLED on 8GiB gpu (cannot fit) — use the q4/q8 variants"

      # C04 (2026-10-23): the Ornith 1.5 35B A3B q6/q8 rungs get the same
      # 8 GiB-verified treatment as qwen3.6-35b-a3b-q8 above - the official
      # GGUF header confirms the same qwen35moe arch (256 experts/top-8), so
      # the 2026-10-11 VRAM budget carries over (expert-only -ot offload,
      # q8_0 KV at ub 1024, --no-mmproj, single slot). BF16 cannot fit even
      # with that regime (see the measured reason in its disable echo).
      ornith-1.5-35b-a3b-q6:
        hf: ornith-ai/Ornith-1.5-35B-A3B-GGUF:Q6_K
        # ${ctx-256k} is NOT reused: it carries -ub 2048, this box needs
        # -ub 1024 (smaller compute buffer); the context flags below replace
        # the macro. -np 1 pinned: the unified KV pool is np x ctx, and 256k
        # tokens of q8_0 KV already take ~2.6 GiB of the 8 GiB card.
        use: [threads, moe, flash-and-q8]
        flags: |
          --no-mmproj
          --ctx-size 262144
          -b 2048
          -ub 1024
          --cache-reuse 256
          -np 1
        description: "Ornith 1.5 35B A3B (MoE), Q6_K; 8GiB-gpu fit: experts on CPU, q8_0 KV, no vision, cache_reuse 256, 1 slot (np pinned: pool = np x ctx), 256k ctx (slow)"

      ornith-1.5-35b-a3b-q8:
        hf: ornith-ai/Ornith-1.5-35B-A3B-GGUF:Q8_0
        use: [threads, moe, flash-and-q8]
        flags: |
          --no-mmproj
          --ctx-size 262144
          -b 2048
          -ub 1024
          --cache-reuse 256
          -np 1
        description: "Ornith 1.5 35B A3B (MoE), Q8_0; 8GiB-gpu fit: experts on CPU, q8_0 KV, no vision, cache_reuse 256, 1 slot (np pinned: pool = np x ctx), 256k ctx (slow)"

      ornith-1.5-35b-a3b-bf16:
        # 66.2 GiB total weights; the GPU-resident term is the BF16
        # non-expert/attention stack + mmproj + the 256k q8_0 KV pool - the
        # same over-card class as the disabled qwen3.6-35b-a3b-bf16 above
        # (measured 2026-10-11: even ~5 GiB of non-experts + 2.66 GiB KV +
        # mmproj busts the ~7.4 GiB usable).
        disabled: "disabled on the 8GiB gpu box: BF16 non-expert weights + 256k q8_0 KV + mmproj exceed the card (66.2 GiB total; same qwen35moe class as the disabled qwen3.6-35b-a3b-bf16). Use ornith-1.5-35b-a3b-q8 (tuned) or gpu-ai."
        description: "DISABLED on 8GiB gpu (cannot fit) — use the tuned q8/q6 entries or gpu-ai"

open-webui:
  annotations:
    reloader.stakater.com/auto: "true"
  #replicaCount: 1
  resources:
    requests:
      cpu: 15m
      memory: 700Mi
    limits:
      cpu: 200m
      memory: 1Gi
  copyAppData:
    resources: {}
  ollama:
    enabled: false
  enableOpenaiApi: true
  openaiBaseApiUrl: "http://gpu-llama-swap.default.svc.cluster.local:8080/v1"
  pipelines:
    enabled: true
    persistence:
      existingClaim: open-webui-pipelines
  tika:
    enabled: true
    resources:
      requests:
        cpu: 15m
        memory: 650Mi
      limits:
        cpu: 100m
        memory: 800Mi
  websocket:
    enabled: true

  extraEnvFrom:
    - secretRef:
        name: open-webui-secrets
  persistence:
    enabled: true
    existingClaim: open-webui
  podSecurityContext:
    supplementalGroups:
      - 140
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 150
    runAsNonRoot: true
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - "ALL"
    seccompProfile:
      type: RuntimeDefault
coder:
  coder:
    env:
      - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
        value: "false"
      - name: CODER_OAUTH_GITHUB_ALLOW_SIGNUPS
        value: "false"
      - name: CODER_TELEMETRY
        value: "false"
      - name: CODER_PROMETHEUS_ENABLE
        value: "true"

    envFrom:
      - secretRef:
          name: coder-secrets
    # This is needed because the Access URL is coming from envFrom
    envUseClusterAccessURL: false

    ingress:
      # Wildcard ingress so workspace app subdomains reach coderd. The
      # wildcard host lives in custom-values/gpu/prod-values.yaml — this
      # external chart's values slice is not templated, so .Values.domain is
      # unavailable here. The chart renders ingress.host unconditionally, so
      # the wildcard is carried there; the plain coder.<domain> host stays
      # with the gpu generic-ingress.
      enable: true
      tls:
        enable: true
        secretName: wildcard-cert

    service:
      type: ClusterIP

langflow:
  app-template:
    persistence:
      knowledge:
        existingClaim: knowledge-shared

shared-storage:
  knowledge:
    pvc-name: knowledge-shared
    provider: seaweedfs

hivetools:
  # gpu-specific MCP servers + Postgres DBs on top of base's defaults
  # (the kubernetes server ships from charts/hivetools/values.yaml).
  mcp:
    playwright:
      enabled: true
      image:  mcr.microsoft.com/playwright/mcp:v0.0.78
      transport: streamable-http
      mcpPort: 8931
      proxyPort: 8080
      # OIDC temporarily disabled (2026-09) — uncomment to re-enable.
      # oidc:
      #   audience: playwright
      resources:
        limits:
          cpu: '200m'
          memory: '4Gi'
        requests:
          cpu: '100m'
          memory: '128Mi'
      podTemplateSpec:
        spec:
          securityContext:
            fsGroup: 1000
          containers:
          - name: mcp
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
            env:
              - name: XDG_CONFIG_HOME
                value: /home/node/.cache
              - name: XDG_CACHE_HOME
                value: /home/node/.cache
            args:
              - "--headless"
              - "--port"
              - "8931"
              - "--host"
              - "0.0.0.0"
              - --allowed-hosts
              - "*"
              - "--output-dir"
              - "/home/node/.cache/"
              - "--isolated"
            volumeMounts:
              - name: tmp
                mountPath: /tmp
              - name: cache
                mountPath: /home/node/.cache
              - name: output
                mountPath: /output
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 512Mi
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
            - name: output
              emptyDir:
                sizeLimit: 500Mi
    # Home Assistant, split into privilege tiers. Both use the SAME HA token
    # (homeassistant-mcp secret); the tier is enforced server-side by ha-mcp's
    # READ_ONLY_MODE (hides write tools + blocks write calls at runtime).
    homeassistant-readonly:
      enabled: true
      image: zorak1103/ha-mcp:2026.9.2
      transport: streamable-http
      mcpPort: 8080
      # OIDC temporarily disabled (2026-09) — uncomment to re-enable.
      # oidc:
      #   audience: homeassistant-readonly
      env:
        - name: READ_ONLY_MODE
          value: "true"
      resources:
        limits:
          cpu: '100m'
          memory: '1128Mi'
        requests:
          cpu: '50m'
          memory: '64Mi'
      podTemplateSpec:
        spec:
          containers:
            - name: mcp
              envFrom:
                - secretRef:
                    name: homeassistant-mcp
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
    homeassistant-admin:
      enabled: true
      image: zorak1103/ha-mcp:2026.9.2
      transport: streamable-http
      mcpPort: 8080
      # OIDC temporarily disabled (2026-09) — uncomment to re-enable.
      # oidc:
      #   audience: homeassistant-admin
      resources:
        limits:
          cpu: '100m'
          memory: '1128Mi'
        requests:
          cpu: '50m'
          memory: '64Mi'
      podTemplateSpec:
        spec:
          containers:
            - name: mcp
              envFrom:
                - secretRef:
                    name: homeassistant-mcp
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
    searxng:
      enabled: true
      image: isokoliuk/mcp-searxng:1.13.0
      # streamable-http (2026-09-27): the stdio attach bridge dies permanently
      # after any transient apiserver outage (ToolHive re-attach gives up after
      # 10 retries and reports healthy anyway — see
      # .agents/plans/2026-09-27-debug-mcp-servers-longterm-fix.md). mcp-searxng
      # serves native Streamable HTTP when MCP_HTTP_PORT is set, so the
      # proxyrunner attach hop goes away entirely (same pattern as wekan/HA).
      # Client URL moves to the -headless service: see .opencode/opencode.json
      # (MCP server definitions).
      transport: streamable-http
      mcpPort: 8080
      # OIDC temporarily disabled (2026-09) — uncomment to re-enable.
      # oidc:
      #   audience: searxng
      resources:
        limits:
          cpu: '100m'
          memory: '1128Mi'
        requests:
          cpu: '50m'
          memory: '64Mi'
      podTemplateSpec:
        spec:
          containers:
            - name: mcp
              env:
                - name: SEARXNG_URL
                  value: "http://gpu-searxng.default.svc.cluster.local:8080"
                # Switches mcp-searxng from stdio to native HTTP mode.
                - name: MCP_HTTP_PORT
                  value: "8080"
                - name: MCP_HTTP_HOST
                  value: "0.0.0.0"
    # WeKan, split into privilege tiers. Both share the same WEKAN_TOKEN
    # (wekan-mcp secret); the readonly tier hides/blocks write tools via the
    # WEKAN_MCP_READ_ONLY flag handled by the wekan-mcp image.
    # Pinned to :v60 — the first build carrying the 25-tool custom-field
    # surface (ticket 2026-10-feat-board-coord-intake, D17/M2); renovate's
    # docker manager tracks future :v<run> bumps (renovate-mcp:v31 precedent).
    wekan-readonly:
      enabled: true
      image: ghcr.io/ownyourio/wekan-mcp:v60
      transport: streamable-http
      mcpPort: 8080
      # OIDC temporarily disabled (2026-09) — uncomment to re-enable.
      # oidc:
      #   audience: wekan-readonly
      env:
        - name: WEKAN_BASE_URL
          value: "https://wekan.spencerslab.com"
        - name: WEKAN_MCP_READ_ONLY
          value: "true"
      secrets:
        - name: wekan-mcp
          key: WEKAN_TOKEN
          targetEnvName: WEKAN_TOKEN
      resources:
        limits:
          cpu: '200m'
          memory: '256Mi'
        requests:
          cpu: '50m'
          memory: '64Mi'
      podTemplateSpec:
        spec:
          containers:
            - name: mcp
              imagePullPolicy: Always   # :main is a mutable tag; always pull fresh
              securityContext:
                runAsUser: 65532
                runAsGroup: 65532
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
    wekan-admin:
      enabled: true
      image: ghcr.io/ownyourio/wekan-mcp:v60
      transport: streamable-http
      mcpPort: 8080
      # OIDC temporarily disabled (2026-09) — uncomment to re-enable.
      # oidc:
      #   audience: wekan-admin
      env:
        - name: WEKAN_BASE_URL
          value: "https://wekan.spencerslab.com"
      secrets:
        - name: wekan-mcp
          key: WEKAN_TOKEN
          targetEnvName: WEKAN_TOKEN
      resources:
        limits:
          cpu: '200m'
          memory: '256Mi'
        requests:
          cpu: '50m'
          memory: '64Mi'
      podTemplateSpec:
        spec:
          containers:
            - name: mcp
              imagePullPolicy: Always   # :main is a mutable tag; always pull fresh
              securityContext:
                runAsUser: 65532
                runAsGroup: 65532
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
    # Grafana, split into privilege tiers. Readonly keeps --disable-write and
    # the existing viewer token; admin drops --disable-write and uses a
    # separate admin service-account token (grafana-mcp-admin-token secret —
    # Bitwarden item must exist before the admin server can start).
    grafana-readonly:
      enabled: true
      image: grafana/mcp-grafana:1.3.0
      transport: streamable-http
      mcpPort: 8000
      # OIDC temporarily disabled (2026-09) — uncomment to re-enable.
      # oidc:
      #   audience: grafana-readonly
      # --allowed-hosts '*' is REQUIRED: mcp-grafana validates Host/Origin and
      # the ToolHive proxy rewrites Host to the backend ClusterIP (else 403).
      args:
        - "--transport"
        - "streamable-http"
        - "--address"
        - "0.0.0.0:8000"
        - "--allowed-hosts"
        - "*"
        - "--disable-write"
      env:
        - name: GRAFANA_URL
          value: https://graphs.spencerslab.com
      secrets:
        - name: grafana-mcp-token
          key: token
          targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
      resources:
        limits:
          cpu: '200m'
          memory: '256Mi'
        requests:
          cpu: '50m'
          memory: '64Mi'
      podTemplateSpec:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: mcp
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              volumeMounts:
                - mountPath: /tmp
                  name: tmp
          volumes:
            - name: tmp
              emptyDir: {}
    grafana-admin:
      enabled: true
      image: grafana/mcp-grafana:1.3.0
      transport: streamable-http
      mcpPort: 8000
      # OIDC temporarily disabled (2026-09) — uncomment to re-enable.
      # oidc:
      #   audience: grafana-admin
      # Same as readonly but WITHOUT --disable-write and with the admin token.
      args:
        - "--transport"
        - "streamable-http"
        - "--address"
        - "0.0.0.0:8000"
        - "--allowed-hosts"
        - "*"
      env:
