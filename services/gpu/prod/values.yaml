          memory: '256Mi'
        requests:
          cpu: '50m'
          memory: '64Mi'
      podTemplateSpec:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: mcp
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
