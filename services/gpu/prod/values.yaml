llama-swap:
open-webui:
  annotations:
    reloader.stakater.com/auto: "true"
  #replicaCount: 1
  resources:
    requests:
      cpu: 15m
      memory: 700Mi
    limits:
      cpu: 200m
      memory: 1Gi
  copyAppData:
    resources: {}
  ollama:
    enabled: false
  enableOpenaiApi: true
  openaiBaseApiUrl: "http://gpu-llama-swap.default.svc.cluster.local:8080/v1"
  pipelines:
    enabled: true
    persistence:
      existingClaim: open-webui-pipelines
  tika:
    enabled: true
    resources:
      requests:
        cpu: 15m
        memory: 650Mi
      limits:
        cpu: 100m
        memory: 800Mi
  websocket:
    enabled: true

  extraEnvFrom:
    - secretRef:
        name: open-webui-secrets
  persistence:
    enabled: true
    existingClaim: open-webui
  podSecurityContext:
    supplementalGroups:
      - 140
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 150
    runAsNonRoot: true
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - "ALL"
    seccompProfile:
      type: RuntimeDefault
coder:
  coder:
    env:
      - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
        value: "false"
      - name: CODER_OAUTH_GITHUB_ALLOW_SIGNUPS
        value: "false"
      - name: CODER_TELEMETRY
        value: "false"
      - name: CODER_PROMETHEUS_ENABLE
        value: "true"

    envFrom:
      - secretRef:
          name: coder-secrets
    # This is needed because the Access URL is coming from envFrom
    envUseClusterAccessURL: false

    service:
      type: ClusterIP

langflow:
  app-template:
    persistence:
      knowledge:
        existingClaim: knowledge-shared

shared-storage:
  knowledge:
    pvc-name: knowledge-shared
    provider: seaweedfs

hivetools:
  # gpu-specific MCP servers + Postgres DBs on top of base's defaults
  # (the kubernetes server ships from charts/hivetools/values.yaml).
  mcp:
    playwright:
      enabled: true
      image:  mcr.microsoft.com/playwright/mcp:v0.0.78
      transport: streamable-http
      mcpPort: 8931
      proxyPort: 8080
      # OIDC temporarily disabled (2026-09) — uncomment to re-enable.
      # oidc:
      #   audience: playwright
      resources:
        limits:
          cpu: '200m'
          memory: '4Gi'
        requests:
          cpu: '100m'
          memory: '128Mi'
      podTemplateSpec:
        spec:
          securityContext:
            fsGroup: 1000
          containers:
          - name: mcp
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
            env:
              - name: XDG_CONFIG_HOME
                value: /home/node/.cache
              - name: XDG_CACHE_HOME
                value: /home/node/.cache
            args:
              - "--headless"
              - "--port"
              - "8931"
              - "--host"
              - "0.0.0.0"
              - --allowed-hosts
              - "*"
              - "--output-dir"
              - "/home/node/.cache/"
              - "--isolated"
            volumeMounts:
              - name: tmp
                mountPath: /tmp
              - name: cache
                mountPath: /home/node/.cache
              - name: output
                mountPath: /output
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 512Mi
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
            - name: output
              emptyDir:
                sizeLimit: 500Mi
    homeassistant:
      enabled: true
      image: zorak1103/ha-mcp:2026.9.2
      transport: streamable-http
      mcpPort: 8080
      # OIDC temporarily disabled (2026-09) — uncomment to re-enable.
      # oidc:
      #   audience: homeassistant
      resources:
        limits:
          cpu: '100m'
          memory: '1128Mi'
        requests:
          cpu: '50m'
          memory: '64Mi'
      podTemplateSpec:
        spec:
          containers:
            - name: mcp
              envFrom:
                - secretRef:
                    name: homeassistant-mcp
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
    searxng:
      enabled: true
      image: isokoliuk/mcp-searxng:1.13.0
      transport: stdio
      mcpPort: 8080
      # OIDC temporarily disabled (2026-09) — uncomment to re-enable.
      # oidc:
      #   audience: searxng
      resources:
        limits:
          cpu: '100m'
          memory: '1128Mi'
        requests:
          cpu: '50m'
          memory: '64Mi'
      podTemplateSpec:
        spec:
          containers:
            - name: mcp
              env:
                - name: SEARXNG_URL
                  value: "http://gpu-searxng.default.svc.cluster.local:8080"
    wekan:
      enabled: true
      image: ghcr.io/ownyourio/wekan-mcp:0.0.2
      transport: streamable-http
      mcpPort: 8080
      # OIDC temporarily disabled (2026-09) — uncomment to re-enable.
      # oidc:
      #   audience: wekan
      env:
        - name: WEKAN_BASE_URL
          value: "https://wekan.spencerslab.com"
      secrets:
        - name: wekan-mcp
          key: WEKAN_TOKEN
          targetEnvName: WEKAN_TOKEN
      resources:
        limits:
          cpu: '200m'
          memory: '256Mi'
        requests:
          cpu: '50m'
          memory: '64Mi'
      podTemplateSpec:
        spec:
          containers:
            - name: mcp
              securityContext:
                runAsUser: 65532
                runAsGroup: 65532
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
    grafana:
      enabled: true
      image: grafana/mcp-grafana:1.3.0
      transport: streamable-http
      mcpPort: 8000
      # OIDC temporarily disabled (2026-09) — uncomment to re-enable.
      # oidc:
      #   audience: grafana
      # --allowed-hosts '*' is REQUIRED: mcp-grafana validates Host/Origin and
      # the ToolHive proxy rewrites Host to the backend ClusterIP (else 403).
      args:
        - "--transport"
        - "streamable-http"
        - "--address"
        - "0.0.0.0:8000"
        - "--allowed-hosts"
        - "*"
        - "--disable-write"
      env:
        - name: GRAFANA_URL
          value: https://graphs.spencerslab.com
      secrets:
        - name: grafana-mcp-token
          key: token
          targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
      resources:
        limits:
          cpu: '200m'
          memory: '256Mi'
        requests:
          cpu: '50m'
          memory: '64Mi'
      podTemplateSpec:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: mcp
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              volumeMounts:
                - mountPath: /tmp
                  name: tmp
          volumes:
            - name: tmp
              emptyDir: {}
    # No pinned :v<run> tag exists yet, so this tracks the rolling :main tag —
    # pin to a :v<run> tag once the first successful build publishes one.
    renovate:
      enabled: true
      image: ghcr.io/ownyourio/renovate-mcp:main
      transport: stdio
      mcpPort: 8080
      # OIDC temporarily disabled (2026-09) — uncomment to re-enable.
      # oidc:
      #   audience: renovate
      env:
        - name: RENOVATE_MCP_REQUIRE_CLI
          value: "true"
        - name: RENOVATE_BASE_DIR
          value: /cache
        - name: HOME
          value: /tmp
      resources:
        limits:
          cpu: '2'
          memory: '4Gi'
        requests:
          cpu: '500m'
          memory: '1Gi'
      podTemplateSpec:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
            - name: clone
              image: ghcr.io/ownyourio/renovate-mcp:main  # same image ships git
              imagePullPolicy: Always
              env:
                - name: HOME
                  value: /tmp
                - name: GITHUB_PERSONAL_ACCESS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: github-mcp
                      key: GITHUB_PERSONAL_ACCESS_TOKEN
              command: ["/bin/sh", "-c"]
              args:
                - |
                  git clone --depth 1 --branch main \
                    "https://x-access-token:${GITHUB_PERSONAL_ACCESS_TOKEN}@github.com/OwnYourIO/SpencersLab.git" \
                    /workspace/SpencersLab
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              volumeMounts:
                - mountPath: /workspace
                  name: workspace
                - mountPath: /tmp
                  name: tmp
          containers:
            - name: mcp
              imagePullPolicy: Always   # :main is a mutable tag; always pull fresh
              resources:
                requests:
                  cpu: '500m'
                  memory: '1Gi'
                limits:
                  cpu: '2'
                  memory: '4Gi'
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              volumeMounts:
                - mountPath: /workspace
                  name: workspace
                - mountPath: /tmp
                  name: tmp
                - mountPath: /cache
                  name: cache
          volumes:
            - name: workspace
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: cache
              emptyDir: {}
  postgresMcp:
    databases:
      - name: coder
        bitwardenIdKey: mcp-pg-coder
        database: coder
      - name: flowise
        bitwardenIdKey: mcp-pg-flowise
        database: flowise
      - name: langflow
        bitwardenIdKey: mcp-pg-langflow
        database: langflow
      - name: n8n
        bitwardenIdKey: mcp-pg-n8n
        database: n8n
      - name: open-webui
        bitwardenIdKey: mcp-pg-open-webui
        database: open-webui
