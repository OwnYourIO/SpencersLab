ingress:
  dashboardProvider: homepage # Set to "homepage" to enable Homepage annotations on ingress objects
  subdomains:
    # Disabled 2026-09-07 with the scifi-farm chart (backend Service removed).
    #scifi-farm:
    #  domain: scifi.farm
    #  service: grow-scifi-farm
    #  port: 1313
    cluster:
      clusterBase: true
      service: argocd-server
      port: 80
    traefik:
      clusterBase: true
      namespace: kube-system
      service: traefik
      port: 8080
    # Key != serviceName (paperless pattern): renders edms.<domain> mesh
    # ingress plus external-dns-labelled mayan-edms.<domain> ingress that the
    # proxy-local hub ExternalName targets. Equal values would collide on
    # the rendered <name>-ingress object names.
    edms:
      serviceName: mayan-edms
      service: grow-mayan-edms
      port: 8000
    training:
      serviceName: ilias
      service: grow-ilias
      port: 80
    erp-next:
      # serviceName renders a second ingress for the public host
      # erp.<domain> (documents/paperless pattern): the hub preserves the
      # Host header when forwarding erp -> target erp-next, so grow must
      # serve both erp.spencerslab.com and erp-next.spencerslab.com.
      serviceName: erp
      service: erp-next
      port: 8080
    okd:
      # serviceName renders a second ingress for the public host
      # forms.<domain> (erp-next/erp pattern): the proxy-local hub preserves
      # the Host header when forwarding forms -> target grow, so grow must
      # serve forms.spencerslab.com too. The key keeps the cluster-side name
      # okd; both hosts route to the same grow-okd service.
      serviceName: forms
      service: grow-okd
      port: 80

# ToolHive MCP platform extension (base deploys hivetools on every cluster):
# read-only Postgres MCP servers for this cluster's CNPG databases, exposed at
# mcp.grow.<domain> (charts/hivetools generic-mcp-ingress). OIDC stays
# disabled until the rollout is re-enabled chart-wide.
hivetools:
  bitwardenIds:
    mcp-pg-grow-assistant: OVERRIDE_VIA_CUSTOM_VALUES
    mcp-pg-grow-assistant-sensors: OVERRIDE_VIA_CUSTOM_VALUES
  postgresMcp:
    databases:
      # name must match the CNPG cluster name (pg-<name>) so the composed
      # DATABASE_URI host pg-<name>-rw resolves.
      - name: grow-assistant
        bitwardenIdKey: mcp-pg-grow-assistant
        database: home-assistant
      - name: grow-assistant-sensors
        bitwardenIdKey: mcp-pg-grow-assistant-sensors
        database: sensors
