# Music stack (plan 2026-09-20-feat-add-music-stack-to-media.md, phase 7a).
# One Bitwarden LOGIN item per secret (no custom fields): the item's password
# field holds the secret; items that also carry a username use that field.
#   betanin        = betanin web login; its password doubles as betanin api_key.
#   acoustid_key   = AcoustID API key (password field).
#   slskd          = Soulseek creds; its password doubles as slskd api_key.
#   explo          = Explo web-UI login.
#   listenbrainz   = ListenBrainz username (user field) + token (password).
#   lidarr         = Lidarr API key (password field).
#   audiomuse-ai   = bundled-Postgres password (username/db are static in the
#                    chart); optionally store jellyfin_user_id/jellyfin_token on
#                    the item for manual entry in the AudioMuse Setup Wizard.
# NOTE(user): acoustid_key and listenbrainz currently share ONE item UUID
# (abdfbf3d…); they are wired as separate keys below, so once you identify the
# correct item just fix the one UUID line that is wrong — no chart changes.
betanin:
  bitwardenIds:
    betanin: 5b6a9f94-62cb-4455-881c-b4cb017540da
    acoustid_key: abdfbf3d-06c3-4a82-b809-b4cb017d2a48
slskd:
