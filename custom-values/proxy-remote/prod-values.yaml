
sshd:
  controllers:
    main:
      containers:
        main:
          env:
            #TZ: America/Denver
            PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAy1rO5LsbzIrtqXCN6aJeLrJRlJIREC7nJZOUqsDaie"

proxy:
  subdomains:
    shows-4k:
      enabled: false
    movies-4k:
      enabled: false

# Deliberately NO bitwardenIds here: this cluster runs without the
# external-secrets operator (zero-trust edge — removed in 0da74e01a; the
# 2026-09-06 MCP-platform sweep re-added them by accident). Base gates its
# ExternalSecrets + cert-manager DNS-01 wildcard certs on
# bitwardenIds.cert-manager-solver-token, so listing that UUID here makes the
# app unsyncable: the external-secrets.io API does not exist on this cluster.
# The MCP platform stays off proxy-remote via
# charts.hivetools.enabled=false in services/proxy-remote/prod/values.yaml.
