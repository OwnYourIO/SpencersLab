# sync.yml — daily Immich -> CuratedForest album sync (ticket cf-11, C06 §2).
#
# Reviewer notes:
# - Cadence is DAILY (cron 17 5 * * * UTC = 05:17 UTC, about 23:17 MDT
#   overnight; off-the-hour :17 dodges the scheduler hotspots). One missed
#   schedule means one stale day and there is no catch-up: the
#   forgejo-run-watchdog (chunk C05) is the compensating control, and
#   workflow_dispatch (albums / force inputs) is the manual override.
# - Where a target page's authored gallery calls would not include the
#   synced files, the sync tool extends that page with ONE machine-marked
#   gallery call of its own (owner N2; idempotent, authored content is
#   never rewritten). That gallery edit is part of THIS run's commit and is
#   reviewed in the SAME PR, together with its farm preview.
# - immich-hugo-publish force-pushes the bot-owned immich-sync branch: the
#   branch is an ephemeral single-commit batch and the documented
#   force-push exemption (owner answer 4), never a human branch. One open
#   PR per batch: the tool creates-or-updates on head=immich-sync.
# - Secrets are seeded from Bitwarden by the forgejo-secret-seed CronJob
#   (chunk C04); this file references their NAMES only.
name: sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      albums:
        type: string
        required: false
        description: "comma-separated album names overriding sync-albums.yaml"
      force:
        type: boolean
        default: false

concurrency:
  # One sync at a time; queued runs finish in order (last write wins the
  # single immich-sync PR, same as the farm slot in deploy.yml).
  group: immich-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: cf-host
    timeout-minutes: 30
    env:
      # Job-level on purpose: one-line edit. This is the RUNNER's
      # in-cluster view of Immich (home cluster); the dev/gpu runners
      # cannot reach it until card #88 resolves the network path, so a
      # live run there fails loud — the C01 fixture suite covers the logic.
      IMMICH_URL: http://home-immich-server:2283
    steps:
      - uses: actions/checkout@v7
        with:
          # Pointers are enough: sync's existence checks never decode, and
          # new files commit back through the LFS filter installed below.
          fetch-depth: 1
          lfs: false

      - name: Install the local LFS filters
        run: git lfs install --local

      - name: Run the Immich album sync (immich-hugo-sync)
        id: sync
        env:
          IMMICH_API_KEY: ${{ secrets.IMMICH_API_KEY }}
          SITE_DIR: ${{ github.workspace }}
          ALBUMS_FILE: ${{ github.workspace }}/sync-albums.yaml
          ALBUMS: ${{ inputs.albums }}
          FORCE: ${{ inputs.force }}
          STATE_DIR: /data/state
          OUTPUT_FLAG: /tmp/immich-hugo-sync.flag
        run: |
          set -eu
          immich-hugo-sync > /tmp/immich-hugo-sync.log 2>&1 || {
            cat /tmp/immich-hugo-sync.log >&2
            exit 1
          }
          cat /tmp/immich-hugo-sync.log
          summary="$(grep '^SYNC_RESULT' /tmp/immich-hugo-sync.log | tail -n 1)"
          printf 'summary=%s\n' "$summary" >> "$GITHUB_OUTPUT"
          if [ "$(cat "$OUTPUT_FLAG")" = "changed" ]; then
            printf 'changed=yes\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=no\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the batch as the single immich-sync PR
        if: steps.sync.outputs.changed == 'yes'
        env:
          SITE_DIR: ${{ github.workspace }}
          # Bot-owned ephemeral branch: each run rewrites it as one commit
          # batch, so the open PR always shows exactly main vs that batch.
          BRANCH: immich-sync
          FORGEJO_URL: https://git.spencerslab.com
          # owner/name — the owner is the Forgejo ORG (org-scoped runner
          # registration, answer 6), not a personal account.
          FORGEJO_REPO: CuratedForest/CuratedForest.com
          # PAT, not the automatic FORGEJO_TOKEN: token-authored PRs are
          # anti-recursion suppressed and would never fire the farm deploy.
          FORGEJO_PAT: ${{ secrets.FORGEJO_SYNC_PAT }}
          SUMMARY: ${{ steps.sync.outputs.summary }}
          GIT_IDENTITY_NAME: immich-sync
          GIT_IDENTITY_EMAIL: immich-sync@curatedforest.com
        run: immich-hugo-publish

      - name: No changes
        if: steps.sync.outputs.changed != 'yes'
        run: echo "no changes — nothing to publish this run"
