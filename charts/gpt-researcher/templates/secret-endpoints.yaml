# Lab endpoint URLs for the backend, composed from the cluster's domain —
# no full URLs hardcoded in the chart. Consumed via secretKeyRef so runtime
# endpoints live in a Secret, not inline in the container env (user decision
# 2026-10-12).
#
# Deliberately a plain Secret and NOT an ExternalSecret: there is no remote
# source to fetch (the values are not credentials), and ESO's validating
# webhook rejects ExternalSecrets with no data/dataFrom — "ExternalSecrets
# is not a templating engine" (external-secrets#3478). If these ever need
# vault management, give the ExternalSecret a real data source (e.g. move
# the API key into Bitwarden) and compose around it like keycloakx does.
apiVersion: v1
kind: Secret
metadata:
  name: gpt-researcher-endpoints
  namespace: default
type: Opaque
stringData:
  OPENAI_BASE_URL: "https://llama.{{ .Values.domain }}/v1"
  SEARX_URL: "https://searxng.{{ .Values.domain }}"