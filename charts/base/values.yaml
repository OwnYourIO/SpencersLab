# This is used to prevent helm from creating objects that depend on CRDs that don't exist yet.
# helm install --namespace default --set initialInstall=true base OwnYourIO/base
# Then when the actual application is installed it can reset this as the CRDs should exist.
initialInstall: false

# These are optional and should be overridden with values from custom_values
bitwardenIds:
  cert-manager-solver-token:
  argocd-sso-secret:

# It's expected that these will be overridden with values from the AppSet.
# Similarly, where you see these in a values.yaml file, it's used as a reference.
#   The actual value is coming from an override on the AppSet.
domain: local
clusterName: base
letsEncryptEmail: ""
#letsEncryptSolver:

# This will allow k3s to be updated. Disabled by default incase anyone uses something other than k3s
autoUpdateK3s: false

# Additionally to disable sso, override this in the umbrella app.
# argo-cd.server.authMode ... or maybe argo-cd.server.sso.enabled

trustedIPs:
  - "10.42.0.0/16"

proxy:
  middlewares:
    entrypoint: ""

charts:
  # MCP platform for every cluster (ToolHive operator + MCP servers).
  # Default servers: mcp-kubernetes-readonly + mcp-kubernetes-admin (see
  # charts/hivetools; all MCPServers are named mcp-*). Services extend via
  # their own values under `hivetools:` and can add `charts:` entries.
  hivetools:
    namespace: default
    ServerSideApply: "true"
  # Stakater Reloader on every cluster: rolling-restarts Deployments/
  # StatefulSets/DaemonSets when a referenced ConfigMap/Secret changes.
  # Charts already carry reloader.stakater.com/auto: "true". Renovate
  # manages the version via the "key as chart name" regex manager: keep
  # version: directly under the key and repository: on the next line.
  reloader:
    version: 2.2.17
    repository: https://stakater.github.io/stakater-charts
    namespace: default
    ServerSideApply: "true"

# Values for the cluster-wide stakater/reloader chart (charts entry above) —
# rides the charts-appset values slice into every <serviceName>-reloader
# Application. annotations reload strategy restarts via a pod-template
# annotation excluded from ArgoCD diffs below, so selfHeal never fights it.
reloader:
  reloader:
    reloadStrategy: annotations
    readOnlyRootFileSystem: true
    deployment:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

cert-manager:
  crds:
    enabled: true
  # This is disabled because it's not necessary, causing problems jamming up ArgoCD, and is redundant.
  startupapicheck:
    enabled: false

argo-cd:
  fullnameOverride: "argocd"
  server:
    authMode: sso
    sso:
      # -- Create SSO configuration. If you set `true` , please also set `.Values.server.authMode` as `sso`.
      enabled: true
      # The rest of the SSO config is done in the ConfigMap to support the use of secrets to replace vars.

    extraArgs:
      - --insecure
      - --application-namespaces="*"
  repoServer:
    containerPort: 8081
    env:
      - name: ARGOCD_EXEC_TIMEOUT
        value: "5m"

  configs:
    # General Argo CD configuration
    ## Ref: https://github.com/argoproj/argo-cd/blob/master/docs/operator-manual/argocd-cm.yaml
    cm:
      oidc.config: |
        name: Keycloak
        issuer: $argocd-sso:issuer
        clientId: $argocd-sso:client-id
        clientSecret: $argocd-sso:client-secret
        requestedIDTokenClaims:
          groups:
            essential: true
        requestedScopes:
          - openid
          - profile
          - email
          - groups

      # This is to address https://github.com/bjw-s/helm-charts/issues/366
      resource.customizations.ignoreDifferences.apps_Deployment: |
        jqPathExpressions:
          - '.spec.template.spec.hostUsers'
          - '.spec.template.metadata.annotations?["reloader.stakater.com/last-reloaded-from"]'
          - '.spec.selector | select(.matchLabels."app.kubernetes.io/name" | test("argocd-(server|repo-server|applicationset-controller)"))'
          - '.metadata.labels | select(.metadata.name | test("argocd-(server|repo-server|applicationset-controller)"))'
      # ArgoCD has trouble handling PVCs and statefulsets. These ignore noise from that.
      resource.customizations.ignoreDifferences.apps_StatefulSet: |
        jqPathExpressions:
          - '.spec.template.metadata.annotations?["date/deploy-date"]'
          - '.spec.template.metadata.annotations?["reloader.stakater.com/last-reloaded-from"]'
          - '.spec.volumeClaimTemplates[] | select(.metadata) | .creationTimestamp'
          - '.spec.volumeClaimTemplates[] | select(.metadata) | .apiVersion'
          - '.spec.volumeClaimTemplates[] | select(.metadata) | .kind'
          - '.spec.selector | select(.matchLabels."app.kubernetes.io/name" | test("argocd-(server|repo-server|applicationset-controller)"))'
          - '.metadata.labels | select(.metadata.name | test("argocd-(server|repo-server|applicationset-controller)"))'
      resource.customizations.ignoreDifferences.apps_DaemonSet: |
        jqPathExpressions:
          - '.spec.template.metadata.annotations?["reloader.stakater.com/last-reloaded-from"]'

      # Local account for argocd-mcp (token auth only: apiKey = can mint API
      # tokens, cannot log in interactively). RBAC below; tokens minted
      # per-cluster out-of-band and stored in Bitwarden.
      accounts.mcp-bot: apiKey

    rbac:
      create: true
      policy.default: ""
      policy.csv: |
        g, Admin, role:admin
        # mcp-bot (argocd-mcp server): read + refresh + sync ONLY. Deliberately
        # no create/update/delete/override/action permissions — ArgoCD RBAC is
        # the backstop layer if the ToolHive Cedar/tool-filter layers ever fail.
        p, mcp-bot, applications, get, */*, allow
        p, mcp-bot, applications, sync, */*, allow
        p, mcp-bot, logs, get, */*, allow
        p, mcp-bot, projects, get, */*, allow
        p, mcp-bot, clusters, get, */*, allow
      scopes: "[groups]"

  dex:
    enabled: false
  notifications:
    enabled: false
  applicationSet:
    enabled: true

  controller:
    extraArgs:
      - --application-namespaces="*"
