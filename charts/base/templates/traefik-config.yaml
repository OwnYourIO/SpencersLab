# Pretty sure this just gets ignored when a custom Traefik chart is used instead.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - "--api"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=DEBUG"
      - "--serversTransport.insecureSkipVerify=true"
    dashboard: 
      enabled: true
    service:
      type: LoadBalancer
      spec:
        externalTrafficPolicy: Local
    ports:
      traefik:
        expose:
          default: true
        # Change from the default of 8080 to avoid conflict with SeaweedFS volumes.
        port: 9000
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
        proxyProtocol:
          trustedIPs: 
            {{- range .Values.trustedIPs }}
            - "{{ . }}"
            {{- end }}
        forwardedHeaders:
          trustedIPs:
            {{- range .Values.trustedIPs }}
            - "{{ . }}"
            {{- end }}
      websecure:
        proxyProtocol:
          trustedIPs: 
            {{- range .Values.trustedIPs }}
            - "{{ . }}"
            {{- end }}
        forwardedHeaders:
          trustedIPs:
            {{- range .Values.trustedIPs }}
            - "{{ . }}"
            {{- end }}
        transport:
          respondingTimeouts:
            readTimeout: 600s
            writeTimeout: 0
            idleTimeout: 600s
      {{- if index .Values "seaweedVolumePort" }}
      seaweedvolume:
        port: {{ index .Values "seaweedVolumePort" }}
        expose:
          default: true
        exposedPort: 8080
        protocol: TCP
      {{- end }}
      {{- if index .Values "gitSshPort" }}
      # The base chart is cluster-wide: the gitssh ServiceLB port, the
      # kubernetesGateway provider and the gateway: listeners must not
      # come up on a cluster without a forgejo git-SSH backend. No
      # entryPoints.gitssh: the chart derives entrypoints from ports.*;
      # the entryPoints: block in this file is chart-ignored.
      gitssh:
        port: {{ index .Values "gitSshPort" }}
        expose:
          default: true
        exposedPort: {{ index .Values "gitSshPort" }}
        protocol: TCP
      {{- end }}
    entryPoints:
      seaweedvolume:
        address: ":8080"
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
        allowExternalNameServices: true
      kubernetesIngress:
        allowEmptyServices: true
        allowExternalNameServices: true
      {{- if index .Values "gitSshPort" }}
      kubernetesGateway:
        enabled: true
        # traefik 3.7 only watches TCPRoute with the experimental channel on
        # (its client lists TCPRoute at v1alpha2); the matching tcproutes CRD
        # comes from the gateway-api-crds chart dependency (Chart.yaml),
        # which serves that version.
        experimentalChannel: true
      {{- end }}
    {{- if index .Values "gitSshPort" }}
    gateway:
      listeners:
        # The k3s chart ships a default web listener (port 8000) that would
        # put a second listener on the lab Gateway; the Gateway must carry
        # only gitssh, so the default is explicitly removed.
        web: null
        gitssh:
          port: {{ index .Values "gitSshPort" }}
          protocol: TCP
          # The TCPRoutes live in default (next to the forgejo Services)
          # while the Gateway lands in kube-system (with traefik), so the
          # listener must accept allowedRoutes from any namespace.
          namespacePolicy:
            from: All
    {{- end }}
