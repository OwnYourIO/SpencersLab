---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: "pg-{{ .Release.Name }}"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6-26
  primaryUpdateStrategy: unsupervised
  storage:
    size: 5Gi
    storageClass: local-path

  monitoring:
    enablePodMonitor: true

  postgresql:
    parameters:
      max_connections: "600"
      shared_buffers: 512MB

  managed:
    roles:
      # Read-only role for the postgres-<release> ToolHive MCP server.
      # pg_read_all_data = read everything, write nothing (PG14+ predefined role).
      # Password lives in Bitwarden (pg-<release>-mcp-secret ExternalSecret); the
      # LOGIN item's username must match this role name (readonly).
      - name: readonly
        ensure: present
        login: true
        inherit: true
        inRoles:
          - pg_read_all_data
        connectionLimit: 5
        passwordSecret:
          name: "pg-{{ .Release.Name }}-mcp-secret"

  bootstrap:
    initdb:
      database: rallly
      owner: rallly
      secret:
        name: "{{ .Release.Name }}-db"
