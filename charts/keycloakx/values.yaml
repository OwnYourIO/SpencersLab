bitwardenIds:
  keycloak: OVERRIDE_NEEDED
  keycloak-mqtt: OVERRIDE_NEEDED
  keycloak-pg: OVERRIDE_NEEDED
  # Read-only CNPG role credential for the postgres-keycloak ToolHive MCP server.
  mcp-pg-keycloak: OVERRIDE_NEEDED

domain: OVERRIDE_VIA_APPSET

keycloakx:
  image:  
    repository: quay.io/keycloak/keycloak
    tag: 26.7.2

  command:
    - "/opt/keycloak/bin/kc.sh"
    - "--verbose"
    - "start"

  # MQTT watchdog: the Keycloak MQTT event-listener client (paho) dies whenever the
  # Home Assistant MQTT broker restarts and never recovers (verified 2026-09-27:
  # 8 disconnects, 0 auto-recoveries, 1801 failed publishes, 3 weeks of silent
  # external-SSO lockout). A healthy client holds an ESTABLISHED TCP connection to
  # the broker; a wedged one holds none. This probe makes the kubelet restart the
  # container in that state — boot always reconnects cleanly (0 boot failures in
  # 30d of logs). Broker-unreachable passes, so HA outages don't crashloop us.
  # Broker: mqtt.spencerslab.com:1883 (matches KC_SPI_EVENTS_LISTENER_MQTT_SERVER_URI
  # in templates/secret-keycloak-admin.yaml) — if the broker host/port ever moves,
  # update the hex port (1883 = 0x075B) and hostname below.
  livenessProbe: |
    exec:
      command:
      - /bin/bash
      - -c
      - |
        # 1) Healthy = ESTABLISHED connection to the MQTT broker exists.
        #    1883 = 0x075B; st 01 = ESTABLISHED. Checked FIRST so the probe's own
        #    reachability test below can never self-match.
        #    Pure-bash parsing: the ubi9-micro Keycloak image lacks awk/grep/timeout.
        found=0
        for f in /proc/net/tcp /proc/net/tcp6; do
          [ -r "$f" ] || continue
          while read -r _ _ rem st _; do
            if [ "$st" = "01" ]; then
              case "$rem" in *:075B) found=1; break 2;; esac
            fi
          done < "$f"
        done
        [ "$found" = "1" ] && exit 0
        # 2) No socket. If the broker itself is unreachable, a restart can't help
        #    (and would crashloop during HA outages) — pass.
        #    Bounded to ~3s via bash busy-wait (timeout(1) not in image).
        ( exec 3<>/dev/tcp/mqtt.spencerslab.com/1883 ) 2>/dev/null &
        cp=$!
        s0=$SECONDS
        while kill -0 "$cp" 2>/dev/null; do
          [ $(( SECONDS - s0 )) -ge 3 ] && { kill "$cp" 2>/dev/null; break; }
        done
        wait "$cp" 2>/dev/null
        [ $? -ne 0 ] && exit 0
        # 3) Broker reachable but keycloak holds no connection — client is wedged.
        exit 1
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 2

  database:
    vendor: "postgres"
    hostname: "pg-keycloak-rw"
    port: "5432"
    database: "keycloak"
    user: "keycloak"
    existingSecret: "pg-keycloak-secret"
    existingSecretKey: "password"
  dbchecker:
    enabled: true

  http:
    relativePath: /
    internalPort: metrics

  proxy:
    enabled: true
    mode: xforwarded

  extraEnv: |-
    - name: TZ
      value: "America/Denver"
    - name: JAVA_OPTS_APPEND
      value: >-
        -Djava.awt.headless=true
        -Djgroups.dns.query=keycloak-headless
        -XX:+UseContainerSupport
    #- name: PROXY_ADDRESS_FORWARDING
    #  value: "true"
    - name: KC_HTTP_PORT
      value: "8080"
    - name: KC_HOSTNAME_STRICT
      value: "true"
    - name: KC_HOSTNAME_STRICT_HTTPS
      value: "true"
    - name: KC_LOG_LEVEL
      value: "org.keycloak.events:DEBUG,org.infinispan:INFO,org.jgroups:INFO"
  extraEnvFrom: |-
    - secretRef:
        name: keycloak-secret
    
  extraVolumes: |-
    - name: keycloak-data
      persistentVolumeClaim:
        claimName: keycloak
    - name: keycloak-providers
      persistentVolumeClaim:
        claimName: keycloak-providers
  # - name: customreg
  #   secret:
  #     secretName: {{ include "keycloak.fullname" . }}-customreg
  # - name: realm
  #   secret:
  #     secretName: {{ include "keycloak.fullname" . }}-realm
  # - name: plugin
  #   emptyDir: {}
  # - name: truststore
  #   secret:
  #     secretName: {{ include "keycloak.fullname" . }}-truststore
  # - name: custom-theme
  #   emptyDir: {}
  extraVolumeMounts: |-
    - name: keycloak-data
      mountPath: /opt/keycloak/data/
    - name: keycloak-providers
      mountPath: /opt/keycloak/providers/
    # Mounting at /data/ because that's where traefik reads it from. 
    # In this pod it might work elsewhere. Would have to update the SPI.

  metrics:
    enabled: true

  serviceMonitor:
    enabled: true
    port: metrics

  extraServiceMonitor:
    enabled: true  
    port: http
    path: /realms/master/metrics
