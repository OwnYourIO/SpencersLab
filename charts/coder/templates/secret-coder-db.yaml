apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-coder-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: pg-coder-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The dev DB items are shared across DBs, so the item's username
        # can't carry a per-DB role. CNPG initdb requires the username to
        # match the owner (templates/pg-coder.yaml) — hardcode it here.
        username: coder
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "coder-pg" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None