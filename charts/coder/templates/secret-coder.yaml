apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-secrets
spec:
  refreshInterval: 1h
  target:
    name: coder-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CODER_PG_CONNECTION_URL: "postgresql://coder:{{ `{{ .pg_password | urlquery }}` }}@pg-coder-rw:5432/coder"
        CODER_ACCESS_URL: "https://coder.{{ $.Values.subDomain }}.{{ $.Values.domain }}"
        CODER_WILDCARD_ACCESS_URL: "*-coder.{{ $.Values.subDomain }}.{{ $.Values.domain }}"
        # DSN user is hardcoded `coder` (initdb owner; the dev DB items are shared
        # across DBs so the item's username is not per-DB) — see
        # templates/secret-coder-db.yaml.
        CODER_OIDC_ISSUER_URL: "{{ `{{ .provider_url }}` }}"
        # Allowed OIDC email domains — from the OPTIONAL custom field
        # `oidcEmailDomain` on the SSO item (fetched whole via the
        # bitwarden-item store, extracted here). Field present → enforce the
        # listed domains (comma-separated; "*" allows anything). Field absent
        # → renders empty, which coderd treats as unset (any email the IdP
        # vouches for may log in) — so SSO items without the field keep
        # working. NOTE: external-secrets renders v2 templates with
        # missingkey=error, so every map access goes through `index`
        # (field syntax like $item.fields hard-errors on a missing key);
        # verified against the ES v2 engine for: no field, no `fields` key,
        # unnamed field, matched field without a value.
        CODER_OIDC_EMAIL_DOMAIN: '{{ `{{ $d := "" }}{{ $item := index . "coder-sso-secret" | fromJson }}{{ range index $item "fields" }}{{ if eq (index . "name") "oidcEmailDomain" }}{{ $d = index . "value" | default "" }}{{ end }}{{ end }}{{ $d }}` }}'
        CODER_OIDC_CLIENT_ID: "{{ `{{ .client_id }}` }}"
        CODER_OIDC_CLIENT_SECRET: "{{ `{{ .secret }}` }}"
        CODER_OIDC_SIGN_IN_TEXT: "Sign in"
        CODER_OIDC_ICON_URL: "https://gitlab.alexsaphir.com/-/pwa-icons/logo-512.png"
        CODER_OIDC_GROUP_AUTO_CREATE: "true"
        CODER_OIDC_EMAIL_FIELD: "email"
        CODER_OIDC_USERNAME_FIELD: "preferred_username"
        CODER_OIDC_SCOPES: "openid,profile,email"
        # No CODER_EMAIL_* on dev — smtp-relay is not deployed here (user
        # decision 2026-10-12). Re-add with a smtp-relay chart entry if
        # dev ever gets mail.
        # Per-user git identity: coderd brokers an OAuth consent against the
        # dev Forgejo (the dev coder's single community-license provider slot
        # pairs with git.scifi.farm). The ID is contractual, not cosmetic —
        # coderd serves the callback at /external-auth/<ID>/callback and the
        # forge-side OAuth app must whitelist that exact URI. TYPE=gitea
        # makes coderd's giteaDefaults() derive TOKEN_URL/VALIDATE_URL/REGEX
        # from the AUTH_URL host (v2.35.2 source), so setting them here would
        # only drift.
        CODER_EXTERNAL_AUTH_0_ID: "forgejo"
        CODER_EXTERNAL_AUTH_0_TYPE: "gitea"
        CODER_EXTERNAL_AUTH_0_DISPLAY_NAME: "Forgejo"
        CODER_EXTERNAL_AUTH_0_AUTH_URL: "https://git.scifi.farm/login/oauth/authorize"
        CODER_EXTERNAL_AUTH_0_CLIENT_ID: "{{ `{{ .ea_client_id }}` }}"
        CODER_EXTERNAL_AUTH_0_CLIENT_SECRET: "{{ `{{ .ea_secret }}` }}"
        # coderd keeps stored external tokens in plaintext in the database
        # unless this is set (v2.35.2 database-encryption doc). Value is
        # comma-separated base64 32-byte keys: the first encrypts, the rest
        # decrypt-only, so a rotated-out key still decrypts old tokens.
        CODER_EXTERNAL_TOKEN_ENCRYPTION_KEYS: "{{ `{{ .token_encryption_keys }}` }}"

  data:
    - secretKey: client_id
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "coder-sso-secret" }}'
        property: username
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: secret
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "coder-sso-secret" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: provider_url
      sourceRef:
        storeRef:
          name: bitwarden-uri
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "coder-sso-secret" }}'
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: coder-sso-secret
      sourceRef:
        storeRef:
          name: bitwarden-item
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "coder-sso-secret" }}'
        # Whole item as JSON (no property) — the template extracts the
        # OPTIONAL `oidcEmailDomain` custom field from it; the
        # bitwarden-fields store would hard-fail when the field is absent.
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: pg_password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "coder-pg" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # coder-external-auth — the Forgejo OAuth app registered for coderd
    # itself, not a user's personal app; do not repoint it at a login item.
    - secretKey: ea_client_id
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "coder-external-auth" }}'
        property: username
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ea_secret
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "coder-external-auth" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # coder-token-encryption — the base64 32-byte key; its generation
    # command is documented in custom-values/dev/prod-values.yaml.
    - secretKey: token_encryption_keys
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "coder-token-encryption" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
