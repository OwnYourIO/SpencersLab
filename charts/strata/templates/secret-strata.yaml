{{- /*
ExternalSecret for the engine API key: Bitwarden item `strata` (fields
store), custom field api_key — one dedicated item per concern per the repo
naming law, never a shared multi-consumer item. Guarded on
bitwardenIds.strata-api-key so a render without the operator's UUID (plan
human step 1 — the item may not exist yet) stays clean and the strata pod
alone strands on the missing secret (Q5 quarantine); the llama.cpp surface
is unaffected either way. The pod consumes the key only as
${env.STRATA_API_KEY} — never into the config ConfigMap.
*/ -}}
{{- if and .Values.bitwardenIds (index .Values.bitwardenIds "strata-api-key") }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: strata-api-key
  namespace: default
spec:
  refreshInterval: 1h
  target:
    name: strata-api-key
    creationPolicy: Owner
  data:
    - secretKey: api_key
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "strata-api-key" }}'
        property: api_key
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
