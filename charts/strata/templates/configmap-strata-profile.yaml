{{- /*
Renders config.engineProfile VERBATIM as the strata run-config JSON at
/profile/<name> — strata serve takes no tuning flags (RESEARCH §2), so the
on-target --plan fixups (C04 step 3) land as one values edit under
config.engineProfile, never as a template change. Key vocabulary is
upstream-owned (profiles.py, RESEARCH §2): helm's JSON writer only
reorders/escapes, it does not rename.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: strata-profile
  namespace: default
data:
  strata-iq3_s.json: |
    {{- .Values.config.engineProfile | toPrettyJson | nindent 4 }}
