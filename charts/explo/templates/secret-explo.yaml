# Explo runtime secrets rendered into a single `.env` file and mounted at
# /explo-secrets/.env (see values.yaml WEB_ENV_PATH). The upstream chart has no
# envFrom / secret-env support, so this is the injection path. Non-secret config
# lives in the plain env: map in values.yaml.
#
# Bitwarden items (all LOGIN, one per secret — custom-values/media maps UUIDs):
#   explo        = Explo web-UI login (username/password -> UI_USERNAME/PASSWORD).
#   listenbrainz = ListenBrainz username (user field) + token (password field).
#   lidarr       = Lidarr API key in the item's password field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: explo
spec:
  refreshInterval: 1h
  target:
    name: explo
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        .env: |
          UI_USERNAME="{{ `{{ .username }}` }}"
          UI_PASSWORD="{{ `{{ .password }}` }}"
          LISTENBRAINZ_USER="{{ `{{ .listenbrainz_user }}` }}"
          LISTENBRAINZ_USER_TOKEN="{{ `{{ .listenbrainz_token }}` }}"
          LIDARR_API_KEY="{{ `{{ .lidarr_api_key }}` }}"
  data:
    - secretKey: username
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "explo" }}'
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "explo" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # ListenBrainz creds come from their own item: username -> user, password -> token.
    - secretKey: listenbrainz_user
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "listenbrainz" }}'
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: listenbrainz_token
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "listenbrainz" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Lidarr API key lives in its own item's password field.
    - secretKey: lidarr_api_key
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "lidarr" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
