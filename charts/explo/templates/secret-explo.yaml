# Explo runtime secrets rendered into a single `.env` file and mounted at
# /explo-secrets/.env (see values.yaml WEB_ENV_PATH). The upstream chart has no
# envFrom / secret-env support, so this is the injection path. Non-secret config
# lives in the plain env: map in values.yaml.
#
# Bitwarden item `explo` (Login): username/password = Explo web-UI login;
# custom fields listenbrainz_user, listenbrainz_token, lidarr_api_key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: explo
spec:
  refreshInterval: 1h
  target:
    name: explo
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        .env: |
          UI_USERNAME="{{ `{{ .username }}` }}"
          UI_PASSWORD="{{ `{{ .password }}` }}"
          LISTENBRAINZ_USER="{{ `{{ .listenbrainz_user }}` }}"
          LISTENBRAINZ_USER_TOKEN="{{ `{{ .listenbrainz_token }}` }}"
          LIDARR_API_KEY="{{ `{{ .lidarr_api_key }}` }}"
  data:
    - secretKey: username
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "explo" }}'
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "explo" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: listenbrainz_user
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "explo" }}'
        property: listenbrainz_user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: listenbrainz_token
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "explo" }}'
        property: listenbrainz_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: lidarr_api_key
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "explo" }}'
        property: lidarr_api_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
