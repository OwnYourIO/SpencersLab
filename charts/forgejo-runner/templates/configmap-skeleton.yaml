# The release config skeleton (C17/D61/D62): rendered by the PARENT chart
# from .Values.configSkeleton (its tpl braces resolve against the parent
# values context — the top-level runner.url / runner.labels the services
# slices pin — which the app-template library's own render context cannot
# see; see the values.yaml comment above configSkeleton). The register init
# container substitutes the __RUNNER_UUID__ placeholder per pod and writes
# the result to /data/config/config.yaml on the ordinal's data PVC. This
# ConfigMap is the template source mounted at /skeleton, never the daemon's
# direct input — an unresolved placeholder would fail-fast at connection
# instead (see the init script). The body's own comments travel inside the
# string and land verbatim in the rendered ConfigMap (C03 byte-identity
# discipline, now ConfigMap-borne); keep them mode-neutral.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-runner-config
data:
  config.yaml: |
    {{- tpl .Values.configSkeleton . | nindent 4 }}
