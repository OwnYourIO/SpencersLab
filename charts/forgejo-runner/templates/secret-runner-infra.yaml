# Registration identity for the infra Forgejo Actions runner — Bitwarden
# item `dev-forgejo-runner-infra` (username = runner uuid, password =
# registration token), created only AFTER the infra instance boots (plan
# User action 7). NOT the `forgejo-token` item: that one is the Coder
# workspace access token and must never back a runner registration.
#
# Runner v13 registers declaratively: the daemon connects with
# server.connections.infra from the generated config.yaml and reads the
# token from file:$CREDENTIALS_DIRECTORY/token — no register CLI, no env
# vars. Only the uuid is dynamic (the item's username); everything else in
# the config is static by design except the connection url, which is a
# values key (runners.infra.url) so the service slice can pin it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: runner-infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: forgejo-runner-infra
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The config's token_url reads this file via $CREDENTIALS_DIRECTORY.
        token: "{{ `{{ .token }}` }}"
        config.yaml: |
          runner:
            capacity: 1
            # Explicit short bounds (not the 3h doc defaults) so an ArgoCD
            # sync never hangs on a terminating pod; in-flight jobs get
            # the 5m shutdown window.
            timeout: 30m
            shutdown_timeout: 5m
          cache:
            enabled: true
          container:
            privileged: false
          server:
            connections:
              infra:
                url: {{ index .Values "runners" "infra" "url" }}
                # Quoted: must stay a string before the uuid is substituted.
                uuid: "{{ `{{ .uuid }}` }}"
                token_url: file:$CREDENTIALS_DIRECTORY/token
                # Run 1's GitHub-parity act-image label set (ruling 3) —
                # only LTS-based act tags exist.
                labels:
                  - ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-24.04
                  - ubuntu-24.04:docker://ghcr.io/catthehacker/ubuntu:act-24.04
                  - ubuntu-22.04:docker://ghcr.io/catthehacker/ubuntu:act-22.04
                  - docker:docker://ghcr.io/catthehacker/ubuntu:act-24.04
                  - node22:docker://docker.io/library/node:22-bookworm
  data:
    - secretKey: uuid
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "forgejo-runner-infra-token" }}'
        property: username
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: token
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "forgejo-runner-infra-token" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
