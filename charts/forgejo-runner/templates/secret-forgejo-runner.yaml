# Registration identity for the Forgejo Actions runner — Bitwarden item
# `forgejo-runner` (username = runner uuid, password = registration token).
# NOT the `forgejo-token` item: that one is the Coder workspace access
# token and must never back a runner registration.
#
# Runner v13 registers declaratively: the daemon connects with
# server.connections.dev from the generated config.yaml and reads the token
# from file:$CREDENTIALS_DIRECTORY/token — no register CLI, no env vars.
# Only the uuid is dynamic (the item's username); everything else in the
# config is static by design (the chart is host-free, see values.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: forgejo-runner
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The config's token_url reads this file via $CREDENTIALS_DIRECTORY.
        token: "{{ `{{ .token }}` }}"
        config.yaml: |
          runner:
            capacity: 1
          cache:
            enabled: true
          container:
            privileged: false
          server:
            connections:
              dev:
                # In-cluster: the runner is a client of the dev instance,
                # no public ingress is involved.
                url: http://dev-forgejo-http.default.svc:3000
                # Quoted: must stay a string before the uuid is substituted.
                uuid: "{{ `{{ .uuid }}` }}"
                token_url: file:$CREDENTIALS_DIRECTORY/token
                labels:
                  - docker:docker://data.forgejo.org/oci/node:lts
                  - dev
  data:
    - secretKey: uuid
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "forgejo-runner-token" }}'
        property: username
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: token
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "forgejo-runner-token" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
