# Registration identity for this release's Forgejo Actions runner — the
# Bitwarden item set in custom-values/dev/prod-values.yaml under the app
# key (username = runner uuid, password = registration token). NOT the
# `forgejo-token` item: that one is the Coder workspace access token and
# must never back a runner registration.
#
# Runner v13 registers declaratively: the daemon connects with
# server.connections.default from the generated config.yaml and reads the
# token from file:$CREDENTIALS_DIRECTORY/token — no register CLI, no env
# vars. Only the uuid is dynamic (the item's username); everything else in
# the config is static by design except the connection url, which is a
# values key (runner.url) so the per-app slice can pin it.
#
# Named after the release (ExternalSecret + target Secret): the two
# releases share namespace `default`, so release-derived names are the
# only collision-free scheme.
{{- if eq .Values.runner.backend "host" }}
{{- /*
  C03 review r1 major-1 — null-out transport gate. Host releases delete the
  docker-only pod structure via nulls in the release slice, but those nulls
  ride inline valuesObject through ApplicationSet -> Application, and ArgoCD
  strips null values from inline sources before helm sees them
  (argo-cd#16312, still open upstream). A stripped slice falls back to the
  chart's docker defaults: backend: host (a plain string, survives) still
  renders a plausible host config.yaml while the PRIVILEGED DinD sidecar
  silently resurrects — direction-lock inversion invisible to every
  render-side test. So refuse to render host mode when any docker-only key
  still carries content after coalesce. Remedies for a release that trips
  this: ServerSideApply "true" on the host charts: entry (repo precedent
  zigbee2mqtt; note t5 of the dev fleet contract currently pins "false" —
  the test leg must be amended with the flip), or move the slice to an
  external values file (valueFiles), where nulls survive. Trims everywhere:
  a healthy render emits nothing here (byte-identity AC2).
*/}}
{{- $lost := list }}
{{- $at := default dict (index .Values "app-template") }}
{{- $runner := default dict (get (default dict (get $at "controllers")) "runner") }}
{{- $rc := default dict (get (default dict (get $runner "containers")) "runner") }}
{{- if get (default dict (get $runner "initContainers")) "dind" }}
{{- $lost = append $lost "controllers.runner.initContainers.dind" }}
{{- end }}
{{- if get (default dict (get $rc "env")) "DOCKER_HOST" }}
{{- $lost = append $lost "containers.runner.env.DOCKER_HOST" }}
{{- end }}
{{- if get (default dict (get $at "persistence")) "socket" }}
{{- $lost = append $lost "persistence.socket" }}
{{- end }}
{{- if $lost }}
{{- fail (printf "forgejo-runner host mode but docker-only structures survived the values merge (%s): the slice null-outs were lost in transit (ArgoCD strips nulls from inline valuesObject — argo-cd#16312), so the privileged DinD sidecar would silently resurrect under runner.backend=host. Remedy: ServerSideApply \"true\" on the host charts: entry, or move the slice to an external values file (see the gate comment in templates/secret-runner.yaml)." (join ", " $lost)) }}
{{- end }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: {{ .Release.Name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The config's token_url reads this file via $CREDENTIALS_DIRECTORY.
        token: "{{ `{{ .token }}` }}"
        config.yaml: |
          runner:
            capacity: 1
            # Explicit short bounds (not the 3h doc defaults) so an ArgoCD
            # sync never hangs on a terminating pod; in-flight jobs get
            # the 5m shutdown window.
            timeout: 30m
            shutdown_timeout: 5m
          cache:
            enabled: true
            {{- if eq .Values.runner.backend "host" }}
            # Host-backend cache dir on the release's /data PVC (the slice
            # sizes the data VCT for it; the daemon writes its caches here
            # so a pod restart re-attaches warm).
            dir: /data/cache
            {{- end }}
          {{- if eq .Values.runner.backend "host" }}
          # Host backend executes jobs directly in the runner container —
          # no container: block (docker-mode syntax), no privileged stand-in.
          host:
            # Workdir_parent on the /data PVC alongside the cache.
            workdir_parent: /data/workdir
          {{- else }}
          container:
            privileged: false
          {{- end }}
          server:
            connections:
              default:
                url: {{ index .Values "runner" "url" }}
                # Quoted: must stay a string before the uuid is substituted.
                uuid: "{{ `{{ .uuid }}` }}"
                token_url: file:$CREDENTIALS_DIRECTORY/token
                {{- if eq .Values.runner.backend "docker" }}
                # GitHub-parity act-image label set (ruling 3) —
                # only LTS-based act tags exist.
                {{- end }}
                labels:
                  {{- .Values.runner.labels | toYaml | nindent 18 }}
  data:
    - secretKey: uuid
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "runner-token" }}'
        property: username
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: token
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "runner-token" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
