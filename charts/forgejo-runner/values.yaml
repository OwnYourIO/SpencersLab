# Forgejo Actions runner — one registration per release.
#
# The dev ApplicationSet aliases this chart once per deployed Forgejo
# runner (each ArgoCD Application carries `chart: forgejo-runner`): today
# forgejo-runner-dev (docker backend, dev instance) and
# forgejo-runner-dev-host (host backend, same instance); the infra alias is
# un-wired pending the 2026-10-25 relocation. Each release runs exactly one
# pod, one headless Service and one ExternalSecret — every resource is named
# after the release, so releases coexist in namespace `default` without
# colliding.
#
# Two backends via `runner.backend` (C03, ticket 2026-10-cf-11-feat-immich-
# hugo-pipeline; docker is the default and the shape this file ships):
#   docker — the pod below: privileged DinD sidecar + runner container, the
#            5-label act image set, DOCKER_HOST at the in-pod socket.
#   host   — jobs run directly in the runner container (the toolchain image,
#            ghcr.io/ownyourio/forgejo-host-runner). Helm parses values.yaml
#            as plain YAML, so the toggle cannot gate this file's structure;
#            a host release's TOP-LEVEL SLICE nulls the docker-only keys at
#            higher precedence — initContainers.dind, the docker-data VCT
#            (the whole volumeClaimTemplates LIST is replaced by a `data`
#            entry sized for workdir/cache, see the dev-host slice in
#            services/dev/prod/values.yaml), persistence.socket, and
#            containers.runner.env.DOCKER_HOST — and overrides the image and
#            runner.labels. templates/secret-runner.yaml renders the
#            backend-appropriate config.yaml from runner.backend; keep its
#            file-level comments mode-neutral at all times — template
#            comments land verbatim in the rendered manifest, so editing
#            them breaks the docker-render byte-identity (C03 AC2).
#            TRANSPORT CAVEAT (card #88 inherits this): the null-outs ride
#            inline valuesObject through ApplicationSet -> Application, and
#            ArgoCD strips nulls from inline values (argo-cd#16312, open
#            upstream) — stripped nulls fall back to the docker defaults and
#            a privileged sidecar would resurrect silently, so
#            secret-runner.yaml FAILS the render when host mode finds any
#            docker-only key still carrying content. If a host release ever
#            trips that gate after a sync: set ServerSideApply "true" on the
#            host charts: entry (SSA is a repo precedent — zigbee2mqtt; but
#            t5 of the dev fleet contract pins "false", so the flip is a
#            test-contract amendment for agent-test, not a solo edit), or
#            route the slice through an external values file where nulls
#            survive. After any host-release sync, verify the generated
#            Application's valuesObject still carries the three null keys
#            and the pod has no dind container.
#            Registration itself is scope-AGNOSTIC (repo/org/instance): the
#            scope is where the OWNER creates the runner record in the target
#            Forgejo's Actions admin UI; the chart consumes exactly the
#            release's (uuid, token) Bitwarden item either way. Cross-runner
#            job hijacking is prevented by LABELS, not scope: labels are
#            instance-scoped, so each release must advertise a label set
#            disjoint from every other runner on that instance (the act set
#            here vs the host release's cf-host).
#
# Client-only: the runner dials out, so the chart is host-free — no
# ingress, no proxy entry, no domain references. The runner.url chart
# default keeps the chart renderable standalone; the per-app TOP-LEVEL
# slices in services/dev/prod/values.yaml pin the real targets (top-level
# placement is load-bearing — the appset merge only flows those to the
# release).
#
# Registration is declarative (runner v13 — the register CLI and env-var
# registration do not work): the daemon connects with its
# server.connections.default entry from the ExternalSecret-generated
# config.yaml and reads the token from file:$CREDENTIALS_DIRECTORY/token.
# The identity is the (uuid, token) pair in the release's Bitwarden item —
# the ExternalSecret re-renders it on every pod start, and the server
# matches the runner record by uuid, so a restart is a re-attach, not a
# re-registration (the daemon never writes a .runner file).
#
# k3s MTU warning: if a workflow dies during "checking out actions", first
# suspect forgejo/runner#1779 (runner >= 12.5 intermittently fails action
# clones on k3s — git-binary cloning, suspected overlay/MTU interaction).
# The failure class applies in host mode too (the clone is still git-binary).
# Mitigations: dind `--mtu 1450` dockerd flag or per-job `network: host`;
# full research in RESEARCH-dind-supplement.md.

bitwardenIds:
  # The Bitwarden item holding this release's (uuid, token) identity
  # (username = runner uuid, password = registration token); the real UUID
  # rides custom-values/dev/prod-values.yaml under the app key. NEVER the
  # `forgejo-token` item — that one is the Coder workspace access token.
  runner-token: OVERRIDE_VIA_CUSTOM_VALUES

# Connection URL: chart default so the chart renders standalone — it is a
# render-time stand-in, the per-app top-level slice pins the live target.
runner:
  url: http://dev-forgejo-http.default.svc:3000
  # Backend mode: docker (privileged DinD sidecar, the stock shape below)
  # or host (jobs execute in the runner container — see the header for the
  # slice-side null-out contract). Everything backend-conditional keys off
  # this value; the default must stay docker so pre-change releases render
  # unchanged.
  backend: docker
  # Advertised runner labels, rendered verbatim into config.yaml's
  # server.connections.default.labels. The docker default is the
  # GitHub-parity act-image set (ruling 3 of the per-instance ticket —
  # only LTS-based act tags exist); host releases override with their own
  # (labels are how jobs route, so a host runner must never carry act
  # labels it cannot execute).
  labels:
    - ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-24.04
    - ubuntu-24.04:docker://ghcr.io/catthehacker/ubuntu:act-24.04
    - ubuntu-22.04:docker://ghcr.io/catthehacker/ubuntu:act-22.04
    - docker:docker://ghcr.io/catthehacker/ubuntu:act-24.04
    - node22:docker://docker.io/library/node:22-bookworm

app-template:
  controllers:
    runner:
      # Single replica on purpose: one (uuid, token) pair must map to
      # exactly one pod. Scaling means more runner records, never more
      # replicas of one identity (decision B1).
      type: statefulset
      replicas: 1
      annotations:
        reloader.stakater.com/auto: "true"
      statefulset:
        # app-template 5.x VCTs are a LIST with singular accessMode/size.
        volumeClaimTemplates:
          # Config workdir and the act cache — the image sets HOME=/data,
          # so ~/.cache/actcache lands here. globalMounts: both containers
          # see it.
          - name: data
            accessMode: ReadWriteOnce
            size: 2Gi
            storageClass: local-path
            globalMounts:
              - path: /data
          # Docker image cache — without it every job re-pulls its images.
          # dind-only via advancedMounts (VCT advancedMounts are
          # {container: [mounts]}; the controller level is added by the
          # library): the runner talks to dockerd over the socket and never
          # needs the data root.
          - name: docker-data
            accessMode: ReadWriteOnce
            size: 10Gi
            storageClass: local-path
            advancedMounts:
              dind:
                - path: /var/lib/docker
      initContainers:
        # DinD as a sidecar (K8s 1.29+ restartPolicy semantics; dev is
        # k3s 1.36.5). Without `restartPolicy: Always` the pod dies when
        # dockerd exits. Privileged on purpose — the only deliberately
        # privileged container in the pod; jobs stay sandboxed
        # (container.privileged: false in the runner config).
        #
        # No storage-driver env: the node root-fs type is unverified —
        # dockerd ships overlay2 and degrades on its own; forcing vfs is a
        # replan, not a default.
        dind:
          image:
            repository: docker
            # Renovate's built-in helm-values manager tracks this pin
            # (dry-run verified 2026-10-23) — the extraction comes from
            # the manager, not from any per-line annotation.
            tag: 29.9.2-dind
          restartPolicy: Always
          securityContext:
            privileged: true
          probes:
            # The socket probe is what keeps the pod observable — dind
            # carries the liveness of the whole pod (see runner probes note).
            startup:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - test
                    - -S
                    - /var/run/docker.sock
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - test
                    - -S
                    - /var/run/docker.sock
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2
              memory: 4Gi
      containers:
        runner:
          image:
            repository: data.forgejo.org/forgejo/runner
            # Renovate's built-in helm-values manager tracks this pin
            # (dry-run verified 2026-10-23) — the extraction comes from
            # the manager, not from any per-line annotation.
            tag: 13.2.0
          # The image's ENTRYPOINT is dumb-init (zombie reaping) and K8s
          # `command` replaces the entrypoint — so it goes back in
          # explicitly.
          #
          # Deliberately no probes on this container: verified against the
          # v13.2.0 source (no --listen flag, no HTTP server anywhere in
          # the daemon), so there is no stable health endpoint to probe.
          # The dind sidecar's socket probes carry the pod's observable
          # liveness.
          command:
            - /usr/bin/dumb-init
            - /bin/forgejo-runner
            - daemon
            - -c
            - /data/config/config.yaml
          env:
            # Resolved by the runner for token_url: file:$CREDENTIALS_DIRECTORY/token
            CREDENTIALS_DIRECTORY: /run/secrets/forgejo-runner
            # In-pod socket (the `socket` emptyDir), not a node socket.
            DOCKER_HOST: unix:///var/run/docker.sock
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      pod:
        # Short and explicit on purpose (ruling 4): an ArgoCD sync must
        # never hang on a terminating pod — the 30m/5m runner timeouts in
        # the config bound the work, and in-flight jobs get the 5m
        # shutdown window.
        terminationGracePeriodSeconds: 300
        securityContext:
          # uid-1000 runner image vs node-owned fresh local-path VCT
          # volumes: without this the first-boot volume ownership can
          # mismatch and the runner fails on writes.
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch

  service:
    # Headless — a StatefulSet requires one for its per-ordinal DNS names.
    # The port is nominal: the daemon listens on nothing, the entry exists
    # only so the headless service has a record to serve.
    runner-headless:
      controller: runner
      clusterIP: None
      ports:
        api:
          port: 3000

  persistence:
    # In-pod docker socket: dind creates it, the runner dials it.
    socket:
      type: emptyDir
      globalMounts:
        - path: /var/run
    # The ExternalSecret-generated identity: whole secret at
    # CREDENTIALS_DIRECTORY (so `token` lands where token_url says) and
    # config.yaml subPath-mounted where the daemon's -c flag points.
    # subPath means the file does not hot-update — the reloader annotation
    # restarts the pod on secret changes.
    #
    # The library tpl's name for type: secret, so a static values entry
    # can still derive it from the release — each release's ExternalSecret
    # targets a Secret of exactly its release name.
    runner-creds:
      type: secret
      name: "{{ .Release.Name }}"
      globalMounts:
        - path: /run/secrets/forgejo-runner
        - path: /data/config/config.yaml
          subPath: config.yaml
