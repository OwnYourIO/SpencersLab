# Forgejo Actions runner — one registration token; every pod registers itself.
#
# The dev ApplicationSet aliases this chart once per deployed Forgejo
# runner (each ArgoCD Application carries `chart: forgejo-runner`): today
# forgejo-runner-dev (docker backend, dev instance); the infra alias is
# un-wired pending the 2026-10-25 relocation. Each release runs N pods (the
# slice's replicas; D61 supersedes the old one-pod-per-registration identity:
# ten pods, ten self-registered records named after the pods, one shared
# token), one headless Service, one ExternalSecret and one config-skeleton
# ConfigMap — every resource is named after the release, so releases coexist
# in namespace `default` without colliding.
#
# Two backends via `runner.backend` (C03, ticket 2026-10-cf-11-feat-immich-
# hugo-pipeline; docker is the default and the shape this file ships):
#   docker — the pod below: privileged DinD sidecar + runner container, the
#            5-label baked job-image set (four act-24.04-family labels on
#            git.spencerslab.com/curatedforest/forgejo-runner — the dev
#            release overrides the list with its own registry's refs in
#            its services slice, cf-6 run-1 2026-11-22; ubuntu-22.04
#            plain act), DOCKER_HOST at the in-pod socket, shared into
#            job containers via config container.docker_host (cf-6,
#            2026-11-21).
#   host   — jobs run directly in the runner container (the toolchain image,
#            ghcr.io/ownyourio/forgejo-host-runner). Helm parses values.yaml
#            as plain YAML, so the toggle cannot gate this file's structure;
#            a host release's TOP-LEVEL SLICE nulls the docker-only keys at
#            higher precedence — initContainers.dind, the docker-data VCT
#            (the whole volumeClaimTemplates LIST is replaced by a `data`
#            entry sized for workdir/cache — a host release is card #88's
#            gpu prod runner, or the separate-ask dev instance),
#            persistence.socket, and
#            containers.runner.env.DOCKER_HOST — and overrides the image and
#            runner.labels. templates/secret-runner.yaml's gate plus
#            templates/configmap-skeleton.yaml render the
#            backend-appropriate config.yaml from runner.backend; keep their
#            file-level comments mode-neutral at all times — template
#            comments land verbatim in the rendered manifests, so editing
#            them breaks the docker-render byte-identity (C03 AC2).
#            TRANSPORT CAVEAT (card #88 inherits this): the null-outs ride
#            inline valuesObject through ApplicationSet -> Application, and
#            ArgoCD strips nulls from inline values (argo-cd#16312, open
#            upstream) — stripped nulls fall back to the docker defaults and
#            a privileged sidecar would resurrect silently, so
#            secret-runner.yaml FAILS the render when host mode finds any
#            docker-only key still carrying content. If a host release ever
#            trips that gate after a sync: set ServerSideApply "true" on the
#            host charts: entry (SSA is a repo precedent — zigbee2mqtt; but
#            t5 of the dev fleet contract pins "false", so the flip is a
#            test-contract amendment for agent-test, not a solo edit), or
#            route the slice through an external values file where nulls
#            survive. After any host-release sync, verify the generated
#            Application's valuesObject still carries the three null keys
#            and the pod has no dind container.
#            Registration itself is scope-AGNOSTIC (repo/org/instance): the
#            scope is where the OWNER mints the registration token in the
#            target Forgejo's Actions admin UI; every pod of the release
#            registers against that one token either way. Cross-runner
#            job hijacking is prevented by LABELS, not scope: labels are
#            instance-scoped, so each release must advertise a label set
#            disjoint from every other runner on that instance (the act set
#            here vs the host release's cf-host).
#
# Client-only: the runner dials out, so the chart is host-free — no
# ingress, no proxy entry, no domain references. The runner.url chart
# default keeps the chart renderable standalone; the per-app TOP-LEVEL
# slices in services/dev/prod/values.yaml pin the real targets (top-level
# placement is load-bearing — the appset merge only flows those to the
# release).
#
# Registration is per-pod at first boot (D61; runner v13): the register init
# container POSTs the runner registration RPC with the shared registration
# token (in the request BODY — the endpoint is otherwise unauthenticated for
# Register only), receives its own uuid+token, and renders the
# configSkeleton ConfigMap onto its own /data PVC. The daemon is
# fully declarative from then on: server.connections.default from
# /data/config/config.yaml, token_url: file:/data/config/token (absolute) —
# no Secret mount, no credentials env. The v13 register CLI is deprecated
# (it works; upstream discourages it in favour of declarative config) and
# env-var identity does not exist. Because the identity file lives on the
# ordinal's retained PVC, a restart — including the reloader's Secret-change
# restart — is a RE-ATTACH, never a re-registration (the init guards on the
# file first).
#
# Stale-row runbook (D63): scale-down leaves the removed pods' rows in the
# admin list — the client has no deregistration call and
# cron.cleanup_offline_runners STAYS OFF (enabling it can delete a row under
# a live PVC; the ordinal would crash-loop until you cleared its
# /data/config/config.yaml, so recovery is owner-side, never automatic).
# Concurrent first boots are safe: each POST mints an independent record
# server-side.
#
# k3s MTU warning: if a workflow dies during "checking out actions", first
# suspect forgejo/runner#1779 (runner >= 12.5 intermittently fails action
# clones on k3s — git-binary cloning, suspected overlay/MTU interaction).
# The failure class applies in host mode too (the clone is still git-binary).
# Mitigations: the dind `--mtu=1450` dockerd flag is APPLIED since
# 2026-11-23 (run -3, ticket cf-6-feat-builder-bootstrap-3) in the dind
# args below, where lane dispatch #215's build-time curl TLS exit 35 had
# recurred the class on this host; per-job `network: host` stays the
# alternative it is for host-mode jobs (no dind daemon to cap there).
# Run -4 (2026-11-23, cf-6-feat-builder-bootstrap-4) moved the bake's tool
# acquisition off get.helm.sh — the fetch this cap was re-armed to survive —
# so the flag stays applied as the clone-path hardening described above, and
# no image build depends on it.
# Full research in RESEARCH-dind-supplement.md.

bitwardenIds:
  # The Bitwarden item whose login PASSWORD holds this instance's reusable
  # registration token (one token for the whole release; owner-minted at
  # Admin -> Actions -> Runners, UA-R6-3 — D61). The username field's old
  # record-identity content is no longer fetched: identities are minted per
  # pod at first boot and live on the pods' PVCs, not in the vault. The real
  # item UUID rides custom-values/dev/prod-values.yaml under the app key and
  # the ExternalSecret fetches by that ID: similarly-named vault items are
  # invisible to the cluster. NEVER the `forgejo-token` item — that one is
  # the Coder workspace access token. An empty password makes every pod's
  # register init fail loudly on first boot (no silent crash-loop; the
  # daemon-side empty-identity fail-fast class retires with the mount).
  runner-token: OVERRIDE_VIA_CUSTOM_VALUES

# Connection URL: chart default so the chart renders standalone — it is a
# render-time stand-in, the per-app top-level slice pins the live target.
runner:
  url: http://dev-forgejo-http.default.svc:3000
  # Backend mode: docker (privileged DinD sidecar, the stock shape below)
  # or host (jobs execute in the runner container — see the header for the
  # slice-side null-out contract). Everything backend-conditional keys off
  # this value; the default must stay docker so pre-change releases render
  # unchanged.
  backend: docker
  # Advertised runner labels, rendered verbatim into config.yaml's
  # server.connections.default.labels. The docker default is the baked
  # job-image set (cf-55 D39/D40), re-pointed to the instance registries
  # by the family-B per-release ruling (cf-6-debug-forge-runner-docker-1,
  # 2026-11-22): the four act-24.04-family labels (ubuntu-latest,
  # ubuntu-24.04, docker, node22) name
  # git.spencerslab.com/curatedforest/forgejo-runner — the repo-built
  # image (containers/forgejo-runner: helm and cr baked over the
  # act-24.04 base) on the INFRA instance registry, which the gpu
  # release rides as the default. The pull is done by the in-pod dind
  # daemon with no credentials, so these refs only work while the
  # package is anonymously readable. The dev release overrides the
  # whole list in its services slice to pull the same build from its
  # own registry (git.scifi.farm) — a runner never cross-pulls another
  # instance's copy. ubuntu-22.04 stays a plain act tag in every set
  # (no job requests it, and a 24.04-content image behind a 22.04
  # label would lie about its OS). The 26.11.1 is bootstrap
  # provenance: owner-built and pushed to BOTH registries by hand
  # 2026-11-22, not minted by the containers-build pipeline. The pins
  # are immutable calendar tags and no renovate manager reads these
  # lines or the dev slice's — and the dev ROLE's builds never mint
  # calendar tags, so that registry's copy is bootstrap-only — a bump
  # is therefore manual across BOTH pin sites AND BOTH registries:
  # push the new tag to git.spencerslab.com and git.scifi.farm, then
  # move the chart default and the dev slice together; a site or
  # registry left behind rides its old immutable tag forever,
  # silently. Rolling refs are forbidden here (":main"/":latest"
  # included) — these runners never re-pull a tag they have cached, so
  # a floating pin would freeze silently at first-pull content, while
  # a wrong calendar pin fails loudly as a pull error.
  # Host releases override with their own labels (labels are how jobs
  # route, so a host runner must never carry act labels it cannot
  # execute).
  labels:
    - ubuntu-latest:docker://git.spencerslab.com/curatedforest/forgejo-runner:26.11.1
    - ubuntu-24.04:docker://git.spencerslab.com/curatedforest/forgejo-runner:26.11.1
    - ubuntu-22.04:docker://ghcr.io/catthehacker/ubuntu:act-22.04
    - docker:docker://git.spencerslab.com/curatedforest/forgejo-runner:26.11.1
    - node22:docker://git.spencerslab.com/curatedforest/forgejo-runner:26.11.1

# The config skeleton (C17/D61/D62) as a template string, rendered by
# templates/configmap-skeleton.yaml into the release-named ConfigMap. The
# home is parent values, NOT app-template's configMaps key, by necessity
# not taste: the library tpl's every container and configMap string against
# the SUBCHART values context (common _env.tpl / _configmap.tpl rootContext
# = the app-template: subtree + global), where this chart's top-level
# runner.url / runner.labels — the slice-pinned values the t3/t5/t17 render
# legs prove must flow — are invisible. The parent renders this body
# instead, so one source feeds both the ConfigMap and the register init's
# /skeleton re-attach read. The body's comments land verbatim in the
# rendered ConfigMap (C03 byte-identity discipline, ConfigMap-borne).
configSkeleton: |-
  runner:
    capacity: 1
    # Explicit short bounds (not the 3h doc defaults) so an ArgoCD
    # sync never hangs on a terminating pod; in-flight jobs get
    # the 5m shutdown window.
    timeout: 30m
    shutdown_timeout: 5m
  cache:
    enabled: true
    {{- if eq .Values.runner.backend "host" }}
    # Host-backend cache dir on the release's /data PVC (the slice
    # sizes the data VCT for it; the daemon writes its caches here
    # so a pod restart re-attaches warm).
    dir: /data/cache
    {{- end }}
  {{- if eq .Values.runner.backend "host" }}
  # Host backend executes jobs directly in the runner container —
  # no container: block (docker-mode syntax), no privileged stand-in.
  host:
    # Workdir_parent on the /data PVC alongside the cache.
    workdir_parent: /data/workdir
  {{- else }}
  container:
    privileged: false
    # Share the pod-local dind socket with job containers — the
    # v13.2.0 default "-" would mount nothing and the job's docker
    # build would die dialing a missing file. cf-97 wired only the
    # runner side; the mount, not a client env, was the missing
    # half. cf-6-debug-forge-runner-docker, 2026-11-21.
    docker_host: unix:///var/run/docker.sock
  {{- end }}
  server:
    connections:
      default:
        url: {{ .Values.runner.url }}
        # Substituted per pod by the register init on first boot
        # (D61: the server mints the identity; the vault holds only
        # the reusable registration token).
        uuid: __RUNNER_UUID__
        # Absolute path on the data PVC — the token file the init
        # writes beside the config; no Secret mount or credentials
        # env anywhere on the daemon (retired with C17).
        token_url: file:/data/config/token
        # The job-image label set (cf-55 D39/D40; per-release
        # instance-registry re-point, family B,
        # cf-6-debug-forge-runner-docker-1, 2026-11-22): every row
        # this release registers advertises the IDENTICAL set (D62 —
        # one url, one labels payload, jobs route uniformly across
        # the rows). The four act-24.04-family labels resolve to the
        # repo-built baked job image (containers/forgejo-runner): by
        # chart default git.spencerslab.com/curatedforest/forgejo-runner,
        # which the gpu release rides, and the dev release overrides
        # the list in its services slice to
        # git.scifi.farm/curatedforest/forgejo-runner — each runner
        # pulls from its own instance registry. The base is
        # digest-pinned upstream: git-lfs is inherited from the base's
        # act.sh-installed binary, and helm and cr are baked into the
        # image. Verify the toolchain in a job — `git lfs version`,
        # `helm version`, `cr --version` — never from the tag alone.
        # The ubuntu-22.04 label keeps the plain upstream act-22.04,
        # whose git-lfs comes from the upstream installer pin, not
        # from the tag. Label pins are calendar tags bumped manually
        # on BOTH registries and BOTH pin sites (chart default + dev
        # services slice) — no renovate manager reads these lines and
        # the dev registry never self-mints a calendar tag. node22
        # names a job slot, not a Node-22 guarantee: the baked base
        # ships Node 20/24 as built today. The daemon image carries
        # no git-lfs and needs none — the LFS filter only runs in job
        # checkouts (the daemon's own git use is cloning action
        # definitions). A job clones over HTTPS to the instance's
        # ROOT_URL, so its LFS fetch is served by the instance — an
        # LFS checkout works only while the instance serves an [lfs]
        # store, and a job failing that way reads as a runner bug.
        labels:
          {{- .Values.runner.labels | toYaml | nindent 8 }}

app-template:
  controllers:
    runner:
      # Decision B1's identity half ("one (uuid, token) registration shared
      # by the pods") is SUPERSEDED by D61 (C17): one registration token,
      # per-pod self-registration, one record per pod. B1-as-amended (D57)
      # still holds for sizing: the DEFAULT stays one pod until a services
      # slice rules otherwise, and the slice scale-out is now ten honest
      # rows, not ten pollers on one identity. Job-count autoscaling stays
      # OUT (Inbox card iaJq5bgWHHDHotcBY owns that dimension).
      type: statefulset
      replicas: 1
      annotations:
        reloader.stakater.com/auto: "true"
      statefulset:
        # C17/D62 belt: manage ordinals independently — under the
        # OrderedReady default one unschedulable pod (node CPU full —
        # EXPLORE Round-6 A1 froze gpu at 3/10) blocks every ordinal behind
        # it from ever being created, let alone registering. Parallel lets
        # each pod the scheduler places come up and self-register alone.
        podManagementPolicy: Parallel
        # app-template 5.x VCTs are a LIST with singular accessMode/size.
        volumeClaimTemplates:
          # Config workdir and the act cache — the image sets HOME=/data,
          # so ~/.cache/actcache lands here. globalMounts: both containers
          # see it.
          - name: data
            accessMode: ReadWriteOnce
            size: 2Gi
            storageClass: local-path
            globalMounts:
              - path: /data
          # Docker image cache — without it every job re-pulls its images.
          # dind-only via advancedMounts (VCT advancedMounts are
          # {container: [mounts]}; the controller level is added by the
          # library): the runner talks to dockerd over the socket and never
          # needs the data root.
          - name: docker-data
            accessMode: ReadWriteOnce
            size: 10Gi
            storageClass: local-path
            advancedMounts:
              dind:
                - path: /var/lib/docker
      initContainers:
        # DinD as a sidecar (K8s 1.29+ restartPolicy semantics; dev is
        # k3s 1.36.5). Without `restartPolicy: Always` the pod dies when
        # dockerd exits. Privileged on purpose — the only deliberately
        # privileged container in the pod; jobs stay sandboxed
        # (container.privileged: false in the runner config) but hold the
        # pod-local daemon through the shared socket — unprivileged is not
        # the same as unreachable (cf-6; the cf-97 trust boundary).
        #
        # No storage-driver env: the node root-fs type is unverified —
        # dockerd ships overlay2 and degrades on its own; forcing vfs is a
        # replan, not a default.
        dind:
          # D33 egress hardening (2026-11-23, run -3, ticket
          # cf-6-feat-builder-bootstrap-3): lane dispatch #215 died building
          # through this daemon with curl TLS exit 35 to get.helm.sh, and the
          # overlay/MTU class of the header note above was the candidate
          # fault. Run -4 (2026-11-23, cf-6-feat-builder-bootstrap-4) removed
          # that fetch — the bake's tools now arrive by digest-pinned COPY
          # --from — so this cap guards the job paths that still cross the
          # daemon, not an image build. The cap is a dockerd flag, not a
          # container command: the dind image entrypoint ships no Cmd, so
          # args here are dockerd's and the socket/probe contract stays
          # byte-untouched. Owner ruling lands it on both releases (they
          # share this chart).
          args:
            - --mtu=1450
          image:
            repository: docker
            # Renovate's built-in helm-values manager tracks this pin
            # (dry-run verified 2026-10-23) — the extraction comes from
            # the manager, not from any per-line annotation.
            tag: 29.9.2-dind
          restartPolicy: Always
          securityContext:
            privileged: true
          probes:
            # The socket probe is what keeps the pod observable — dind
            # carries the liveness of the whole pod (see runner probes note).
            startup:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - test
                    - -S
                    - /var/run/docker.sock
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - test
                    - -S
                    - /var/run/docker.sock
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2
              memory: 4Gi
        # C17/D61: per-pod self-registration on FIRST boot (D62 A'). The
        # G1 source facts this script encodes (v15.0.10 @ 17e1001d,
        # routers/api/actions/runner/{runner,interceptor}.go): the
        # RunnerService Register RPC takes the registration token IN THE
        # BODY (the interceptor exempts only Register from the uuid/token
        # header auth), the server mints the uuid, the token stays active
        # across N registers (reusable), and nothing expires it. The admin
        # REST twin POST /api/v1/admin/actions/runners needs a site-admin
        # API token instead — not a vault-shareable runner credential —
        # so it documents why the RPC path below is the one.
        register:
          # Same image as the daemon (G2: busybox sh + wget + ssl_client +
          # CA bundle verified from the 13.2.0 layer listing) — one pinned
          # ref, one bump site, no extra pull surface; node-CRI anonymous
          # pull. Renovate's helm-values manager tracks the pair below.
          image: &runner-image
            repository: data.forgejo.org/forgejo/runner
            tag: 13.2.0
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              # Guard FIRST (D62 restart discipline): identity exists on this
              # ordinal's PVC from the first successful boot — a container
              # restart (reloader Secret-change included) must NOT re-POST.
              [ -f /data/config/config.yaml ] && exit 0
              # Minting endpoint (G1, v15.0.10 @ 17e1001d): the shared
              # registration token authenticates ONLY the runner-service
              # Register RPC — the interceptor exempts Register from the
              # uuid/token header auth and the token stays active after
              # each use. The site-admin REST twin,
              # /api/v1/admin/actions/runners, wants a full admin API
              # token — never a vault-shareable runner credential — so
              # the RPC below is the channel.
              # The registration target IS the mounted skeleton's url —
              # the same runner.url the daemon will dial (one source of
              # truth; app-template container env renders against the
              # SUBCHART values context where runner.url does not exist,
              # so the file, not an env, carries it).
              url=$(sed -n 's/^[[:space:]]*url:[[:space:]]*\([^[:space:]]*\).*/\1/p' /skeleton/config.yaml | head -n1)
              api="${url}/api/actions/forgejo.actions.runner.v1.RunnerService/Register"
              # The release's exact label set, likewise read from the
              # mounted skeleton (configmap-skeleton.yaml) so one source
              # feeds both the POST and the config.
              labels=$(sed -n 's/^ *- \([^ ]*\)$/"\1",/p' /skeleton/config.yaml | sed 's/,$//')
              reply=$(wget -q -O - --header 'Content-Type: application/json' \
                --post-data "{\"name\":\"${POD_NAME}\",\"token\":\"${RUNNER_REGISTRATION_TOKEN}\",\"ephemeral\":false,\"version\":\"v13.2.0\",\"labels\":[${labels}]}" \
                "$api") || { echo "register: POST to ${api} failed" >&2; exit 1; }
              uuid=$(printf '%s' "$reply" | sed -n 's/.*"uuid"[ ]*:[ ]*"\([^"]*\)".*/\1/p')
              token=$(printf '%s' "$reply" | sed -n 's/.*"token"[ ]*:[ ]*"\([^"]*\)".*/\1/p')
              if [ -z "$uuid" ] || [ -z "$token" ]; then
                echo "register: response carried no uuid/token: $reply" >&2
                exit 1
              fi
              mkdir -p /data/config
              sed "s/__RUNNER_UUID__/${uuid}/" /skeleton/config.yaml > /data/config/config.yaml
              printf '%s' "$token" > /data/config/token
              chmod 0600 /data/config/token
          env:
            # The record name IS the pod name (official k8s example shape,
            # RESEARCH [S11]) — downward API, never ordinal math.
            POD_NAME:
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # No RUNNER_URL env by chart law, not by oversight: app-template
            # container env values tpl against the SUBCHART values context
            # (common _env.tpl rootContext = app-template), where the parent
            # chart's top-level runner.url — the slice-pinned, t3/t17-flowed
            # value — is invisible (helm renders it empty/errors). The URL
            # reaches the POST through the mounted skeleton instead: one
            # source, resolved at boot, exactly the value the daemon dials.
            RUNNER_REGISTRATION_TOKEN:
              valueFrom:
                secretKeyRef:
                  name: '{{ .Release.Name }}'
                  key: registration-token
      containers:
        runner:
          # The register init references this same mapping (YAML anchor) —
          # one pin, one bump site (G2: its sh/wget/TLS tooling is the point).
          # The daemon image is the register init's anchor above — one pin
          # site for Renovate's helm-values manager (dry-run verified
          # 2026-10-23; the extraction follows the literal pair, not any
          # per-line annotation).
          image: *runner-image
          # The image's ENTRYPOINT is dumb-init (zombie reaping) and K8s
          # `command` replaces the entrypoint — so it goes back in
          # explicitly.
          #
          # Deliberately no probes on this container: verified against the
          # v13.2.0 source (no --listen flag, no HTTP server anywhere in
          # the daemon), so there is no stable health endpoint to probe.
          # The dind sidecar's socket probes carry the pod's observable
          # liveness.
          command:
            - /usr/bin/dumb-init
            - /bin/forgejo-runner
            - daemon
            - -c
            - /data/config/config.yaml
          env:
            # In-pod socket (the `socket` emptyDir), not a node socket. The
            # old credentials-dir env retired with C17: config and token are
            # PVC files produced by the register init, not Secret projections.
            DOCKER_HOST: unix:///var/run/docker.sock
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            # The pinned forgejo/runner image's config declares
            # User: "1000:1000", but the image ships no /etc/passwd entry
            # for uid 1000, so containerd resolves a bare runAsUser with
            # primary group 0 — runAsGroup carries the gid the blob
            # intends. Identity stays on this container alone on purpose:
            # a pod-level runAsUser would apply to dind too, kubelet's
            # FsUserFrom would then resolve an fs user, and the 12 GiB of
            # VCT volumes (including /var/lib/docker) would be recursively
            # re-chowned at apply. Fallback and hazard audit:
            # .agents/plans/2026/2026-11-cf-97-bug-forgejo-runner/DECISIONS.md
            # (final whole-plan review, 2026-11-02).
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
      pod:
        # Short and explicit on purpose (ruling 4): an ArgoCD sync must
        # never hang on a terminating pod — the 30m/5m runner timeouts in
        # the config bound the work, and in-flight jobs get the 5m
        # shutdown window.
        terminationGracePeriodSeconds: 300
        securityContext:
          # uid-1000 runner image vs node-owned fresh local-path VCT
          # volumes: without this the first-boot volume ownership can
          # mismatch and the runner fails on writes.
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          # The runner must hold the group that owns the docker socket.
          # dockerd serves /var/run/docker.sock root:docker 0660 (moby's
          # default socket group is `docker`). The pinned docker:29.9.2-dind
          # pre-adds that group at fixed gid 2375 — its base docker:29-cli
          # Dockerfile runs `addgroup -g 2375 -S docker` — not the blog-era
          # 999; a future dind pin bump must re-check this gid against the
          # new image's Dockerfile. fsGroup cannot cover the socket: it
          # chowns the volume at mount, while dockerd creates the file
          # afterwards under its own group. The daemon control this grants
          # is pod-local and already implied by DOCKER_HOST — driving this
          # sidecar is the runner's job. Ruling and full gid audit:
          # .agents/plans/2026/2026-11-cf-97-bug-forgejo-runner/DECISIONS.md
          # (2026-11-02).
          supplementalGroups:
            - 2375

  service:
    # Headless — a StatefulSet requires one for its per-ordinal DNS names.
    # The port is nominal: the daemon listens on nothing, the entry exists
    # only so the headless service has a record to serve.
    runner-headless:
      controller: runner
      clusterIP: None
      ports:
        api:
          port: 3000

  persistence:
    # In-pod docker socket: dind creates it, the runner dials it.
    socket:
      type: emptyDir
      globalMounts:
        - path: /var/run
    # C17: the release Secret is consumed by the register init through a
    # secretKeyRef ENV only — no container mounts it. The old runner-creds
    # whole-Secret mount (+ its config.yaml subPath, which would shadow the
    # PVC-rendered config) retires with the vault-held identity pair (D61).
    runner-skeleton:
      # The config template the register init reads, substitutes the
      # __RUNNER_UUID__ placeholder in, and writes to the PVC. Mounted
      # read-only into the init container only. Named by release (the
      # chart-level template renders it — the dynamic keys come from the
      # parent values, invisible to an app-template configMaps tpl).
      type: configMap
      name: "{{ .Release.Name }}-runner-config"
      advancedMounts:
        runner:
          register:
            - path: /skeleton
              readOnly: true
