# Consumed by the chart-owned templates/ (parent values context); the
# app-template: subtree below is the subchart's own values and cannot see
# these top-level keys.
bitwardenIds:
  argocd-hook-secret: OVERRIDE_VIA_CUSTOM_VALUES
  argocd-hook-tokens: OVERRIDE_VIA_CUSTOM_VALUES

# Injected as a top-level helm parameter by charts/base/templates/appset-charts.yaml
# at deploy time; the ConfigMap template builds cluster URLs from it because
# domain never reaches the subchart's tpl context.
domain: OVERRIDE_VIA_APPSET

# cf-139 OQ7 ruling: the relay's ref accept-list is config, not code. Shipped
# set is the only branch revision the fleet's appset sources resolve to
# (prod-stage roots track main); widening for a future non-prod stage cluster
# is one values edit here.
allowedRefs:
  - refs/heads/main

# The git origin every root app tracks; the relay matches live apps'
# spec.source.repoURL against it during the child pass. A public stable URL,
# deliberately not a cluster-domain literal.
trackedRepo: https://github.com/OwnYourIO/SpencersLab.git

# Fan-out roster = the 11 fleet root apps (backups/personal have no root
# app). tokenKey doubles as the flat secret filename the relay
# reads per target; proxy-local is the hub that hosts the relay and must be
# the exactly-one local: true entry - the relay syncs it last because that
# sync re-renders the hub and can restart the relay mid-fan-out.
targetCategories:
  - dev
  - gpu
  - gpu-ai
  - grow
  - home
  - infra
  - media
  - monitoring
  - proxy-local
  - proxy-backup
  - proxy-remote

app-template:
  defaultPodOptions:
    securityContext:
      # Matches the pinned nonroot uid/gid baked into
      # containers/argocd-hook/Dockerfile.
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault

  controllers:
    relay:
      pod:
        annotations:
          # Token rotation lands in the mounted secret files; the relay reads
          # secrets only at startup, so the pod must restart on change.
          reloader.stakater.com/auto: "true"
      containers:
        main:
          image:
            repository: ghcr.io/ownyourio/argocd-hook
            # No published :yy.mm.N calendar tag exists for this brand-new
            # in-repo container yet (first prod-role Forgejo build lands
            # post-merge). Replace with the calendar pin as soon as one is
            # published — helm-chart-creation "Image tag pinning" rule 2;
            # Always because the :main tag is mutable.
            tag: main
            pullPolicy: Always
          # The ENTRYPOINT is python3 /app/main.py, so these are plain CLI
          # args; both paths are the relay's file contract (see README).
          args:
            - --config
            - /config/targets.json
            - --secrets-dir
            - /secrets
          env:
            # Relay tunables, chart-wired so they stay settable per cluster
            # without an image rebuild. Values mirror the relay's own
            # defaults (containers/argocd-hook/README.md).
            SETTLE_SECONDS: "10"
            TARGET_TIMEOUT_SECONDS: "60"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 140Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

  service:
    relay:
      controller: relay
      ports:
        http:
          port: 8080

  persistence:
    targets:
      type: configMap
      # Not a library configMaps entry: the chart-owned template in
      # templates/configmap-targets.yaml, named after the release.
      name: '{{ .Release.Name }}-targets'
      globalMounts:
        - path: /config
    secrets:
      # One flat-file directory from two Bitwarden concerns: projected merges
      # the HMAC item and the per-category token item into /secrets, matching
      # the relay's --secrets-dir file names exactly.
      type: custom
      volumeSpec:
        projected:
          sources:
            - secret:
                name: argocd-hook
            - secret:
                name: argocd-hook-tokens
      globalMounts:
        - path: /secrets
