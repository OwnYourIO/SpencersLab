{{- /*
Shared GitHub<->fleet HMAC key (cf-139 OQ2 ruling: one key for the whole
fleet). Stored as the password of the `argocd-hook` Bitwarden login item; the
secretKey is the flat filename the relay reads from --secrets-dir, so no
target.template rename block here - keys land verbatim.
*/ -}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-hook
spec:
  refreshInterval: 1h
  target:
    name: argocd-hook
    creationPolicy: Owner
  data:
    - secretKey: github-webhook
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "argocd-hook-secret" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
