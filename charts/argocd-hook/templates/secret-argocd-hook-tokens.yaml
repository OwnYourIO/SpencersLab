{{- /*
Per-cluster mcp-bot API tokens, one custom field per fleet category in the
`argocd-hook-tokens` Bitwarden item (freshly minted for the relay rather than
shared with the argocd-mcp server tokens - rotation isolation, DECISIONS
2026-11-17). Field name == category == secretKey == the flat filename the
relay resolves from a target's tokenKey.
*/ -}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-hook-tokens
spec:
  refreshInterval: 1h
  target:
    name: argocd-hook-tokens
    creationPolicy: Owner
  data:
    {{- range $cat := .Values.targetCategories }}
    - secretKey: {{ $cat }}
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: SecretStore
      remoteRef:
        key: '{{ index $.Values "bitwardenIds" "argocd-hook-tokens" }}'
        property: {{ $cat }}
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
