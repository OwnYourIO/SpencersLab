{{- /*
The relay's --config file (contract: containers/argocd-hook/README.md).

Rendered here rather than via the library's configMaps: key because cluster
URLs need the top-level `domain` value, and the subchart tpl context cannot
see parent values (helm-chart-creation "app-template subcharts cannot see
top-level values"). Each target's host is its clusterHosts full host when
one is mapped, else the derived mesh-route form cluster.<cat>.<domain>.
Both shapes name argocd-server routes the clusters already expose, reached
over mesh DNS - no cluster gains a new public surface.
*/ -}}
{{- $targets := list -}}
{{- range $cat := .Values.targetCategories -}}
  {{- $host := get $.Values.clusterHosts $cat | default (printf "cluster.%s.%s" $cat $.Values.domain) -}}
  {{- $entry := dict
        "name" $cat
        "url" (printf "https://%s" $host)
        "rootApp" $cat
        "tokenKey" $cat
        "repo" $.Values.trackedRepo
  -}}
  {{- if eq $cat "proxy-local" -}}
    {{- $_ := set $entry "local" true -}}
  {{- end -}}
  {{- $targets = append $targets $entry -}}
{{- end -}}
{{- $config := dict "allowed_refs" .Values.allowedRefs "targets" $targets -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-targets
data:
  targets.json: {{ $config | toJson | quote }}
