apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spotdl
  namespace: default
  annotations:
    # .spotdl sync file + cache — keep the data even if the ArgoCD
    # Application is pruned.
    argocd.argoproj.io/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
