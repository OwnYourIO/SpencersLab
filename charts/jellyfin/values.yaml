# No bitwardenIds: Jellyfin keeps its own user database on the config PVC —
# nothing lives in a Kubernetes secret.

domain: OVERRIDE_VIA_APPSET

global:
  nameOverride: jellyfin

app-template:
  controllers:
    jellyfin:
      pod:
        #nodeSelector:
        #  intel.feature.node.kubernetes.io/gpu: "true"
        securityContext:
          runAsNonRoot: true
          runAsUser: 568
          # Using gid 1000 as "shared" group.
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile: { type: RuntimeDefault }
          supplementalGroups:
            - 44 # video
            - 109 # render
            - 568
      containers:
        app:
          image:
            repository: jellyfin/jellyfin
            tag: 10.11.6@sha256:333b647716631443a43c7fabac4b0c46b4e2f036bad19547e00958f10f721b85
          env:
            # JELLYFIN_PublishedServerUrl is set per-service (it's the public
            # URL of this deployment, e.g. via the consuming service's
            # `jellyfin:` values block).
            # This is needed otherwise Jellyfin flags plugins with old versions as needed a reboot and disables them.
            JELLYFIN_RemoveOldPlugins: "true"
          #securityContext:
          #  allowPrivilegeEscalation: false
          #  readOnlyRootFilesystem: true
          #  capabilities: { drop: ["ALL"] }
          probes:
            liveness: &probes
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: &port 8096
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            readiness: *probes
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: *port
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 8Gi
              #gpu.intel.com/i915: 1
  # External exposure is handled by the consuming service's generic-ingress
  # (ingress.subdomains entry), same as every other service in this repo.
  service:
    app:
      controller: jellyfin
      type: ClusterIP
      ports:
        http:
          port: *port
  persistence:
    config:
      existingClaim: jellyfin
    cache:
      type: emptyDir
    transcode:
      type: emptyDir
    media:
      # Repo convention: the shared media PVC is named `media` on every cluster
      # that has one (see services/*/prod/templates/pvc-media-seaweedfs.yaml).
      existingClaim: media
      globalMounts:
        - path: /media
