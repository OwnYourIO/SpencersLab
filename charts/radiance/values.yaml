# Radiance (cf-143 C02; genericised into the per-instance shell by C03): the
# chart every radiance lane on the gpu-ai R9700s releases from.
# "Radiance" here is the StillDeadcode ENGINE (docker.io/stilldeadcode/radiance
# — the C++/HIP one, RESEARCH RQ0). Two name-collisions must not be read into
# this chart: charts/vllm's image vllm-radiance-mxfp4 is the magiccodingman
# vLLM FORK (a different artifact and a different API surface), and Strata
# (Niko1221/Strata) is an unrelated engine. Naming law: DECISIONS Conventions.
#
# Cluster-internal (Q1=A, structure ruled): the sole client route is the
# llama-swap peers.radiance hop (C04 wires it) — no ingress, no public host,
# no secret surface (D8: keyless engine + ungated packs => no bitwardenIds,
# no ExternalSecret leg, no custom-values entry: the trio law's documented
# skip). domain/clusterName references are absent on purpose.

#
# ONE SHELL, SEVERAL RELEASES (2026-11-feat-radiance-multi-instance C03, plan
# OQ-D + rulings D35/D43): this chart is MECHANISM — the image pin and digest ledger,
# the /health probe law, Recreate plus the drain grace, the unprivileged GPU
# securityContext, the shared models claim and /dev/shm, the Service shape, the
# staging init's image and hash budget, and BOTH generic script FORMs riding
# one ConfigMap carrier: the fetch shell the init consumes (D35) and the
# serve-argv compose wrapper the main container invokes (D43). LANE DATA — the
# served pack path and its ledger, the serve specifics the compose FORM reads
# from container env, the memory and card claim, and the pack scalars the FORM
# substitutes (PACK/LFS_SHA/URL/MARKER) — ships in each
# release's roster block in services/gpu-ai/prod/values.yaml. The lanes and
# their claim math are in templates/NOTES.txt.

app-template:
  # Nothing lane-specific survives at this level (C03/OQ-D). The pack path and
  # its ledger, the serve recipe, the sizing scalars and the memory/card claim
  # pair are roster-block data; so are the four scalars the fetch FORM below
  # substitutes — the FORM is generic, the numbers are not. What proves the
  # relocation shipped nothing unintended is the intentional-delta proof in
  # charts/radiance/tests/ (the evidence/pre-move-render-*.yaml fixtures and
  # the four-path budget leg D35 rules). Any key added here is a fact EVERY
  # release of this shell inherits — a second release booting with the first
  # lane's pack and the first lane's card count is the exact failure the
  # relocation closed.


  # --- priority / preemption (Q2 ruling, RESEARCH RQ2): radiance honors the
  # OpenAI body `priority` field with HIGHER-WINS ranking (urgent 9 / default
  # 5 / low 1) and preempts by recompute — the OPPOSITE polarity of the
  # retired vLLM lane's 1/5/9 table, so porting the old numbers would run the
  # board backwards. Engine defaults NOT shipped as flags (the profile pins
  # only what deviates): --preempt-wait-ms 5000, and --max-queued-requests
  # overflow answers 429 + Retry-After (peers surface it verbatim). The 9/5/1
  # catalog rows land in C05 and the llama-swap peer floor
  # filters.setParams "priority?": 5 in C04 (radiance's DEFAULT class — never
  # read it as a vLLM-era number).
  #
  # --- plugin facts (Q9 Option-1 as SHIPPED by C07, renamed per the D24
  # lane ruling; RESEARCH §R6-Q1/§R7-Q2): first-party charts/amd-gpu runs
  # the device plugin at -resource_naming_strategy=product, which buckets
  # devices per SANITIZED MARKETING NAME, and since D24 the names come from
  # the PATCHED amdgpu.ids ConfigMap that chart mounts over the image's
  # baked table — the sanitizer maps the 7551/C0 row's "r9700" product
  # string to gpu-r9700 (renamed 2026-11-22 per D21; the amd.com namespace and the gpu- prefix are
  # plugin CODE constants, §R7-Q1/Q2). This node advertises exactly
  # amd.com/gpu-r9700 (the R9700s, PCI 7551 revision C0 — a pool of TWO
  # devices since the TP2 wave) and
  # amd.com/gpu-8060s (the Strix APU, 1586, carried rows — unchanged) — a
  # pod requesting the R9700 pool can ONLY ever receive the R9700
  # (scheduler determinism replaces the
  # nodeId-ascending APU-first accident that crash-looped charts/vllm
  # 2026-11-07; the round-2 mis-allocation runtime-retry gate is SUPERSEDED
  # by that determinism — the startup-report PCI/gfx1201 assert survives only
  # as belt-and-braces in the C06 step-7 receipt e). amd.com/gpu is GONE
  # from the GPU-AI NODE's ADVERTISEMENT — cf-144 dated nuance (EXPLORE
  # gotcha 8, §D2.2): the live read shows the key PRESENT at COUNT 0 (kubelet
  # retention of the pruned single-naming advertisement), not capacity-absent;
  # the conclusion is unchanged either way: a stray bare claim there schedules
  # Pending-forever, loud by design. Scope: that is per-cluster — the gpu
  # cluster's plugin stays single-naming 1.31.0.9 and its renders keep the
  # bare name BY DESIGN
  # (the owner's B1 shield, DECISIONS D21; this chart serves gpu-ai only, so
  # it claims the named pool). The plugin Allocate() injects /dev/kfd + the
  # allocated card/render nodes into the container and sets NO environment:
  # host enumeration is irrelevant inside the pod, so this chart ships NO
  # ROCR/HIP env (the charts/vllm 307/310 idiom is obsolete here — that lane
  # uses hostPath devices, which Q7 rules out below). "No occupancy check in
  # Allocate()" stays TRUE upstream (open PRs #243/#247 — watch, don't wait)
  # and the pre-TP2 "each pool holds one device" reading is RETIRED with the
  # second card (RESEARCH C1, 2026-11-22): the R9700 pool holds TWO devices,
  # so within-bucket choice DOES exist, settled at the SCHEDULER — a free
  # single-card claim takes the pool's lowest-KFD-NodeId card (advisory at
  # the API, source-pinned at v1.31.0.12), concurrent claims take distinct
  # cards by occupancy, and a TP2 claim gets both; pinning a lane to one
  # specific card is NOT expressible through the plugin. The fallback trap (a card whose sysfs (device,revision)
  # pair is absent from the patched table reverts to the bare amd.com/gpu
  # name) is closed by the C06 step-0 gate (a) BEFORE first boot, not
  # by runtime logic. STRATA LAW (Q11): strata's privileged hostPath pod sits
  # PHYSICALLY on the same card this pool names — naming settles cross-card
  # choice, never VRAM arbitration; the radiance-vs-strata contention stays
  # the owner's observe-only ruling, the manual scale-down protocol governs.

  # No serve recipe here (C03): the args are lane data and ship complete in
  # each release's block, every time. The profile law is per block and
  # suite-pinned there — each flag exactly once, an extra flag as fatal as a
  # missing one (every stale-guide survivor shipped is a boot-time refusal or
  # a silently different memory story, RESEARCH "Guide corrections"), and the
  # absence list checked as a named bar, not a style note.


  # --- THE SCRIPT-FORM CARRIER (C03 round 2 owner ruling D35; serve half added
  # by round 3 owner ruling D43) -----------------------------------------------
  # ONE generic staging shell for every release of this shell: resume-download
  # the lane's pack onto the shared claim, verify it against the lane's LFS sha,
  # write the success marker only on a match. It rides a ConfigMap because
  # app-template 5.0.1 renders container command/args through plain toYaml (no
  # tpl), so a chart-side script could never read per-release values from the
  # container — while configMap DATA is tpl'd, which is what lets the FORM stay
  # chart-owned and PACK/LFS_SHA/URL/MARKER stay roster-block data. The cost the
  # owner accepted with the ruling (D35(2)): a release rolls at the sync that
  # lands this carrier (Recreate + changed pod template), watched on its own.
  # D43 extends the same class to the SERVE side — see serve.sh below: the lane
  # feeds it through container env instead of values, and the pod spec shows an
  # invocation instead of the engine's argv.
  radianceFetch:
    # The scalars the FORM substitutes, empty here on purpose: a release that
    # does not author its own pack trips the loud guard at the top of the script
    # instead of quietly fetching a sibling lane's bytes. PACK is deliberately
    # NOT one of them — PACK is the block's modelPath, the same key the
    # dual-edit legs compare against the model path the lane serves, so the
    # fetched pack and the served pack cannot drift apart on a retarget.
    lfsSha: ""
    url: ""
    marker: ""

  configMaps:
    radiance-fetch:
      # The name follows the release (app-template derives it from the fullname),
      # so the two live lanes never fight over one ConfigMap in `default`. ONE
      # carrier holds BOTH script FORMs (fetch + serve, D43): the pod template
      # then rolls on a single checksum/configMaps value, not two.
      data:
        fetch.sh: |
          #!/bin/sh
          # radiance pack staging — chart-owned FORM (D35). The assignments
          # below are the ONLY lane-specific bytes in this file; the sequence
          # around them is law for every release of this shell.
          set -e
          PACK={{ .Values.modelPath }}
          LFS_SHA={{ .Values.radianceFetch.lfsSha }}
          URL={{ .Values.radianceFetch.url }}
          MARKER={{ .Values.radianceFetch.marker }}
          if [ -z "$PACK" ] || [ -z "$LFS_SHA" ] || [ -z "$URL" ] || [ -z "$MARKER" ]; then
            echo "radiance staging: missing pack scalars — the release block must author modelPath plus radianceFetch lfsSha/url/marker"
            exit 1
          fi
          mkdir -p "$(dirname "$PACK")"
          if [ -f "$MARKER" ] && [ -f "$PACK" ]; then
            echo "radiance staging: marker + pack present — skipping"
            exit 0
          fi
          echo "radiance staging: fetch $PACK (curl-resume)"
          # rc 33 = "the file is already completely retrieved" under
          # --continue-at - : a pack that finished without ever having written
          # its marker (a kill between bytes and touch) is DONE, not a failure
          # — set -e would otherwise boot-loop on it.
          rc=0
          curl --fail --location --retry 5 --retry-delay 10 --continue-at - --output "$PACK" "$URL" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 33 ]; then
            echo "radiance staging: curl failed rc=$rc"
            exit "$rc"
          fi
          # The marker is written only after the checksum passes: the marker IS
          # the landed-file provenance the C06 receipts re-check against this
          # same ledgered value. BusyBox grammar only — the pinned curl image is
          # Alpine, where the hash applets take short options and refuse GNU
          # long ones, while GNU has no short quiet flag. Plain shell equality
          # on the two-space compute output, both digests on one echo line, is
          # the only gate both families run unchanged (cf-143 D27/§D3b).
          actual=$(sha256sum "$PACK" | cut -d' ' -f1)
          if [ "$actual" != "$LFS_SHA" ]; then
            echo "radiance staging: sha256 MISMATCH expected=$LFS_SHA actual=$actual"
            exit 1
          fi
          touch "$MARKER"
          echo "radiance staging: complete"
        # THE SERVE-COMPOSE FORM (C03 round 3, owner ruling D43): the same
        # carrier class on the serve side. The engine's argv is not lane data
        # except through env — the FORM owns the flag vocabulary and the
        # fixed flags, the release's RADIANCE_* env carries every per-lane
        # value (env rides tpl; container args never did, which is exactly
        # why the per-block arrays went stale on the pool rename), and the
        # pod spec shows an invocation instead of a vector.
        serve.sh: |
          #!/bin/sh
          # radiance serve compose — chart-owned FORM (D43). Every per-lane
          # value arrives through RADIANCE_* container env; nothing here names
          # a pack, an id, or a lane's numbers, and a lane cannot restyle the
          # FORM by writing one of the fixed flags into its env (the suite
          # reds that dual channel).
          #
          # POSIX-only: the engine image's bin/sh is busybox ash — no bash,
          # no dash, no arrays, no [[ ]]. The engine execs by BARE name
          # (§D1.5: the image ENTRYPOINT is ["radiance"] and PATH resolves
          # /opt/radiance/bin/radiance); re-pathing it here would fork the
          # engine identity away from the image pin.
          #
          # D43(2) visibility note — read this before calling the render a
          # drift: kubectl describe and the Argo diff now show the wrapper
          # invocation plus the env, NOT the argv. The startup echo below is
          # the operator's receipt for the vector the engine actually
          # received; the suite proves the same bytes compose each lane's
          # ruled profile exactly.

          # Loud guard (the fetch FORM's -z law, serve side): a required env
          # absent dies BEFORE composing — a serve without its model, id, tp
          # or context is not a serve, and a baked default here would
          # re-smuggle lane data into the chart. The message names the
          # variable so the pod log alone diagnoses it.
          : "${RADIANCE_MODEL_PATH:?RADIANCE_MODEL_PATH is required - the lane must author its pack path}"
          : "${RADIANCE_SERVED_ID:?RADIANCE_SERVED_ID is required - the lane must author its served id}"
          : "${RADIANCE_TP:?RADIANCE_TP is required - tp must equal the pod card claim}"
          : "${RADIANCE_MAX_MODEL_LEN:?RADIANCE_MAX_MODEL_LEN is required - the context ceiling is a lane fact}"

          # FORM-owned flags: port 8000 (the Service and probes agree) and
          # host :: (the cf-143 idiom) stay identical for every release; the
          # session count and the KV dtype ride this same spine as env-fed
          # channels whose fallback is the SHIPPED byte (8 / fp8). The
          # fallbacks are law, not style: the engine's own defaults are 256
          # sessions and a bf16 cache, so an absent-means-absent channel here
          # would silently re-size every parked lane and double its KV bytes
          # (2026-11-23 owner rulings R1/R2, DECISIONS D-3/D-16). Every other
          # arm below stays absent-means-absent, which is how the dense lanes
          # omit the whole expert family without this FORM knowing which lane
          # it serves.
          # Receipt-gate guardrail: the gate reads each lane's M bar from the
          # fallback digit in these bytes and refuses when it finds two
          # distinct digits, so prose here must not spell the flag beside a
          # bare digit — a second readable match is a refusal at the gate.
          set -- --model "$RADIANCE_MODEL_PATH" --served-model-name "$RADIANCE_SERVED_ID" \
            --port 8000 --host :: --max-num-seqs "${RADIANCE_MAX_NUM_SEQS:-8}" \
            --kv-cache-dtype "${RADIANCE_KV_CACHE_DTYPE:-fp8}" \
            --tp "$RADIANCE_TP" --max-model-len "$RADIANCE_MAX_MODEL_LEN"
          [ -n "${RADIANCE_TP_WIRE:-}" ] && set -- "$@" --tp-wire "$RADIANCE_TP_WIRE"
          [ -n "${RADIANCE_HOST_POOL_MIB:-}" ] && set -- "$@" --host-pool-mib "$RADIANCE_HOST_POOL_MIB"
          [ -n "${RADIANCE_GPU_HEADROOM_MIB:-}" ] && set -- "$@" --gpu-headroom-mib "$RADIANCE_GPU_HEADROOM_MIB"
          [ -n "${RADIANCE_KV_RESIDENT:-}" ] && set -- "$@" --kv-resident "$RADIANCE_KV_RESIDENT"
          [ -n "${RADIANCE_PREFIX_CACHE_MIB:-}" ] && set -- "$@" --prefix-cache-mib "$RADIANCE_PREFIX_CACHE_MIB"
          [ -n "${RADIANCE_PLACEMENT:-}" ] && set -- "$@" --placement "$RADIANCE_PLACEMENT"
          [ -n "${RADIANCE_NGRAM_PLACEMENT:-}" ] && set -- "$@" --ngram-placement "$RADIANCE_NGRAM_PLACEMENT"
          [ -n "${RADIANCE_NUM_SPECULATIVE_TOKENS:-}" ] && set -- "$@" --num-speculative-tokens "$RADIANCE_NUM_SPECULATIVE_TOKENS"
          [ -n "${RADIANCE_MAX_NUM_BATCHED_TOKENS:-}" ] && set -- "$@" --max-num-batched-tokens "$RADIANCE_MAX_NUM_BATCHED_TOKENS"
          [ -n "${RADIANCE_CHECKPOINT_INTERVAL:-}" ] && set -- "$@" --checkpoint-interval "$RADIANCE_CHECKPOINT_INTERVAL"

          echo "radiance serve: composed engine argv: $*"
          exec radiance "$@"

  # cf-145 D-8 (owner batched ruling: annotation autodiscovery over a raw
  # ServiceMonitor) — the charts/vllm D8 idiom: the gate for the
  # k8s.grafana.com/* scrape pair in defaultPodOptions below. 60 s is the
  # k8s-monitoring v4 annotationAutodiscovery feature default, so NO
  # metrics.scrapeInterval annotation (cf-143 Q5 ruling carried — exactly two
  # keys). The gate lives INSIDE this app-template subtree because the map is
  # tpl'd against the subchart values: at chart top level the subchart cannot
  # read it (vllm's working layout).
  monitoring:
    annotations: true

  global:
    nameOverride: &chartName radiance
    # The engine pod never calls the K8S API, so no ServiceAccount object is
    # created (the vllm/home-assistant tokenless precedent).
    createDefaultServiceAccount: false

  defaultPodOptions:
    # cf-145 D-8 (charts/vllm D8 shape verbatim): exactly two
    # k8s.grafana.com/* annotations — the scrape gate + portNumber 8000 (the
    # engine's --port, containerPort and service port already agree). app-template
    # 5.0.1 tpl's the whole map against the subchart values, so gate-OFF keeps
    # the keys with inert (empty) values instead of dropping them — an empty
    # value is what disables the scrape. The single-quoted ternaries are plain
    # literals: this pair carries no anchor dependency, so the per-document
    # anchor law (file header) never runs on it. No job/path/interval keys —
    # autodiscovery fills the defaults (job = the app.kubernetes.io/name label
    # fallback "radiance" for both releases, path /metrics); adding a third key
    # needs a DECISIONS line. Chart defaults, so the q27 overlay inherits —
    # no per-release wiring.
    annotations:
      k8s.grafana.com/scrape: '{{ .Values.monitoring.annotations | ternary "true" "" }}'
      k8s.grafana.com/metrics.portNumber: '{{ .Values.monitoring.annotations | ternary "8000" "" }}'
    terminationGracePeriodSeconds: 180
    # The engine drains in-flight work ~60-120 s on SIGTERM (1.17.0 compose
    # stop_grace_period 60 s + teardown margin). NOT strata's 420 — that
    # number is the child-choreography invariant of the llama-swap-child
    # shape, not a radiance law.
    securityContext:
      # DEDICATED UID: io_uring rings count against RLIMIT_MEMLOCK (the k3s
      # default 8 MiB) PER UID — a fresh, dedicated uid gets its own budget
      # and needs no host drop-in (llmkube's exact posture, RESEARCH RQ3;
      # the lab's strata pod pinning ~100+ GiB on the same default proves
      # the card-path itself is not ulimit-charged). 65532 = the distroless
      # nonroot convention, non-colliding: no consumer of the shared claim
      # runs it (llama-swap/vllm/strata are root), and host human uids sit
      # in the 1000-range. Same uid/gid/fsGroup everywhere on this pod: the
      # fetch-init's staged tree reads group- AND owner-consistent in the
      # serve container (Q7 verbatim, non-privileged from day one — the
      # host-prep receipts gate first boot in the C06 runbook).
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      # The 500Gi claim carries other tenants' root-owned trees; a recursive
      # group rewrite of 500Gi on every mount would stall boot and churn
      # foreign ownership. OnRootMismatch applies once (root dir group
      # mismatch) and skips after; the claim's dir itself is provisioned
      # world-writable (local-path default), and same-uid reads never needed
      # the rewrite anyway — fsGroup exists for the staged .rad's GROUP
      # readability (Q7).
      fsGroupChangePolicy: OnRootMismatch
      # kfd device access, non-privileged: this node's /dev/kfd and
      # /dev/dri/renderD* are group 486 mode 660 (the charts/vllm GID-486
      # comment is the precedent source; RESEARCH RQ3 live-verified). The
      # named-pool plugin injects the device nodes; 486 is what lets a
      # non-root process OPEN them (render/video join: the C06 host receipt,
      # one-edit service-block override if the render nodes need more than
      # 486 here).
      supplementalGroups: [486]
      # io_uring + NUMA (mbind/set_mempolicy) need Unconfined: the RuntimeDefault
      # profile blocks io_uring outright, which kills the ngram DISK tier and
      # the ROCm NUMA path (upstream's own seccomp note, RESEARCH RQ3) —
      # the profile ships Unconfined, or the engine refuses to boot.
      seccompProfile:
        type: Unconfined

  controllers:
    radiance:
      # A ~60 GiB-class pinned host pool must never ride a RollingUpdate
      # overlap — a second pod would double-pin the node (the strata #2257
      # class the repo lived). Same-node single-tenant.
      strategy: Recreate
      # No reloader.stakater.com/auto annotation ON PURPOSE: the restart the
      # one mounted ConfigMap needs (the fetch FORM, D35) is already driven by
      # app-template's checksum/configMaps pod-template annotation, which is
      # deterministic and needs no extra operator; there is no Secret surface at
      # all (keyless cf-143 D8), so the reloader would only add a second restart path.
      containers:
        radiance:
          image:
            repository: docker.io/stilldeadcode/radiance
            # renovate: datasource=docker depName=docker.io/stilldeadcode/radiance
            tag: "1.17.0"
            pullPolicy: IfNotPresent
            # DIGEST LEDGER (D2 — tag pin + digests-in-comment, NO digest
            # field: the repo has no image.digest precedent). Which is which
            # (RESEARCH RQ0/S4, verified against the Docker Hub API
            # 2026-11-12):
            #   amd64 IMAGE MANIFEST:
            #     sha256:6fb0e99bfb862e17cc15cb7b2f116c7dbdc831df59f82456a0691122e6cf5330
            #   tag INDEX (manifest-list wrapper — what `radiance:1.17.0`
            #   itself resolves to; llmkube pins the manifest digest as
            #   1.17.0@sha256:6fb0e99b...):
            #     sha256:c2acbaa373c89272ec47a22befa1cf04d2ddf1de51c2baf534f5273e517f7100
            # Tag-rebuild caution (the unified-vulkan-262 precedent: a tag
            # CAN be rebuilt in place upstream, silently changing bytes under
            # a held pin) — this ledger is the forensic anchor for exactly
            # that case; a digest retarget is a DECISIONS line, not a drive-by.
          # INVOCATION ONLY (D43, mirroring the D35 init law): the serve
          # argv composes in the mounted FORM above, so the container names
          # the file it runs and `args` stays absent — whatever rendered here
          # would be a second argv source. `sh` runs the file because
          # ConfigMap volumes serve 0644 root-owned bytes to this pod's
          # 65532 — readable, never executable. Engine law the wrapper
          # upholds for every lane: no `serve` verb (the engine takes args
          # directly; the vllm/Strata idiom double-verbs it) and no api key
          # (cf-143 D8 keyless).

          command:
            - sh
            - /scripts/serve.sh

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          probes:
            # Probe law: /health only — key-exempt and the load-aware surface
            # (upstream's own healthcheck puts a ~15-min start period on it,
            # RESEARCH RQ3). Never probe a model endpoint: that would run
            # real inference on every kubelet tick, and needs a key this
            # lane does not have.
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8000
                # 180x10s = 30-min ceiling: the cold-load class is minutes
                # (the pack's GiB-class read + graph build), the llmkube law; a
                # mis-sized boot fails LOUD at startup rather than thrashing.
                periodSeconds: 10
                failureThreshold: 180
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8000
          # No resources here (C03): the VALUES of the pair are lane data and
          # ship in each block. The POD-CLASS LAW is chart-side because it is
          # not lane data (cf-143 D15): Guaranteed is a POD property — any container
          # without an equal requests==limits pair silently downgrades the
          # WHOLE pod to Burstable — and an extended resource REQUIRES the
          # equal integer pair, the kubelet rejects requests != limits for it.
          # Four lanes price their working sets differently; one lane's number
          # is another lane's Pending pod or OOMKill.

          securityContext:
            # The repo drop-ALL standard plus the engine's one carry:
            # IPC_LOCK for locked-buffer / io_uring registration (Q7).
            # allowPrivilegeEscalation false and NO privileged — the
            # charts/vllm privileged+hostPath block must not be copied, the
            # named pool's Allocate() injects the device nodes instead.
            # readOnlyRootFilesystem stays unset: the engine writes scratch +
            # the disk ngram tier, and this chunk ships no PVC to point it
            # at — the root FS is its scratch.
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - IPC_LOCK
      initContainers:
        radiance-fetch:
          # D10 staging: pull the ungated pack ONCE onto the shared claim by
          # curl-resume, marker-gated on the lfs sha. Image choice between the
          # chunk's two sanctioned shapes (curl image / engine image):
          # staging is pure network+disk IO needing only curl + coreutils,
          # so the minimal pinned curl image carries it without dragging the
          # engine's ~GiB runtime onto a pod step that touches no GPU. The
          # resume flag (-C -) is the mechanism that survives an interrupted
          # 113.6 GiB fetch — a full re-download per boot glitch is the
          # failure mode this shape exists to avoid.
          image:
            repository: docker.io/curlimages/curl
            # renovate: datasource=docker depName=docker.io/curlimages/curl
            tag: "8.23.0"
            pullPolicy: IfNotPresent
            # amd64 IMAGE-MANIFEST digest of the tag above (the live imageID, §D3b.1): sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
            # — this is the APPLET PREMISE PIN (D2 posture, C11/AC4.3): the
            # image's coreutils ARE BusyBox v1.37.0 (the container's own
            # banner), which is what the checksum-grammar law in the script
            # below guards. Swapping the image family means re-ruling that
            # premise — the identity leg refuses to pass vacuously.
          # INVOCATION ONLY (D35): the bytes of the fetch script are the
          # chart-owned ConfigMap above, mounted at /scripts; the command names
          # the file it execs. sh runs the file rather than relying on its exec
          # bit because a ConfigMap volume serves mode-0644 root-owned files to
          # this pod's 65532 — readable, never executable. What stays law for
          # every lane here: the pinned curl image (the BusyBox-applet premise
          # the gate's grammar is written against — the identity leg refuses to
          # pass vacuously), the single-core hash budget, and the non-root
          # stage posture.
          command:
            - sh
            - /scripts/fetch.sh

          resources:
            # THE POD-CLASS LAW, commented where it renders (D15): Guaranteed
            # is a POD property — ANY container without an equal
            # requests==limits pair silently downgrades the WHOLE pod to
            # Burstable. C12/§D4 raises the CPU half 200m -> 1000m: the
            # first-ever pack hash is CPU-quota-bound, NOT disk-bound — the
            # busybox sha256sum applet is single-threaded with no SHA-NI
            # path (§D4 measured exactly 0.2000 core with io PSI 0) — so one
            # core is the whole gain (30-70 min @200m ÷ 5 ⇒ ~5.8-13.6 min
            # @1000m, D30(6); the drafted 8-23 was §D4.4's un-quoted
            # full-feed-disk counterfactual, ~1.5x wrong as a cap-bound
            # figure); more than one
            # core is pointless) and every pod loss before completion
            # restarts the hash at byte 0. SEPARABLE: reverting this knob
            # is one line, leaving the memory fix intact. Memory stays
            # 2Gi/2Gi (measured workingSet 4.1 MB — generous by design).
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            # Non-privileged like the serve container (Q7) — and the same
            # pod-level runAsUser writes the staged tree, so the serve
            # container reads it owner-consistently.
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

  service:
    radiance:
      controller: *chartName
      ports:
        http:
          port: 8000
      # NO ingress anywhere on this lane, deliberately: the trio rule's
      # proxy leg is skipped by the internal-only ruling — the engine stays
      # reachable only through the llama-swap peers hop (a host here would
      # publish it). The skip-comment home is the services file's
      # ingress.subdomains section, where C04 mirrors the vllm/strata
      # precedent text with the radiance entry.

  persistence:
    # Weights: the EXISTING 500Gi llama-swap claim, mounted per ACTOR
    # (advancedMounts keyed <controller>.<container>): the serve container
    # reads /models read-only, the radiance-fetch init writes it. What the
    # claim carries: /models/radiance/*.rad + .staged-* markers (this
    # chart), the GGUF trees the llama.cpp rungs serve, the vllm-era
    # Qwen3.8-27B trees — DO NOT DELETE anything under /models you did not
    # stage (the class-10 GGUF ground; the vllm 542-552 warning mirrors
    # here). RWO same-node multi-attach is the lab's single-node pattern
    # (vllm/strata/llama-swap all already ride this claim).
    models:
      existingClaim: llama-swap
      advancedMounts:
        radiance:
          radiance:
            - path: /models
              readOnly: true
          radiance-fetch:
            - path: /models
    # The script-form carrier (D35 fetch FORM + D43 serve FORM): mounted into
    # the staging init AND the serve container — each execs its own file from
    # here, and neither sees a baked copy. Whole-ConfigMap directory (no
    # subPath): a key change then lands as a new file atomically, and the
    # checksum annotation restarts the pod that has the old one cached.
    radiance-fetch-script:
      type: configMap
      identifier: radiance-fetch
      advancedMounts:
        radiance:
          radiance:
            - path: /scripts
              readOnly: true
          radiance-fetch:
            - path: /scripts
              readOnly: true
    # Engine shared memory (HIP/IPC surfaces): emptyDir medium Memory,
    # capped 2Gi (the single-GPU-TP1 worker's working set; the node's tmpfs
    # accounting keeps the cap honest). cf-144 C01/OQ-G dated annotation
    # (2026-11-21): the value stays 2Gi at the TP2 two-rank shape — the
    # owner ruling accepted 2 GiB plus a first-boot receipt; the boot's shm
    # usage confirms or moves it, never a pre-emptive change (receipt law).
    shm:
      type: emptyDir
      medium: Memory
      sizeLimit: 2Gi
      globalMounts:
        - path: /dev/shm
    # NO kfd/dri hostPath entries (Q7): the named-pool plugin's Allocate()
    # injects /dev/kfd + the R9700 render node into the container — the
    # strata/vllm hostPath class is exactly what this chart replaces (and
    # the absence is test-pinned, load-bearing, not stylistic).
