apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mayan-edms
spec:
  refreshInterval: 1h
  target:
    name: mayan-edms
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # MAYAN_DATABASES embeds the password in a Python dict literal
        # (Django parses it with ast.literal_eval) — hence no plain
        # secretKeyRef, and the DB password (mayan-edms-db item) must not
        # contain single quotes.
        MAYAN_DATABASES: "{'default':{'ENGINE':'django.db.backends.postgresql','NAME':'mayan-edms','PASSWORD':'{{ `{{ .db_password }}` }}','USER':'{{ `{{ .db_username }}` }}','HOST':'pg-mayan-edms-rw'}}"
        # Initial Mayan admin password: the regular LOGIN password of the
        # `mayan-edms` Bitwarden item (used once, at first-boot setup).
        MAYAN_AUTOADMIN_PASSWORD: "{{ `{{ .autoadmin_password }}` }}"
        # Autoadmin email, built from the cluster domain (used once, at
        # first-boot setup; the login page shows this address).
        MAYAN_AUTOADMIN_EMAIL: "edms@{{ .Values.domain }}"
  data:
    - secretKey: db_username
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "mayan-edms-db" }}'
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: db_password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "mayan-edms-db" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: autoadmin_password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "mayan-edms" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
