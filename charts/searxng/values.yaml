bitwardenIds:
  searxng: OVERRIDE_VIA_CUSTOM_VALUES

domain: OVERRIDE_VIA_APPSET

app-template:
  global:
    nameOverride: &chartName searxng

  controllers:
    searxng:
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        main:
          image:
            repository: searxng/searxng
            # Immutable date-commit tag verified 2026-10-10 against Docker Hub
            # (digest matches searxng/searxng:latest at that time).
            tag: 2026.10.9-f4822b3fc
          env:
            SEARXNG_BASE_URL: "https://{{ .Values.domain }}"
            SEARXNG_PORT: "8080"
            SEARXNG_BIND_ADDRESS: "0.0.0.0"
            REDIS_URL: "redis://localhost:6379/0"
            TZ: Etc/UTC
          envFrom:
            - secretRef:
                name: *chartName
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        redis:
          image:
            repository: redis
            tag: 8.6.0
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
            limits:
              memory: 256Mi
      pod:
        securityContext:
          runAsUser: 977
          fsGroup: 977
          fsGroupChangePolicy: OnRootMismatch
          runAsNonRoot: true
  service:
    searxng:
      controller: *chartName
      ports:
        http:
          port: 8080
  persistence:
    config:
      existingClaim: *chartName
      globalMounts:
        - path: /etc/searxng
    settings:
      # GitOps-managed settings.yml rendered by the ExternalSecret
      # (secret-searxng.yaml): Bitwarden secret_key + engine policy.
      # The image entrypoint never writes to an existing settings.yml
      # (verified at image commit f4822b3fc), so shadowing the PVC copy
      # is safe. subPath mounts refresh only on pod restart — the
      # reloader annotation covers that.
      type: secret
      name: *chartName
      globalMounts:
        - path: /etc/searxng/settings.yml
          subPath: settings.yml
