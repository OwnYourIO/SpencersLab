apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng
spec:
  refreshInterval: 1h
  target:
    name: searxng
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SEARXNG_SECRET_KEY: "{{ `{{ .secret_key }}` }}"
        settings.yml: |
          # GitOps-managed SearXNG settings, merged over built-in defaults.
          # Image 2026.10.9 has botdetection bypasses for duckduckgo and
          # modernized yahoo handling — keep those enabled. Engines disabled
          # below are either IP-blocked/CAPTCHA-walled with no upstream fix
          # (google family, brave family, qwant family, reuters, pinterest —
          # verified 2026-10-10/11) or turned off by operator choice.
          # mojeek/startpage do not register in this build at all, so don't
          # add them here. See plan
          # 2026-10-10-bug-fix-searxng-upstream-ratelimits.md for background.
          use_default_settings: true
          server:
            secret_key: "{{ `{{ .secret_key }}` }}"
            image_proxy: true
          search:
            # This SearXNG build only enables html output by default; the JSON
            # API is what mcp-searxng (global-searxng MCP server) consumes,
            # without this /search?format=json returns 403.
            formats:
              - html
              - json
          engines:
            # --- operator-selected extras (disabled by default upstream) ---
            - name: bing
              disabled: false
            - name: yandex
              disabled: false
            - name: yahoo
              disabled: false
            - name: privacywall
              disabled: false
            - name: wolframalpha
              disabled: false
            - name: tineye
              disabled: false
            - name: openlibrary
              disabled: false
            - name: codeberg
              disabled: false
            - name: sourcehut
              disabled: false
            - name: huggingface
              disabled: false
            - name: ollama
              disabled: false
            - name: microsoft learn
              disabled: false
            - name: national vulnerability database
              disabled: false
            - name: discuss.python
              disabled: false
            - name: fdroid
              disabled: false
            - name: apk mirror
              disabled: false
            - name: google play apps
              disabled: false
            - name: yandex images
              disabled: false
            - name: imgur
              disabled: false
            - name: giphy
              disabled: false
            - name: privacywall images
              disabled: false
            - name: 1337x
              disabled: false
            - name: nyaa
              disabled: false
            - name: annas archive
              disabled: false
            - name: library genesis
              disabled: false
            - name: btdigg
              disabled: false
            - name: tokyotoshokan
              disabled: false
            - name: openrepos
              disabled: false
            - name: findfiles
              disabled: false
            # --- operator-disabled (were enabled by default upstream) ---
            - name: google cse
              disabled: true
            - name: google cse images
              disabled: true
            - name: wiby
              disabled: true
            - name: lingva
              disabled: true
            - name: mymemory translated
              disabled: true
            - name: dictzone
              disabled: true
            - name: askubuntu
              disabled: true
            # --- upstream engines that IP-block us, no solver available ---
            # brave: scrape endpoint 429s this IP even on 2026.10.9 (verified
            # 2026-10-11). Re-enable once a Brave Search API key (free tier)
            # is wired in via Bitwarden + the engine's api_key setting.
            - name: brave
              disabled: true
            - name: brave.images
              disabled: true
            - name: brave.videos
              disabled: true
            - name: brave.news
              disabled: true
            # qwant: hard CAPTCHA wall from this IP (verified 2026-10-11).
            - name: qwant
              disabled: true
            - name: google
              disabled: true
            - name: google images
              disabled: true
            - name: google news
              disabled: true
            - name: google videos
              disabled: true
            - name: google scholar
              disabled: true
            - name: qwant news
              disabled: true
            - name: qwant images
              disabled: true
            - name: qwant videos
              disabled: true
            - name: reuters
              disabled: true
            - name: pinterest
              disabled: true
  data:
    - secretKey: secret_key
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "searxng" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
