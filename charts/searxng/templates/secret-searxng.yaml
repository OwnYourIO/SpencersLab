apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng
spec:
  refreshInterval: 1h
  target:
    name: searxng
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SEARXNG_SECRET_KEY: "{{ `{{ .secret_key }}` }}"
        settings.yml: |
          # GitOps-managed SearXNG settings, merged over built-in defaults.
          # Image 2026.10.9 has solvers for startpage (anubis) and mojeek
          # (altcha), plus a duckduckgo botdetection bypass — keep those
          # enabled. Engines disabled below are IP-blocked with no upstream
          # fix (verified 2026-10-10). See plan
          # 2026-10-10-bug-fix-searxng-upstream-ratelimits.md before
          # re-enabling anything.
          use_default_settings: true
          server:
            secret_key: "{{ `{{ .secret_key }}` }}"
            image_proxy: true
          engines:
            # Resilient web-search backends (disabled by default upstream)
            - name: mojeek
              disabled: false
            - name: wiby
              disabled: false
            # --- upstream engines that IP-block us, no solver available ---
            - name: google
              disabled: true
            - name: google images
              disabled: true
            - name: google news
              disabled: true
            - name: google videos
              disabled: true
            - name: google scholar
              disabled: true
            - name: qwant news
              disabled: true
            - name: qwant images
              disabled: true
            - name: qwant videos
              disabled: true
            - name: yahoo news
              disabled: true
            - name: reuters
              disabled: true
            - name: pinterest
              disabled: true
  data:
    - secretKey: secret_key
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "searxng" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
