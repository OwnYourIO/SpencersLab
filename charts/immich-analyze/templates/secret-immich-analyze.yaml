apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-analyze
spec:
  refreshInterval: 1h
  target:
    name: immich-analyze
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        api_key: "{{ `{{ .api_key }}` }}"
  data:
    - secretKey: api_key
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "immich-analyze" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
