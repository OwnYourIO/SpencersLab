# CNPG initdb credentials for pg-okd. The username is hardcoded: it MUST
# match bootstrap.initdb.owner in pg-okd.yaml (repo precedent: mayan-edms),
# so only the password lives in Bitwarden (Login item `enketo`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-okd-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: pg-okd-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: odk
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "enketo" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
