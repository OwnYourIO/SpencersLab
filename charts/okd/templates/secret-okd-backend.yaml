apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: okd-backend
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  target:
    name: okd-backend
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # PostgreSQL (CNPG cluster pg-okd) — libpq env consumed by the backend.
        # Username hardcoded: it must match the pg-okd initdb owner, so only
        # the password lives in Bitwarden (Login item `enketo`).
        PGHOST: "pg-okd-rw"
        PGDATABASE: "odk"
        PGUSER: "odk"
        PGPASSWORD: "{{ `{{ .password }}` }}"
        PGAPPNAME: "odkcentral"
        # Application config.
        DOMAIN: "{{ $.Values.subdomain }}.{{ $.Values.domain }}"
        SYSADMIN_EMAIL: "{{ $.Values.sysadminEmail }}"
        HTTPS_PORT: "443"
        DB_POOL_SIZE: "10"
        SESSION_LIFETIME: "86400"
        # Mail via the grow smtp-relay (charts/smtp-relay, port 587).
        EMAIL_FROM: "no-reply@{{ $.Values.subdomain }}.{{ $.Values.domain }}"
        EMAIL_HOST: "smtp-relay-mail"
        EMAIL_PORT: "587"
        EMAIL_SECURE: "false"
        EMAIL_IGNORE_TLS: "true"
        EMAIL_USER: ""
        EMAIL_PASSWORD: ""
        # OIDC disabled (ODK's own auth).
        OIDC_ENABLED: "false"
        OIDC_ISSUER_URL: ""
        OIDC_CLIENT_ID: ""
        OIDC_CLIENT_SECRET: ""
        # Upstream compose defaults (ODK's own Sentry project) — single source
        # in values.yaml `sentry:`, shared with the frontend okd-env ConfigMap.
        SENTRY_ORG_SUBDOMAIN: "{{ $.Values.sentry.orgSubdomain }}"
        SENTRY_KEY: "{{ $.Values.sentry.key }}"
        SENTRY_PROJECT: "{{ $.Values.sentry.project }}"
        SENTRY_TRACE_RATE: "0"
        # S3 blob storage unused (local DB-backed storage).
        S3_SERVER: ""
        S3_ACCESS_KEY: ""
        S3_SECRET_KEY: ""
        S3_BUCKET_NAME: ""
  data:
    - secretKey: password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "enketo" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
