# Enketo key material, mounted as files at /etc/secrets in the backend and
# enketo containers (start-enketo.sh asserts sizes 64/32/128 bytes;
# start-odk.sh reads enketo-api-key). The K8s key names are load-bearing —
# they become the file names. Sources: custom field `enketo-secret` on the
# `enketo` Login item; passwords of the `enketo-less` / `enketo-api-key` items.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: okd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  target:
    name: okd
    creationPolicy: Owner
  data:
    - secretKey: enketo-secret
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "enketo" }}'
        property: enketo-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: enketo-less-secret
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "enketo-less" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: enketo-api-key
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "enketo-api-key" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
