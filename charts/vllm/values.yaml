# vLLM (cf-105 C02): the qwen3.8-27b dense engine on the gpu-ai R9700.
# Cluster-internal only (D7/Q4) — the sole client route is the llama-swap
# peers.vllm hop; there is no ingress and no public host.

# Size of the hand-written vllm-cache PVC (templates/pvc-vllm-cache.yaml) —
# parent-only: the claim template is a parent-context manifest, so it reads
# this key at the chart top level rather than from the app-template subtree.
cachePvcSize: 10Gi

app-template:
  # The served model dir, spliced as the FIRST serveArgs item (the
  # positional model — the image entrypoint supplies the verb): the RAW
  # RELEASE dir of amd/Qwen3.8-27B-Quark-AWQ-MXFP4 on the shared 500Gi
  # llama-swap claim. The fp8_mtp.py rewrite step is dropped (the round-2
  # Q8 ruling): AMD's 2026-11-03 module-name mtp-exclude fix makes this
  # revision strictly more loadable than the 156be69f revision the 0.30
  # stack was qualified on, and RADIANCE_QUARK_BF16_MTP=1 is the documented
  # mtp-profile load path (D25/D26); the rewrite re-land is the
  # two-generations-removed fallback (runbook steps 2/3). The dir is PLAIN —
  # no HF-snapshot-hash segment: stable by construction (the R2 D13 path
  # law). The source revision pin is main-sha
  # 93245f7c00f1a8964b66a97c6e02e2fd09080be4: the SHA pins the SOURCE and
  # the PATH pins the OUTPUT, and a re-fetch moves all three homes together
  # (this comment, the C03 staging marker, the runbook). The C03 `setup`
  # init container is the staging actor; the runbook step-2 `ls` is the
  # path authority — a wrong path is an operator-visible startup error fixed
  # here (values), never in a template.
  modelPath: &modelPath /models/Qwen3.8-27B-Quark-AWQ-MXFP4

  # KV-cache dtype, spliced into --kv-cache-dtype. SHIP DEFAULT (D36, the
  # owner's R6-Q1 ruling "q4 default, boot at 262144"): int4_per_token_head
  # — 16,896 B/token, the ~4 GiB attention leg at 262144 — served ONLY by
  # TRITON_ATTN: the per-token-head family and fp8_e5m2 are TRITON_ATTN-only
  # territory; R4D's supported list at the fork pin is
  # auto/bfloat16/fp8/fp8_e4m3 and it refuses the per-(token,head) scales
  # AND e5m2 at startup [171] (the D27-era refusal law survives — the
  # fp8+R4D SHIP pairing does not). fp8 is the documented toggle (the pre-D36
  # default: the compose baseline's literal + the "mandatory FP8 KV" record,
  # R3 L2.2/L1.3) AND the recorded ALTERNATIVE pairing with R4D should the
  # runbook's 3.6 quality/tool legs fail on target — the original D27 gate
  # logic inverted on evidence; that return forces its own D31(e)-class cap
  # ruling, fp8@262144 being arithmetically dead on this card (R6).
  # bf16 / auto stay the tested toggles [91], R4D-capable. The D27 two-edit
  # gate now binds the BOOT CONFIG (the 3.6 promotion — the two edits ship,
  # no longer a non-default experiment). The owner's 48GB-RDNA3
  # q4-headroom note (round-1 OQ3) stays ledgered.
  kvCacheDtype: &kvCacheDtype int4_per_token_head

  # ROCr device index of the R9700 (D2). With the hostPath device pattern
  # the index is HOST enumeration — 0 = R9700, 1 = 8060S — so the pin is
  # deterministic (no plugin allocation to hide it). The index is confirmed
  # at the C06 rocminfo gate — retarget this key, never the template.
  rocrVisibleDevices: "0"

  # The shipped spec method (record key, the D16/R2-D6 pattern; round-2 Q1
  # confirmed: the measured production path — native at 0.30 as the V2
  # DFlash2Speculator, not the 0.27.1 patch-registered method, R3 L2.3).
  # The two documented JSONs: dflash = the shipped specConfig below (K7, the
  # top measured lane: 42.26% acceptance / 3.958 accepted-plus-bonus tokens
  # per draft [108] — recorded, not claimed); mtp =
  # {"method":"mtp","num_speculative_tokens":4,"attention_backend":"R4D","disable_padded_drafter_batch":true}
  # (K4 = the only 0.30-MEASURED MTP depth, R3-Q4; the .env example's K8 is
  # unmeasured general guidance; the mtp K4 lane carries a 29/30
  # TOOL-GATE-FAIL caveat [108] — the toggle is not tool-qualified). The
  # toggle procedure is three coupled edits: swap the specConfig splice
  # below; flip RADIANCE_QUARK_BF16_MTP=1 in the main env — the raw
  # release's bf16 MTP-head load path, baked default 0, needed "only when
  # selecting its MTP profile; non-spec and DFlash do not need that
  # override" [84] (the R3-Q6 coupling); and apply the C03 init's
  # drafter-skip record (the mtp lane needs no drafter). Counter-family
  # expectation: the spec_decode_* family (dflash rides the stock V2 dflash2
  # path, R3 L2.3); the diffusion_* alternative is the recorded fallback —
  # the on-target capture closes it.
  specMethod: "dflash"

  # The shipped --speculative-config JSON, spliced by anchor (all keys
  # native at 0.30, R3 L2.3). K7 = the top measured lane [108]. The draft's
  # max_model_len 262144 is the drafter's native max_position_embeddings:
  # the R3-Q3 "matched to the target" ruling re-bound by the Q11 engine-cap
  # chain — draft and target share the native ceiling (the 8192 profile
  # constant stays the recorded alternative). The drafter's own attention is
  # stock TRITON_ATTN (R3 L2.3); disable_padded_drafter_batch true is the
  # single-stream lever, the compose-class default pair. Omitted keys are
  # 0.30 defaults: draft_tensor_parallel_size (TP1 — their TP2 profile sets
  # 2) and draft_sample_method ("greedy" — the explicit 0.9.3 JSON value is
  # optional now). The model path is the C03-staged drafter tree at
  # revision ee0cb26a (D13/D26). Single-quoted YAML so the inner double
  # quotes survive rendering.
  specConfig: &specConfig '{"method":"dflash","model":"/models/Qwen3.8-27B-DFlash2-FP8","num_speculative_tokens":7,"max_model_len":262144,"attention_backend":"TRITON_ATTN","disable_padded_drafter_batch":true}'

  # D8: the two k8s.grafana.com/* pod annotations, gated. 60 s scrape
  # interval is the k8s-monitoring v4 annotationAutodiscovery feature
  # default — NO metrics.scrapeInterval annotation (Q5 ruling).
  monitoring:
    annotations: true

  # The D24 serve recipe on the compose-baseline ground [92] with the
  # owner-ruled Shape-B constants, the flag order contract-pinned by the
  # test suite (the D36 q4 package moves exactly four values: the
  # kvCacheDtype anchor, the target-attention backend, the ssm-dtype pair,
  # the util literal). --max-model-len 262144 is the round-3 Q11 ENGINE-CAP
  # ruling — the model's native ceiling and, per D36, the BOOT GOAL: the
  # catalog advertisement stays true at the engine iff this boot holds — if
  # the boot refuses, the engine prints its estimated-max-length line [155]
  # and the owner caps the arg at that number: a fresh D31(e)-class ruling
  # after the refusal, the sanctioned B fall-through — the designed outcome
  # path, not a crash class. The ABSENCE of --kv-cache-memory-bytes is the
  # re-measure-gate law (D24): no pool pin is verified on 0.30 at the
  # shipped shape, so the day-one re-measure gate owns the pool and the
  # engine's own calibration rides until then. Util 0.98 is the D36 ceiling
  # start: 0.99 is startup-dead on this card (asks 31.54 > 31.46 free
  # [158]), 0.95 stands recorded as the conservative rung, the 0.85 compose
  # default stays recorded. Honest boot arithmetic: the pool at 0.98 is
  # ~3.67 GiB vs the int4 + ssm-bf16 demand ~4.93 — the 262144 boot still
  # needs ~1.3 GiB out of the padding/graph-profiling levers or a named
  # margin donor (D36; runbook 3.5 owns the verdict).
  # The args START with the model dir: the base image's entrypoint
  # (/opt/radiance_entrypoint.sh) execs `vllm serve "$@"` itself — a verb
  # token in the args would double it (R3 L1.3/L3.1). The list renders
  # VERBATIM (app-template 5.0.1's args field is not templated); the anchor
  # splices *modelPath, *kvCacheDtype and *specConfig are the only
  # templating mechanism, and the JSON values are single-quoted YAML so
  # their inner double quotes survive rendering. Anchors resolve
  # per-document, so the service block's modelPath re-pin does not reach
  # this render: a retarget is the dual edit — the chart
  # modelPath/serveArgs plus the service re-pin kept in sync (the suite's
  # args[0] == service modelPath assert guards the divergence).
  # Dropped vs the cf-105 recipe and the re-plan's D15 derivation (the Q7
  # round-2 set + the 0.30 surface, R3 L2.5): the vllm serve prefix (the
  # entrypoint IS the verb), the
  # --kv-cache-memory-bytes pin (the re-measure-gate law above), the
  # --compilation-config CLI (PIECEWISE rides the
  # RADIANCE_COMPILATION_CONFIG env seam, D25), --enforce-eager (the 0.30
  # qualified lane runs graphed — PIECEWISE rides the env seam below), the
  # GDN dtype flags (the
  # 0.30 qualified-lane defaults — --mamba-cache-mode align is the carried
  # lever; D36 re-lands the ssm half as --mamba-ssm-cache-dtype bfloat16,
  # the conv half --mamba-cache-dtype stays not carried),
  # --enable-sleep-mode + VLLM_SERVER_DEV_MODE +
  # --disable-access-log-for-endpoints (the sleep/wake + dev-route story:
  # the flag exists at 0.30 and is the documented re-enable surface,
  # runbook-owned), --override-generation-config + --chat-template (the
  # 0.30 sampling surface replaces the pair — --generation-config auto on
  # the checkpoint-native template, R3 L1.3), --language-model-only (the
  # vision tower serves: --limit-mm-per-prompt carries).
  serveArgs: &serveArgs
    - *modelPath
    - "--served-model-name"
    - "qwen3.8-27b-vllm"
    - "--tensor-parallel-size"
    - "1"
    - "--max-num-seqs"
    - "3"
    - "--max-model-len"
    - "262144"
    - "--gpu-memory-utilization"
    - "0.98"
    - "--max-num-batched-tokens"
    - "2560"
    - "--kv-cache-dtype"
    - *kvCacheDtype
    - "--attention-backend"
    - "TRITON_ATTN"
    - "--enable-prefix-caching"
    - "--mamba-cache-mode"
    - "align"
    - "--mamba-ssm-cache-dtype"
    - "bfloat16"
    - "--no-async-scheduling"
    - "--enable-auto-tool-choice"
    - "--tool-call-parser"
    - "qwen3_coder"
    - "--reasoning-parser"
    - "qwen3"
    - "--generation-config"
    - "auto"
    - "--default-chat-template-kwargs"
    - '{"reasoning_effort":"xhigh"}'
    - "--trust-remote-code"
    - "--speculative-config"
    - *specConfig
    - "--host"
    - "0.0.0.0"
    - "--port"
    - "8000"
    # The Q7 carries, appended after the compose-baseline block (round-2
    # ruling, 0.30 spot-checked R3 L2.5): the priority-wiring engine half,
    # the preemption headroom, the vision requirement. The 0.30 CLI parses
    # --limit-mm-per-prompt through json.loads — the value is a JSON dict,
    # single-quoted like the specConfig. The 0.27.1 fork launcher's own
    # `image=4` passthrough form is NOT the stock CLI's: it dies at
    # argument parse before the engine starts (observed on-target).
    - "--scheduling-policy"
    - "priority"
    - "--watermark"
    - "0.05"
    - "--limit-mm-per-prompt"
    - '{"image": 4}'

  global:
    nameOverride: &chartName vllm
    # The engine pod never calls the K8s API, so no ServiceAccount object is
    # created (home-assistant/mosquitto precedent); the pod runs tokenless on
    # the namespace default SA (5.x automount default false).
    createDefaultServiceAccount: false

  defaultPodOptions:
    # AMD pod shape (R1 Q5): the HIP runtime needs the host IPC namespace.
    hostIPC: true
    # D8: exactly two k8s.grafana.com/* annotations (scrape + port). Values
    # are ternary-templated on the monitoring.annotations gate; the map is
    # tpl'd as a whole by app-template 5.0.1, so gate-OFF keeps the keys
    # with inert (empty) values instead of dropping them — an empty value
    # is what disables the scrape.
    annotations:
      k8s.grafana.com/scrape: '{{ .Values.monitoring.annotations | ternary "true" "" }}'
      k8s.grafana.com/metrics.portNumber: '{{ .Values.monitoring.annotations | ternary "8000" "" }}'

  controllers:
    vllm:
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        vllm:
          image: &engineImage
            # The C01 thin re-export (containers/vllm-radiance-mxfp4) of
            # the 0.30 Radiance stack. The upstream pin it carries:
            # magiccodingman/vllm-radiance:1.0.397 @
            # sha256:b73bf3e41bc0a1cf7aaa5935bebe31123f549639e69b61a3ffa81acd5f7313e0 —
            # source commit 5b99d66c844fd0a54e4a7eb93b40a1ece009a53d (the
            # image's OCI revision label), engine vLLM 0.30.0 @ ced6857a
            # (the exact v0.30.0 tag commit).
            # containers/vllm-radiance-mxfp4/README.md is the ledger home;
            # this comment is the values-side mirror (D23).
            # PIN-ME: the re-export has no versioned build yet — pin the
            # first :v<run> once docker-build.yaml has run on main, then
            # drop pullPolicy: Always (the cf-105 C06 step-10 law; the
            # runbook carries the follow-through).
            repository: ghcr.io/ownyourio/vllm-radiance-mxfp4
            tag: main
            pullPolicy: Always
          args: *serveArgs
          env:
            # The D25 twenty-var main-container law, D34-restored. The entrypoint's
            # startup gates exit 64 on retired/experimental var mixes
            # [94 L10-64] — this exact set is the qualified combination,
            # and the exact-membership test is the risk control. The
            # image's baked RADIANCE_* profile [86] is NOT re-declared
            # except where the recipe varies it (R3 L3.1's surface
            # choice). RADIANCE_GDN_LAZY is ABSENT on purpose: the
            # lazy-GDN feature was deliberately not ported into the 0.30
            # stack — the multi-turn corruption law holds structurally
            # (R3 L2.3).
            # String values are tpl'd by the library, so the chip index
            # splices from the values key — the template never changes when
            # the R9700 index changes (D2).
            ROCR_VISIBLE_DEVICES: '{{ .Values.rocrVisibleDevices }}'
            # The 8060S-exclusion twin: the entrypoint's NUMA helper reads
            # the HIP/ROCR/CUDA visible-device lists [94 L263].
            HIP_VISIBLE_DEVICES: "0"
            # The serve pod loads two local dirs (target + drafter) — no
            # hub access at boot (the R2 law carries).
            HF_HUB_OFFLINE: "1"
            # The image's entrypoint defaults the caches to /root/.cache/*
            # + /tmp/torchinductor [94 L88-89]; the re-declarations move
            # them onto the vllm-cache claim (C03's mount lands the target)
            # and pin the env-to-mount-path coupling (the repo cache law).
            # The entrypoint's per-lane cache suffix ("-fast-draft",
            # [94 L82-85]) makes one-cache-per-config structural and
            # isolates the dflash lane.
            VLLM_CACHE_ROOT: /cache/vllm
            TORCHINDUCTOR_CACHE_DIR: /cache/inductor
            TRITON_CACHE_DIR: /cache/triton
            AITER_ROOT_DIR: /cache/aiter
            # D34 restoration on the R5 ground: the var is the flash-attn
            # package's own Triton-binding selector (flash_attn_interface.py
            # L11-15 [144]) AND the RDNA ViT gate (rocm.py L438) — REQUIRED
            # WITH the image's flash-attn install layer: the var selects,
            # the package is the payload (the round-1 OQ12 posture returns
            # by owner ruling). The runtime var is chart-owned; the
            # Dockerfile build-time flag stays inline-only.
            FLASH_ATTENTION_TRITON_AMD_ENABLE: "TRUE"
            # The entrypoint seam [94 L182-198]: auto omits --quantization
            # entirely and lets vLLM consume the checkpoint's Quark
            # metadata — required for Quark OCP MXFP4. The .env.example
            # spells the knob WEIGHT_QUANTIZATION; the entrypoint reads the
            # RADIANCE_-prefixed seam, and that seam name is the pin.
            RADIANCE_WEIGHT_QUANTIZATION: "auto"
            # The qualified RX5-safe MXFP4 W4A8 decode subset [84][91]: the
            # RX4/RX5 experimental tiers stay OFF — the entrypoint
            # hard-gates their combinations [94 L26-64] and the
            # publication ran them off [108]. W4A8_MIN_M stays 0: the
            # generic AITER W4A4 fallback is numerically incorrect for one
            # qualified Qwen GDN projection [84].
            RADIANCE_MXFP4: "1"
            RADIANCE_MXFP4_W4A8: "1"
            RADIANCE_MXFP4_W4A8_MIN_M: "0"
            RADIANCE_MXFP4_DECODE_MAX_M: "64"
            RADIANCE_MXFP4_TN4_MIN_M: "2048"
            RADIANCE_MXFP4_WPERM: "1"
            RADIANCE_MXFP4_DECODE_NT: "1"
            # The 0.30 dflash lane's prerequisites (R3 L2.3): the V2 model
            # runner hosts the DFlash2/MTP speculators (0.30's default is
            # V1 — the compose knob sets it), and the measured lane runs
            # the INT2-g128 exact-rerank draft head (baked default 0 [86];
            # its graph-cache isolation is the -fast-draft suffix above).
            VLLM_USE_V2_MODEL_RUNNER: "1"
            RADIANCE_FAST_DRAFT: "1"
            # The measured dflash graph mode [91] — the entrypoint appends
            # it as --compilation-config unless the CLI wins [94]; the
            # recipe carries no CLI form, so this env seam decides. The
            # re-plan's derived capture-size list is NOT the 0.30 form
            # (R3 L2.3).
            RADIANCE_COMPILATION_CONFIG: '{"cudagraph_mode":"PIECEWISE"}'
            # The issue #6/#12 HSA idle-spin mitigation:
            # reporter-verified on this stack lineage, ordinary metrics +
            # GPU monitoring unaffected (R3 L1.4; adopted per R3-Q5). Drop
            # condition, runbook watch: PR #19 (docs) / PR #42 (fix
            # promotion) landing in a new pin.
            HSA_TOOLS_DISABLE_REGISTER: "1"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          probes:
            # The startup budget is the D18 re-derivation on the 0.30 boot
            # class: 60 s + 15 s x 160 = the 40-min conservative envelope
            # (the compose start_period 1800 s is the maintainer's generic
            # budget; the 0.30 cold-cache boot is the 0.9.3 FASTBOOT class
            # minus the gone GDN fp32 autotune plus the V2 capture-gc
            # fasten [100][91], and the first-use AITER JIT — no 0.30
            # pre-bake, R3 L1.2 — is the boot cost the warm /cache
            # amortizes; on-target first boot is the datum, runbook 1.2).
            # It is also the LIVE 262144 pool risk's loud gated refusal
            # (D31): a reject fails startup, it never mis-serves silently.
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8000
                initialDelaySeconds: 60
                periodSeconds: 15
                failureThreshold: 160
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8000
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8000
          resources:
            # RAM law (EXPLORE 8.6): the 32Gi limit is the cap that keeps
            # the 125Gi node undisturbed while Strata's pod coexists.
            requests:
              cpu: 4
              memory: 16Gi
            limits:
              memory: 32Gi
          securityContext:
            # Device access: the strata ruling (EXPLORE 8.7) — privileged +
            # hostPath /dev/kfd + /dev/dri (the persistence entries below),
            # NOT the amd.com/gpu device plugin. The plugin advertises by
            # count and cannot name the card: on this R9700+8060S node it
            # allocated the 8060S and the pod crash-looped with zero HIP
            # devices (2026-11-07). Chip targeting happens inside, via
            # rocrVisibleDevices on host enumeration (0 = R9700).
            # runAsUser 0: this openSUSE node's /dev/kfd and
            # /dev/dri/renderD* are group 486 (mode 660), not the image's
            # `video` GID 44 — and runc drops effective capabilities on
            # setuid to a non-root uid without ambient caps, so a
            # non-root uid cannot open /dev/kfd even under privileged
            # (EACCES, HIP enumerates 0 devices). Root bypasses the DAC
            # check — the strata privileged+root precedent. runAsGroup 44
            # is inert under root but stays: this exact shape initialized
            # both GPUs on target (2026-11-07). The rest is the upstream
            # AMD pod shape (R1 Q5): the ROCm runtime needs the full ioctl
            # surface (Unconfined seccomp) and SYS_PTRACE for the HIP
            # debugger path — the approved deviation from the repo
            # drop-ALL standard, confined to this pod.
            # No allowPrivilegeEscalation key here: k8s rejects explicit
            # false alongside privileged: true, and escalation is implicit
            # in privileged mode.
            privileged: true
            seccompProfile:
              type: Unconfined
            runAsUser: 0
            runAsGroup: 44
            capabilities:
              add:
                - SYS_PTRACE

      initContainers:
        setup:
          # The staging actor (D14): the same image as the serve plane, by
          # anchor — the script runs this image's own python + huggingface_hub
          # and writes the trees the engine then loads, so two separate image
          # blocks would be one drift surface (stage under one build, serve
          # under another). The suite pins the rendered triple equal.
          image: *engineImage
          # The D26 staging command: the RAW release download (the round-2
          # Q8 ruling dropped the rewrite step) plus the revision-pinned
          # drafter, both with local_dir so the ~20.4 GiB lands directly on
          # the claim and never transits the pod's root FS.
          # Idempotent-skip-first: the marker keys on BOTH shas, so a re-pin
          # of either artifact re-stages while a same-pair re-boot skips in
          # ~10 s; the per-tree config.json guards are the secondary checks.
          # The echo lines name the skipped rewrite as narrative only: no
          # action line invokes it. This step list changes when the Q8 ruling
          # changes — the rewrite's re-land is the runbook's recorded
          # contingency, never an in-place fix.
          # command REPLACES the image entrypoint (k8s semantics, args
          # append): the 0.30 entrypoint's NUMA bind + rocm bandwidth sweep +
          # banner is serve-plane work that reaches for the GPU device path,
          # and this container is device-free by design — staging is pure
          # network + disk IO, no GPU work, and no build step left to run
          # (the libr4d kernels and the 35 release overlays are baked into
          # the C01 image).
          # The body is ONE YAML value: the line breaks are the shell's, not
          # argv splits (a multi-line element renders as a single string).
          command:
            - sh
            - -c
            - |-
              set -e
              TSRC=93245f7c00f1a8964b66a97c6e02e2fd09080be4
              TDRAFT=ee0cb26a8279b7910cc28d82a8a3e15e4728d56f
              MARKER=/models/.staged-mxfp4-$TSRC-$TDRAFT
              TARGET=/models/Qwen3.8-27B-Quark-AWQ-MXFP4
              DRAFTER=/models/Qwen3.8-27B-DFlash2-FP8
              if [ -f "$MARKER" ] && [ -f "$TARGET/config.json" ] && [ -f "$DRAFTER/config.json" ]; then
                echo "mxfp4 staging: marker + trees present — skipping"; exit 0
              fi
              echo "mxfp4 staging: raw release target (amd/Qwen3.8-27B-Quark-AWQ-MXFP4 @ $TSRC — the 2026-11-03 mtp-exclude fix; the fp8_mtp.py rewrite is SKIPPED per the round-2 Q8 ruling, RADIANCE_QUARK_BF16_MTP is the mtp-profile load path)"
              python3 -c "from huggingface_hub import snapshot_download; snapshot_download(\"amd/Qwen3.8-27B-Quark-AWQ-MXFP4\", revision=\"$TSRC\", local_dir=\"$TARGET\")"
              echo "mxfp4 staging: drafter (tcclaviger/Qwen3.8-27B-DFlash2-FP8 @ $TDRAFT — the qualified revision; the weight etag is identical to main f02593d0)"
              python3 -c "from huggingface_hub import snapshot_download; snapshot_download(\"tcclaviger/Qwen3.8-27B-DFlash2-FP8\", revision=\"$TDRAFT\", local_dir=\"$DRAFTER\")"
              touch "$MARKER"
              echo "mxfp4 staging: complete"
          resources:
            # D14's modest pin: both steps are IO-bound hub downloads, so the
            # budget is the hub client's buffering, not the tree sizes.
            requests:
              cpu: 2
              memory: 4Gi
            limits:
              memory: 8Gi
          securityContext:
            # runAsUser 0 here is the claim-ownership fact: the /models trees
            # and the marker on the 500Gi llama-swap claim are root-owned, and
            # this container is the one that writes them. It is NOT the main
            # container's GID-486 device law — the init opens no device, so it
            # takes the repo privilege standard in full (drop ALL, no
            # escalation, no privileged): the approved privileged deviation
            # stays confined to the serve container.
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # No env: the image's baked defaults govern, and the serve plane's
          # HF_HUB_OFFLINE=1 must not reach this container — a pinned-offline
          # downloader is the one failure mode the staging step cannot survive.

  service:
    vllm:
      controller: *chartName
      ports:
        http:
          port: 8000

  persistence:
    # Weights: the EXISTING 500Gi llama-swap claim, mounted per ACTOR —
    # advancedMounts keyed by CONTAINER NAME (app-template 5.0.1's
    # advancedMounts.<controller>.<container>; this controller's serve
    # container is `vllm`, not `main`). The split is the two planes' laws:
    # the engine reads the trees read-only (the D1 read law), the `setup`
    # init writes them (the D14 staging law). What the claim carries: the
    # raw-release tree /models/Qwen3.8-27B-Quark-AWQ-MXFP4, the drafter tree
    # /models/Qwen3.8-27B-DFlash2-FP8, and the
    # .staged-mxfp4-<target-sha>-<drafter-sha> marker. The GGUF file the
    # llama.cpp rungs serve stays on the claim — do-not-delete (the class-10
    # rung's ground). RWO same-node double mount is the single-node pattern.
    models:
      existingClaim: llama-swap
      advancedMounts:
        vllm:
          vllm:
            - path: /models
              readOnly: true
          setup:
            - path: /models
    # The 0.30 compile caches on the hand-written vllm-cache claim
    # (templates/pvc-vllm-cache.yaml) — the library renders no PVC for
    # existingClaim entries, so the claim itself is hand-written. The mount
    # moved /data → /cache to land the four /cache/* paths the D25 env names
    # (VLLM_CACHE_ROOT, TORCHINDUCTOR_CACHE_DIR, TRITON_CACHE_DIR,
    # AITER_ROOT_DIR). The path move IS the fresh subtree: one cache
    # directory per image+model+config, so the GGUF-era /data content stays
    # on the claim unmounted and inert — a directory that replays graphs
    # traced under the old settings fails the new boot (D19; the entrypoint's
    # per-lane cache suffix then isolates the dflash lane within it).
    cache:
      existingClaim: vllm-cache
      globalMounts:
        - path: /cache
    # HIP shared memory for the single GPU worker (R1 Q5 shm sizing).
    shm:
      type: emptyDir
      medium: Memory
      sizeLimit: 8Gi
      globalMounts:
        - path: /dev/shm
    # The GPU device nodes — hostPath per the strata ruling (the
    # securityContext comment carries the why), so the container sees host
    # enumeration and rocrVisibleDevices pins the R9700 from it.
    kfd:
      type: hostPath
      hostPath: /dev/kfd
      hostPathType: CharDevice
      globalMounts:
        - path: /dev/kfd
    dri:
      type: hostPath
      hostPath: /dev/dri
      hostPathType: Directory
      globalMounts:
        - path: /dev/dri
