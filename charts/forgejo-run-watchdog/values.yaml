# gpu's historical sentinel string, kept as fleet practice (searxng/neo4j
# carry the same label while resolving elsewhere). These defaults are NOT
# the delivery path: the real uuids arrive via the forgejo-run-watchdog
# bitwardenIds app block in custom-values/gpu/prod-values.yaml, which base's
# charts appset projects into this Application's valuesObject (that file is
# fetched through the services.gpu.customValuesUrls cluster annotation — the
# gpu annotation that actually feeds uuids; the older
# services.gpu.bitwardenIds parameter projection was removed fleet-wide).
# With the app block absent or unfilled, the ExternalSecret renders the
# sentinel/OVERRIDE_NEEDED literal and its fetch fails visibly hourly.
#
# Both keys reuse the very same Bitwarden items as charts/forgejo-secret-seed
# (no new mandatory items): the PAT's write:repository scope covers the
# runs-API reads, and the Netlify item carries the token plus site ids.
bitwardenIds:
  # Bitwarden item hugo-build-netlify; login password = auth token, custom
  # fields site_id_com = the prod site id the fallback leg queries.
  netlify: OVERRIDE_VIA_CLUSTER_ANNOTATION
  # Bitwarden item hugo-build-forgejo (login item; password = repo-write
  # PAT — the same item the seeder uses; write:repository covers the
  # runs-API reads and the stale-run dispatch).
  forgejo-pat: OVERRIDE_VIA_CLUSTER_ANNOTATION

# Defaults for the check-script knobs (aliased into app-template.watchdog
# below). NOT an override path: the env carriers template against subchart
# values, where only the nested block is visible — a per-release watchdog.*
# override never reaches the env.
watchdog: &watchdogDefaults
  # Canonical Forgejo host (infra instance); the gpu job reaches it over the
  # same public chain the seeder uses.
  forgejoUrl: https://git.spencerslab.com
  # Config, not sentinels: renders as-is; the owner confirms the exact org
  # and repo name when the repo is created (the same pair the seeder
  # carries — one values edit corrects both charts).
  repoOwner: CuratedForest
  repoName: CuratedForest.com
  # The daily sync schedule's workflow file (site-staging's sync.yml). The
  # Gitea-1.22 dispatch API accepts the filename as the workflow id, so no
  # separate id indirection is needed.
  syncWorkflow: sync.yml
  # Dispatches always target the prod branch: merge to main is what deploys
  # curatedforest.com.
  dispatchRef: main
  # Freshness threshold = 2x the DAILY sync cadence: one missed day is a late
  # run, two missed days is a dead schedule. The alerting knob — to tighten
  # it once the cadence settles, set app-template.watchdog.maxAgeHours
  # (per-release values or --set); the top-level key here is the default
  # definition only.
  maxAgeHours: 48
  # Netlify-fallback threshold: prod deploys are merge-driven (human review
  # in the loop), so this leg is a liveness floor, not a freshness promise.
  # Entered only when the runs endpoint 404s.
  maxAgeDays: 3
  notify:
    # Channel is the owner's value, not the chart's: point the URL at any
    # receiver (HA/n8n/gotify/ntfy — HA lives in services/grow, so no
    # in-cluster receiver is assumed). Unset = a stale check skips the POST
    # loudly and the job exits non-zero until a URL is supplied. The JSON
    # body the receiver gets is plain, so no receiver-specific shaping here.
    url: ""

app-template:
  # The authoritative override path for the check-script knobs: the env
  # carriers below template against subchart values, where only this nested
  # block is visible (e.g. app-template.watchdog.maxAgeHours — the
  # nested-override convention the forgejo-runner releases use). The
  # top-level watchdog block is the default source this alias expands, so a
  # chart edit moves both sides together.
  watchdog: *watchdogDefaults

  global:
    nameOverride: forgejo-run-watchdog

  controllers:
    watchdog:
      type: cronjob
      annotations:
        # Fleet convention; the job pods read the live Secret through the
        # volume mount anyway.
        reloader.stakater.com/auto: "true"
      cronjob:
        # HOURLY check even though the sync cadence is daily: the watchdog
        # is the compensating control for the schedule trigger (the fragile
        # leg of Actions-type systems), and at one shot/day every missed
        # schedule costs a stale day. The :23 offset dodges on-the-hour
        # scheduler hotspots and the sync run's own :17 start. Stale runs
        # re-alert and re-dispatch every hour — no state between runs,
        # simpler than persistence and safe (the site's concurrency group
        # queues a dispatched run behind a running one).
        schedule: "23 * * * *"
        # Overlapping checks of the same stale window are pure churn.
        concurrencyPolicy: Forbid
        ttlSecondsAfterFinished: 3600
        # Transient egress blips to the public hosts are the expected
        # failure mode; OnFailure retries keep them in one job.
        backoffLimit: 2
      pod:
        # A failed check must surface in job status/pod logs, not silently restart.
        restartPolicy: OnFailure
        securityContext:
          # curlimages/curl declares a non-numeric USER (curl_user); kubelet
          # cannot verify runAsNonRoot against a name, so pin the numeric
          # ids from the image (curl_user = 100:100).
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 100
      containers:
        watchdog:
          image:
            repository: docker.io/curlimages/curl
            tag: 8.23.0
          # The image entrypoint is curl itself; /bin/sh is busybox ash —
          # the script must not assume bash (no process substitution, no
          # JSON tooling beyond grep/sed).
          command: ["/bin/sh", "/watchdog/check.sh"]
          env:
            MAX_AGE_HOURS: '{{ .Values.watchdog.maxAgeHours }}'
            MAX_AGE_DAYS: '{{ .Values.watchdog.maxAgeDays }}'
            NOTIFY_URL: '{{ .Values.watchdog.notify.url }}'
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

  persistence:
    script:
      type: configMap
      name: forgejo-run-watchdog-script
      globalMounts:
        - path: /watchdog
    secrets:
      # Keys arrive as files named after the ExternalSecret target template
      # keys (forgejo_pat, netlify_auth_token, netlify_site_id) —
      # credentials are never inlined into env or command lines.
      type: secret
      name: forgejo-run-watchdog
      globalMounts:
        - path: /secrets
