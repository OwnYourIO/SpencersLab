# One mixed-store ExternalSecret for the watchdog: the two reused Bitwarden
# items split across the stores by shape — login passwords via
# bitwarden-login, the site-id custom field via bitwarden-fields — so each
# mapping pins its own sourceRef.storeRef (archon/immich-analyze precedent,
# same shape as charts/forgejo-secret-seed). The spec-level secretStoreRef
# is not required by ESO (live mixed-store precedents run without one); it
# stays because every entry overrides it anyway, making the field inert here
# and compatible with older ESO CRDs that demand it.
#
# Target Secret keys are the file names /watchdog/check.sh cats under /secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-run-watchdog
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: forgejo-run-watchdog
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        forgejo_pat: "{{ `{{ .forgejo_pat }}` }}"
        netlify_auth_token: "{{ `{{ .netlify_auth_token }}` }}"
        netlify_site_id: "{{ `{{ .netlify_site_id }}` }}"
  data:
    - secretKey: forgejo_pat
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "forgejo-pat" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: netlify_auth_token
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "netlify" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: netlify_site_id
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "netlify" }}'
        property: site_id_com
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
