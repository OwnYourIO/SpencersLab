apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-langflow-mcp-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: pg-langflow-mcp-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Username is hardcoded to the CNPG managed role name; only the
        # password is sourced from Bitwarden.
        username: readonly
        password: '{{ `{{ .password }}` }}'
  data:
    - secretKey: password
      remoteRef:
        key: {{ index .Values "bitwardenIds" "mcp-pg-langflow" }}
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
