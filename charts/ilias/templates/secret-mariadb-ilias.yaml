# Bitwarden credentials for the mariadb-operator instance (mariadb-ilias).
# Repo pattern: skills/helm-chart-creation/references/chart-templates.md
# "MariaDB instance" — two login items: <service>-mariadb-root (root password)
# and <service>-mariadb (app user; username must match the User CR's name).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-ilias-root
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: mariadb-ilias-root
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "ilias-mariadb-root" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-ilias-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: mariadb-ilias-app
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "ilias-mariadb" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
