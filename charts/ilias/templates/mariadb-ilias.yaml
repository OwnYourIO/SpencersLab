# MariaDB for ILIAS via mariadb-operator (charts/mariadb-operator on grow).
# Repo pattern: skills/helm-chart-creation/references/chart-templates.md
# "MariaDB instance" — never sidecar a MariaDB container in new charts.
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb-ilias
spec:
  rootPasswordSecretKeyRef:
    name: mariadb-ilias-root
    key: password
    # Required for ArgoCD SSA convergence: the operator's defaulting webhook
    # injects generate: false on apply; without declaring it the app stays
    # OutOfSync forever (the only defaulted field that shows in the diff).
    generate: false
  # renovate: datasource=docker depName=mariadb
  image: mariadb:11.8.8
  replicas: 1 # standalone — grow is single-node (no Galera/replication)
  port: 3306
  # ILIAS requires a 3-byte utf8 (utf8mb3) server collation.
  myCnf: |
    [mysqld]
    character-set-server = utf8
    collation-server = utf8_general_ci
  storage:
    # local-path CANNOT expand — sized up front (was the 10Gi ilias-mysql PVC
    # in the original sidecar design).
    size: 10Gi
    storageClassName: local-path
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  # The operator runs the instance pod non-root (UID 999); the official image
  # entrypoint initializes the datadir as the mysql user without issue.
  #
  # Override the operator's default startup probe (~50s budget). First-boot
  # init = mariadb-install-db (75s+ on a slow node) + a temporary server that
  # applies the root-password/user SQL. If the probe kills the container
  # mid-init, the next start sees an initialized datadir and SKIPS the init
  # SQL forever — root password never set, permanent CrashLoopBackOff with
  # "Access denied for user 'root'@'localhost'" (observed 2026-09-14).
  # Budget: 20s delay + 60 x 10s = ~10 minutes. Same exec as the operator
  # default; liveness/readiness stay operator defaults.
  startupProbe:
    exec:
      command:
        - bash
        - -c
        - mariadb -u root -p"${MARIADB_ROOT_PASSWORD}" -e "SELECT 1;"
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
  metrics:
    enabled: true
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: ilias
spec:
  mariaDbRef:
    name: mariadb-ilias
  name: ilias
  # ILIAS requires 3-byte utf8; tables ILIAS creates inherit the DB default.
  characterSet: utf8
  collate: utf8_general_ci
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: ilias
spec:
  mariaDbRef:
    name: mariadb-ilias
  # Must match the username of the Bitwarden item behind bitwardenIds.ilias-mariadb.
  name: ilias
  passwordSecretKeyRef:
    name: mariadb-ilias-app
    key: password
  maxUserConnections: 20
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: ilias
spec:
  mariaDbRef:
    name: mariadb-ilias
  privileges:
    - ALL PRIVILEGES
  database: ilias
  table: "*"
  username: ilias
---
# Connection secret consumed by the ilias + cron containers via envFrom.
# secretTemplate renames the keys straight to ILIAS env vars, so no
# per-container DB host overrides are needed anywhere.
apiVersion: k8s.mariadb.com/v1alpha1
kind: Connection
metadata:
  name: ilias
spec:
  mariaDbRef:
    name: mariadb-ilias
  username: ilias
  passwordSecretKeyRef:
    name: mariadb-ilias-app
    key: password
  database: ilias
  # Named ilias-db per lab convention (playsms-style <service>-db), not the
  # skill-doc default mariadb-<service>-conn.
  secretName: ilias-db
  secretTemplate:
    hostKey: ILIAS_DB_HOST
    portKey: ILIAS_DB_PORT
    usernameKey: ILIAS_DB_USER
    passwordKey: ILIAS_DB_PASSWORD
    databaseKey: ILIAS_DB_NAME
  healthCheck:
    interval: 30s
