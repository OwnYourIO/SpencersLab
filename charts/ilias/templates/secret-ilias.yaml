apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}
spec:
  refreshInterval: 1h
  target:
    name: {{ .Release.Name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # ILIAS root user password (Bitwarden login item, username: root).
        ILIAS_ROOT_PASSWORD: "{{ `{{ .root_password }}` }}"
        # Public URL through the proxy-local hub (domain injected by the appset,
        # publicSubdomain injected via the grow charts entry's values:).
        ILIAS_HTTP_PATH: "https://{{ .Values.publicSubdomain }}.{{ $.Values.domain }}"
        # DB connection env (ILIAS_DB_HOST/PORT/USER/PASSWORD/NAME) comes from
        # the ilias-db Secret rendered by the Connection CR — see
        # templates/mariadb-ilias.yaml.
  data:
    - secretKey: root_password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "ilias" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
