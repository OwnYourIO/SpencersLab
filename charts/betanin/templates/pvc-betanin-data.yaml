apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: betanin-data
  namespace: default
  annotations:
    # betanin SQLite DB — keep the data even if the Application is pruned.
    argocd.argoproj.io/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
