# Healthcheck route for the kubelet probes (deployment.livenessPath/readinessPath=/healthcheck).
#
# This is rendered here (instead of the upstream chart's ingressRoute.healthcheck)
# because it MUST carry an explicit route priority: with --api.insecure and
# --api.dashboard enabled, Traefik's internal provider auto-creates a dashboard
# catch-all router on the same "traefik" entrypoint — rule PathPrefix(`/`),
# priority MaxInt-2 (9223372036854775805) — which outranks any default-priority
# router and answers /healthcheck with 404. The upstream template cannot set a
# priority, so its healthcheck IngressRoute can never work (verified live
# 2026-09-10: router "enabled" in the API yet /healthcheck -> 404 on every
# instance; only /ping survived because its internal router has priority MaxInt).
#
# MaxInt-1 beats the dashboard router; the internal ping router (MaxInt, rule
# /ping) does not overlap this rule. If the crowdsec plugin middleware is
# invalid this router doesn't load -> probes get 404 -> kubelet restarts the
# pod, which is the intended self-heal.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-healthcheck
  namespace: kube-system
spec:
  entryPoints:
    - traefik
  routes:
    - match: PathPrefix(`/healthcheck`)
      kind: Rule
      priority: 9223372036854775806
      middlewares:
        - name: crowdsec
          namespace: kube-system
      services:
        - name: ping@internal
          kind: TraefikService
