keycloak:
  realm: OVERRIDE_VIA_CUSTOM_VALUES

bitwardenIds:
  crowdsec-secret: OVERRIDE_VIA_CUSTOM_VALUES
  traefik-sso-secret: OVERRIDE_VIA_CUSTOM_VALUES
  traefik-mqtt: OVERRIDE_VIA_CUSTOM_VALUES

domain: OVERRIDE_VIA_APPSET
clusterName: OVERRIDE_VIA_APPSET
namespace: OVERRIDE_VIA_APPSET

cert-manager:
  installCRDs: true

traefik:
  fullnameOverride: "traefik"

  additionalArguments:
    - "--api"
    - "--api.dashboard=true"
    - "--api.insecure=true"
    - "--serversTransport.insecureSkipVerify=true"
    - "--providers.file.directory=/data/"
    # Force all port 80 traffic to 443
    - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
    - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
    # Plugins are re-downloaded from plugins.traefik.io on EVERY startup
    # (the local archive cache is wiped first), so right after a node reboot —
    # before egress is up — the download times out and Traefik would start with
    # ALL plugin middlewares dead (every router using them is dropped → 404s).
    # Abort instead: the pod crashloops and retries until the download succeeds.
    # NOTE: this must be a CLI flag. TRAEFIK_* env vars are silently ignored
    # whenever traefik runs with CLI args (paerser stops at the first loader
    # that succeeds — FlagLoader — and never runs EnvLoader).
    - "--experimental.abortonpluginfailure=true"

  ingressClass:
    enabled: true
    name: "traefik" # Change from "proxy-local-traefik"

  persistence:
    enabled: true
    existingClaim: "proxy-allowlist"
    accessMode: ReadWriteOnce

  providers:
    kubernetesCRD:
      allowCrossNamespace: true
      allowExternalNameServices: true
    kubernetesIngress:
      allowEmptyServices: true
      allowExternalNameServices: true
    file:
      enabled: true
      watch: true
  deployment:
    # Route the kubelet probes through the middleware-gated healthcheck
    # IngressRoute below (see the note there — /ping is shadowed by Traefik's
    # internal MaxInt-priority ping router and can never fail).
    livenessPath: /healthcheck
    readinessPath: /healthcheck
    additionalContainers:
      - name: user-allowlist-mqtt
        # Pinned to the latest published release tag (was :main). Renovate keeps
        # this current; see the pinned-image rule in skills/helm-chart-creation.
        image: ghcr.io/ownyourio/traefik-mqtt-allowlist:0.0.12

        envFrom:
          - secretRef:
              name: traefik-mqtt
        securityContext:
          runAsUser: 65532
          runAsGroup: 65532
        volumeMounts:
          - name: data
            mountPath: /data

  # NOTE: TRAEFIK_EXPERIMENTAL_ABORTONPLUGINFAILURE used to be set here as an
  # env var, but env vars are never decoded when traefik runs with CLI args
  # (paerser's loader loop stops at FlagLoader). The setting now lives in
  # additionalArguments as --experimental.abortonpluginfailure=true.

  experimental:
    plugins:
      geoblock:
        moduleName: "github.com/PascalMinder/geoblock"
        version: "v0.3.6"
      keycloakopenid:
        moduleName: "github.com/jmcarbo/keycloakopenid"
        version: "v0.1.40"
      crowdsec:
        moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
        version: "v1.3.5"
      traefik-plugin-redirect-on-status:
        moduleName: "github.com/m-riedel/traefik-plugin-redirect-on-status"
        version: "v1.0.1"
      rewrite-password-with-char-req:
        moduleName: "github.com/traefik/plugin-rewritebody"
        version: "v0.3.1"
      theme-park:
        moduleName: "github.com/packruler/traefik-themepark"
        version: "v1.4.2"

  service:
    type: LoadBalancer
    spec:
      externalTrafficPolicy: Local

  ports:
    web:
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      proxyProtocol:
        trustedIPs:
          - "10.42.0.0/16"
      forwardedHeaders:
        trustedIPs:
          - "10.42.0.0/16"
    websecure:
      proxyProtocol:
        trustedIPs:
          - "10.42.0.0/16"
      forwardedHeaders:
        trustedIPs:
          - "10.42.0.0/16"
      transport:
        respondingTimeouts:
          readTimeout: 650s
          writeTimeout: 0
          idleTimeout: 650s

  # Without this, Traefik's ping returns ok when the middleware is infact down and Traefik needs to restart.
  #
  # IMPORTANT: the probes must NOT use /ping. Traefik auto-creates an internal
  # "ping" router on the traefik entrypoint with rule PathPrefix(`/ping`) and
  # priority MaxInt and NO middlewares, which shadows any /ping IngressRoute and
  # answers kubelet probes with 200 no matter how broken the middlewares are.
  #
  # The probes therefore hit /healthcheck (deployment.livenessPath/
  # readinessPath), served through the crowdsec middleware so a broken plugin
  # middleware means the route doesn't load → probe gets 404 → kubelet
  # restarts the pod.
  #
  # That route is rendered by THIS chart (templates/ingressroute-healthcheck.yaml),
  # not by the upstream healthcheck IngressRoute, because the upstream template
  # cannot set a route priority: with --api.insecure + --api.dashboard Traefik
  # auto-creates a dashboard catch-all router (PathPrefix(`/`), priority
  # MaxInt-2 = 9223372036854775805) on the same entrypoint, which outranks any
  # default-priority router and answers /healthcheck with 404. Verified live
  # 2026-09-10: upstream route "enabled" in the API yet /healthcheck 404 on
  # every instance → v2 probes crashlooped. Our route sets priority MaxInt-1.
  ingressRoute:
    healthcheck:
      enabled: false
  # The startupProbe covers the slow part of boot on the INTERNAL ping router
  # (always 200 once the process listens): plugin re-download from
  # plugins.traefik.io + provider sync can take well over 10s after a node
  # reboot, and entrypoints only open after plugins load. Liveness/readiness
  # are suspended while it runs.
  startupProbe:
    httpGet:
      path: /ping
      port: 8080
      scheme: HTTP
    initialDelaySeconds: 2
    periodSeconds: 2
    failureThreshold: 30
    timeoutSeconds: 2
  # failureThreshold 1 is NOT survivable: after startup the /healthcheck route
  # needs another 1-3s (first provider config build) before it can answer, so a
  # threshold-1 liveness kills every healthy start and crashloops forever
  # (observed live 2026-09-10: 9 restarts in 15 min, every run 2-8s).
  # Threshold 2 still detects a genuinely broken middleware within ~20s.
  livenessProbe: 
    failureThreshold: 2
  readinessProbe:
    failureThreshold: 2

  metrics:
    prometheus:
      serviceMonitor:
        enabled: true
        namespace: default

  volumes:
    - name: "{{ .Release.Name }}-bouncer-tls"
      mountPath: /etc/traefik/crowdsec-certs/
      type: secret
    - name: traefik-sso
      type: secret
      mountPath: "/run/secrets/oidc"

  logs:
    # general:
    #  level: DEBUG
    access:
      enabled: true

crowdsec:
  container_runtime: containerd
  tls:
    enabled: true
    agent:
      tlsClientAuth: true
  secrets:
    externalSecret:
      name: "crowdsec-keys"
      csLapiSecretKey: "csLapiSecretKey"
      registrationTokenKey: "registrationToken"

  lapi:
    storeCAPICredentialsInSecret: true
    storeLAPICscliCredentialsInSecret: false
    env:
      # TODO: Handle this better
      - name: TZ
        value: America/Denver
      - name: ENROLL_INSTANCE_NAME
        value: proxy-remote
      # Setting the enroll key after initial startup requires force enrollment
      # which currently breaks the local API.
      - name: ENROLL_KEY
        valueFrom:
          secretKeyRef:
            name: crowdsec-keys
            key: ENROLL_KEY
      - name: LEVEL_DEBUG
        value: "true"
    config:
      config.yaml.local: |
        api:
          server:
            auto_registration:
              enabled: false  # Disable password-based registration
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    persistentVolume:
      # Persistent volume for data folder.
      # Stores e.g. registered bouncer api keys
      data:
        enabled: true
        accessModes:
          - ReadWriteOnce
        size: 1Gi
      # Persistent volume for config folder.
      # Stores e.g. online api credentials
      config:
        enabled: false
  agent:
    acquisition:
      - namespace: kube-system
        podName: traefik-[0-9]*
        program: traefik
        poll_without_inotify: true
    env:
      # TODO: Handle this better
      - name: TZ
        value: America/Denver
      - name: COLLECTIONS
        value: >-
          crowdsecurity/linux
          crowdsecurity/traefik
          crowdsecurity/base-http-scenarios
          crowdsecurity/http-cve

    persistentVolume:
      # Persistent volume for config folder.
      # Stores local config (parsers, scenarios etc.)
      config:
        enabled: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
