{{- if index .Values "mcp" "enabled" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-mcp-key
  namespace: default
spec:
  refreshInterval: 1h
  target:
    name: {{ .Release.Name }}-mcp-key
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        ACTUAL_SESSION_TOKEN: "{{ `{{ .token }}` }}"
  data:
    - secretKey: token
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "actualbudget-mcp-key" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
