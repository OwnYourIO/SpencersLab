apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slskd
spec:
  refreshInterval: 1h
  target:
    name: slskd
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        slskd.yml: |
          directories:
            downloads: /media/downloads
            incomplete: /media/downloads/incomplete
          shares:
            directories:
              - /media/Music/automation
          web:
            authentication:
              api_keys:
                tubifarry:
                  key: "{{ `{{ .api_key }}` }}"
                  role: readwrite
                  cidr: 0.0.0.0/0
          soulseek:
            username: "{{ `{{ .username }}` }}"
            password: "{{ `{{ .password }}` }}"
            listen_port: 50300
  data:
    - secretKey: username
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "slskd" }}'
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "slskd" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: api_key
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "slskd" }}'
        property: api_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
