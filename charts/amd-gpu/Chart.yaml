# =============================================================================
# charts/amd-gpu — FIRST-PARTY repo-owned chart (cf-143 C08, owner item 5).
# Governance: DECISIONS D23 supersedes D19; the conversion facts: RESEARCH
# §R7-Q5. The pod renders entirely from the app-template: values subtree —
# the single app-template 5.0.1 dependency below is this chart's only
# upstream, so dependency updates ride renovate as everywhere else in the
# repo and the upstream-snapshot debt D19 carried no longer exists.
#
# Facts migrated line-for-line from the replaced governance line:
#   - args: declaring args REPLACES the image CMD, so the Dockerfile CMD
#     trio is restated in full in values.yaml; the -v=5 law survives there
#     as the args comment (it is what makes the plugin runbook-log-bearing:
#     the C06 runbook receipt (b) greps the product-enumeration lines only
#     -v=5 prints). The product-naming flag is now a plain arg — the
#     plumbing key and its per-cluster splice died with the old values
#     file; a per-cluster strategy change is the service-block override.
#   - RBAC fact: the labeller classes are labeller-gated and render NOTHING
#     today (§R7-Q5); the shipped chart therefore carries zero
#     ServiceAccount/Role surface. When the labeller ever returns, the
#     app-template serviceAccount / rbac.roles / rbac.bindings values keys
#     are the expression — no inherited templates come back.
#   - object names: the D19 byte-pin is intentionally traded (D23 strain
#     1); the rename-set is enumerated beside the expected-names ledger in
#     values.yaml, and the swap lands as the same Application's one-sync
#     prune+create inside the flip wave.
#   - image + digests + the docker renovate pin: moved verbatim into the
#     app-template image block in values.yaml (D2 posture: tag + digest
#     ledger comment, no digest field).
#   - product-naming expected-names ledger: moved to values.yaml, names per
#     the D24 lane ruling (7551/C0 via the patched amdgpu.ids ConfigMap).
# =============================================================================
apiVersion: v2
name: amd-gpu
description: AMD GPU device plugin (ROCm k8s-device-plugin) with product resource naming, first-party app-template chart
type: application
version: 1.0.0
appVersion: "1.31.0.12"
dependencies:
# The repo app-template idiom: the single dep bundles the common chart
# internally, so the workload renders from this chart's app-template: values
# with no parent-side loader (charts/radiance Chart.yaml comment, verbatim
# law). type: daemonset is set explicitly — app-template defaults controllers
# to deployment and a device plugin must not run as one (§R7-Q5 caveat).
- name: app-template
  version: 5.0.1
  repository: https://bjw-s-labs.github.io/helm-charts/
