#   args hook), full DaemonSet document verbatim:
# KNOWN DEFECT (C09/D25, test-session authorized header line, body bytes
#   unchanged): this render has NO command: key and the image carries no
#   ENTRYPOINT (§D1.5) — the oracle captured the C07-born args-only bug, so
#   for COMMAND/ENTRYPOINT semantics it is the DEFECT EVIDENCE, not the
#   parity authority: the command-parity authority is
