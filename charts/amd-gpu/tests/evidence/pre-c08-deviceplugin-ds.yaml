observed_kinds:
- DaemonSet/amd-gpu-device-plugin-daemonset

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amd-gpu-device-plugin-daemonset
  namespace: default
spec:
  selector:
    matchLabels:
      name: amd-gpu-dp-ds
  template:
    metadata:
      labels:
        name: amd-gpu-dp-ds
    spec:
      containers:
      - args:
        - -logtostderr=true
        - -stderrthreshold=INFO
        - -v=5
        - -resource_naming_strategy=product
        image: docker.io/rocm/k8s-device-plugin:1.31.0.12
        name: amd-gpu-dp-cntr
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /var/lib/kubelet/device-plugins
          name: dp
        - mountPath: /sys
          name: sys
        - mountPath: /var/lib/amd-metrics-exporter/
          name: health
      priorityClassName: system-node-critical
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      volumes:
      - hostPath:
          path: /var/lib/kubelet/device-plugins
        name: dp
      - hostPath:
          path: /sys
        name: sys
      - hostPath:
          path: /var/lib/amd-metrics-exporter/
          type: DirectoryOrCreate
        name: health
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate

