# ERPNext database via mariadb-operator (charts/mariadb-operator on grow).
# Pattern: skills/helm-chart-creation/references/chart-templates.md
# "MariaDB instance (mariadb-operator)".
#
# Deviation from the full pattern: NO Database/User/Grant/Connection CRs —
# `bench new-site` bootstraps the site database + user itself using the DB
# root credentials (jobs.custom create-site container), exactly like the
# frappe chart's built-in mariadb-sts flow did. The root password comes from
# Secret erp-next-db (ExternalSecret erp-next-db-secret, Bitwarden item
# `erp-next-db`).
#
# Image: MariaDB 10.6 LTS — the series the frappe chart's own mariadb-sts
# ships for ERPNext v16; newer series are not what upstream validates
# against. Pinned patch tag per operator best practice.
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb-erp-next
spec:
  rootPasswordSecretKeyRef:
    name: erp-next-db
    key: mariadb-root-password
    # Required for ArgoCD SSA convergence: the operator's defaulting webhook
    # injects generate: false on apply; without declaring it the app stays
    # OutOfSync forever (the only defaulted field that shows in the diff).
    generate: false
  # renovate: datasource=docker depName=mariadb
  image: mariadb:10.6.28
  replicas: 1
  port: 3306
  storage:
    # local-path cannot expand — size adequately up front.
    size: 8Gi
    storageClassName: local-path
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # Override the operator's default startup probe (~50s budget). First-boot
  # init = mariadb-install-db + a temporary server that applies the
  # root-password SQL; if the probe kills the container mid-init, the next
  # start sees an initialized datadir and SKIPS the init SQL forever
  # (permanent CrashLoopBackOff — observed on grow 2026-09-14, ilias +
  # erp-next). Budget: 20s delay + 60 x 10s = ~10 minutes.
  startupProbe:
    exec:
      command:
        - bash
        - -c
        - mariadb -u root -p"${MARIADB_ROOT_PASSWORD}" -e "SELECT 1;"
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
  metrics:
    enabled: true
