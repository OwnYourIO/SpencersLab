# MariaDB root credentials from the Bitwarden login item `erp-next-db`
# (username root). Target Secret `erp-next-db` is consumed by:
# - the MariaDB CR (templates/mariadb-erp-next.yaml,
#   rootPasswordSecretKeyRef, key mariadb-root-password)
# - the create-site job (keys mariadb-root-username/mariadb-root-password).
# The frappe chart renders no Secret of its own here: mariadb-sts is
# disabled and dbRootPassword stays unset. The create-site job also reads
# both keys (DB_ROOT_USER / DB_ROOT_PASSWORD).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erp-next-db-secret
spec:
  refreshInterval: 1h
  target:
    name: erp-next-db
    creationPolicy: Owner
  data:
    - secretKey: mariadb-root-username
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "erp-next-db" }}'
        property: username
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: mariadb-root-password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "erp-next-db" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
