# Frappe Administrator credentials from the Bitwarden login item `erp-next`
# (username Administrator). Target name `erp-next-admin` is consumed by the
# create-site job (jobs.custom container env ADMIN_PASSWORD, key password);
# `username` is synced for completeness/discovery.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erp-next-secret
spec:
  refreshInterval: 1h
  target:
    name: erp-next-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "erp-next" }}'
        property: username
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "erp-next" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
