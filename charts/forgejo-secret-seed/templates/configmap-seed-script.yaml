# The seeder script (mounted at /seed, run by the CronJob container). The
# repo/org pair and the Forgejo URL come from seed.* values at render time,
# so correcting the owner/repo after the repo is created is a values edit —
# the script itself is edit-free.
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-secret-seed-script
data:
  seed.sh: |
    #!/bin/sh
    set -eu

    # Forgejo PUT /actions/secrets/{name} is create-or-update, so a daily
    # re-run of unchanged values is harmless churn and a rotated credential
    # converges by the next run. The {data}-only body matches
    # CreateOrUpdateSecretOption (required: data) in the Gitea-1.22 API
    # baseline the target's Forgejo embeds; the instance's
    # /api/v1/swagger.json is not served (swagger disabled), so the first
    # run's log lines are the live verification.
    API="{{ .Values.seed.forgejoUrl }}/api/v1/repos/{{ .Values.seed.repoOwner }}/{{ .Values.seed.repoName }}/actions/secrets"

    # Command substitution trims the trailing newline the Secret file may carry.
    PAT=$(cat /secrets/forgejo_pat)

    put_secret() {
        # $1 = "<Forgejo repo-secret name>:<file under /secrets>" — one
        # argument per secret so adding or renaming one is a single edit. The
        # body is built by shell quoting, no JSON tooling: all five values
        # are issuer-generated tokens and UUIDs whose alphabets are JSON-safe
        # unescaped. A value that somehow broke the body would draw a 4xx,
        # which -f turns into a non-zero exit.
        name=${1%%:*}
        value=$(cat "/secrets/${1#*:}")
        curl -fsS -X PUT \
            -H "Authorization: token $PAT" \
            -H 'Content-Type: application/json' \
            --data-binary '{"data":"'"$value"'"}' \
            "$API/$name"
        echo "seeded $name"
    }

    put_secret IMMICH_API_KEY:immich_api_key
    put_secret NETLIFY_AUTH_TOKEN:netlify_auth_token
    put_secret NETLIFY_SITE_ID:netlify_site_id
    put_secret NETLIFY_SITE_ID_FARM:netlify_site_id_farm
    put_secret FORGEJO_SYNC_PAT:forgejo_pat

    echo "seed complete"
