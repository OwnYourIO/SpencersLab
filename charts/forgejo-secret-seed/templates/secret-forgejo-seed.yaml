# One mixed-store ExternalSecret for the seeder: the three Bitwarden items
# split across the two stores by shape — login items expose their password
# via bitwarden-login, custom fields via bitwarden-fields — so each mapping
# pins its own sourceRef.storeRef (archon/immich-analyze precedent). The
# spec-level secretStoreRef is not required by ESO (live mixed-store
# precedents run without one); it stays because every entry overrides it
# anyway, making the field inert here and forward-compatible with older
# ESO CRDs that demand it.
#
# Target Secret keys are the file names /seed/seed.sh cats under /secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-secret-seed
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: forgejo-secret-seed
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        immich_api_key: "{{ `{{ .immich_api_key }}` }}"
        netlify_auth_token: "{{ `{{ .netlify_auth_token }}` }}"
        netlify_site_id: "{{ `{{ .netlify_site_id }}` }}"
        netlify_site_id_farm: "{{ `{{ .netlify_site_id_farm }}` }}"
        forgejo_pat: "{{ `{{ .forgejo_pat }}` }}"
  data:
    - secretKey: immich_api_key
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "immich-api-key" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: netlify_auth_token
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "netlify" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: netlify_site_id
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "netlify" }}'
        property: site_id_com
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: netlify_site_id_farm
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "netlify" }}'
        property: site_id_farm
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: forgejo_pat
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "forgejo-pat" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
