apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pinchflat-ngx
spec:
  refreshInterval: 1h
  target:
    name: pinchflat-ngx
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY_BASE
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "pinchflat-ngx" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
