bitwardenIds:
  # LOGIN item `minuspod`: password = master passphrase (MUST exist before
  # first boot or provider keys are stored plaintext; back it up offline —
  # losing it makes stored keys/backups unrecoverable). LLM + Whisper both
  # run on llama-swap (gpu cluster), which needs no API keys.
  minuspod: OVERRIDE_VIA_CUSTOM_VALUES

domain: OVERRIDE_VIA_APPSET

app-template:
  global:
    nameOverride: &chartName minuspod

  controllers:
    minuspod:
      annotations:
        reloader.stakater.com/auto: "true"
      # SQLite on RWO + single background worker: never scale above 1.
      # Recreate is app-template's deployment default; explicit for intent.
      strategy: Recreate
      containers:
        app:
          image:
            repository: ttlequals0/minuspod
            # Concrete version tag (repo pinning rule) == current stable
            # channel. CAUTION: MinusPod publishes edge releases as
            # <ver>-cpu tags several times a day — only merge Renovate bumps
            # that match upstream STABLE release notes.
            tag: 2.95.3-cpu
          env:
            TZ: America/Denver
            # LLM via llama-swap on the gpu cluster (OpenAI-compatible, no
            # auth — llama-swap apiKeys is empty). OPENAI_BASE_URL is
            # domain-dependent → rendered in secret-minuspod.yaml. Model is a
            # seed: OPENAI_MODEL only applies while the stored setting is
            # unset; afterwards change it in Settings > AI models.
            LLM_PROVIDER: openai-compatible
            OPENAI_API_KEY: not-needed
            OPENAI_MODEL: qwen3.6-27b-q6
            # Whisper via llama-swap's whisper.cpp (ggml-large-v3) on the gpu
            # cluster — same endpoint as the LLM, no auth. WHISPER_API_BASE_URL
            # is domain-dependent → rendered in secret-minuspod.yaml.
            WHISPER_BACKEND: openai-api
            WHISPER_API_KEY: not-needed
            WHISPER_API_MODEL: whisper-large-v3
            WHISPER_DEVICE: cpu
            # Behind the traefik ingress — real client IPs for rate limits/audit
            MINUSPOD_TRUSTED_PROXY_COUNT: "1"
            # First-boot posture seeds only; stored settings win afterwards —
            # tune later in the Settings UI, not here.
            AUTO_PROCESS_ENABLED: "true"
            FEED_AUTH_ENABLED: "true"
            # NOTE: set no DATA_DIR/DATA_PATH/MINUSPOD_DATA_DIR — the PVC
            # mounts at the default /app/data (2.95.3 path-precedence gotcha).
          envFrom:
            - secretRef:
                name: *chartName   # MINUSPOD_MASTER_PASSPHRASE, WHISPER_API_KEY, OPENAI_BASE_URL, BASE_URL
          probes:
            liveness: &probes
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v1/health
                  port: 8000
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 5
            readiness: *probes
            startup:
              enabled: true
              spec:
                failureThreshold: 60   # migrations run on boot; be generous
                periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              memory: 12Gi
          # Upstream: deploy permissive, tighten deliberately. Keep root +
          # writable rootfs. The entrypoint chowns /app/data and then drops
          # to the app user via setpriv, which needs these capabilities back
          # (drop-ALL alone crash-loops: "setpriv: setresuid failed") —
          # documented exception, plan design decision 14.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
                - SETUID
                - SETGID

  service:
    app:
      controller: *chartName
      type: ClusterIP
      ports:
        http:
          port: 8000

  persistence:
    data:
      existingClaim: *chartName   # PVC from pvc-minuspod-default.yaml; SQLite → RWO local-path, never SeaweedFS/NFS
      globalMounts:
        - path: /app/data
