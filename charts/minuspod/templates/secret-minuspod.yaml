apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minuspod
spec:
  refreshInterval: 1h
  target:
    name: minuspod
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Must exist on FIRST BOOT or provider keys land in the DB plaintext.
        MINUSPOD_MASTER_PASSPHRASE: "{{ `{{ .master_passphrase }}` }}"
        # LLM + Whisper endpoint (llama-swap on the gpu cluster; mesh DNS
        # resolves llama-cpp.<domain> to the gpu traefik; no auth needed).
        # Whisper is served by llama-swap's whisper.cpp (ggml-large-v3).
        OPENAI_BASE_URL: "https://llama-cpp.{{ $.Values.domain }}/v1"
        WHISPER_API_BASE_URL: "https://llama-cpp.{{ $.Values.domain }}/v1"
        # Feed enclosure URLs are built from this — must equal the ingress
        # URL exactly (wrong BASE_URL = feed loads but every audio 404s).
        BASE_URL: "https://minuspod.{{ $.Values.domain }}"
  data:
    - secretKey: master_passphrase
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "minuspod" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
