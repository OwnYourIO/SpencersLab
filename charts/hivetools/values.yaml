# Configuration for hivetools - Combined ToolHive CRDs and Operator
# This chart deploys both the CRDs and the operator in a single installation

# Global namespace for ToolHive components
# The operator will be deployed to this namespace
namespace: default

# Domain for MCP ingress (override via custom-values)
domain: OVERRIDE_VIA_CUSTOM_VALUES

# Bitwarden secret IDs
bitwardenIds:
  github-mcp: OVERRIDE_VIA_CUSTOM_VALUES
  homeassistant-mcp: OVERRIDE_VIA_CUSTOM_VALUES
  mcp-sso: OVERRIDE_VIA_CUSTOM_VALUES
  # Grafana service-account token (Viewer) for the grafana MCP server.
  grafana-mcp-token: OVERRIDE_VIA_CUSTOM_VALUES
  # Read-only Postgres MCP role credentials (one Bitwarden LOGIN item per
  # CNPG cluster; username=readonly). Also back the composed DATABASE_URI secrets
  # rendered by templates/secret-postgres-mcp.yaml.
  mcp-pg-coder: OVERRIDE_VIA_CUSTOM_VALUES
  mcp-pg-flowise: OVERRIDE_VIA_CUSTOM_VALUES
  mcp-pg-langflow: OVERRIDE_VIA_CUSTOM_VALUES
  mcp-pg-n8n: OVERRIDE_VIA_CUSTOM_VALUES
  mcp-pg-open-webui: OVERRIDE_VIA_CUSTOM_VALUES

# Keycloak OIDC configuration for MCP endpoint authentication.
# All MCP servers are exposed through the shared ingress and authenticate via
# the shared MCPOIDCConfig (templates/mcpoidcconfig-keycloak.yaml) unless a
# server sets oidc: null / oidcConfigRef: null to opt out.
keycloak:
  realm: OVERRIDE_VIA_CUSTOM_VALUES
  # Public client id registered in Keycloak for MCP token flows.
  clientId: mcp

# Postgres MCP servers (crystaldba/postgres-mcp, read-only). Driven by .databases
# below: templates/secret-postgres-mcp.yaml renders one ExternalSecret and
# templates/generic-postgres-mcpserver.yaml renders one MCPServer per entry, so
# adding a database = one entry here + the bitwardenIds key + the CNPG managed role.
# The shared image/args/resources/podTemplateSpec live once in this block. Each
# Bitwarden LOGIN item (username=readonly) backs the CNPG managed role password AND
# the composed DATABASE_URI. Host is deterministic: pg-<name>-rw.<ns>.svc.cluster.local:5432.
postgresMcp:
  # crystaldba/postgres-mcp 0.3.0 is the FINAL upstream release — pin, don't float.
  # Security: --access-mode=restricted (app layer) + pg_read_all_data role (real boundary).
  image: crystaldba/postgres-mcp:0.3.0
  transport: stdio
  mcpPort: 8080
  args:
    - "--access-mode=restricted"
  resources:
    limits:
      cpu: '200m'
      memory: '512Mi'
    requests:
      cpu: '50m'
      memory: '128Mi'
  podTemplateSpec:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mcp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  databases:
    - name: coder
      bitwardenIdKey: mcp-pg-coder
      database: coder
    - name: flowise
      bitwardenIdKey: mcp-pg-flowise
      database: flowise
    - name: langflow
      bitwardenIdKey: mcp-pg-langflow
      database: langflow
    - name: n8n
      bitwardenIdKey: mcp-pg-n8n
      database: n8n
    - name: open-webui
      bitwardenIdKey: mcp-pg-open-webui
      database: open-webui

# Shared storage configuration
# When set, overrides the default PVC for knowledge storage
# Example:
# shared-storage:
#   knowledge:
#     pvc-name: knowledge-shared
#     provider: seaweedfs
shared-storage: {}

# Configuration for toolhive-operator-crds subchart
# This subchart installs the Custom Resource Definitions
toolhive-operator-crds:
  enabled: true

# Configuration for toolhive-operator subchart
# This subchart installs the ToolHive operator
toolhive-operator:
  enabled: true
  podAnnotations:
    argocd.argoproj.io/sync-wave: "1"
  
  operator:
    # Number of operator replicas
    replicaCount: 1
    
    # ToolHive runner image version
    #toolhiveRunnerImage: ghcr.io/stacklok/toolhive:v0.4.0
    
    # RBAC configuration
    rbac:
      # Deployment mode: 'cluster' or 'namespace'
      # - cluster: Operator has cluster-wide access (default, simpler)
      # - namespace: Operator restricted to specific namespaces (more secure)
      scope: 'cluster'
      
      # Only used when scope is 'namespace'
      # List of namespaces the operator can manage
      # allowedNamespaces:
      #   - 'default'
      #   - 'gpu-workloads'

# Default MCP Servers
# Each server can be enabled/disabled independently
mcp:
  # Playwright MCP Server - Browser automation
  playwright:
    enabled: true
    image:  mcr.microsoft.com/playwright/mcp:v0.0.78
    transport: streamable-http
    mcpPort: 8931
    proxyPort: 8080
    oidc:
      audience: playwright
    resources:
      limits:
        cpu: '200m'
        memory: '4Gi'
      requests:
        cpu: '100m'
        memory: '128Mi'
    podTemplateSpec:
      spec:
        securityContext:
          fsGroup: 1000 
        containers:
        - name: mcp
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          env:
            - name: XDG_CONFIG_HOME
              value: /home/node/.cache
            - name: XDG_CACHE_HOME
              value: /home/node/.cache
          args:
            - "--headless"
            - "--port"
            - "8931"
            - "--host"
            - "0.0.0.0"
            - --allowed-hosts
            - "*"
            - "--output-dir"
            - "/home/node/.cache/"
            #- "--user-data-dir"
            #- "/home/node/.cache/ms-playwright-mcp"
            - "--isolated"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/node/.cache
            - name: output
              mountPath: /output
        volumes:
          # Critical: /tmp for browser profiles and temporary data
          - name: tmp
            emptyDir:
              medium: Memory
              sizeLimit: 512Mi
          
          # Browser cache directory
          - name: cache
            emptyDir:
              sizeLimit: 1Gi
          
          # Optional: Output directory for traces/videos
          - name: output
            emptyDir:
              sizeLimit: 500Mi

  # Git MCP Server - Local git operations
  git:
    enabled: true
    # TODO: This should be versioned, but microsoft is only shipping latest >_<.
    image: mcp/git:latest
    transport: stdio
    mcpPort: 8080
    oidc:
      audience: git
    resources:
      limits:
        cpu: '100m'
        memory: '1128Mi'
      requests:
        cpu: '50m'
        memory: '64Mi'
    # TODO: It's also requiring the container run as root >_<.
    podTemplateSpec:
      spec:
        containers:
        - name: mcp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false

  # GitHub MCP Server - GitHub API operations
  github:
    enabled: true
    image: ghcr.io/github/github-mcp-server:v1.6.0
    transport: stdio
    mcpPort: 8080
    oidc:
      audience: github
    resources:
      limits:
        cpu: '100m'
        memory: '1128Mi'
      requests:
        cpu: '50m'
        memory: '64Mi'
    secrets:
      - name: github-mcp
        key: GITHUB_PERSONAL_ACCESS_TOKEN
        targetEnvName: GITHUB_PERSONAL_ACCESS_TOKEN

  # Home Assistant MCP Server - Smart home control and automation management
  # Repo: github.com/zorak1103/ha-mcp (40 tools: entities, automations, scripts,
  # scenes, helpers, registries, dashboards, HACS). Talks to external HA over
  # WebSocket + REST. HA_URL overridden per-cluster via custom-values.
  homeassistant:
    enabled: true
    image: zorak1103/ha-mcp:2026.9.2
    #image: ghcr.io/curatedforest/ha-mcp:0.0.0-rc.3
    transport: streamable-http
    mcpPort: 8080
    oidc:
      audience: homeassistant
    resources:
      limits:
        cpu: '100m'
        memory: '1128Mi'
      requests:
        cpu: '50m'
        memory: '64Mi'
    podTemplateSpec:
      spec:
        containers:
          - name: mcp
            envFrom:
              - secretRef:
                  name: homeassistant-mcp
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL

  # Kubernetes MCP Server - Kubernetes/OpenShift operations
  # Repo: github.com/containers/kubernetes-mcp-server
  # Runs read-only against the in-cluster API via the kubernetes-mcp ServiceAccount
  # (bound to the custom 'kubernetes-mcp-view' ClusterRole, which mirrors the built-in
  # 'view' role but without read access to Secrets — see templates/rbac-kubernetes-mcp.yaml).
  kubernetes:
    enabled: true
    image: ghcr.io/containers/kubernetes-mcp-server:v0.0.65
    transport: streamable-http
    mcpPort: 8080
    serviceAccount: kubernetes-mcp
    oidc:
      audience: kubernetes
    args:
      - "--port"
      - "8080"
      - "--stateless"
      - "--read-only"
    resources:
      limits:
        cpu: '200m'
        memory: '1256Mi'
      requests:
        cpu: '100m'
        memory: '128Mi'
    podTemplateSpec:
      spec:
        volumes:
          - name: tmp
            emptyDir: {}
        containers:
          - name: mcp
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            volumeMounts:
              - name: tmp
                mountPath: /tmp

  # Docling MCP Server - Document processing
  # Latest version: v1.0.1 (PyPI)
  # Example 1MCP config:
  #   "docling": {
  #     "command": "uvx",
  #     "args": ["--from", "docling-mcp", "docling-mcp-server", "--transport", "stdio"]
  #   }
  # docling:
  #   enabled: false
  #   transport: streamable-http
  #   port: 8080
  #   targetPort: 8080

  # Fetch MCP Server - HTTP fetching and web scraping
  fetch:
    enabled: true
    # TODO: This should be versioned, but microsoft is only shipping latest >_<.
    image: mcp/fetch
    transport: stdio
    mcpPort: 8080
    oidc:
      audience: fetch
    resources:
      limits:
        cpu: '100m'
        memory: '1128Mi'
      requests:
        cpu: '50m'
        memory: '64Mi'
    # TODO: It's also requiring the container run as root >_<.
    podTemplateSpec:
      spec:
        containers:
        - name: mcp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false

  # Filesystem MCP Server - File system operations
  filesystem:
    enabled: true
    # TODO: This should be versioned, but microsoft is only shipping latest >_<.
    image: mcp/filesystem:latest
    transport: stdio
    mcpPort: 8080
    oidc:
      audience: filesystem
    resources:
      limits:
        cpu: '100m'
        memory: '1128Mi'
      requests:
        cpu: '50m'
        memory: '64Mi'
    podTemplateSpec:
      spec:
        volumes:
          - name: knowledge
            persistentVolumeClaim:
              claimName: knowledge-shared
        containers:
          - name: mcp
            # Pass /knowledge directory as allowed directory for filesystem operations
            args:
              - "/knowledge"
            volumeMounts:
              - mountPath: /knowledge
                name: knowledge

    # Configuration for 1MCP to add MCP servers
    # Example: Configure to add docling server
    # podTemplateSpec:
    #   spec:
    #     containers:
    #       - name: mcp
    #         env:
    #           - name: PYTHONIOENCODING
    #             value: utf-8
    #           - name: MCP_CONFIG
    #             value: |
    #               {
    #                 "mcpServers": {
    #                   "docling": {
    #                     "command": "uvx",
    #                     "args": ["--from", "docling-mcp", "docling-mcp-server", "--transport", "stdio"]
    #                   }
    #                 }
    #               }

  # Spec Driven Development MCP Server
  # Repository: github.com/formulahendry/mcp-server-spec-driven-development
  # Example 1MCP config:
  #   "spec-driven-dev": {
  #     "command": "npx",
  #     "args": ["-y", "mcp-server-spec-driven-development@latest"]
  #   }
  # spec-driven-development:
  #   enabled: false
  #   transport: streamable-http
  #   port: 8080
  #   targetPort: 8080

  # Sequential Thinking MCP Server
  sequential-thinking:
    enabled: true
    # TODO: This should be versioned, but microsoft is only shipping latest >_<.
    image: mcp/sequentialthinking:latest
    transport: stdio
    mcpPort: 8080
    oidc:
      audience: sequential-thinking
    resources:
      limits:
        cpu: '100m'
        memory: '1128Mi'
      requests:
        cpu: '50m'
        memory: '64Mi'

  # Firecrawl MCP Server - Advanced web scraping
  # Disabled: no public image exists (ghcr.io/mendableai/firecrawl-mcp is
  # untagged/private; nothing on Docker Hub). Rebuild as a custom container
  # under containers/ if wanted later.
  firecrawl:
    enabled: false
    image: ghcr.io/mendableai/firecrawl-mcp
    transport: streamable-http
    mcpPort: 8080
    oidc:
      audience: firecrawl
    resources:
      limits:
        cpu: '200m'
        memory: '1256Mi'
      requests:
        cpu: '100m'
        memory: '128Mi'

  # SearXNG MCP Server - Private web search via self-hosted SearXNG
  # Repo: github.com/ihor-sokoliuk/mcp-searxng
  # Points at the in-cluster SearXNG service (see charts/searxng)
  searxng:
    enabled: true
    image: isokoliuk/mcp-searxng:1.13.0
    transport: stdio
    mcpPort: 8080
    oidc:
      audience: searxng
    resources:
      limits:
        cpu: '100m'
        memory: '1128Mi'
      requests:
        cpu: '50m'
        memory: '64Mi'
    podTemplateSpec:
      spec:
        containers:
          - name: mcp
            env:
              - name: SEARXNG_URL
                value: "http://gpu-searxng.default.svc.cluster.local:8080"

  # Grafana MCP Server - read-only dashboards/Prometheus/Loki/alerting access.
  # Read-only enforced twice: --disable-write (server side) + Viewer-only SA token.
  # GRAFANA_URL is the public ingress (monitoring stack lives on another cluster);
  # the SA bearer token authenticates at Grafana regardless of the Keycloak OAuth.
  # Repo: github.com/grafana/mcp-grafana
  grafana:
    enabled: true
    image: grafana/mcp-grafana:1.3.0
    transport: streamable-http
    mcpPort: 8000
    oidc:
      audience: grafana
    # --allowed-hosts '*' is REQUIRED: mcp-grafana validates Host/Origin
    # (DNS-rebinding protection) and the ToolHive proxy rewrites Host to the
    # backend ClusterIP, which would otherwise be rejected with 403.
    args:
      - "--transport"
      - "streamable-http"
      - "--address"
      - "0.0.0.0:8000"
      - "--allowed-hosts"
      - "*"
      - "--disable-write"
    env:
      - name: GRAFANA_URL
        value: https://graphs.spencerslab.com
    secrets:
      - name: grafana-mcp-token
        key: token
        targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
    resources:
      limits:
        cpu: '200m'
        memory: '256Mi'
      requests:
        cpu: '50m'
        memory: '64Mi'
    podTemplateSpec:
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
        containers:
          - name: mcp
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
            volumeMounts:
              - mountPath: /tmp
                name: tmp
        volumes:
          - name: tmp
            emptyDir: {}

  # Renovate MCP - design-time Renovate config tooling (validate/dry-run renovate.json).
  # The pod init-clones this (private) repo from GitHub using the existing github-mcp
  # PAT secret; the mcp container itself needs no GitHub auth. stdio transport is
  # single-connection by design (one session at a time).
  renovate:
    enabled: true
    image: ghcr.io/ownyourio/renovate-mcp:0.0.1
    transport: stdio
    mcpPort: 8080
    oidc:
      audience: renovate
    env:
      - name: RENOVATE_MCP_REQUIRE_CLI
        value: "true"
      - name: RENOVATE_BASE_DIR
        value: /cache
      - name: HOME
        value: /tmp   # writable path under uid 1000 / readOnlyRootFilesystem
    resources:
      limits:
        cpu: '2'
        memory: '4Gi'
      requests:
        cpu: '500m'
        memory: '1Gi'
    podTemplateSpec:
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
        initContainers:
          - name: clone
            image: ghcr.io/ownyourio/renovate-mcp:0.0.1  # same image ships git
            env:
              - name: HOME
                value: /tmp
              - name: GITHUB_PERSONAL_ACCESS_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: github-mcp
                    key: GITHUB_PERSONAL_ACCESS_TOKEN
            command: ["/bin/sh", "-c"]
            args:
              - |
                git clone --depth 1 --branch main \
                  "https://x-access-token:${GITHUB_PERSONAL_ACCESS_TOKEN}@github.com/OwnYourIO/SpencersLab.git" \
                  /workspace/SpencersLab
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
            volumeMounts:
              - mountPath: /workspace
                name: workspace
              - mountPath: /tmp
                name: tmp
        containers:
          - name: mcp
            resources:   # Renovate dry-runs are CPU/memory heavy
              requests:
                cpu: '500m'
                memory: '1Gi'
              limits:
                cpu: '2'
                memory: '4Gi'
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
            volumeMounts:
              - mountPath: /workspace
                name: workspace
              - mountPath: /tmp
                name: tmp
              - mountPath: /cache
                name: cache
        volumes:
          - name: workspace
            emptyDir: {}
          - name: tmp
            emptyDir: {}
          - name: cache
            emptyDir: {}
