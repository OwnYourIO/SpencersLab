# hivetools — ToolHive MCP platform (CRDs + operator + MCP servers), deployed
# on every cluster via base's charts list. Services extend it under their own
# `hivetools:` values key; see skills/helm-chart-creation/references/mcp-servers.md.

namespace: default

# Domain for MCP ingress (override via custom-values)
domain: OVERRIDE_VIA_CUSTOM_VALUES

bitwardenIds:
  mcp-sso: OVERRIDE_VIA_CUSTOM_VALUES

# Keycloak OIDC for all MCP servers (shared MCPOIDCConfig).
keycloak:
  realm: OVERRIDE_VIA_CUSTOM_VALUES
  clientId: mcp

# Read-only Postgres MCP servers (crystaldba/postgres-mcp): one MCPServer +
# ExternalSecret per entry in .databases. Recipe: references/mcp-servers.md.
postgresMcp:
  # 0.3.0 is the FINAL upstream release — pin, don't float.
  # Security: --access-mode=restricted (app layer) + pg_read_all_data role (real boundary).
  image: crystaldba/postgres-mcp:0.3.0
  transport: stdio
  mcpPort: 8080
  args:
    - "--access-mode=restricted"
  resources:
    limits:
      cpu: '200m'
      memory: '512Mi'
    requests:
      cpu: '50m'
      memory: '128Mi'
  podTemplateSpec:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mcp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  # Services add entries under hivetools.postgresMcp.databases.
  databases: []

toolhive-operator-crds:
  enabled: true

toolhive-operator:
  enabled: true
  podAnnotations:
    argocd.argoproj.io/sync-wave: "1"

  operator:
    replicaCount: 1
    rbac:
      # 'cluster' (default) or 'namespace' scope for the operator.
      scope: 'cluster'

mcp:
  # Cluster access: read + restart/rollout, no secrets access, no exec —
  # enforced by ClusterRole kubernetes-mcp (templates/rbac-kubernetes-mcp.yaml),
  # documented in skills/helm-chart-creation/references/mcp-servers.md.
  kubernetes:
    enabled: true
    image: ghcr.io/containers/kubernetes-mcp-server:v0.0.65
    transport: streamable-http
    mcpPort: 8080
    serviceAccount: kubernetes-mcp
    oidc:
      audience: kubernetes
    args:
      - "--port"
      - "8080"
      - "--stateless"
    resources:
      limits:
        cpu: '200m'
        memory: '1256Mi'
      requests:
        cpu: '100m'
        memory: '128Mi'
    podTemplateSpec:
      spec:
        volumes:
          - name: tmp
            emptyDir: {}
        containers:
          - name: mcp
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            volumeMounts:
              - name: tmp
                mountPath: /tmp
