# Configuration for hivetools - Combined ToolHive CRDs and Operator
# This chart deploys both the CRDs and the operator in a single installation

# Global namespace for ToolHive components
# The operator will be deployed to this namespace
namespace: default

# Domain for MCP ingress (override via custom-values)
domain: OVERRIDE_VIA_CUSTOM_VALUES

# Bitwarden secret IDs
bitwardenIds:
  github-mcp: OVERRIDE_VIA_CUSTOM_VALUES
  # Bitwarden item must carry two custom fields:
  #   url   - externally reachable Home Assistant base URL (https:// is converted to wss://)
  #   token - Home Assistant long-lived access token
  home-assistant-mcp: OVERRIDE_VIA_CUSTOM_VALUES

# Keycloak OIDC authentication for the MCP endpoints.
#
# The mcp.<domain> ingress has no authentication of its own, and a ToolHive proxy
# without oidcConfigRef accepts every request that reaches it. This block turns on
# ToolHive's native OIDC bearer-token validation, which is the right model for MCP
# (machine clients presenting a token), unlike the browser-redirect
# kube-system-oidc-keycloak middleware used for human-facing subdomains.
#
# Rollout is opt-in per server so existing clients do not break:
#   1. Create a Keycloak client in the realm below and add an audience mapper that
#      puts `audience` (default "mcp") into the access token.
#   2. Set mcpAuth.enabled: true in custom-values.
#   3. Add `auth: true` to one mcp.<name> entry at a time and verify, or flip
#      mcpAuth.default: true to require auth on every server at once.
mcpAuth:
  # Master switch. While false nothing is rendered and every server stays
  # unauthenticated, exactly as before this block existed.
  enabled: false

  # Fallback for servers that do not set `auth` explicitly, once enabled.
  # Set to true to require auth everywhere.
  default: false

  # Name of the MCPOIDCConfig resource created by this chart.
  name: keycloak

  # Keycloak realm. Only used to build the default issuer below.
  realm: OVERRIDE_VIA_CUSTOM_VALUES

  # Leave empty to derive https://login.<domain>/realms/<realm>, matching the
  # issuer every other service in this repo uses. Set explicitly to override.
  issuer: ""

  # Shared audience for all MCP servers. ToolHive documents that audience should be
  # unique per server to prevent a token minted for one server being replayed
  # against another; a single shared audience deliberately accepts that trade-off
  # for a single Keycloak client. Override per server with `oidcAudience`.
  audience: mcp

  # Scopes advertised in the RFC 9728 protected-resource metadata document.
  scopes:
    - openid
    - profile
    - email

  # Allow JWKS/discovery fetches to resolve to private IPs. Needed when
  # login.<domain> resolves to a LAN address via split-horizon DNS, which is the
  # common homelab case; a blocked JWKS fetch fails auth closed and is hard to
  # diagnose. Safe here because the issuer is operator-controlled chart config,
  # not attacker-supplied input, so this is not an SSRF vector.
  jwksAllowPrivateIP: true

# Shared storage configuration
# When set, overrides the default PVC for knowledge storage
# Example:
# shared-storage:
#   knowledge:
#     pvc-name: knowledge-shared
#     provider: seaweedfs
shared-storage: {}

# Configuration for toolhive-operator-crds subchart
# This subchart installs the Custom Resource Definitions
toolhive-operator-crds:
  enabled: true

# Configuration for toolhive-operator subchart
# This subchart installs the ToolHive operator
toolhive-operator:
  enabled: true
  podAnnotations:
    argocd.argoproj.io/sync-wave: "1"
  
  operator:
    # Number of operator replicas
    replicaCount: 1
    
    # ToolHive runner image version
    #toolhiveRunnerImage: ghcr.io/stacklok/toolhive:v0.4.0
    
    # RBAC configuration
    rbac:
      # Deployment mode: 'cluster' or 'namespace'
      # - cluster: Operator has cluster-wide access (default, simpler)
      # - namespace: Operator restricted to specific namespaces (more secure)
      scope: 'cluster'
      
      # Only used when scope is 'namespace'
      # List of namespaces the operator can manage
      # allowedNamespaces:
      #   - 'default'
      #   - 'gpu-workloads'

# Default MCP Servers
# Each server can be enabled/disabled independently
mcp:
  # Playwright MCP Server - Browser automation
  playwright:
    enabled: true
    image:  mcr.microsoft.com/playwright/mcp:v0.0.78
    transport: streamable-http
    mcpPort: 8931
    proxyPort: 8080
    resources:
      limits:
        cpu: '200m'
        memory: '4Gi'
      requests:
        cpu: '100m'
        memory: '128Mi'
    podTemplateSpec:
      spec:
        securityContext:
          fsGroup: 1000 
        containers:
        - name: mcp
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          env:
            - name: XDG_CONFIG_HOME
              value: /home/node/.cache
            - name: XDG_CACHE_HOME
              value: /home/node/.cache
          args:
            - "--headless"
            - "--port"
            - "8931"
            - "--host"
            - "0.0.0.0"
            - --allowed-hosts
            - "*"
            - "--output-dir"
            - "/home/node/.cache/"
            #- "--user-data-dir"
            #- "/home/node/.cache/ms-playwright-mcp"
            - "--isolated"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/node/.cache
            - name: output
              mountPath: /output
        volumes:
          # Critical: /tmp for browser profiles and temporary data
          - name: tmp
            emptyDir:
              medium: Memory
              sizeLimit: 512Mi
          
          # Browser cache directory
          - name: cache
            emptyDir:
              sizeLimit: 1Gi
          
          # Optional: Output directory for traces/videos
          - name: output
            emptyDir:
              sizeLimit: 500Mi

  # Git MCP Server - Local git operations
  git:
    enabled: true
    # TODO: This should be versioned, but microsoft is only shipping latest >_<.
    image: mcp/git:latest
    transport: stdio
    mcpPort: 8080
    resources:
      limits:
        cpu: '100m'
        memory: '128Mi'
      requests:
        cpu: '50m'
        memory: '64Mi'
    # TODO: It's also requiring the container run as root >_<.
    podTemplateSpec:
      spec:
        containers:
        - name: mcp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false

  # GitHub MCP Server - GitHub API operations
  github:
    enabled: true
    image: ghcr.io/github/github-mcp-server:v1.6.0
    transport: stdio
    mcpPort: 8080
    resources:
      limits:
        cpu: '100m'
        memory: '128Mi'
      requests:
        cpu: '50m'
        memory: '64Mi'
    secrets:
      - name: github-mcp
        key: GITHUB_PERSONAL_ACCESS_TOKEN
        targetEnvName: GITHUB_PERSONAL_ACCESS_TOKEN

  # Docling MCP Server - Document processing
  # Latest version: v1.0.1 (PyPI)
  # Example 1MCP config:
  #   "docling": {
  #     "command": "uvx",
  #     "args": ["--from", "docling-mcp", "docling-mcp-server", "--transport", "stdio"]
  #   }
  # docling:
  #   enabled: false
  #   transport: streamable-http
  #   port: 8080
  #   targetPort: 8080

  # Fetch MCP Server - HTTP fetching and web scraping
  fetch:
    enabled: true
    # TODO: This should be versioned, but microsoft is only shipping latest >_<.
    image: mcp/fetch
    transport: stdio
    mcpPort: 8080
    resources:
      limits:
        cpu: '100m'
        memory: '128Mi'
      requests:
        cpu: '50m'
        memory: '64Mi'
    # TODO: It's also requiring the container run as root >_<.
    podTemplateSpec:
      spec:
        containers:
        - name: mcp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false

  # Filesystem MCP Server - File system operations
  filesystem:
    enabled: true
    # TODO: This should be versioned, but microsoft is only shipping latest >_<.
    image: mcp/filesystem:latest
    transport: stdio
    mcpPort: 8080
    resources:
      limits:
        cpu: '100m'
        memory: '128Mi'
      requests:
        cpu: '50m'
        memory: '64Mi'
    podTemplateSpec:
      spec:
        volumes:
          - name: knowledge
            persistentVolumeClaim:
              claimName: knowledge-shared
        containers:
          - name: mcp
            # Pass /knowledge directory as allowed directory for filesystem operations
            args:
              - "/knowledge"
            volumeMounts:
              - mountPath: /knowledge
                name: knowledge

  # 1MCP - One MCP Server for All
  # This acts as a proxy/gateway that can manage multiple MCP servers as subprocesses
  # Perfect for running non-containerized MCP servers (like docling) in a unified way
  onemcp:
    enabled: true
    image: ghcr.io/1mcp-app/agent:v0.34.2
    transport: streamable-http
    mcpPort: 3050
    resources:
      limits:
        cpu: '200m'
        memory: '256Mi'
      requests:
        cpu: '100m'
        memory: '128Mi'
    # Volume mount for 1MCP configuration directory
    # Required: 1MCP needs to write config to /home/node/.config/1mcp
    podTemplateSpec:
      spec:
        volumes:
          - name: onemcp-config
            # TODO: Make local?
            emptyDir: {}
        containers:
          - name: mcp
            volumeMounts:
              - mountPath: /home/node/.config/1mcp
                name: onemcp-config
    # Configuration for 1MCP to add MCP servers
    # Example: Configure to add docling server
    # podTemplateSpec:
    #   spec:
    #     containers:
    #       - name: mcp
    #         env:
    #           - name: PYTHONIOENCODING
    #             value: utf-8
    #           - name: MCP_CONFIG
    #             value: |
    #               {
    #                 "mcpServers": {
    #                   "docling": {
    #                     "command": "uvx",
    #                     "args": ["--from", "docling-mcp", "docling-mcp-server", "--transport", "stdio"]
    #                   }
    #                 }
    #               }

  # Spec Driven Development MCP Server
  # Repository: github.com/formulahendry/mcp-server-spec-driven-development
  # Example 1MCP config:
  #   "spec-driven-dev": {
  #     "command": "npx",
  #     "args": ["-y", "mcp-server-spec-driven-development@latest"]
  #   }
  # spec-driven-development:
  #   enabled: false
  #   transport: streamable-http
  #   port: 8080
  #   targetPort: 8080

  # Sequential Thinking MCP Server
  sequential-thinking:
    enabled: true
    # TODO: This should be versioned, but microsoft is only shipping latest >_<.
    image: mcp/sequentialthinking:latest
    transport: stdio
    mcpPort: 8080
    resources:
      limits:
        cpu: '100m'
        memory: '128Mi'
      requests:
        cpu: '50m'
        memory: '64Mi'

  # Firecrawl MCP Server - Advanced web scraping
  firecrawl:
    enabled: true
    image: ghcr.io/mendableai/firecrawl-mcp
    transport: streamable-http
    mcpPort: 8080
    resources:
      limits:
        cpu: '200m'
        memory: '256Mi'
      requests:
        cpu: '100m'
        memory: '128Mi'

  # SearXNG MCP Server - Private web search via self-hosted SearXNG
  # Repo: github.com/ihor-sokoliuk/mcp-searxng
  # Points at the in-cluster SearXNG service (see charts/searxng)
  searxng:
    enabled: true
    image: ghcr.io/ihor-sokoliuk/mcp-searxng:v1.11.1
    transport: stdio
    mcpPort: 8080
    resources:
      limits:
        cpu: '100m'
        memory: '128Mi'
      requests:
        cpu: '50m'
        memory: '64Mi'
    podTemplateSpec:
      spec:
        containers:
          - name: mcp
            env:
              - name: SEARXNG_URL
                value: "http://searxng.default.svc.cluster.local:8080"

  # Home Assistant MCP Server - smart home queries and analysis
  # Repo: github.com/zorak1103/ha-mcp
  # Read-only: no service calls, no automation/script/scene/helper mutation.
  # HA runs outside this cluster, so HA_URL comes from the secret, not values.yaml.
  # mcpPort must be 8080: it is both the ha-mcp default listen port and the port
  # the generic-mcp-ingress template uses as the mcp-<name>-proxy backend.
  home-assistant:
    enabled: true
    image: zorak1103/ha-mcp:2026.7.3
    transport: streamable-http
    mcpPort: 8080
    env:
      - name: HA_MCP_READ_ONLY
        value: "true"
    # NOT spec.secrets: MCPServer.spec.secrets is x-kubernetes-list-type: map keyed
    # on `name`, so two entries both named home-assistant-mcp are a duplicate map key
    # and the apiserver rejects the whole object. Both values come from one Secret, so
    # they are injected as standard secretKeyRef env vars on the `mcp` container
    # instead, which keeps the HA URL out of Git with a single ExternalSecret.
    resources:
      limits:
        cpu: '200m'
        memory: '256Mi'
      requests:
        cpu: '50m'
        memory: '64Mi'
    podTemplateSpec:
      spec:
        containers:
          - name: mcp
            env:
              - name: HA_URL
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-mcp
                    key: HA_URL
              - name: HA_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-mcp
                    key: HA_TOKEN
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL

  # Kubernetes MCP Server - in-cluster read-only cluster inspection
  # Repo: github.com/containers/kubernetes-mcp-server
  # All behaviour is driven by the kubernetes-mcp-config ConfigMap (config.toml):
  # read_only, toolsets, and denied_resources for v1/Secret.
  # RBAC comes from the kubernetes-mcp ServiceAccount (rbac-kubernetes-mcp.yaml).
  kubernetes:
    enabled: true
    image: ghcr.io/containers/kubernetes-mcp-server:v0.0.65
    transport: streamable-http
    mcpPort: 8080
    serviceAccount: kubernetes-mcp
    args:
      - "--config"
      - "/etc/kubernetes-mcp-server/config.toml"
    resources:
      limits:
        # 512Mi because the server buffers up to 16Mi request bodies and caches
        # the cluster's OpenAPI schemas.
        cpu: '500m'
        memory: '512Mi'
      requests:
        cpu: '50m'
        memory: '128Mi'
    podTemplateSpec:
      spec:
        volumes:
          - name: config
            configMap:
              name: kubernetes-mcp-config
        containers:
          - name: mcp
            volumeMounts:
              - name: config
                mountPath: /etc/kubernetes-mcp-server
                readOnly: true
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL

