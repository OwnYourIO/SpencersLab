# hivetools — ToolHive MCP platform (CRDs + operator + MCP servers), deployed
# on every cluster via base's charts list. Services extend it under their own
# `hivetools:` values key; see skills/helm-chart-creation/references/mcp-servers.md.

namespace: default

# Domain for MCP ingress (override via custom-values)
domain: OVERRIDE_VIA_CUSTOM_VALUES

bitwardenIds:
  mcp-sso: OVERRIDE_VIA_CUSTOM_VALUES

# Keycloak OIDC for all MCP servers (shared MCPOIDCConfig).
keycloak:
  realm: OVERRIDE_VIA_CUSTOM_VALUES
  clientId: mcp

# Additional MCPOIDCConfig resources (rendered by generic-mcpoidcconfig.yaml),
# keyed by MCPOIDCConfig name. The shared Keycloak config lives in
# mcpoidcconfig-keycloak.yaml; use this map for other OIDC source types (e.g.
# kubernetesServiceAccount). An mcp entry references one via oidc.configRef.
mcpOidcConfigs: {}

# Read-only Postgres MCP servers (enterprisedb/pg-airman-mcp): one MCPServer +
# ExternalSecret per entry in .databases. Recipe: references/mcp-servers.md.
postgresMcp:
  # airman succeeds the unmaintained crystaldba/postgres-mcp (final release
  # 0.3.0). One process serves every session through a single shared pool
  # (min 1 / max 5, airman's built-in default). The stdio/supergateway
  # process-per-session wrapper is gone — its cold-start race fails the first
  # tools/call of every new session (crystaldba/postgres-mcp#223).
  image: enterprisedb/pg-airman-mcp:1.1.1
  transport: streamable-http
  mcpPort: 8080
  args:
    - "--transport=streamable-http"
    - "--streamable-http-host=0.0.0.0"
    - "--streamable-http-port=8080"
    # Security: restricted mode (app layer) + pg_read_all_data role (real boundary).
    - "--access-mode=restricted"
  # airman's restricted mode allows COMMENT ON writes by default
  # (ALLOW_COMMENT_IN_RESTRICTED=true) — the one place it is looser than
  # crystaldba 0.3.0. Close it so restricted means read-only.
  env:
    - name: ALLOW_COMMENT_IN_RESTRICTED
      value: "false"
  resources:
    limits:
      cpu: '200m'
      memory: '512Mi'
    requests:
      cpu: '50m'
      memory: '128Mi'
  podTemplateSpec:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mcp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  # Services add entries under hivetools.postgresMcp.databases.
  databases: []

toolhive-operator-crds:
  enabled: true

toolhive-operator:
  enabled: true
  podAnnotations:
    argocd.argoproj.io/sync-wave: "1"

  operator:
    replicaCount: 1
    rbac:
      # 'cluster' (default) or 'namespace' scope for the operator.
      scope: 'cluster'

mcp:
  # Cluster access comes in two tiers, each its own MCPServer + ServiceAccount
  # + ClusterRole (templates/rbac-kubernetes-mcp.yaml), documented in
  # skills/helm-chart-creation/references/mcp-servers.md:
  #   kubernetes-readonly — strict read tier (its read_only = true also hides
  #                         write tools from the tool list)
  #   kubernetes-admin    — read + restart/rollout tier (may grow later)
  # Both: no secrets access, no exec — RBAC is the enforcement boundary.
  # Image v0.0.68 deleted every runtime CLI flag; only --config remains, so
  # server settings live in the per-tier config.toml rendered by
  # generic-mcpconfigmap.yaml. Its volume rides podTemplateSpec because the
  # MCPServer CRD's spec.volumes is HostPath-only, and mounts as a directory
  # so CM edits refresh (subPath projections never do) over the image-baked
  # default config.
  kubernetes-readonly:
    enabled: true
    image: ghcr.io/containers/kubernetes-mcp-server:v0.0.69
    transport: streamable-http
    mcpPort: 8080
    serviceAccount: kubernetes-mcp-readonly
    # OIDC temporarily disabled (2026-09) — uncomment to re-enable. The shared
    # MCPOIDCConfig + mcp-sso secret stay in place for that.
    # oidc:
    #   audience: kubernetes-readonly
    args:
      - "--config"
      - "/etc/kubernetes-mcp-server/config.toml"
    # read_only hides the write tools from the tool list (RBAC denies them
    # anyway); the image-baked default omits it, so this tier must set it.
    configFile:
      content: |
        port = "8080"
        stateless = true
        read_only = true
    resources:
      limits:
        cpu: '200m'
        memory: '1256Mi'
      requests:
        cpu: '100m'
        memory: '128Mi'
    podTemplateSpec:
      spec:
        volumes:
          - name: tmp
            emptyDir: {}
          - name: mcp-config
            configMap:
              name: mcp-kubernetes-readonly-config
        containers:
          - name: mcp
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            volumeMounts:
              - name: tmp
                mountPath: /tmp
              - name: mcp-config
                mountPath: /etc/kubernetes-mcp-server
  kubernetes-admin:
    enabled: true
    image: ghcr.io/containers/kubernetes-mcp-server:v0.0.69
    transport: streamable-http
    mcpPort: 8080
    serviceAccount: kubernetes-mcp-admin
    # OIDC temporarily disabled (2026-09) — uncomment to re-enable. The shared
    # MCPOIDCConfig + mcp-sso secret stay in place for that.
    # oidc:
    #   audience: kubernetes-admin
    args:
      - "--config"
      - "/etc/kubernetes-mcp-server/config.toml"
    # No read_only: the admin tier keeps write tools visible; RBAC still
    # bounds what they can do.
    configFile:
      content: |
        port = "8080"
        stateless = true
    resources:
      limits:
        cpu: '200m'
        memory: '1256Mi'
      requests:
        cpu: '100m'
        memory: '128Mi'
    podTemplateSpec:
      spec:
        volumes:
          - name: tmp
            emptyDir: {}
          - name: mcp-config
            configMap:
              name: mcp-kubernetes-admin-config
        containers:
          - name: mcp
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            volumeMounts:
              - name: tmp
                mountPath: /tmp
              - name: mcp-config
                mountPath: /etc/kubernetes-mcp-server
