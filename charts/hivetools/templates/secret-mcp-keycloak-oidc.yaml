# Client credentials for the Keycloak OIDC client used by the shared
# MCPOIDCConfig (mcpoidcconfig-keycloak.yaml). Mirrors the bitwarden-login
# pattern used by traefik-sso: username -> client-id, password -> client-secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-keycloak-oidc
  namespace: default
spec:
  refreshInterval: 1h
  target:
    name: mcp-keycloak-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "mcp-keycloak-oidc" }}'
        property: username
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: client-secret
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "mcp-keycloak-oidc" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
