{{- range $name, $config := .Values.mcp }}
{{- if and $config (ne ($config.enabled | toString) "false") }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace | default "default" }}
  {{- if $config.labels }}
  labels:
    {{- toYaml $config.labels | nindent 4 }}
  {{- end }}
spec:
  image: {{ $config.image | required (printf "mcp.%s.image is required" $name) }}
  transport: {{ $config.transport | required (printf "mcp.%s.transport is required" $name) }}
  {{- if $config.targetPort }}
  proxyPort: {{ $config.proxyPort }}
  {{- end }}
  mcpPort: {{ $config.mcpPort | required (printf "mcp.%s.port is required" $name) }}
  {{- if $config.serviceAccount }}
  # Sets the ServiceAccount on the MCP server backend pod. The ToolHive proxy
  # runner always uses its own ServiceAccount, and the operator overwrites any
  # serviceAccountName set inside podTemplateSpec, so RBAC must go through here.
  serviceAccount: {{ $config.serviceAccount }}
  {{- end }}
  {{- $auth := $.Values.mcpAuth | default dict }}
  {{- if $auth.enabled }}
  {{- $serverAuth := $auth.default | default false }}
  {{- if hasKey $config "auth" }}
  {{- $serverAuth = $config.auth }}
  {{- end }}
  {{- if $serverAuth }}
  # Requires a Keycloak bearer token. Without this block the ToolHive proxy accepts
  # every request that reaches its port. resourceUrl must be the external URL clients
  # actually connect to so RFC 9728 protected-resource metadata advertises correctly.
  oidcConfigRef:
    name: {{ $auth.name | default "keycloak" }}
    audience: {{ $config.oidcAudience | default $auth.audience | required (printf "mcpAuth.audience (or mcp.%s.oidcAudience) is required when auth is enabled for %s" $name $name) | quote }}
    resourceUrl: "https://mcp.{{ $.Values.domain }}/{{ $name }}"
    {{- if $auth.scopes }}
    scopes:
      {{- toYaml $auth.scopes | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- if $config.args }}
  args:
    {{- toYaml $config.args | nindent 4 }}
  {{- end }}
  {{- if $config.env }}
  env:
    {{- toYaml $config.env | nindent 4 }}
  {{- end }}
  {{- if $config.resources }}
  resources:
    {{- toYaml $config.resources | nindent 4 }}
  {{- end }}
  {{- if $config.secrets }}
  secrets:
    {{- toYaml $config.secrets | nindent 4 }}
  {{- end }}
  {{- if $config.podTemplateSpec }}
  podTemplateSpec:
    {{- toYaml $config.podTemplateSpec | nindent 4 }}
  {{- end }}
  {{- if $config.volumes }}
  volumes:
    {{- toYaml $config.volumes | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
