apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-mcp
  namespace: default
spec:
  refreshInterval: 1h
  target:
    name: home-assistant-mcp
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Home Assistant runs outside this cluster, so the base URL is kept in
        # the Bitwarden item alongside the token instead of in values.yaml.
        HA_URL: "{{ `{{ .url }}` }}"
        HA_TOKEN: "{{ `{{ .token }}` }}"
  data:
    - secretKey: url
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "home-assistant-mcp" }}'
        property: url
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: token
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "home-assistant-mcp" }}'
        property: token
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
