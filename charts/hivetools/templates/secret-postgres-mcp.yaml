{{- /*
Postgres MCP credentials: one ExternalSecret per entry in .Values.postgresMcp.databases.
Composes DATABASE_URI from a hardcoded username (the CNPG managed role `readonly`),
the password pulled from the Bitwarden LOGIN item, the deterministic in-cluster CNPG
host, and the app database name.

Password escaping: the password is percent-encoded for the URI userinfo component
with `urlquery` (a Go text/template built-in, always available to ESO's v2 template
engine). urlquery percent-encodes EVERY character that is not RFC 3986 "unreserved"
(A-Za-z0-9 - . _ ~), so it covers the full charset rather than a hand-rolled subset.
Its one quirk is that it renders spaces as "+" (query-string style), so we normalize
"+" back to %20 for the userinfo component. The matching read-only role `readonly`
is declared in each CNPG Cluster spec (pg_read_all_data).
*/}}
{{- range .Values.postgresMcp.databases }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-mcp-{{ .name }}
  namespace: {{ $.Values.namespace | default "default" }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: postgres-mcp-{{ .name }}
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # Inner {{ "{{ ... }}" }} braces are ESO template syntax, escaped from Helm.
        # Single-quoted YAML value so the Helm `default "default"` and the ESO
        # replace "+" "%20" can use plain double quotes. The username is hardcoded
        # to the CNPG managed role name (readonly); only the password comes from
        # Bitwarden.
        DATABASE_URI: 'postgresql://readonly:{{ `{{ .password | urlquery | replace "+" "%20" }}` }}@pg-{{ .name }}-rw.{{ $.Values.namespace | default "default" }}.svc.cluster.local:5432/{{ .database }}'
  data:
    - secretKey: password
      remoteRef:
        key: '{{ index $.Values "bitwardenIds" .bitwardenIdKey }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
