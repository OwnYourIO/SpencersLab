{{- range .Values.postgresMcp.databases }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-mcp-{{ .name }}
  namespace: {{ $.Values.namespace | default "default" }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: postgres-mcp-{{ .name }}
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        DATABASE_URI: 'postgresql://readonly:{{ `{{ .password | urlquery | replace "+" "%20" }}` }}@pg-{{ .name }}-rw.{{ $.Values.namespace | default "default" }}.svc.cluster.local:5432/{{ .database }}'
  data:
    - secretKey: password
      remoteRef:
        key: '{{ index $.Values "bitwardenIds" .bitwardenIdKey }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
