apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wekan-mcp
  namespace: default
spec:
  refreshInterval: 1h
  target:
    name: wekan-mcp
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        WEKAN_TOKEN: "{{ `{{ .token }}` }}"
  data:
    - secretKey: token
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "wekan-mcp" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
