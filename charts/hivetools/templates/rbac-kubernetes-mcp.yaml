{{- if ne (.Values.mcp.kubernetes.enabled | toString) "false" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp
  namespace: {{ .Values.namespace | default "default" }}
---
# Mirrors the built-in 'view' ClusterRole but WITHOUT read access to Secrets.
# (RBAC is additive-only, so we cannot subtract the secrets rule from 'view'.)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-mcp-view
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - pods
      - replicationcontrollers
      - replicationcontrollers/scale
      - serviceaccounts
      - services
      - services/status
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - bindings
      - events
      - limitranges
      - namespaces/status
      - pods/log
      - pods/status
      - replicationcontrollers/status
      - resourcequotas
      - resourcequotas/status
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - namespaces
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - controllerrevisions
      - daemonsets
      - daemonsets/status
      - deployments
      - deployments/scale
      - deployments/status
      - replicasets
      - replicasets/scale
      - replicasets/status
      - statefulsets
      - statefulsets/scale
      - statefulsets/status
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
      - horizontalpodautoscalers/status
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - cronjobs/status
      - jobs
      - jobs/status
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources:
      - daemonsets
      - daemonsets/status
      - deployments
      - deployments/scale
      - deployments/status
      - ingresses
      - ingresses/status
      - networkpolicies
      - replicasets
      - replicasets/scale
      - replicasets/status
      - replicationcontrollers/scale
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
      - poddisruptionbudgets/status
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - ingresses/status
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources:
      - localsubjectaccessreviews
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterrolebindings
      - clusterroles
      - rolebindings
      - roles
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list", "watch"]
  # --- CRDs used in this cluster (read-only) ---
  # CRD discovery itself (not part of built-in 'view')
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list", "watch"]
  # ArgoCD / GitOps
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
      - applicationsets
      - appprojects
    verbs: ["get", "list", "watch"]
  # Toolhive MCP operator
  - apiGroups: ["toolhive.stacklok.dev"]
    resources:
      - mcpservers
      - mcpoidcconfigs
      - mcpregistries
    verbs: ["get", "list", "watch"]
  # External Secrets Operator (secret metadata only; Secrets themselves stay denied)
  - apiGroups: ["external-secrets.io"]
    resources:
      - externalsecrets
      - secretstores
      - clustersecretstores
    verbs: ["get", "list", "watch"]
  # CloudNativePG
  - apiGroups: ["postgresql.cnpg.io"]
    resources:
      - clusters
      - backups
      - scheduledbackups
      - poolers
      - databases
    verbs: ["get", "list", "watch"]
  # Traefik
  - apiGroups: ["traefik.io"]
    resources:
      - ingressroutes
      - middlewares
      - serverstransports
      - traefikservices
    verbs: ["get", "list", "watch"]
  # cert-manager
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
      - certificaterequests
      - issuers
      - clusterissuers
    verbs: ["get", "list", "watch"]
  # Prometheus Operator monitoring
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - servicemonitors
      - podmonitors
      - prometheusrules
      - scrapeconfigs
    verbs: ["get", "list", "watch"]
  # k3s system upgrade controller
  - apiGroups: ["upgrade.cattle.io"]
    resources:
      - plans
    verbs: ["get", "list", "watch"]
  # k3s helm controller
  - apiGroups: ["helm.cattle.io"]
    resources:
      - helmcharts
      - helmchartconfigs
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-mcp-view
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp
    namespace: {{ .Values.namespace | default "default" }}
{{- end }}
