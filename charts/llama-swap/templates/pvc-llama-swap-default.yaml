apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-swap
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Parameterized so clusters can size independently (gpu rides the 300Gi
      # default; gpu-ai overrides to 500Gi). Chart default unchanged.
      storage: {{ .Values.modelsPvcSize | default "300Gi" }}