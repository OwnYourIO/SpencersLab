# HuggingFace token for gated model repos (orcarouter et al.). Consumed as
# HF_TOKEN by the llama-swap main container (-hf downloads) and the tools
# sidecar (LoRA adapter + base config fetches) — both consumers are wired in
# services/gpu-ai/prod/values.yaml, where this secret is guaranteed. Mirrors
# the repo's ExternalSecret + Bitwarden pattern (charts/audiomuse-ai).
# Guarded on bitwardenIds.hf-token so clusters without it (gpu) render clean.
{{- if and .Values.bitwardenIds (index .Values.bitwardenIds "hf-token") }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hf-token
  namespace: default
spec:
  refreshInterval: 1h
  target:
    name: hf-token
    creationPolicy: Owner
  data:
    - secretKey: token
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "hf-token" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
