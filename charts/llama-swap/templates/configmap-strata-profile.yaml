{{- /*
Renders the run-config JSONs VERBATIM under /profile — strata serve takes no
tuning flags (RESEARCH §2), so on-target --plan fixups (C04 step 3) land as
values edits under strata.config.engineProfile*, never as template changes.
Each inner model cmd names its profile file with --profile, so the second
file is the whole flavor switch. Key vocabulary is upstream-owned
(profiles.py, RESEARCH §2): helm's JSON writer only reorders/escapes, it
does not rename. Gated on the strata controller flag like the inner-config
ConfigMap; the seven flags flip together (guard lives in
configmap-strata.yaml).
*/ -}}
{{- if (index .Values "app-template" "controllers" "strata" "enabled") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: strata-profile
  namespace: default
data:
  strata-iq3_s.json: |
    {{- .Values.strata.config.engineProfile | toPrettyJson | nindent 4 }}
  strata-strix-iq3_s.json: |
    {{- .Values.strata.config.engineProfileStrix | toPrettyJson | nindent 4 }}
  strata-abliterated-iq3_xxs.json: |
    {{- .Values.strata.config.engineProfileAbliterated | toPrettyJson | nindent 4 }}
  strata-orca-iq3_xxs.json: |
    {{- .Values.strata.config.engineProfileOrca | toPrettyJson | nindent 4 }}
  strata-q4.json: |
    {{- .Values.strata.config.engineProfileStrataQ4 | toPrettyJson | nindent 4 }}
{{- end -}}
