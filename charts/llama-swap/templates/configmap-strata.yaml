{{- /*
Renders the INNER llama-swap declared config for the strata controller from
.Values.strata.config. Keys prefixed engineProfile* are chart-side layers
(the run-config bodies configmap-strata-profile.yaml writes), not llama-swap
keys — stripped here. ROCm visibility is injected per model from the values
(on-target rocminfo gate, C04 runbook): rocrVisibleDevices by default,
rocrVisibleDevicesByModel overrides by model ID. The override exists because
the two inner engines target different silicon — the primary's index
deliberately hides the 8060S, so a shared value would leave the strix
fallback with no gfx1151 device to bind.

The gate reads the controller flag through `index` with quoted keys: dotted
access through the hyphenated "app-template" key is a Go-template lexer
error. The companion-flag check below is the seven-flag divergence guard: a
partial flag set (controller ON, service or persistence flags OFF) would
render a half-wired pod — advancedMounts onto a DISABLED controller fails in
the library, but the reverse gap is silently valid, so the chart fails it
loudly here naming the identifier.
*/ -}}
{{- if (index .Values "app-template" "controllers" "strata" "enabled") -}}
  {{- $at := index .Values "app-template" -}}
  {{- $missing := list -}}
  {{- if not (index $at "service" "strata" "enabled") -}}
    {{- $missing = append $missing "app-template.service.strata.enabled" -}}
  {{- end -}}
  {{- range $p := list "strata-config" "strata-profile" "strata-kfd" "strata-dri" "strata-shm" -}}
    {{- if not (index $at "persistence" $p "enabled") -}}
      {{- $missing = append $missing (printf "app-template.persistence.%s.enabled" $p) -}}
    {{- end -}}
  {{- end -}}
  {{- if $missing -}}
    {{- fail (printf "strata controller is enabled but its companion flags are not: [%s]. The seven strata flags flip TOGETHER from the service values; a partial set renders a half-wired pod." (join ", " $missing)) -}}
  {{- end -}}
{{- $cfg := deepCopy .Values.strata.config -}}
{{- range $k := keys $cfg -}}
  {{- if hasPrefix "engineProfile" $k -}}
    {{- $_ := unset $cfg $k -}}
  {{- end -}}
{{- end -}}
{{- $byModel := .Values.strata.rocrVisibleDevicesByModel | default dict -}}
{{- range $name, $model := $cfg.models | default dict -}}
  {{- $dev := default $.Values.strata.rocrVisibleDevices (get $byModel $name) -}}
  {{- $_ := set $model "env" (concat ($model.env | default list) (list (printf "ROCR_VISIBLE_DEVICES=%s" $dev))) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: strata-config
  namespace: default
data:
  config.yaml: |
    {{- toYaml $cfg | nindent 4 }}
{{- end -}}
