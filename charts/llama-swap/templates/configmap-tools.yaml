# Operator provisioning tools for the llama-swap `tools` sidecar (disabled by
# default; gpu-ai enables it). Scripts ship read-only via this ConfigMap,
# mounted at /app/tools.
#
# SIZE LIMIT: this ConfigMap is applied client-side (ServerSideApply: "false"
# on both gpu and gpu-ai), so kubectl stores the whole object in the
# last-applied-configuration annotation, which the API server caps at 256 KiB.
# Embedding the vendored b10015 converter here (~750 KiB) broke syncs with
# "metadata.annotations: Too long". Therefore ONLY the operator CLI and its
# provenance pin are embedded; `llama_tools.py prepare` fetches the converter
# files from the pinned raw.githubusercontent.com URLs in
# converter-source.json (sha256-verified before publish, staged to
# /models/.tools/converter/). The vendored copies under scripts/conversion/
# and scripts/gguf-py/ stay in git for CI contract tests — they are the
# source of truth the pins were taken from.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-tools
  namespace: default
data:
  llama_tools.py: |
{{ .Files.Get "scripts/llama_tools.py" | indent 4 }}
  converter-source.json: |
{{ .Files.Get "scripts/converter-source.json" | indent 4 }}
