        - --native /models/strata/Strata-data/models/IQ3_XXS-abliterated/Qwen3.8-Flash-Next-GSQ-RCO-abliterated-IQ3_XXS-00001-of-00002.gguf
        - --ple-gguf /models/strata/Strata-data/models/IQ3_XXS-abliterated/Qwen3.8-Flash-Next-GSQ-RCO-abliterated-IQ3_XXS-00002-of-00002.gguf
        # Same qwen-architecture expert profile the other two profiles share
        # (setup's checkout data; the coder family is the only variant).
        - --expert-profile /models/strata/Strata/data/expert-profile.bin
        - --expert-cache auto
        - --spec 4
        - --spec-min-p 0.5
        # Shared stock draft-head runtime staged on the claim by the q3
        # provisioning (setup's mtp_fetch path). SC117 ships its own
        # strata/rt built from the SAME pinned stock BF16 checkpoint — the
        # abliteration never touched the MTP head — and ORCA.md prescribes
