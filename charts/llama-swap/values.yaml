    # strata — the gpu-ai internal Strata engine pod (cf-77): the SECOND
    # controller of this Application, default OFF. Seven data flags flip
    # TOGETHER from the gpu-ai service values — this one, service.strata and
    # the five strata-* persistence entries below. A partial set fails the
    # render: advancedMounts onto a DISABLED controller is app-template's
    # canonical hard error, and the reverse gap (controller ON, persistence
    # OFF) is guarded in templates/configmap-strata.yaml. Strata's public
    # exposure happens THROUGH the gpu-ai llama-swap `peers:` route, never
    # from here: the deliberate trio-rule deviation — no ingress.subdomains
    # entry — is the operator's Q4 ruling (DECISIONS 2026-10-27; a host of
    # its own would publish the pod the peers hop exists to keep private).
    strata:
      enabled: false
      type: deployment
      # A ~47 GiB pinned arena must never ride a RollingUpdate overlap —
      # two pods would double-pin the node (#2257 class; the repo lived it
      # 2026-10-18/19, DECISIONS).
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      # Pod-shape keys ride per-controller: the tree-global pod defaults
      # would also re-shape the main pod, breaking the default-OFF
      # byte-parity contract (DECISIONS 2026-10-28, Q-C ruling).
      pod:
        # Invariant: 420 > unloadTimeout(180) + --shutdown-timeout drain(30
        # default, 0..300) + slack (RESEARCH §3 amendment). The kubelet
        # SIGKILL window must beat a clean arena stop or it leaves a
        # half-pinned arena.
        terminationGracePeriodSeconds: 420
        securityContext:
          # DOCKER.md runtime contract: group video+render on the device
          # nodes. Numeric GIDs are distro-local — the C04 runbook resolves
          # them on-target and sets this key (deep-merged via the service
          # block).
          supplementalGroups: []
          # ROCm/HIP needs the full ioctl surface. Privileged already skips
          # the default profile, so this key pins the Unconfined contract
          # explicitly — the promise survives the documented-not-built
          # fallback (naming GPU plugin + IPC_LOCK/SYS_RESOURCE, non-
          # privileged).
          seccompProfile:
            type: Unconfined
      # Weight staging as a first-class citizen: upstream provisions models
      # headlessly ONLY through the source-checkout installer — the packaged
      # CLI's `install` verb is a shim for the checkout's setup.py ("this
      # folder has no installer", first deploy 2026-10-28) and docs/
      # LLAMA_SWAP.md says the integration "needs a source checkout, not the
      # desktop installer". So the image embeds the pinned checkout
      # (containers/strata Dockerfile, strata-src stage) and this init copies
      # it onto the claim and runs the documented
      # `./setup.sh --family qwen --model <id> --no-start --yes`: setup owns
      # the whole artifact story (shards, tokenizer, pack, draft data, its
      # own engine fetch) and writes strata-<model>.json run configs beside
      # the checkout — hence the checkout lives under /models/strata, so
      # every output persists on the shared claim. --no-start keeps the RAM
      # law untouched (setup never serves); markers make it idempotent.
      initContainers:
        model-fetch:
          image:
            repository: ghcr.io/ownyourio/strata
            # Same rolling tag + PIN-ME habit as the main container of this
            # pod (brand-new in-repo image; :v<run> pin lands with the first
            # docker-build.yaml merge).
            tag: main
            pullPolicy: Always
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              fail() { echo "model-fetch: $*" >&2; exit 1; }
              [ -f /opt/strata/src/Strata/setup.sh ] \
                || fail "image carries no source checkout - containers/strata must be rebuilt (strata-src stage, 2026-10-29 contract)"
              mkdir -p /models/strata
              # Session-file landing zone for the Q4 rung's --slot-save-path
              # (strata-q4.json): same claim as the weights, so a saved
              # conversation outlives a ttl unload AND a pod Recreate. Created
              # here, idempotently, because the engine writes only on demand
              # and a missing directory surfaces as a save error at the worst
              # possible moment (an operator trying to free the arena). The
              # engine's own --session-min-free-mib 4096 default guards the
              # claim's free space; the disk gate for this rung's ~4.7 GiB per
              # 262k conversation file is a human on-target check.
              mkdir -p /models/strata/sessions
              # /data/install stays the CLI's install-dir anchor, bound to the
              # claim so discovery tools (models list --install-dir default)
              # see what setup produced.
              rm -rf /data/install
              ln -sfn /models/strata /data/install
              SRC=/models/strata/Strata
              if [ ! -d "$SRC" ]; then
                cp -a /opt/strata/src/Strata "$SRC"
              else
                [ -f "$SRC/setup.sh" ] || fail "$SRC exists without setup.sh - refusing to overwrite"
              fi
              # setup.sh needs a python3 on PATH; this image ships only the
              # terminal's bundled interpreter — find it, else self-diagnose.
              if ! command -v python3 >/dev/null 2>&1; then
                for c in /opt/strata/terminal/bin/python3 /opt/strata/terminal/bin/python \
                         /opt/strata/terminal/usr/bin/python3 /opt/strata/terminal/python/bin/python3; do
                  if [ -x "$c" ]; then ln -sf "$c" /usr/local/bin/python3; break; fi
                done
              fi
              command -v python3 >/dev/null 2>&1 \
                || fail "no python3 to drive setup.sh; terminal layout: $(find /opt/strata/terminal -maxdepth 3 -name 'python*' 2>/dev/null | tr '\n' ' ')"
              # setup.sh Step 4 compiles the AMD engine for the checkout.
              # git + a C++ compiler are BAKED into the image (2026-10-29
              # owner ruling: runtime apt in an init container = pod-start
              # mirror dependency + non-reproducible layer); the Dockerfile
              # verify step pins the same two commands, so a missing tool
              # fails the build, not the boot.
              command -v git >/dev/null 2>&1 \
                && command -v c++ >/dev/null 2>&1 \
                || fail "image lacks git/c++ for the engine compile - containers/strata must be rebuilt (build-deps RUN, 2026-10-29 contract)"
              # Manual pack for the abliterated GSQ-RCO set (cf-86 C01). The
              # pinned checkout's setup catalog carries NO abliterated family:
              # verified at the v0.2.7 setup.py (image copy at
              # /opt/strata/src/Strata/setup.py) — zero hits for abliterated /
              # SC117, and the qwen family pins the plain ISTA repo — so
              # setup.sh can never fetch this pack. The recipe is SC117's own
              # strata/README.md migration section: stage both shards under
              # their original names in one directory (iq_pack auto-finds
              # shard 2) and build a NEW native pack — the IQ3_S pack's
              # native_experts.txt no longer matches after the ablation moved
              # tensor offsets, and reusing it serves wrong weights under a
              # new id. The pack is public/ungated: the fetch stays
              # anonymous (the C-A keyless posture is untouched — no token
              # appears anywhere in this chain).
              abl_pack() {
                # $1 = quant tier (IQ3_XXS today). Staging mirrors setup's own
                # Strata-data layout: models/<tier>/ for shards, packs/<tier>
                # for the iq_pack output — with an -abliterated suffix because
                # these are different bytes than the catalog tier of the same
                # name.
                tier=$1
                tierl=$(printf '%s' "$tier" | tr 'A-Z' 'a-z')
                dir=/models/strata/Strata-data/models/$tier-abliterated
                pack=/models/strata/Strata-data/packs/abliterated-$tierl
                stem=Qwen3.8-Flash-Next-GSQ-RCO-abliterated-$tier
                s1=$dir/$stem-00001-of-00002.gguf
                # shard 2 is the 28.8 GB n-gram (PLE) table — the IQ3_XXS tier
                # ships it just like IQ3_S (verified in the HF tree).
                s2=$dir/$stem-00002-of-00002.gguf
                # iq_pack needs the checkout venv (numpy) and gguf-py from
                # setup's pinned llama.cpp source (it also exports the pack's
                # tokenizer/ itself). Both land with the q3 iteration, which
                # runs before abl in the same init — name the precondition
                # loudly instead of booting a half-provisioned arena, and name
                # it BEFORE staging: the ~76 GB of downloads below must never
                # start for a pack this init cannot build.
                [ -x "$SRC/.venv/bin/python" ] \
                  || fail "abl pack: $SRC/.venv missing - the q3 token must provision before abl"
                ggufpy=$SRC/third_party/llama.cpp/gguf-py
                [ -d "$ggufpy" ] \
                  || fail "abl pack: no gguf-py at $ggufpy - setup unpacks the pinned llama.cpp source during provisioning"
                mkdir -p "$dir"
                # Staging goes through the venv interpreter, NOT curl: the
                # pinned strata image provably carries no curl binary (its
                # apt lists at v0.2.7 are python3/ca-certificates/tini + the
                # hip libraries, this repo's build adds only build-essential/
                # git/ccache, and the containers/strata verify step pins just
                # git and c++ — the bake+verify law forbids assuming a tool
                # at boot that the build never checks). setup's own downloader
                # is stdlib urllib, so this reuses the interpreter the pack
                # step already needs; C02's gated fetch reuses the same path
                # with an Authorization header. $3 is the HF-tree byte size
                # (LFS-pointer verified): a .part that finished downloading
                # between pods gets RENAMED, not re-requested — curl -C - on
                # a complete file exits non-zero and would wedge every later
                # boot. Python lines sit at the YAML block's base indent
                # because the heredoc must reach them unindented.
                abl_dl() {
                  [ -s "$2" ] && { echo "model-fetch: $(basename "$2") already staged"; return 0; }
                  "$SRC/.venv/bin/python" - "$1" "$2.part" "$3" <<'PY' || fail "abl pack: download failed for $1 (partial kept as $2.part for a resume)"
              import os, sys, urllib.error, urllib.request
              url, part, want = sys.argv[1], sys.argv[2], int(sys.argv[3])
              for _ in range(4):
                  have = os.path.getsize(part) if os.path.exists(part) else 0
                  if have > want:
                      os.remove(part); have = 0  # corrupt leftover: restart rather than wedge
                  if have == want:
                      break
                  try:
                      req = urllib.request.Request(url, headers={"Range": "bytes=%d-" % have} if have else {})
                      with urllib.request.urlopen(req, timeout=120) as r:
                          if have and r.status == 200:
                              os.remove(part); have = 0  # Range ignored: restart cleanly
                          with open(part, "ab" if have else "wb") as f:
                              while True:
                                  chunk = r.read(1048576)
                                  if not chunk:
                                      break
                                  f.write(chunk)
                  except (urllib.error.URLError, OSError) as err:
                      sys.stderr.write("abl dl: attempt failed: %s (%s)\n" % (err, part))
              final = os.path.getsize(part) if os.path.exists(part) else 0
              sys.exit(0 if final == want else "abl dl: %s ended at %d of %d bytes (partial kept for a resume)" % (url, final, want))
              PY
                  mv "$2.part" "$2" || fail "abl pack: rename failed for $2"
                }
                abl_dl "https://huggingface.co/SC117/Qwen3.8-Flash-Next-GSQ-RCO-abliterated-GGUF/resolve/main/$tier/$stem-00001-of-00002.gguf" "$s1" 47342144896
                abl_dl "https://huggingface.co/SC117/Qwen3.8-Flash-Next-GSQ-RCO-abliterated-GGUF/resolve/main/$tier/$stem-00002-of-00002.gguf" "$s2" 28800138432
                # setup's own completeness guard (native_experts.txt is
                # written last by iq_pack): a crash between pack build and the
                # marker re-enters here instead of serving a partial pack.
                if [ ! -f "$pack/native_experts.txt" ] || [ ! -f "$pack/tokenizer/vocab.json" ]; then
                  # GSQ-RCO files keep the BF16 hyper-connection projections
                  # the engine reads natively, so this is the plain qwen-family
                  # pack call — NOT ORCA.md's --compat-bf16, which only
                  # quantizers that compressed those projections need.
                  ( cd "$SRC" && STRATA_GGUF_PY="$ggufpy" .venv/bin/python tools/iq_pack.py --gguf "$s1" --out "$pack" ) \
                    || fail "abl pack: iq_pack failed (nothing is marked, the next boot resumes)"
                fi
              }
              # Manual pack for the gated orcarouter Uncensored IQ3_XXS pair
              # (cf-86 C02, the second ablated rung of the U2 ruling). The
              # catalog gate has two proofs at v0.2.7: setup.py carries no
              # orca family (docs/ORCA.md: "OrcaRouter is not an installer
              # menu entry, and there is no --family orca"), and setup.py has
              # ZERO download-auth support (no HF_TOKEN/Authorization/Bearer
              # path in the whole 628 KB installer) — so even a catalog family
              # could never fetch a gated repo, and branch B is forced. The
              # recipe is ORCA.md verbatim: stage both shards under their
              # original names (iq_pack reads the split pair from one
              # directory), pack with --compat-bf16 (Orca's quantizer, unlike
              # SC117's above, compressed the projections Strata's kernels
              # read as BF16), output to the ORCA.md-named pack dir. The
              # BYTES are gated (resolve/main 401 + Bearer challenge measured
              # 2026-10-30) while the tree metadata is public, so this fetch
              # is the one hf-token Secret consumer the R-d ruling sanctions,
              # strictly DOWNLOAD-ONLY: no token reaches the strata container,
              # the inner config, or any profile (C-A keyless serve posture).
              orca_pack() {
                # $1 = quant tier (IQ3_XXS — the only validated Orca quant).
                # Same Strata-data staging shape as abl_pack, -orca suffix.
                tier=$1
                tierl=$(printf '%s' "$tier" | tr 'A-Z' 'a-z')
                dir=/models/strata/Strata-data/models/$tier-orca
                pack=/models/strata/Strata-data/packs/orca-$tierl
                stem=Qwen3.8-Flash-Next-Uncensored-$tier
                s1=$dir/$stem-00001-of-00002.gguf
                # ORCA.md: this pack's PLE table rides in shard 1 (its example
                # profile points --native and --ple-gguf at the same shard);
                # shard 2 still must be staged — iq_pack reads both halves.
                s2=$dir/$stem-00002-of-00002.gguf
                # Guards before any byte moves (C01 review law): never start
                # 85.20 GB of downloads for a pack this init cannot build.
                [ -x "$SRC/.venv/bin/python" ] \
                  || fail "orca pack: $SRC/.venv missing - the q3 token must provision before orca"
                ggufpy=$SRC/third_party/llama.cpp/gguf-py
                [ -d "$ggufpy" ] \
                  || fail "orca pack: no gguf-py at $ggufpy - setup unpacks the pinned llama.cpp source during provisioning"
                mkdir -p "$dir"
                # Same venv-urllib downloader as abl_dl (no shell HTTP client
                # is baked into this image — bake+verify law), extended with
                # the gated leg. Header law, measured 2026-10-30: the 401 +
                # Bearer gate sits at the huggingface.co ORIGIN (an invalid
                # Bearer 401s before any redirect), the public chain 302s to
                # a PRE-SIGNED us.aws.cdn.hf.co URL whose Signature/Expires
                # query authorizes the CDN leg (Range crosses the hop: 206
                # Content-Range), and CPython's own redirect_request copies
                # Authorization onto every cross-host hop — auto-following
                # would leak the token to the whole chain. So: no auto-follow,
                # walk hops manually over an hf.co-family allowlist, Bearer
                # ONLY on the token host, CDN leg on signature + Range.
                orca_dl() {
                  [ -s "$2" ] && { echo "model-fetch: $(basename "$2") already staged"; return 0; }
                  "$SRC/.venv/bin/python" - "$1" "$2.part" "$3" <<'PY' || fail "orca pack: download failed for $1 (partial kept as $2.part for a resume)"
              import os, sys, urllib.error, urllib.parse, urllib.request
              url, part, want = sys.argv[1], sys.argv[2], int(sys.argv[3])
              token = os.environ.get("HF_TOKEN")
              if not token:
                  sys.exit("orca dl: HF_TOKEN is empty - the gated pack needs the hf-token secretKeyRef on this init (R-d download-only)")
              TOKEN_HOST = "huggingface.co"
              PLATFORM = (".hf.co", ".huggingface.co")
              class NoAutoRedirect(urllib.request.HTTPRedirectHandler):
                  # returning None surfaces the 302 as HTTPError instead of
                  # urllib re-issuing the request (and its Authorization
                  # header) at the next host
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None
              opener = urllib.request.build_opener(NoAutoRedirect())
              def open_ranged(target, have, depth=0):
                  host = urllib.parse.urlsplit(target).netloc
                  headers = {"Authorization": "Bearer " + token} if host == TOKEN_HOST else {}
                  if have:
                      headers["Range"] = "bytes=%d-" % have
                  try:
                      return opener.open(urllib.request.Request(target, headers=headers), timeout=120)
                  except urllib.error.HTTPError as err:
                      if err.code not in (301, 302, 303, 307, 308) or depth >= 4:
                          raise
                      nxt = urllib.parse.urljoin(err.geturl(), err.headers.get("Location", ""))
                      nh = urllib.parse.urlsplit(nxt).netloc
                      if nh != TOKEN_HOST and not nh.endswith(PLATFORM):
                          sys.exit("orca dl: refusing off-platform redirect %s -> %s (the token never leaves %s)" % (err.geturl(), nh, TOKEN_HOST))
                      return open_ranged(nxt, have, depth + 1)
              for _ in range(4):
                  have = os.path.getsize(part) if os.path.exists(part) else 0
                  if have > want:
                      os.remove(part); have = 0  # corrupt leftover: restart rather than wedge
                  if have == want:
                      break
                  try:
                      with open_ranged(url, have) as r:
                          if have and r.status == 200:
                              os.remove(part); have = 0  # Range ignored: restart cleanly
                          with open(part, "ab" if have else "wb") as f:
                              while True:
                                  chunk = r.read(1048576)
                                  if not chunk:
                                      break
                                  f.write(chunk)
                  except (urllib.error.URLError, OSError) as err:
                      sys.stderr.write("orca dl: attempt failed: %s (%s)\n" % (err, part))
              final = os.path.getsize(part) if os.path.exists(part) else 0
              sys.exit(0 if final == want else "orca dl: %s ended at %d of %d bytes (partial kept for a resume)" % (url, final, want))
              PY
                  mv "$2.part" "$2" || fail "orca pack: rename failed for $2"
                }
                # Byte pins are the HF tree-API literals the pack contract is
                # built on (sum 85202668032 = ORCA.md's 85.20 GB); the
                # downloader renames a .part only on an exact match.
                orca_dl "https://huggingface.co/orcarouter/Qwen3.8-Flash-Next-Uncensored-GGUF/resolve/main/$stem-00001-of-00002.gguf" "$s1" 44637691008
                orca_dl "https://huggingface.co/orcarouter/Qwen3.8-Flash-Next-Uncensored-GGUF/resolve/main/$stem-00002-of-00002.gguf" "$s2" 40564977024
                # setup's own completeness guard (native_experts.txt is
                # written last by iq_pack): a crash between pack build and the
                # marker re-enters here instead of serving a partial pack.
                if [ ! -f "$pack/native_experts.txt" ] || [ ! -f "$pack/tokenizer/vocab.json" ]; then
                  # --compat-bf16 is ORCA.md's answer to THIS quantizer: it
                  # expands only the hyper-connection/small-attention/PLE
                  # projections Orca compressed but Strata reads as BF16;
                  # experts, native attention, embeddings and the PLE table
                  # stay untouched (and the table stays on disk).
                  ( cd "$SRC" && STRATA_GGUF_PY="$ggufpy" .venv/bin/python tools/iq_pack.py --gguf "$s1" --out "$pack" --compat-bf16 ) \
                    || fail "orca pack: iq_pack failed (nothing is marked, the next boot resumes)"
                fi
              }
              IFS=,
              for tok in ${STRATA_QUANTS:-q3}; do
                [ -n "$tok" ] || continue
                TOK=$(printf '%s' "$tok" | tr 'a-z' 'A-Z')
                FAM=qwen
                case "$TOK" in
                  Q3) SIZE=IQ3_S ;;
                  *)  SIZE=$(printenv "STRATA_MODEL_$TOK" || true) ;;
                esac
                # STRATA_MODEL_Qx may name another catalog family as
                # "family/model" (e.g. unsloth/UD-Q4_K_XL — the q4/q5 the
                # qwen family does not carry); a bare name stays qwen. The
                # pseudo-families "abl" and "orca" are deliberately NOT
                # catalog names: they route the token to the manual packs
                # above.
                case "$SIZE" in
                  */*) FAM=${SIZE%%/*}; SIZE=${SIZE#*/} ;;
                esac
                if [ -z "$SIZE" ]; then
                  echo "model-fetch: no model id mapped for quant '$tok' - set env STRATA_MODEL_$TOK=[family/]model (catalog: ./setup.sh --help in $SRC)" >&2
                  exit 1
                fi
                MARK="/models/strata/.setup-$TOK"
                if [ -f "$MARK" ]; then
                  echo "model-fetch: $tok already set up, skipping"
                  continue
                fi
                if [ "$FAM" = abl ]; then
                  echo "model-fetch: manual pack for $tok ($SIZE abliterated tier — no setup.sh catalog entry)"
                  abl_pack "$SIZE"
                  touch "$MARK"
                  continue
                fi
                if [ "$FAM" = orca ]; then
                  # The 85.20 GB gated pack carries its OWN completeness
                  # marker at the chunk-frozen path: touched only after the
                  # staged shards AND the pack built (orca_pack fail-exits on
                  # any partial), so an interrupted pack re-enters the step
                  # instead of being marked done — a marker written early
                  # would make a partial pack permanent and the arena would
                  # serve missing weights. Re-entry is cheap: the -s skip and
                  # the native_experts.txt guard short-circuit everything but
                  # a genuinely missing byte.
                  OMARK="/models/strata/.pack-orca"
                  if [ -f "$OMARK" ]; then
                    echo "model-fetch: orca pack complete, skipping"
                    continue
                  fi
                  echo "model-fetch: gated manual pack for $tok ($SIZE orcarouter Uncensored — no setup.sh catalog entry)"
                  orca_pack "$SIZE"
                  touch "$OMARK"
                  continue
                fi
                echo "model-fetch: setup.sh for $tok as $FAM/$SIZE (downloads start here)"
                # --backend hip is mandatory, not a preference: setup.sh probes
                # NVIDIA by default and hard-stops "no NVIDIA GPU found" on this
                # AMD node (deploy 2026-10-29); SOURCE_INSTALL.md AMD section
                # names the explicit selector. The init container therefore
                # mounts /dev/kfd + /dev/dri (persistence advancedMounts below)
                # — the HIP probe must see the card, or it fails the same lie
                # in the other direction.
                ( cd "$SRC" && ./setup.sh --backend hip --family "$FAM" --model "$SIZE" --context 262144 --vision no --no-start --yes )
                touch "$MARK"
              done
              ls -la "$SRC"/strata-*.json 2>/dev/null \
                || echo "model-fetch: WARNING no strata-*.json run config found - inspect $SRC before serving"
              echo "model-fetch: quants [${STRATA_QUANTS:-q3}] provisioned via checkout on the claim"
          env:
            # Quant set, comma-separated: "q3" today. Only q3=IQ3_S carries
            # a built-in mapping (qwen family); further tokens need
            # STRATA_MODEL_Qx=[family/]model — the qwen family caps at the
            # four ISTA quants (Q2_0/IQ2_XS/IQ3_XXS/IQ3_S), so q4/q5 come
            # from the unsloth family (UD-Q4_K_XL ~104 GB incl. the shared
            # 28.8 GB n-gram shard; UD-Q5_K_XL ~147 GB — past this node's
            # arena model, see the runbook budget table). Loud fail for
            # unmapped tokens; markers keep each quant idempotent. Override
            # deep-merges from the service block:
            # app-template.controllers.strata.initContainers.model-fetch.env.
            STRATA_QUANTS: "q3"
          resources:
            # limits.memory 1Gi OOM-KILLED the engine compile (exit 137, 8
            # restarts 2026-10-29: step 4 runs `ninja -j 16` clang jobs the
            # moment configure completes — the 1Gi cap was sized for pip and
            # downloads, not for a compile). 32Gi bounds the parallel clang
            # peak inside a cgroup so a runaway build can never eat into the
            # llama.cpp trio; 2Gi request keeps pod scheduling honest without
            # stacking on the main container's 96Gi reservation.
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              memory: 32Gi
          securityContext:
            # HIP GPU detection (setup.sh --backend hip) needs the same device
            # view as the main container, so the earlier download-only
            # non-privileged shape is lifted: privileged + /dev/kfd +
            # /dev/dri here mirrors the pod's already-accepted device
            # deviation (DECISIONS 2026-10-27). No serve, no pins —
            # --no-start keeps the RAM law out of init's way.
            privileged: true
      containers:
        strata:
          image:
            repository: ghcr.io/ownyourio/strata
            # PIN-ME: brand-new container, no :v<run> exists yet (repo
            # new-container rule) — docker-build.yaml publishes :v<run_number>
            # on the first merge; replace this rolling tag with the pin
            # (+ the renovate habit) as soon as one exists.
            tag: main
            pullPolicy: Always
          # C01 interface freeze (containers/strata README): PID 1 is the
          # harvested llama-swap binary; args override the image CMD, which
          # documents the same default config path.
          args:
            - "-config"
            - "/app/config/config.yaml"
          # No container env at all: the keyless ruling (C-A, DECISIONS
          # 2026-10-28) deleted this pod's whole secret chain rather than
          # gating it — do not re-add a secretKeyRef or env passthrough.
          # The engine's key posture ships in the profiles below (api_key
          # "none").
          probes:
            # Every probe hits the supervisor's own /health — a kubelet
            # probe at a model/upstream endpoint triggers loads (repo
            # lesson) and peers/`/upstream` passthrough is not probe-safe
            # (RESEARCH §3 caveat). llama-swap answers /health itself, so
            # probes never flap mid-swap (DECISIONS probes ruling).
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                # 150x10s absorbs the cold arena pin in parallel with
                # healthCheckTimeout (plan Goal, O2 pairing).
                periodSeconds: 10
                failureThreshold: 150
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
          resources:
            # 128 GB node (R3). OOM post-mortem 2026-10-29: the setup-chosen
            # `--ple-io ram` (+28.8 GiB resident) atop a ~47 GiB arena with
            # the llama.cpp trio warm blew node RAM and the kernel harvested
            # cluster system pods. Caps bound the blast radius: the container
            # cgroup stops strata (kernel victims stay inside THIS cgroup)
            # and the engine's --memory-limit-mib (PR #1601 pairing: a
            # cgroup limit must be declared to the engine) sizes arena +
            # conversation cache + KV inside 90 GiB of it — supervisor and
            # venv headroom fill the rest. Coexistence is time-shared (ttl
            # below), not simultaneous residency.
            requests:
              cpu: 8
              memory: 64Gi
            # 96Gi ceiling = ~50 GiB IQ3_S arena + 32 GiB conversation cache
            # + ~13 GiB worst-case 4-slot KV + engine/supervisor headroom
            # (owner budget ruling 2026-10-29). Node is 125 GiB: a fully
            # warm strata pod leaves the llama.cpp trio NO real headroom —
            # the ttl:3600 time-share and the cgroup cap are what keep the
            # next collision inside this container instead of the whole
            # node. Raise --memory-limit-mib in lockstep with this number.
            # cf-86 C06 raises the ceiling to 100Gi for the UD-Q4_K_XL rung:
            # its declared pair is 95232 MiB inside 100Gi (71.7 GiB pinned
            # experts + 8 GiB trimmed conversation cache + ~13 GiB worst-case
            # KV ≈ 92.7, RESEARCH Round 2/3 [A1]) — the pair is PER-RUNG, so
            # the IQ3_S/IQ3_XXS profiles keep their 92160 cap inside this same
            # cgroup and ride the smaller arena; nothing about the smaller
            # rungs' envelope changed. 100Gi is the largest cap this node has
            # ever carried, which is precisely why the matrix keeps all five
            # arenas as alternatives and the 420 s grace stays untouched.
            limits:
              memory: 100Gi
          securityContext:
            # DECISIONS 2026-10-27 device-access ruling: privileged +
            # hostPath /dev/kfd + /dev/dri, NOT the amd-gpu device plugin —
            # the plugin advertises by count and cannot name gfx1201 vs the
            # 8060S on this mixed APU+dGPU node; chip hiding happens inside
            # via rocrVisibleDevices. Accepted deviation from the repo
            # drop-ALL standard, confined to this pod (the llama.cpp pod
            # keeps its unprivileged shape untouched). Documented-not-built
            # fallback once a naming-capable plugin exists: amd.com/gpu +
            # IPC_LOCK/SYS_RESOURCE + non-privileged.
            privileged: true

  service:
    llama-swap:
      controller: *chartName
      ports:
        http:
          port: 8080
    strata:
      enabled: false
      controller: strata
      ports:
        http:
          port: 8080
      # ClusterIP only, and NO ingress entry beside it or in the service
      # values: Q4 internal-only ruling, the deliberate trio deviation
      # (DECISIONS rework). The gpu-ai peers proxy URL is this controller's
      # rendered Service name — app-template fullname + controller key,
      # e.g. gpu-ai-llama-swap-strata — read it from NOTES, and keep the
      # no-/v1-suffix shape (the path appends verbatim, RESEARCH §3).

  persistence:
    config:
      # Mount the ConfigMap as a DIRECTORY (no subPath): subPath mounts never
      # receive ConfigMap updates, which silently disabled llama-swap's
      # -watch-config hot reload (the 2026-10-17 whisper incident needed a
      # manual pod restart for exactly this reason). With the directory mount
      # kubelet syncs ConfigMap changes (~1 min) and run.sh's default
      # -watch-config reloads llama-swap in place; the LLAMA_SWAP_CONFIG env
      # above points at the file inside the directory.
      # advancedMounts, not globalMounts: a globalMount attaches to EVERY
      # enabled controller, and the strata container owns its own
      # /app/config (strata-config below) — a collision. This enumerates
      # exactly the containers globalMounts reached before (main, tools),
      # so every per-container mount set renders byte-identical to the
      # pre-consolidation tree (mount-exactness law, DECISIONS 2026-10-28).
      type: configMap
      name: llama-swap-config
      advancedMounts:
        llama-swap:
          main:
            - path: /app/config
          tools:
            - path: /app/config
    tools:
      # advancedMounts for the same collision reason as `config` above —
      # enumerating the old globalMount consumers exactly: main keeps its
      # read-only /app/tools mount, the tools sidecar keeps its own.
      type: configMap
      name: llama-swap-tools
      advancedMounts:
        llama-swap:
          main:
            - path: /app/tools
              readOnly: true
          tools:
            - path: /app/tools
              readOnly: true
    models:
      # STAYS globalMounts: strata legitimately shares /models (Q3 ruling —
      # the EXISTING llama-swap claim mounted whole, this chart creates no
      # second PVC; tests pin that). RWO multi-pod same-node mount on
      # local-path is the single-node-cluster pattern; on-target verification
      # rides C04 along with the capacity check.
      existingClaim: *chartName
      globalMounts:
        - path: /models
    # --- strata controller volumes (default OFF; flip with the other six
    # strata flags — advancedMounts naming a DISABLED controller fails the
    # render, so these carry their own enabled gates) ---
    strata-config:
      # Mounted as a DIRECTORY, never subPath: subPath mounts do not receive
      # ConfigMap updates, which silently killed hot reload in the
      # 2026-10-17 llama-swap incident (repo lesson).
      enabled: false
      type: configMap
      name: strata-config
      advancedMounts:
        strata:
          strata:
            - path: /app/config
    strata-profile:
      # Directory for the same hot-reload reason; the cmd's --profile path
      # is inside here (strata-iq3_s.json).
      enabled: false
      type: configMap
      name: strata-profile
      advancedMounts:
        strata:
          strata:
            - path: /profile
    strata-kfd:
      enabled: false
      type: hostPath
      hostPath: /dev/kfd
      hostPathType: CharDevice
      advancedMounts:
        strata:
          strata:
            - path: /dev/kfd
          # model-fetch probes HIP hardware during setup (see init
          # container comment) — the card must be visible to it too.
          model-fetch:
            - path: /dev/kfd
    strata-dri:
      enabled: false
      type: hostPath
      hostPath: /dev/dri
      hostPathType: Directory
      advancedMounts:
        strata:
          strata:
            - path: /dev/dri
          model-fetch:
            - path: /dev/dri
    strata-shm:
      # DOCKER.md's --shm-size 2g equivalent (C01 README runtime contract).
      enabled: false
      type: emptyDir
      medium: Memory
      sizeLimit: 2Gi
      advancedMounts:
        strata:
          strata:
            - path: /dev/shm

# ---------------------------------------------------------------------------
# strata — workload DATA for the second app-template controller above. The
# gated templates (configmap-strata.yaml, configmap-strata-profile.yaml)
# render this subtree ONLY while the strata flags stay enabled; the inert-
# default render of the whole container changes nothing (byte-parity gate).
# The gpu-ai internal Strata engine pod (cf-77): one privileged pod whose
# llama-swap supervisor (from the containers/strata image,
# ghcr.io/ownyourio/strata) owns `strata serve` as a supervised child; public
# exposure happens THROUGH the existing gpu-ai llama-swap `peers:` route,
# never from here (Q4 internal-only ruling).
# ---------------------------------------------------------------------------
strata:
  # ROCr device index for the engine (PR #3636 hid the 8060S APU with 0).
  # Injected into every model's env at render; the on-target rocminfo gate
  # (C04 runbook) retargets it with a values edit, not a template edit.
  rocrVisibleDevices: "0"

  # Per-model ROCr overrides; a model absent here inherits the value above.
  # The strix fallback must name the OTHER silicon: the primary's index
  # deliberately hides the 8060S, so reusing that value would leave the
  # gfx1151 model with no device to bind. "1" mirrors PR #3636's
  # enumeration (dGPU first, chip second) — VERIFY at the same rocminfo
  # gate; on a chip-only node (the fallback's main scenario) the chip is 0,
  # so set "0" or "" to inherit there.
  # New R9700 rungs (the abliterated IQ3_XXS arena, later Q4 rungs) get NO
  # entry here on purpose: they target the same dGPU as the primary and
  # inherit the global index — per-rung entries would multiply the
  # retargeting surface at the rocminfo gate without naming a difference.
  rocrVisibleDevicesByModel:
    qwen3.8-flash-next-strata-strix: "1"

  # -------------------------------------------------------------------------
  # The INNER llama-swap declared config. configmap-strata.yaml renders this
  # subtree to /app/config/config.yaml; keys prefixed `engineProfile` are
  # chart-side layers (run-config JSON bodies consumed by the profile
  # ConfigMap, not llama-swap keys) and are stripped there. The result must
  # validate against the deployed supervisor's v266-pinned schema (the exact
  # tag the image was harvested from — main-only keys false-fail, RESEARCH
  # "Implications/Validation").
  # -------------------------------------------------------------------------
  config:
    # 1800 s absorbs the cold arena pin: 46.84 GiB at the PR's measured
    # 17.3 GiB/s plus engine init (RESEARCH §3/O2; llama-swap restarts the
    # countdown whenever /health reports new progress, so this bounds the
    # worst case, not the steady state).
    healthCheckTimeout: 1800

    # ${PORT} base — pod-local, mirrors the outer instance's numbering habit;
    # nothing else binds these ports (the engine stays on 127.0.0.1).
    startPort: 10001

    # Q2 lazy posture: nothing ever unloads on a timer.
    globalTTL: 0

    # Empty = default-allow. The keyless ruling (C-A) deleted the whole
    # secret chain — ExternalSecret, per-container env, per-model
    # passthrough — rather than gating it, so no landmine or dead guard
    # remains. The unauthenticated posture mirrors the OUTER llama-swap's
    # own apiKeys: [] and is cluster-internal only: the sanctioned route is
    # the peers hop and the engine binds loopback.
    apiKeys: []

    # Upstream engine lines (the pin progress log, the /health JSON) must
    # reach pod stdout — they are the C04 --plan-gate and unload-timing
    # evidence trail.
    logToStdout: "both"

    models:
      qwen3.8-flash-next-strata:
        name: Qwen3.8-Flash-Next IQ3_S (R9700 arena)
        description: Strata engine, experts pinned in a page-locked RAM arena on the R9700, capped at 90 GiB engine-side with a 32 GiB conversation-cache budget; first request pays the cold pin (minutes), then residency is time-shared — the arena unloads after 1h idle so the llama.cpp trio gets its RAM back (set ttl 0 to pin forever).
        # serve takes only --profile/--host/--port (RESEARCH §2) — every
        # tuning knob lives in the run-config JSON below. `exec` hands the
        # process to llama-swap for stop/unload, and the ulimit wrapper is
        # load-bearing: no 0.2.x release self-raises nofile (PR #2399 open)
        # and HIP expert memory creation fails at ~1k FDs (RESEARCH §2,
        # contradiction #5). ${PORT} with no hardcoded port keeps this
        # SanitizeCommand-safe and needs no proxy key.
        cmd: bash -c 'ulimit -n 524288; exec /opt/strata/terminal/bin/strata serve --profile /profile/strata-iq3_s.json --host 127.0.0.1 --port ${PORT}'
        # ttl 3600 = unload after 1h idle (tri-state: 0 = never, -1 =
        # globalTTL). The 2026-10-29 OOM post-mortem settled the residency
        # policy: with the arena capped but uncapped-by-default llama.cpp
        # models wanting the same 125 GB, PERMANENT residency (the run-1
        # Q2 posture) turns every cold strata load into a coin-flip for the
        # trio. Time-sharing hands the budgeted ~50-90 GiB back after quiet;
        # the cost is re-paying the minutes-long cold pin after an idle hour.
        # Set ttl: 0 to pin forever (dedicated-window mode); manual escape
        # remains POST /api/models/unload/qwen3.8-flash-next-strata.
        ttl: 3600
        # llama-swap force-kills at unloadTimeout (global default 10 s) long
        # before the 420 s pod grace matters — a ~47 GiB page-locked unload
        # needs this raised window (RESEARCH §3, contradiction #4; timed
        # unload verification is a C04 on-target gate). terminationGrace-
        # PeriodSeconds(420) > this + the engine's 30 s drain is the
        # invariant — keep both values' pairing true when editing either.
        unloadTimeout: 180
        # Strata's /health answers only once the model is loaded and needs no
        # key (RESEARCH §3) — the upstream doc's integration shape.
        checkEndpoint: /health
        # PR #3636 one-at-a-time arm's switches (RESEARCH §5; the strix
        # eight-set is a superset and stays C05's) plus the chart-injected
        # ROCR entry. STRATA_KV_GROW stays off per the R4 ruling.
        # Strata's DNS-rebinding guard sees the peers-forwarded Service
        # Host (llama-swap passes the client Host through; docs/
        # LLAMA_SWAP.md "Host is not allowed") — with the api_key
        # deliberately absent (C-A), the allow-list is the documented
        # other answer. The engine ignores ports, so the Service-DNS
        # shapes cover in-cluster callers; localhost always passes.
        env:
          - "STRATA_PF_FUSED=1"
          - "STRATA_PF_GEMM=1"
          - "STRATA_PA_FAST=1"
          - "STRATA_HIP_WMMA=1"
          - "STRATA_SELECT_WMMA=1"
          - "STRATA_PREFILL_CPU_SHARE=auto"
          - "STRATA_ALLOWED_HOSTS=gpu-ai-llama-swap-strata,gpu-ai-llama-swap-strata.default.svc,gpu-ai-llama-swap-strata.default.svc.cluster.local"
        # Lazy by ruling (Q2 + RESEARCH §3: preloading matrix alternatives
        # swap-loads each other — C05's (p|s) case). Preload flip, only if
        # on-target ever wants a boot-pinned arena:
        # hooks:
        #   on_startup:
        #     preload: [qwen3.8-flash-next-strata]

      qwen3.8-flash-next-strata-strix:
        name: Qwen3.8-Flash-Next IQ3_S (Strix Halo 8060S fallback)
        description: Strata engine, gfx1151 build on the 8060S iGPU; arena lives in shared LPDDR5X, manual/secondary use, unloads on idle (see the chart README, Strix-alone fallback).
        # Same serve wrapper as the primary (C01 interface freeze) — the
        # gfx1151-vs-gfx1201 switch is the exe key inside the second
        # profile, never the image or this flag list.
        cmd: bash -c 'ulimit -n 524288; exec /opt/strata/terminal/bin/strata serve --profile /profile/strata-strix-iq3_s.json --host 127.0.0.1 --port ${PORT}'
        # ttl > 0 = idle SECONDS before unload (the tri-state trap: 0 is
        # never, not immediately). Secondary use should hand the LPDDR5X
        # arena back when quiet instead of holding it like the primary's
        # pinned residency — 1800 is the operator-toggle default, set 0 to
        # pin forever once warm.
        ttl: 1800
        # Page-locked in LPDDR5X just like the primary's VRAM arena — the
        # same force-kill window logic applies (RESEARCH contradictions #4).
        unloadTimeout: 180
        checkEndpoint: /health
        # The §5 eight-set rides in the run-config profile below instead:
        # those literals are upstream-recipe constants, not values-gated,
        # so their single source is engineProfileStrix.env. No SECRETS at
        # this layer — the keyless ruling (C-A) removed the last entry that
        # lived here; the absence is the posture, not an omission. The one
        # non-secret this layer carries is the peers-forwarded Host
        # allow-list (same DNS-rebinding reason as the primary).
        env:
          - "STRATA_ALLOWED_HOSTS=gpu-ai-llama-swap-strata,gpu-ai-llama-swap-strata.default.svc,gpu-ai-llama-swap-strata.default.svc.cluster.local"
        # Rounds differ from the primary's output: the §5 switches are
        # KL-gated (STRIX_HALO §5 "changes bits") — never A/B the two
        # profiles token-for-token, compare on the bench suite instead.

      qwen3.8-flash-next-strata-abliterated:
        name: Qwen3.8-Flash-Next Abliterated IQ3_XXS (R9700 arena)
        description: Strata engine on the public SC117 GSQ-RCO-abliterated pack at IQ3_XXS — same ~50 GiB arena class and 90 GiB engine cap as the IQ3_S flagship, experts pinned in the page-locked RAM arena on the R9700 with the 32 GiB conversation-cache budget; first request pays the cold pin (minutes), then residency is time-shared — the arena unloads after 1h idle so the llama.cpp trio gets its RAM back.
        # Same serve wrapper as the primary (C01 interface freeze) — the
        # pack/quant switch lives entirely in the profile file; serve takes
        # no tuning flags.
        cmd: bash -c 'ulimit -n 524288; exec /opt/strata/terminal/bin/strata serve --profile /profile/strata-abliterated-iq3_xxs.json --host 127.0.0.1 --port ${PORT}'
        # Residency contract copied from the primary verbatim: ttl/unload-
        # Timeout/checkEndpoint equality is what keeps the time-share
        # discipline and the 420 s grace invariant rung-wide, not per-rung.
        ttl: 3600
        unloadTimeout: 180
        checkEndpoint: /health
        # This rung rides the engine's defaults: NO env switch set — neither
        # the primary's PR #3636 one-at-a-time arm nor the strix eight-set
        # (both are silicon/recipe-specific; re-deriving switches for an XXS
        # ablation is an on-target bench call, not a copy-paste). The one
        # entry is the peers-forwarded Host allow-list (DNS-rebinding guard,
        # same reason as the other two); the ROCR entry is injected by the
        # template from the global index.
        env:
          - "STRATA_ALLOWED_HOSTS=gpu-ai-llama-swap-strata,gpu-ai-llama-swap-strata.default.svc,gpu-ai-llama-swap-strata.default.svc.cluster.local"

      qwen3.8-flash-next-strata-orca:
        name: Qwen3.8-Flash-Next Uncensored IQ3_XXS (R9700 arena)
        description: Strata engine on the gated orcarouter Uncensored pack at IQ3_XXS via the ORCA.md manual pack (the only validated Orca quant) — same ~50 GiB arena class (ORCA.md measures the 49.8 GiB expert arena) and 90 GiB engine cap as the IQ3_S flagship, experts pinned in the page-locked RAM arena on the R9700 with the 32 GiB conversation-cache budget; first request pays the cold pin (minutes), then residency is time-shared — the arena unloads after 1h idle so the llama.cpp trio gets its RAM back.
        # Same serve wrapper as the primary (C01 interface freeze); the pack
        # switch lives entirely in the profile file.
        cmd: bash -c 'ulimit -n 524288; exec /opt/strata/terminal/bin/strata serve --profile /profile/strata-orca-iq3_xxs.json --host 127.0.0.1 --port ${PORT}'
        # Residency contract copied from the primary verbatim (same law as
        # the abliterated rung): ttl/unloadTimeout/checkEndpoint equality
        # keeps the time-share discipline and the 420 s grace invariant
        # rung-wide.
        ttl: 3600
        unloadTimeout: 180
        checkEndpoint: /health
        # Engine defaults like the other R9700 XXS rung: no PR/strix switch
        # set (silicon/recipe-specific), only the peers-forwarded Host
        # allow-list; ROCR entry injected by the template from the global
        # index.
        env:
          - "STRATA_ALLOWED_HOSTS=gpu-ai-llama-swap-strata,gpu-ai-llama-swap-strata.default.svc,gpu-ai-llama-swap-strata.default.svc.cluster.local"

      qwen3.8-flash-next-strata-q4:
        name: Qwen3.8-Flash-Next Unsloth UD-Q4_K_XL (R9700 arena)
        description: Strata engine on the public unsloth UD-Q4_K_XL pack — the wave's quality rung at 93.1% Q8_0 top-token match against the IQ3_S flagship's 87.7%, paid for with a 71.7 GiB pinned-expert arena, a conversation-cache trim from 32 to 8 GiB (upstream's own default class) and disk-backed session files in place of RAM parking; ~10-30% slower decode than IQ3_S on this card class is the cost the U8 ruling accepts knowingly. Experts pinned in the page-locked RAM arena on the R9700 inside its own 100Gi/95232 pair; the arena unloads after 1h idle so the llama.cpp trio gets its RAM back.
        # Same serve wrapper as the primary, byte-for-byte except the profile
        # file (the suite asserts exactly this equality — the ulimit wrapper is
        # load-bearing, and a per-rung wrapper drift is invisible until fd
        # exhaustion): the pack/quant/memory switch lives entirely in the
        # profile file; serve takes no tuning flags.
        cmd: bash -c 'ulimit -n 524288; exec /opt/strata/terminal/bin/strata serve --profile /profile/strata-q4.json --host 127.0.0.1 --port ${PORT}'
        # Residency contract copied from the primary verbatim (rung-wide law,
        # same as the abliterated/orca rungs): ttl/unloadTimeout/checkEndpoint
        # equality keeps the time-share discipline and the 420 s grace
        # invariant, which C06 must not touch.
        ttl: 3600
        unloadTimeout: 180
        checkEndpoint: /health
        # Engine defaults like the other R9700 rungs: no PR/strix switch set
        # (silicon/recipe-specific), only the peers-forwarded Host allow-list;
        # the ROCR entry is injected by the template from the global index.
        env:
          - "STRATA_ALLOWED_HOSTS=gpu-ai-llama-swap-strata,gpu-ai-llama-swap-strata.default.svc,gpu-ai-llama-swap-strata.default.svc.cluster.local"

    matrix:
      # The engines are ALTERNATIVES, never co-loadable: the arenas pin
      # RAM additively on the 128 GB node and co-residency recreates #1715's
      # global OOM (RESEARCH §7). "(p | s | c | o | q)" expands to one-model
      # combos, so the solver evicts the resident arena before starting the
      # other — the preload-empty hook alone would not stop a request-driven
      # co-load. The Q4 arena is the largest of the five (71.7 GiB pinned
      # experts), which is exactly why it rides the alternation instead of a
      # slot of its own. vars name model IDs, not aliases (llama-swap matrix
      # semantics). All stay lazily reachable; nothing preloads.
      vars:
        p: qwen3.8-flash-next-strata
        s: qwen3.8-flash-next-strata-strix
        c: qwen3.8-flash-next-strata-abliterated
        o: qwen3.8-flash-next-strata-orca
        q: qwen3.8-flash-next-strata-q4
      sets:
        main: "(p | s | c | o | q)"

    # -----------------------------------------------------------------------
    # The run-config JSON rendered VERBATIM to /profile/strata-iq3_s.json
    # (key vocabulary: RESEARCH §2, measured from profiles.py). SOURCE OF
    # TRUTH: the run-config setup GENERATED for this node
    # (/models/strata/Strata/strata-iq3_s.json, cat 2026-10-29) — it
    # supersedes the PR #3636 seed and corrects every seeded path guess:
    # weights/pack/MTP live under Strata-data, the tokenizer is a DIRECTORY
    # riding inside the pack (the seed's GGUF-file pointer was the crash
    # strata.py named), and the engine is the checkout's own gfx1201
    # compile. The on-target --plan gate (C04) is now verification, not
    # discovery; every deliberate deviation from the generated file is a
    # documented toggle below.
    # -----------------------------------------------------------------------
    engineProfile:
      # C-A keyless shipped default: "none" = the engine checks no key. It
      # binds loopback (see host below), so only the supervisor proxy can
      # reach it and the pod's auth posture is fully decided by the apiKeys
      # above — a key here would gate nothing reachable. (The generated file
      # omits the key; "none" states the same posture explicitly.)
      api_key: "none"
      # exe = the engine model-fetch's setup COMPILED for this machine
      # (gfx1201 via the checkout's venv ROCm SDK). The checkout lives on the
      # shared claim, so the path is pod-stable; the packaged /opt/strata
      # engines remain the strix fallback's runtime. Switching flavor =
      # switching profile file, never the image (C01 interface freeze).
      exe: /models/strata/Strata/engine/strata
      # serve's engine child inherits llama-swap's model env (the layer
      # above, single source of truth); a duplicate here would let serve
      # silently re-pin a value the chart gates (rocrVisibleDevices). C05's
      # strix profile carries its own §5 eight-set instead.
      env: {}
      # setup's own choices, kept verbatim: engine-relative cwd and the
      # progress log on the claim (the --plan-gate and unload-timing
      # evidence trail).
      cwd: /models/strata/Strata
      log: /models/strata/Strata/strata-iq3_s.log
      # Paths are SETUP's measured layout on the shared claim (2026-10-29):
      # weights/pack/MTP under Strata-data, expert-profile in the checkout's
      # data/. The prefix keeps this engine's files out of llama.cpp's
      # LLAMA_CACHE=/models layout on the same disk (DECISIONS Q3).
      args:
        - --pack /models/strata/Strata-data/packs/iq3_s
        # IQ3_S two-shard GGUF (ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF;
        # shard 2 is the PLE file, RESEARCH §4); setup's .done markers sit
        # beside them.
        - --native /models/strata/Strata-data/models/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf
        - --ple-gguf /models/strata/Strata-data/models/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00002-of-00002.gguf
        - --expert-profile /models/strata/Strata/data/expert-profile.bin
        # N in --expert-cache counts expert SLOTS, not MiB (RESEARCH §2);
        # `auto` is both the PR's and setup's choice — the --plan gate
        # verifies the resolved arena against real RAM (R1/R3).
        - --expert-cache auto
        - --spec 4
        - --spec-min-p 0.5
        - --mtp /models/strata/Strata-data/mtp/rt
        - --max-context 262144
        # int8 KV: the engine default AND the PR's explicit choice.
        - --kv int8
        # Machine-tuned by setup, adopted with 2026-10-29 post-OOM edits:
        # --ple-io ram REMOVED (back to the engine's file/mmap default — the
        # 28.8 GiB n-gram table reads sparsely; RAM-resident only made sense
        # on a node with nothing else warm), and --memory-limit-mib declared
        # so the engine sizes its page-locked arena inside the container's
        # 96Gi cgroup instead of guessing at free node RAM (PR #1601
        # pairing; 90 GiB = arena ~50 + conversation cache 32 + worst-case
        # 4-slot KV ~13, per the owner budget ruling). KV-int8 math here is
        # ~13 KiB/token (only 12 of 48 layers carry full attention), so a
        # full 256k park costs ~3.3 GiB and the 32768 MiB budget parks
        # roughly 9-10 of those — or dozens of typical 30-50k sessions.
        - --kv-resident 32768
        - --prefill auto
        - --memory-limit-mib 92160
        - --conversation-cache-mib 32768
        - --conversation-cache-slots 16
        # Context-extension toggle (EXPERIMENTAL, off by policy): the
        # engine answers past the trained 262144 with llama.cpp-style rope
        # scaling — add
        #   "- --max-context 524288" (replacing 262144)
        #   "- --rope-scaling yarn"
        #   "- --rope-scale 2"
        # Costs, all documented upstream: yarn's mscale (~1.069 at factor 2)
        # makes EVERY run a slightly different model (a 64-token greedy
        # prompt diverges ~19 tokens in — short-context quality is not
        # "native"); KV doubles per parked session (~6.5 GiB/park → half the
        # park count on the 32 GiB budget) and the rope tables add ~0.26
        # KiB/token; KV is allocated before expert-cache auto-sizing, so the
        # arena shrinks to make room (#765 budgeting order). One scaling
        # setting per process — never mix scaled and unscaled sessions on
        # one cache. Verify with a needle probe before trusting recall.
        # Documented deviations/toggles, one values edit away (verbatim
        # provenance kept for the record):
        # --prefill 32768: the PR #3636 R9700-machine number; setup chose
        #   `auto` here — override only on --plan/bench evidence.
        # --conversation-cache-mib 24576 / --conversation-cache-slots 16:
        #   the PR's parked budget — superseded by the owner's 32768×16
        #   above; the real home of the guide's "24576" (RESEARCH §5
        #   contradiction #3).
        # --ple-io ram: put the 28.8 GiB n-gram table back in RAM — only
        #   sane with the trio idle (the OOM post-mortem above); re-add
        #   after loading, never alongside residency.
        # --conversation-cache-mib 24576 / --conversation-cache-slots 16:
        #   the PR's parked-conversation budget — the real home of the
        #   guide's "24576" (RESEARCH §5 contradiction #3). Setup ships its
        #   default instead (40% free RAM above floor, capped 8 GiB);
        #   re-add both lines to pin the PR budget.
        # --mtp-window 8192: guide-class long-context knob, absent from the
        #   generated config; re-add to restore it.
        # --kv-grow (R4 deferred, +2-3% @64K only): re-add "- --kv-grow";
        #   the cmd's ulimit wrapper already covers its fd dependency and
        #   the env alias is STRATA_KV_GROW=1 — the guide's hold-env is VOID
        #   (RESEARCH §2). Needs the on-target fd experiment (C04) first.
        # --vision (R2 off for v1): mmproj-Qwen3.8-Flash-Next-BF16.gguf
        #   ships at the quant repo root (~0.9 GB); the vision{} run-config
        #   key stays available for the flip.
        # --resident-budget-gib implies --mmap-experts, the opposite of the
        #   page-locked arena (contradiction #3) — strix/#1715 territory.
        # --prompt-cache-every: #4206 no-op at prefill edges; never adopted.
      # Person-wins layer that survives config rewrites (RESEARCH §2): empty
      # until an operator out-ranks the seed.
      user_args: []
      # A DIRECTORY, not the GGUF file (the seed's shard path was the
      # tokenizer-missing crash strata.py named): the tokenizer rides inside
      # the pack, measured 2026-10-29.
      tokenizer: /models/strata/Strata-data/packs/iq3_s/tokenizer
      model_name: qwen3.8-flash-next-iq3_s
      # The compiled engine's ROCm runtime = the checkout venv's SDK trees
      # (setup's own choice) — not the packaged image roots.
      lib_dirs:
        - /models/strata/Strata/.venv/lib/python3.12/site-packages/_rocm_sdk_devel/lib
        - /models/strata/Strata/.venv/lib/python3.12/site-packages/_rocm_sdk_libraries_gfx120X_all/lib
      backend: hip
      # The peer hop always rewrites the request model to this bare ID
      # (RESEARCH §3), so routing does not depend on aliases; these carry the
      # PR's family alias for direct/debug hits on the inner surface.
      aliases:
        - qwen3.8-flash-next
      gpu: [0]
      parallel: 4
      # The cmd's --host flag binds loopback (the supervisor is the pod's
      # only in-pod listener); the PR ran 0.0.0.0 on a laptop.
      host: "127.0.0.1"

    # -----------------------------------------------------------------------
    # The Strix-alone fallback's run-config, rendered VERBATIM to
    # /profile/strata-strix-iq3_s.json by the same profile ConfigMap. Seed:
    # UPSTREAM docs/STRIX_HALO.md §5 fast-config — the R1 ruling says NOT
    # the card's numbers, and not the primary's arena recipe either: the
    # 8060S runs on shared LPDDR5X, so the residency math is a different
    # fix-class (#1715). Final sizing: strata serve --plan --output json
    # (C04, human step 3).
    # -----------------------------------------------------------------------
    engineProfileStrix:
      # C-A keyless shipped default (same posture as the primary).
      api_key: "none"
      # C01 interface freeze (containers/strata README): halo label = the
      # gfx1151 root. Pointing the rx9070 exe at the 8060S loads the wrong
      # arch kernels; exe is the ONLY flavor switch (same image, same
      # terminal entry, same weights).
      exe: /opt/strata/components/engine/0.1.52-linux-x86_64-hip-halo/strata
      # RESEARCH §7 verbatim eight-set — the spellings ARE upstream literals
      # (normalizing case or names silently no-ops the engine's env parsing,
      # AC2's bar). gfx1151 auto-enables much of this from §4; §5 sets them
      # explicitly because they change bits (KL-gated rounds). To disable
      # the whole auto-set: STRATA_GFX1151_DEFAULTS=0.
      env:
        STRATA_PF_FUSED: "1"
        STRATA_PF_GEMM: "1"
        STRATA_HC_UPMIX: "1"
        STRATA_PA_FAST: "1"
        STRATA_HIP_WMMA: "1"
        STRATA_SELECT_WMMA: "1"
        STRATA_PF_SWITCH_MIN_T: "4096"
        STRATA_PREFILL_STREAM_MIN: "128"
        # STRATA_PF_FUSED_KQ=1 applies only to K-quant packs; the shipped
        # IQ3_S pack is not one — enable if the on-target pack ever changes.
        # STRATA_HC_UPMIX=1 carries the #2706 split-mode hazard history:
        # startup-log check gate in the fallback runbook (README), flip it
        # to "0" here if the hazard reproduces on this engine build.
      args:
        # Same Strata-data layout as the primary (measured 2026-10-29) — one
        # staged set serves both profiles; the matrix never runs them at once.
        - --pack /models/strata/Strata-data/packs/iq3_s
        - --native /models/strata/Strata-data/models/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf
        - --ple-gguf /models/strata/Strata-data/models/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00002-of-00002.gguf
        - --expert-profile /models/strata/Strata/data/expert-profile.bin
        # VERIFY (R1): the 24576/55 pair has NO upstream source — it is the
        # card guide's number pair, and 24576 also equals the model's total
        # expert count, the likely misattribution origin (RESEARCH §7).
        # They ship because #1715's fix-class is exactly this shape: on a
        # 128 GB Strix Halo, --expert-cache auto WITHOUT --resident-budget-gib
        # OOMs globally — the opposite of the primary, where resident-budget
        # would flip --mmap-experts and break the page-locked arena. Both
        # numbers are HYPOTHESES until the strata serve --plan --output json
        # gate (C04 human step 3) finalizes them against real RAM; note
        # --expert-cache N counts expert SLOTS, not MiB (RESEARCH §2).
        - --expert-cache 24576
        - --resident-budget-gib 55
        # STRIX_HALO §5/§6 fast-config-class prefill chunk for the chip
        # alone (the primary runs setup's --prefill auto).
        - --prefill 16384
        - --max-context 262144
        - --kv int8
        - --spec 4
        - --spec-min-p 0.5
        - --mtp-window 8192
        - --mtp /models/strata/Strata-data/mtp/rt
        # Deliberately absent: --kv-grow (R4 deferral covers strix too),
        # --vision (R2 off for both profiles), --conversation-cache* (the
        # primary's 24 GiB x 16 slots is the PR's R9700-machine budget —
        # the chip's share is the --plan gate's to size, not ours to seed).
      # Person-wins layer (RESEARCH §2), same rule as the primary.
      user_args: []
      # Tokenizer rides inside the pack — a DIRECTORY (strata.py appends
      # /vocab.json; same measured correction as the primary).
      tokenizer: /models/strata/Strata-data/packs/iq3_s/tokenizer
      model_name: qwen3.8-flash-next
      # The matching halo engine root for lib_dirs (the exe's ROCm runtime
      # ships inside it — same packaged-engine VERIFY as the primary).
      lib_dirs:
        - /opt/strata/components/engine/0.1.52-linux-x86_64-hip-halo
      backend: hip
      aliases:
        - qwen3.8-flash-next
      # The visible set is renumbered by the ROCr filter injected per model
      # above, so [0] is the first (only) visible GPU — the chip for this
      # profile, whatever its pre-filter index was.
      gpu: [0]
      # Mirrors the primary seed (same family recipe); the --plan gate
      # reviews it for the chip too.
      parallel: 4
      host: "127.0.0.1"

    # -----------------------------------------------------------------------
    # The SC117 abliterated IQ3_XXS swap rung's run-config, rendered VERBATIM
    # to /profile/strata-abliterated-iq3_xxs.json by the same profile
    # ConfigMap. Shape: a clone of the primary's run-config (same engine
    # build, same memory declaration — the 43 GB IQ3_XXS expert set sits
    # inside today's ~50 GiB arena envelope, RESEARCH Q4 table) with the
    # pack/weights/tokenizer switched to the SC117 set staged by model-
    # fetch's manual abl step. The catalog gate (2026-10-30, pinned v0.2.7
    # setup.py) proved setup carries no abliterated family, so these paths
    # follow SC117's own strata/README.md migration recipe, NOT a setup.sh
    # catalog layout — and they must stay off the IQ3_S pair's files: the
    # ablation moved tensor offsets, and pointing a new arena at the old
    # pack serves wrong weights under a new id.
    # -----------------------------------------------------------------------
    engineProfileAbliterated:
      # C-A keyless shipped default (identical posture to the other two —
