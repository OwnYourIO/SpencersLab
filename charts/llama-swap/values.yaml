        # than the IQ3_S anchor's — no re-tune, no second untracked budget.
        - --kv-resident 32768
        - --prefill auto
        - --memory-limit-mib 92160
        - --conversation-cache-mib 32768
        - --conversation-cache-slots 16
      # Person-wins layer (RESEARCH §2), same rule as the other profiles.
      user_args: []
      tokenizer: /models/strata/Strata-data/packs/abliterated-iq3_xxs/tokenizer
      model_name: qwen3.8-flash-next-abliterated-iq3_xxs
      lib_dirs:
        - /models/strata/Strata/.venv/lib/python3.12/site-packages/_rocm_sdk_devel/lib
        - /models/strata/Strata/.venv/lib/python3.12/site-packages/_rocm_sdk_libraries_gfx120X_all/lib
      backend: hip
      # UNIQUE inner alias — deliberately not the primary's bare
      # qwen3.8-flash-next: two engine profiles claiming one alias inside
      # one supervisor is a shadowing hazard for direct/debug hits, and the
      # peer hop always rewrites the request model to the bare inner ID
      # anyway (RESEARCH §3).
      aliases:
        - qwen3.8-flash-next-abliterated
      gpu: [0]
      parallel: 4
      host: "127.0.0.1"

    # -----------------------------------------------------------------------
