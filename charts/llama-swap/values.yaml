        # every draft, so acceptance is this pack's only variable.
        - --mtp /models/strata/Strata-data/mtp/rt
        - --max-context 262144
        - --kv int8
        # Memory declaration byte-equal to the IQ3_S pair: the #1601 cgroup
        # lockstep (92160 inside the 96Gi limit) and the owner's parked-
