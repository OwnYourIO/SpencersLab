      description: "Reasoning vision-language MoE model for Immich image analysis, Q8_0 quant, CPU-offloaded experts; higher accuracy for complex images"
      capabilities:
        in:
          - text
          - image
        out:
          - text
      ttl: 0

    qwen3-vl-30b-a3b-thinking-q4:
      hf: unsloth/Qwen3-VL-30B-A3B-Thinking-GGUF:Q4_K_M
      use: [threads, moe-vl-q4, flash-and-q8, big-ub]
      # mmproj auto-downloads from the -hf repo (hf:// in --mmproj is a literal path, not a hub ref)
      flags: |
        -c 16384
      name: "Qwen3 VL 30B A3B Thinking (Q4_K_M)"
      description: "Reasoning vision-language MoE model for Immich image analysis, Q4_K_M quant, CPU-offloaded experts; higher accuracy for complex images"
      capabilities:
        in:
          - text
          - image
        out:
          - text
      ttl: 0

    qwen3-vl-30b-a3b-thinking-bf16:
      hf: unsloth/Qwen3-VL-30B-A3B-Thinking-GGUF:BF16
      use: [threads, moe, flash-and-q8]
      # mmproj auto-downloads from the -hf repo (hf:// in --mmproj is a literal path, not a hub ref)
      flags: |
        -c 16384
      name: "Qwen3 VL 30B A3B Thinking (BF16)"
      description: "Reasoning vision-language MoE model for Immich image analysis, BF16 (no quant), CPU-offloaded experts; higher accuracy for complex images"
      capabilities:
        in:
          - text
          - image
        out:
          - text
      ttl: 0

    # Audio transcription for MinusPod (media cluster) via whisper.cpp,
    # bundled in the unified image. Weights (~3.1GB) are fetched once from
    # HuggingFace into the models PVC on first load. Swaps 1:1 with the GPU
    # chat/VL models per the matrix below (one GPU model at a time on 8GB).
    # 2026-10-17: weights URL is ggerganov/whisper.cpp — the former home
    # ggml-org/whisper.cpp was removed from HuggingFace (401), which made
    # every load die in the curl bootstrap ("upstream command exited
    # prematurely"); ggerganov/whisper.cpp is where upstream's own
    # download-ggml-model.sh points.
    # 2026-10-17 (2nd): --inference-path below is REQUIRED. whisper.cpp's
    # server only ever registers request_path + inference_path (default
    # /inference) — it has NO /v1/audio/transcriptions route (verified in
    # the image's whisper.cpp 60c0be6a), while llama-swap forwards the
    # OpenAI path to upstreams unrewritten, so without the flag every
    # transcription 404'd with Server: whisper.cpp. /health stays put
    # (registered off request_path), so checkEndpoint keeps working.
    # NOTE on the /bin/sh -c bootstrap below: llama-swap's SanitizeCommand
    # strips trailing backslashes (keeping the newline) before shlex-splitting,
    # so inside the quoted script a command must be COMPLETE on one line —
    # continuation is only safe via a trailing &&/|| (a newline after an
    # operator is legal POSIX). Lines starting with # are also stripped.
    whisper-large-v3:
      cmd: |
        /bin/sh -c "
          mkdir -p /models/whisper &&
          { test -f /models/whisper/ggml-large-v3.bin ||
            { curl -fL --retry 3 --retry-all-errors -o /models/whisper/ggml-large-v3.bin.part https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3.bin &&
              mv /models/whisper/ggml-large-v3.bin.part /models/whisper/ggml-large-v3.bin; }; } &&
          exec whisper-server --host 0.0.0.0 --port ${PORT} --inference-path /v1/audio/transcriptions -m /models/whisper/ggml-large-v3.bin
        "
      name: "Whisper Large v3"
      description: "Audio transcription (whisper.cpp ggml-large-v3) for podcast processing"
      checkEndpoint: /health
      ttl: 0
      capabilities:
        in:
          - audio
        out:
          - text

  # Concurrency matrix (replaces legacy groups routing).
  # One GPU model at a time; homecpu (CPU) may run alongside any GPU model.
  matrix:
    vars:
      q38q4: qwen3.8-27b-q4
      q38q6: qwen3.8-27b-q6
      q38q8: qwen3.8-27b-q8
      q38bf16: qwen3.8-27b-bf16
      q27bq6: qwen3.6-27b-q6
      q27bq8: qwen3.6-27b-q8
      q35q6: qwen3.6-35b-a3b-q6
      q35q8: qwen3.6-35b-a3b-q8
      q35bf16: qwen3.6-35b-a3b-bf16
      q35b1m: qwen3.6-35b-a3b-1m
      homegpu: home-3b-v3-gpu
      homecpu: home-3b-v3
      vl2bq8: qwen3-vl-2b-q8
      vl2bq4: qwen3-vl-2b-q4
      vl2bbf: qwen3-vl-2b-bf16
      vl4bq4: qwen3-vl-4b-q4
      vl4bq8: qwen3-vl-4b-q8
      vl4bbf: qwen3-vl-4b-bf16
      vl8bq4: qwen3-vl-8b-q4
      vl8bq8: qwen3-vl-8b-q8
      vl8bbf: qwen3-vl-8b-bf16
      vl30bq4: qwen3-vl-30b-a3b-q4
      vl30bq8: qwen3-vl-30b-a3b-q8
      vl30bbf: qwen3-vl-30b-a3b-bf16
      v4tq8: qwen3-vl-4b-thinking-q8
      v4tq4: qwen3-vl-4b-thinking-q4
      v4tbf: qwen3-vl-4b-thinking-bf16
      v30tq8: qwen3-vl-30b-a3b-thinking-q8
      v30tq4: qwen3-vl-30b-a3b-thinking-q4
      v30tbf: qwen3-vl-30b-a3b-thinking-bf16
      ornqbf: ornith-1.5-35b-a3b-bf16
      ornq8: ornith-1.5-35b-a3b-q8
      ornq6: ornith-1.5-35b-a3b-q6
      ornq5: ornith-1.5-35b-a3b-q5
      ornq4: ornith-1.5-35b-a3b-q4
      ornq3: ornith-1.5-35b-a3b-q3
      orniq2: ornith-1.5-35b-a3b-iq2xxs
      wsp: whisper-large-v3
    sets:
      # C04 (2026-10-23): the Ornith 35B ladder joins the MoE alternation on
      # both clusters - one GPU model at a time still holds (gpu-ai narrows
      # this set with its own main/solo definitions; here it is the chart
      # default the gpu box rides). ornqbf is routable but fail-fast on gpu
      # (services/gpu disabled override) - matrix membership of a disabled
      # echo is the established pattern on that box.
      main: "(q38q4 | q38q6 | q38q8 | q38bf16 | q27bq6 | q27bq8 | q35q6 | q35q8 | q35bf16 | q35b1m | homegpu | vl2bq8 | vl2bq4 | vl2bbf | vl4bq4 | vl4bq8 | vl4bbf | vl8bq4 | vl8bq8 | vl8bbf | vl30bq4 | vl30bq8 | vl30bbf | v4tq8 | v4tq4 | v4tbf | v30tq8 | v30tq4 | v30tbf | orniq2 | ornq3 | ornq4 | ornq5 | ornq6 | ornq8 | ornqbf | wsp) & homecpu"

# Scanned-half generation (Path A two-source merge, plan 2026-10-22). The
# `autogen` initContainer below runs the pinned llama-swap-config-autogen
# generator against the rendered base.yaml ConfigMap into the `gen` emptyDir;
# llama-swap then merges `-config /app/config/config.yaml` (declared half,
# this chart's `config:`) with `-config-dir /app/gen` (scanned half). run.sh
# maps both env vars (verified at v262 docker/unified/run.sh).
#
# Scan layout enforced by the pinned generator - anything deeper or mixed is
# a hard generate error, and a *.gguf whose filename carries no quant token
# (-Qn_Qn / -BF16 / -F16) crashes it, so disk models must land as:
#   /models/scanned/<model>/*.gguf
#   /models/scanned/<model>/<variant>/*.gguf
# Their IDs come out as `<dir>:<QUANT>` - a namespace the declared roster
# never uses, which is what keeps the two halves merge-safe.
#
# Reload semantics (DECISIONS "Reload semantics statement"):
#   - declared half: hot-reloads via kubelet ConfigMap sync (~1 min) +
#     -watch-config; a bad reload keeps the old config running (v262).
#   - scanned half: restart-to-reload only - the initContainer regenerates
#     the emptyDir at pod start, nothing rewrites it afterwards.
#   - pod rolls: reloader.stakater.com/auto on the controller watches every
#     mounted ConfigMap, incl. llama-swap-autogen-base; if auto mode is ever
#     observed to miss it, add reloader.stakater.com/match naming both CMs.
#     C05 records the observed behaviour on the gpu box.
autogen:
  # Directories `generate` scans. The initContainer args repeat each as a
  # --scan-dir flag (entrypoint quick-find mirror) -- the base.yaml helper
  # fails the render if the two drift apart. Today's steady state: the dir
  # is absent -> degrade path (comment-only file).
  scanPaths:
    - /models/scanned
  # llama-server inside the unified-vulkan fleet image (RESEARCH [16]);
  # the generator's cmd template hardwires ${binary}.
  binary: /usr/local/bin/llama-server
  # Fallback macro for any scanned model matching no model_patterns entry -
  # must exist in base.yaml macros or llama-swap rejects the generated half.
  # Floor value only: --jinja, what every declared model already passes via
  # server-cmd. Tune per family with model_patterns before putting big or
  # exotic GGUFs on disk.
  defaultParams: "--jinja"

app-template:
  global:
    nameOverride: &chartName llama-swap

  controllers:
    llama-swap:
      annotations:
        reloader.stakater.com/auto: "true"
      initContainers:
        # Stock generator run right before llama-swap starts (plan Path A),
        # as the image entrypoint of containers/llama-swap-autogen: the
        # degrade/fail-open logic lives in the image, the chart wires only
        # image + args + mounts (CR4; the autogenBase helper fails the render
        # on any command: here). Fail-open by design (DECISIONS 2026-10-22
        # "Degrade path"): an empty scan set or a crashed `generate` leaves a
        # comment-only 10-scanned.yaml -- v262 merge.go parseSource skips
        # files without YAML content, so the declared half loads untouched.
        # Crashlooping would cost live consumers (Immich/HA/OpenWebUI)
        # against a half that only ever ADDS models; the initContainer log
        # carries the failure evidence.
        autogen:
          image:
            repository: ghcr.io/ownyourio/llama-swap-autogen
            # Brand-new containers/ image: docker-build.yaml only publishes
            # the immutable :v<run_number> on merge to main, so none exists
            # yet. :main + Always is the documented new-container exception
            # (DECISIONS "Planning decisions") - pin the first :v<run> tag
            # post-merge; renovate's docker manager covers this reference.
            tag: main
            pullPolicy: Always
          # Flags for the image entrypoint (containers/llama-swap-autogen/
          # entrypoint.sh). The --scan-dir set MUST equal autogen.scanPaths:
          # the base.yaml helper parses these args and fails the render on
          # drift ("edit both or neither") - the entrypoint quick-find
          # decides whether the generator runs at all. Usage errors (missing/
          # duplicate flags) exit nonzero on purpose: degrade rc0 is reserved
          # for scan-empty / generate-fail, a wiring bug stays loud.
          args:
            - --scan-dir
            - /models/scanned
            - --base
            - /app/autogen/base.yaml
            - --out
            - /app/gen/10-scanned.yaml
            - --home
            - /home/autogen
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # uid 65532 = the C01 image contract (Dockerfile USER). The
            # read-only root survives the generator's ~/.cache GGUF-metadata
            # write (unguarded mkdir + write_text at c7357e68, which cli.py's
            # FileNotFoundError/ValueError-only handler lets escape as a
            # traceback) only because --home points the entrypoint's HOME at
            # the init-only `autogen-home` emptyDir; without that mount
            # generate exits 1 the first time any GGUF is on disk and the
            # fail-open hides a dead scanned half.
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
      containers:
        main:
          image:
            repository: ghcr.io/mostlygeek/llama-swap
            # 2026-10-17: switched from the vNNN-vulkan-bNNNN lineage to the
            # unified pipeline. The old lineage's vulkan tags were built by
            # the pre-#1071 Dockerfile (llama-server in /app, NO whisper.cpp,
            # entrypoint /app/llama-swap -config /app/config.yaml) — verified
            # from the v262-vulkan-b11515 image history — so whisper-large-v3
            # died with "exec: whisper-server: not found" after the 2026-10-17
            # download-URL fix. unified-vulkan-262 is the v262-release image
            # of the per-project pipeline: whisper-server/sd-server/llama-
            # server in /usr/local/bin, entrypoint run.sh. Pinned to the
            # release-versioned tag (not the floating unified-vulkan) so the
            # digest is stable; same llama-swap v262 config schema. Its
            # llama.cpp (889edf43, 2026-10-03) was audited for every flag
            # used below (-ot, --load-mode, --cache-reuse, --cache-ram,
            # --n-cpu-moe, --no-mmproj, --flash-attn, --jinja, ...).
            tag: unified-vulkan-262
          env:
            TZ: Etc/UTC
            # Cache downloaded models (-hf flag) on the models PVC
            LLAMA_CACHE: /models
            # run.sh (unified entrypoint) maps LLAMA_SWAP_* env to llama-swap
            # flags. Default config path is the image's bundled example at
            # /etc/llama-swap/config/config.yaml — point it at OUR rendered
            # config. WATCH_CONFIG defaults to true in run.sh; spelled out
            # here because it only pays off with the directory mount below
            # (subPath mounts never receive ConfigMap updates).
            LLAMA_SWAP_CONFIG: /app/config/config.yaml
            LLAMA_SWAP_WATCH_CONFIG: "true"
            # Second config source (Path A): run.sh maps this to -config-dir
            # (verified at v262 docker/unified/run.sh); llama-swap merges the
            # scanned half the autogen initContainer writes to the /app/gen
            # emptyDir. Restart-to-reload only - kubelet never syncs an
            # emptyDir, the init re-run regenerates it at every pod start.
            LLAMA_SWAP_CONFIG_DIR: /app/gen
            # NOTE: HF_TOKEN is intentionally NOT set here. Gated -hf repos
            # need a token, but app-template's schema forbids optional
            # secretKeyRefs and clusters without bitwardenIds.hf-token (gpu)
            # have no hf-token secret. gpu-ai injects HF_TOKEN into this
            # container via its service values (secret is guaranteed there).
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
          resources:
            requests:
              cpu: 1000m
              memory: 4Gi
            limits:
              amd.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

        # Operator provisioning sidecar (LoRA conversion, artifact staging).
        # Disabled by default; gpu-ai enables it. No GPU, no port. Scripts are
        # mounted read-only from the llama-swap-tools ConfigMap at /app/tools;
        # /models arrives via the models persistence globalMounts.
        tools:
          enabled: false
          image:
            repository: python
            tag: 3.12.15-slim-bookworm
          command: ["sleep", "infinity"]
          env:
            TZ: Etc/UTC
          probes:
            liveness: {enabled: false}
            readiness: {enabled: false}
            startup: {enabled: false}
          resources:
            requests: {cpu: 10m, memory: 128Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

  service:
    llama-swap:
      controller: *chartName
      ports:
        http:
          port: 8080

  persistence:
    config:
      # Mount the ConfigMap as a DIRECTORY (no subPath): subPath mounts never
      # receive ConfigMap updates, which silently disabled llama-swap's
      # -watch-config hot reload (the 2026-10-17 whisper incident needed a
      # manual pod restart for exactly this reason). With the directory mount
      # kubelet syncs ConfigMap changes (~1 min) and run.sh's default
      # -watch-config reloads llama-swap in place; the LLAMA_SWAP_CONFIG env
      # above points at the file inside the directory.
      type: configMap
      name: llama-swap-config
      globalMounts:
        - path: /app/config
    gen:
      # Scanned half: written by the autogen initContainer, read by llama-swap
      # via LLAMA_SWAP_CONFIG_DIR - one globalMount serves writer and reader
      # (the tools sidecar seeing an empty dir is inert). ~KB configs; the cap
      # is headroom, not expected use.
      type: emptyDir
      sizeLimit: 10Mi
      globalMounts:
        - path: /app/gen
    autogen-base:
      # Generator contract for the initContainer ONLY - common 5.0.1
      # advancedMounts are per-container, keeping the main container's mount
      # surface byte-identical to the pre-C03 pod (chunk acceptance 1).
      type: configMap
      name: llama-swap-autogen-base
      advancedMounts:
        llama-swap:
          autogen:
            - path: /app/autogen
              readOnly: true
    autogen-home:
      # /home/autogen is where the generator's ~/.cache write lands: the
      # initContainer passes --home /home/autogen and entrypoint.sh exports
      # it as HOME before invoking generate (CR4 makes the C03 finding-#1
      # writable-cache contract explicit on the CLI, replacing the passwd-
      # fallback reasoning). Writable scratch is a proven pattern for this
      # container at uid 65532 - the degrade path already writes
      # 10-scanned.yaml into the `gen` emptyDir. advancedMounts keep it
      # init-only: main must not gain a writable dir (chunk acceptance 1).
      type: emptyDir
      sizeLimit: 10Mi
      advancedMounts:
        llama-swap:
          autogen:
            - path: /home/autogen
    tools:
      type: configMap
      name: llama-swap-tools
      globalMounts:
        - path: /app/tools
          readOnly: true
    models:
      existingClaim: *chartName
      globalMounts:
        - path: /models
