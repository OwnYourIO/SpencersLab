      # Engine build is per-node, not per-rung: byte-identical exe/cwd/
      # lib_dirs/backend/gpu/parallel/host to the primary (same compiled
      # gfx1201 checkout engine, same ROCm trees).
      exe: /models/strata/Strata/engine/strata
      # serve's engine child inherits this model's env layer (the layer
      # above keeps single-source truth); a duplicate here could silently
      # re-pin values the chart gates.
      env: {}
      cwd: /models/strata/Strata
      # Own progress log on the claim (the --plan-gate and unload-timing
      # evidence trail for THIS rung).
      log: /models/strata/Strata/strata-abliterated-iq3_xxs.log
      args:
        # Fresh iq_pack pack built from the SC117 shards by model-fetch
        # (never the iq3_s pack — see the header); the tokenizer directory
        # rides inside it, same measured layout as the primary's pack.
        - --pack /models/strata/Strata-data/packs/abliterated-iq3_xxs
        # SC117's own two-shard IQ3_XXS (47.34 GB + shard 2, the 28.8 GB
        # n-gram/PLE table — the XXS tier ships PLE just like IQ3_S, HF-tree
