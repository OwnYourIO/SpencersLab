domain: OVERRIDE_VIA_APPSET

# Bitwarden item IDs (uuids), injected per-cluster via custom-values or the
# cluster annotation. Empty by default: charts that render secrets guard on
# these keys so clusters without them render clean.
bitwardenIds: {}

# Models PVC size. gpu rides the 300Gi default; gpu-ai overrides to 500Gi
# (Qwen3.8-27B roster + MTP/mmproj auxiliaries + a converted cyber LoRA).
modelsPvcSize: 300Gi

# llama-swap application configuration
config:
  # Health check timeout for model readiness.
  # Generous (1h) on purpose: the first load of a large model includes the
  # -hf download (30B Q8 ~32 GB, 30B BF16 ~61 GB) and llama-server only opens
  # its port once download+load finish. At 500s llama-swap killed the process
  # mid-download ("health check timed out after 8m20s"). Cached loads are fast;
  # this only widens the window for cold downloads.
  healthCheckTimeout: 3600
  performance:
    enable: true
    every: 5s

  # Logging
  logLevel: info
  # llama-swap v259 split stdout into streams: HTTP access lines moved out of
  # "proxy" into "http". "proxy,http" keeps the pre-v259 stdout makeup so
  # request lines still reach Loki via pod logs.
  logToStdout: "proxy,http"

  # Start port for automatic ${PORT} macro
  startPort: 10001

  # Send loading state to clients
  sendLoadingState: true

  # Expose aliases in /v1/models (incl. the :tags/:caption workload aliases
  # below) so clients that enumerate models (Pictaria, OpenWebUI) can see them.
  includeAliasesInList: true

  # No API keys required (default allow)
  apiKeys: []

  # Global TTL (0 = never automatically unload)
  globalTTL: 0

  # Graceful timeout when unloading a model
  unloadTimeout: 30

  # Macros for reusable configuration
  macros:
    # Bare binary name: the unified image (v262+) ships llama-server in
    # /usr/local/bin — the old /app/llama-server path is gone.
    server-cmd: |
      llama-server
      --port ${PORT}
      --host 0.0.0.0
      --jinja
    threads: |
      -t 10
    # --no-mmap was removed upstream; --load-mode none is the equivalent
    # (read weights into RAM without mmap).
    moe: |
      -ngl 99 
      -ot "\.ffn_.*_exps\.=CPU" 
      --load-mode none
    # Expert placement for the 30B vision-MoE quants on the 8GB gpu card
    # (measured regime: Poor GPU Club runs Qwen3-30B-A3B Q4 on 8GB with
    # n-cpu-moe ~28-34 at 20-34 t/s; all-experts-on-CPU is the slow floor).
    # --n-cpu-moe N keeps experts of N layers on CPU, rest on GPU. These are
    # conservative starting points — sweep N down (more experts on GPU) while
    # load-time VRAM allows. BF16 has no expert headroom on 8GB, it keeps ${moe}.
    moe-vl-q4: |
      -ngl 99
      --n-cpu-moe 38
      --load-mode none
    moe-vl-q8: |
      -ngl 99
      --n-cpu-moe 44
      --load-mode none
    flash-and-q8: |
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0

    ctx-256k: |
      --ctx-size 262144
      -b 2048 
      -ub 2048
    big-ub: |
      -b 2048 
      -ub 2048


    # Trades throughput for fitting onto the 8GB card.
    ctx-1m: |
      -c 1010000 
      --rope-scaling yarn --rope-scale 4 --yarn-orig-ctx 262144
      -b 512 -ub 512


  # Named per-workload filter blocks, referenced from models by `filters:`
  # name; the renderer expands the reference into each model's `filters` map
  # (llama-swap has no presets key). Replaces the old &vlWorkloadFilters
  # YAML anchor.
  #
  # Per-workload aliases for a loaded VL model (no reload between workloads).
  # llama-swap substitutes ${MODEL_ID} in setParamsByID keys and
  # auto-registers each key as an alias (verified in upstream load.go), so
  # this single block serves every Qwen3-VL Instruct model:
  #   <model>:tags    -> Pictaria tag extraction. Forces thinking OFF
  #                      (llama.cpp #20345: with enable_thinking=true the
  #                      json_schema grammar is silently bypassed -> broken
  #                      JSON) + low temp for classification. Pictaria sends
  #                      response_format json_schema itself; llama-swap
  #                      passes it through untouched.
  #   <model>:caption -> Immich captioning. Free-text (no schema: constraints
  #                      hurt description quality), thinking off, low temp +
  #                      fixed seed for reproducible captions.
  filterPresets:
    vl-workload:
      setParamsByID:
        "${MODEL_ID}:tags":
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.2
        "${MODEL_ID}:caption":
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.1
          seed: 42

  # Model definitions. Models are downloaded automatically from HuggingFace
  # via the -hf flag and cached on the models PVC (LLAMA_CACHE=/models).
  #
  # Roster schema (templates/_helpers-llama-swap.tpl composes each entry into
  # llama-swap's config surface; tests/golden pin the rendered result):
  #   hf / draft   -hf / -hfd refs
  #   spec         --spec-type / --spec-draft-* speculative-decoding flags
  #   use          ordered ${macro} references (rendered as the reference;
  #                llama-swap expands macros at load)
  #   flags        verbatim lines, composed after use — llama.cpp is
  #                rightmost-wins, so a flag here can override a macro value
  #   cmd          raw escape hatch, passed through untouched
  #   disabled     fail-fast message; the cmd echoes "<id> <disabled>" to
  #                stderr and exits 1 (precedence disabled > cmd > composition)
  #   filters      a filterPresets name, expanded into the model map
  # name/description/ttl/aliases/capabilities/checkEndpoint/proxy/env pass
  # through as-is; omitted proxy defaults to http://localhost:${PORT},
  # omitted ttl inherits globalTTL.
  models:
    # Qwen 3.8 27B (plain/official). Q4/Q6/Q8 from unsloth's dynamic
    # imatrix builds (no plain K-quants published); the 16-bit entry comes
    # from ggml-org since unsloth ships no F16/BF16 for this model.
    qwen3.8-27b-q4:
      hf: unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
      use: [threads, ctx-256k, flash-and-q8]
      name: "Qwen 3.8 27B (UD-Q4_K_XL)"
      description: "Qwen 3.8 27B dense model, UD-Q4_K_XL quant"
      ttl: 0

    qwen3.8-27b-q6:
