domain: OVERRIDE_VIA_APPSET

# llama-swap application configuration
config:
  # Health check timeout for model readiness
  healthCheckTimeout: 500
  performance:
    enable: true
    every: 5s

  # Logging
  logLevel: info
  logToStdout: "proxy"

  # Start port for automatic ${PORT} macro
  startPort: 10001

  # Send loading state to clients
  sendLoadingState: true

  # No API keys required (default allow)
  apiKeys: []

  # Global TTL (0 = never automatically unload)
  globalTTL: 0

  # Graceful timeout when unloading a model
  unloadTimeout: 30

  # Macros for reusable configuration
  macros:
    server-cmd: |
      /app/llama-server
      --port ${PORT}
      --host 0.0.0.0
      --jinja
    threads: |
      -t 10
    moe: |
      -ngl 99 
      -ot "\.ffn_.*_exps\.=CPU" 
      --no-mmap
    flash-and-q8: |
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0

    ctx-256k: |
      --ctx-size 262144
      -b 2048 
      -ub 2048
    big-ub: |
      -b 2048 
      -ub 2048


    # Trades throughput for fitting onto the 8GB card.
    ctx-1m: |
      -c 1010000 
      --rope-scaling yarn --rope-scale 4 --yarn-orig-ctx 262144
      -b 512 -ub 512

  # Model definitions
  # Models are downloaded automatically from HuggingFace via the -hf flag
  # and cached on the models PVC (LLAMA_CACHE=/models).
  models:
    qwen3.6-27b-q6:
      cmd: |
        ${server-cmd}
        ${threads}
        -hf unsloth/Qwen3.6-27B-GGUF:Q6_K
        ${ctx-256k}
        ${flash-and-q8}
      name: "Qwen 3.6 27B (Q6_K)"
      description: "Qwen 3.6 27B general purpose model, Q6_K quant"
      proxy: http://localhost:${PORT}
      ttl: 0

    qwen3.6-27b-q8:
      cmd: |
        ${server-cmd}
        ${threads}
        -hf unsloth/Qwen3.6-27B-GGUF:Q8_0
        ${flash-and-q8}
        ${ctx-256k}
      name: "Qwen 3.6 27B (Q8_0)"
      description: "Qwen 3.6 27B general purpose model, Q8_0 quant"
      proxy: http://localhost:${PORT}
      ttl: 0

    qwen3-coder-next-q6:
      cmd: |
        ${server-cmd}
        ${threads}
        -hf unsloth/Qwen3-Coder-Next-GGUF:Q6_K
        ${ctx-256k}
        ${flash-and-q8}
      name: "Qwen 3 Coder Next (Q6_K)"
      description: "Qwen 3 Coder Next coding model, Q6_K quant"
      proxy: http://localhost:${PORT}
      ttl: 0

    qwen3-coder-next-q8:
      cmd: |
        ${server-cmd}
        ${threads}
        -hf unsloth/Qwen3-Coder-Next-GGUF:Q8_0
        ${ctx-256k}
        ${flash-and-q8}
      name: "Qwen 3 Coder Next (Q8_0)"
      description: "Qwen 3 Coder Next coding model, Q8_0 quant"
      proxy: http://localhost:${PORT}
      ttl: 0

    qwen3.6-35b-a3b-q6:
      cmd: |
        ${server-cmd}
        ${threads}
        -hf unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q6_K
        ${ctx-256k}
        ${flash-and-q8}
      name: "Qwen 3.6 35B A3B (UD-Q6_K)"
      description: "Qwen 3.6 35B with 3B active parameters (MoE), UD-Q6_K quant"
      proxy: http://localhost:${PORT}
      ttl: 0

    qwen3.6-35b-a3b-q8:
      cmd: |
        ${server-cmd}
        ${threads}
        -hf unsloth/Qwen3.6-35B-A3B-GGUF:Q8_0
        ${ctx-256k}
        ${moe}
        ${flash-and-q8}
      name: "Qwen 3.6 35B A3B (Q8_0)"
      description: "Qwen 3.6 35B with 3B active parameters (MoE), Q8_0 quant"
      proxy: http://localhost:${PORT}
      ttl: 0
    qwen3.6-35b-a3b-1m:
      cmd: |
        ${server-cmd}
        ${threads}
        -hf unsloth/Qwen3.6-35B-A3B-GGUF:Q8_0
        ${ctx-1m}
        ${moe}
        ${flash-and-q8}
      name: "Qwen 3.6 35B A3B (Q8_0) - 1M"
      description: "Qwen 3.6 35B with 3B active parameters (MoE), Q8_0 quant"
      proxy: http://localhost:${PORT}
      ttl: 0
    qwen3.6-35b-a3b-bf16:
      cmd: |
        ${server-cmd}
        ${threads}
        -hf unsloth/Qwen3.6-35B-A3B-GGUF:BF16
        ${ctx-256k}
        ${moe}
        ${flash-and-q8}
      name: "Qwen 3.6 35B A3B (BF16)"
      description: "Qwen 3.6 35B with 3B active parameters (MoE), BF16 (no quant)"
      proxy: http://localhost:${PORT}
      ttl: 0

    qwen3-30b-a3b-q4:
      cmd: |
        ${server-cmd}
        ${threads}
        -hf unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF:Q4_K_M
        ${ctx-256k}
        ${moe}
        ${flash-and-q8}
      name: "Qwen 3 30B A3B Instruct (Q4_K_M)"
      description: "Qwen 3 30B with 3B active parameters (MoE), Q4_K_M quant"
      proxy: http://localhost:${PORT}
      ttl: 0

    qwen3-30b-a3b-q8:
      cmd: |
        ${server-cmd}
        ${threads}
        -hf unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF:Q8_0
        ${ctx-256k}
        ${moe}
        ${flash-and-q8}
      name: "Qwen 3 30B A3B Instruct (Q8_0)"
      description: "Qwen 3 30B with 3B active parameters (MoE), Q8_0 quant"
      proxy: http://localhost:${PORT}
      ttl: 0

    qwen3-8b-q4:
      cmd: |
        ${server-cmd}
        ${threads}
        -hf unsloth/Qwen3-8B-GGUF:Q4_K_M
        ${ctx-256k}
        ${flash-and-q8}
      name: "Qwen 3 8B (Q4_K_M)"
      description: "Qwen 3 8B dense model, Q4_K_M quant"
      proxy: http://localhost:${PORT}
      ttl: 0

    qwen3-8b-q8:
      cmd: |
        ${server-cmd}
        ${threads}
        -hf unsloth/Qwen3-8B-GGUF:Q8_0
        ${ctx-256k}
        ${flash-and-q8}
      name: "Qwen 3 8B (Q8_0)"
      description: "Qwen 3 8B dense model, Q8_0 quant"
      proxy: http://localhost:${PORT}
      ttl: 0

    home-3b-v3-gpu:
      cmd: |
        ${server-cmd}
        ${threads}
        -hf acon96/Home-3B-v3-GGUF:Q8_0
        -ngl 99
        -c 8192
      name: "Home 3B v3 (Q8_0) - GPU"
      description: "Home Assistant 3B v3 model on GPU, Q8_0 quant"
      proxy: http://localhost:${PORT}
      ttl: 0

    kat-coder-q4:
      cmd: |
        ${server-cmd}
        ${threads}
        -hf bartowski/Kwaipilot_KAT-Coder-V2.5-Dev-GGUF:Q4_K_M
        ${ctx-256k}
        ${moe}
        ${flash-and-q8}
      name: "KAT Coder V2.5 Dev (Q4_K_M)"
      description: "Kwaipilot KAT-Coder V2.5 Dev coding model (MoE), Q4_K_M quant"
      proxy: http://localhost:${PORT}
      ttl: 0

    kat-coder-q6:
      cmd: |
        ${server-cmd}
        ${threads}
        -hf bartowski/Kwaipilot_KAT-Coder-V2.5-Dev-GGUF:Q6_K
        ${ctx-256k}
        ${moe}
        ${flash-and-q8}
      name: "KAT Coder V2.5 Dev (Q6_K)"
      description: "Kwaipilot KAT-Coder V2.5 Dev coding model (MoE), Q6_K quant"
      proxy: http://localhost:${PORT}
      ttl: 0

    kat-coder-q8:
      cmd: |
        ${server-cmd}
        ${threads}
        -hf bartowski/Kwaipilot_KAT-Coder-V2.5-Dev-GGUF:Q8_0
        ${ctx-256k}
        ${moe}
        ${flash-and-q8}
      name: "KAT Coder V2.5 Dev (Q8_0)"
      description: "Kwaipilot KAT-Coder V2.5 Dev coding model (MoE), Q8_0 quant"
      proxy: http://localhost:${PORT}
      ttl: 0

    home-3b-v3:
      cmd: |
        ${server-cmd}
        ${threads}
        -hf acon96/Home-3B-v3-GGUF:Q4_K_M
        -ngl 0
        -c 8192
      name: "Home 3B v3 (Q4_K_M) - CPU"
      description: "Home Assistant 3B v3 model on CPU, Q4_K_M quant; runs in parallel with GPU models"
      proxy: http://localhost:${PORT}
      ttl: 0

  # Concurrency matrix (replaces legacy groups routing).
  # One GPU model at a time; homecpu (CPU) may run alongside any GPU model.
  matrix:
    vars:
      q27bq6: qwen3.6-27b-q6
      q27bq8: qwen3.6-27b-q8
      coderq6: qwen3-coder-next-q6
      coderq8: qwen3-coder-next-q8
      q35q6: qwen3.6-35b-a3b-q6
      q35q8: qwen3.6-35b-a3b-q8
      q35bf16: qwen3.6-35b-a3b-bf16
      q35b1m: qwen3.6-35b-a3b-1m
      q30q4: qwen3-30b-a3b-q4
      q30q8: qwen3-30b-a3b-q8
      q8bq4: qwen3-8b-q4
      q8bq8: qwen3-8b-q8
      katq4: kat-coder-q4
      katq6: kat-coder-q6
      katq8: kat-coder-q8
      homegpu: home-3b-v3-gpu
      homecpu: home-3b-v3
    sets:
      main: "(q27bq6 | q27bq8 | coderq6 | coderq8 | q35q6 | q35q8 | q35bf16 | q35b1m | q30q4 | q30q8 | q8bq4 | q8bq8 | katq4 | katq6 | katq8 | homegpu) & homecpu"

app-template:
  global:
    nameOverride: &chartName llama-swap

  controllers:
    llama-swap:
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        main:
          image:
            repository: ghcr.io/mostlygeek/llama-swap
            tag: v240-vulkan-b10015
          env:
            TZ: Etc/UTC
            # Cache downloaded models (-hf flag) on the models PVC
            LLAMA_CACHE: /models
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
          resources:
            requests:
              cpu: 1000m
              memory: 4Gi
            limits:
              amd.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

  service:
    llama-swap:
      controller: *chartName
      ports:
        http:
          port: 8080

  persistence:
    config:
      type: configMap
      name: llama-swap-config
      globalMounts:
        - path: /app/config.yaml
          subPath: config.yaml
    models:
      existingClaim: *chartName
      globalMounts:
        - path: /models