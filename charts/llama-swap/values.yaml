      # alternation.
      q36her: qwen36-heretic
      q36hui: qwen36-huihui
      # C04 big families (2026-10-23) - all solo-set on gpu-ai.
      fnq3: qwen3.8-flash-next-q3
      fnq4: qwen3.8-flash-next-q4
      fnorca: qwen3.8-flash-next-orca-q6
      o122q3: ornith-1.5-122b-q3
      o122q4: ornith-1.5-122b-q4
      o122q5: ornith-1.5-122b-q5
      o122q6: ornith-1.5-122b-q6
      # q38cyber: qwen38-cyber      # PHASE 2 (vars must not reference undefined models)
    sets:
      # C04 (2026-10-23): the Ornith 35B ladder joins the MoE alternation on
      # both clusters - one GPU model at a time still holds (gpu-ai narrows
      # this set with its own main/solo definitions; here it is the chart
      # default the gpu box rides). ornqbf is routable but fail-fast on gpu
      # (services/gpu disabled override) - matrix membership of a disabled
      # echo is the established pattern on that box.
      main: "(q38q4 | q38q6 | q38q8 | q38bf16 | q27bq6 | q27bq8 | q35q6 | q35q8 | q35bf16 | q35b1m | homegpu | vl2bq8 | vl2bq4 | vl2bbf | vl4bq4 | vl4bq8 | vl4bbf | vl8bq4 | vl8bq8 | vl8bbf | vl30bq4 | vl30bq8 | vl30bbf | v4tq8 | v4tq4 | v4tbf | v30tq8 | v30tq4 | v30tbf | orniq2 | ornq3 | ornq4 | ornq5 | ornq6 | ornq8 | ornqbf | wsp) & homecpu"

app-template:
  global:
    nameOverride: &chartName llama-swap

  controllers:
    llama-swap:
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        main:
          image:
            # unified pipeline (vs the old vNNN-vulkan-bNNNN lineage: pre-
            # #1071 Dockerfile, llama-server in /app, NO whisper.cpp,
            # entrypoint /app/llama-swap - verified from the
            # v262-vulkan-b11515 image history, 2026-10-17). whisper-server/
            # sd-server/llama-server land in /usr/local/bin, entrypoint
            # run.sh; the whisper bootstrap below dies without
            # /usr/local/bin/whisper-server ("exec: whisper-server: not
            # found" on the old lineage).
            #
            # unified-vulkan-266 = the llama-swap v266 release image.
            # Re-pinned 2026-10-25: unified-vulkan-262 was REBUILT IN PLACE
            # upstream - its digest moved to
            # sha256:038bb09388681895e9d51e5cf02aaa38178cd6571273cd73b7df2712c416b48d
            # and the rebuilt content carried the macros.go ${PORT}-proxy
            # check that crash-looped the gpu box. The old "pinned to the
            # release-versioned tag so the digest is stable" claim is
            # falsified: trust the recorded digest + re-verification, never
            # a tag's reputation. This tag's manifest digest:
            # sha256:0cc42f1024b54be3de100ae7a7a2730047ca5c27cf7a354f8a9f63142f00c045
            # (stable across two pulls, 2026-10-25). Freshness is
            # renovate-managed (the packageRule for this dep in renovate.json
            # scopes versioning to the unified-vulkan-<N> family the built-in
            # helm-values manager's docker versioning can't parse), so the
            # next release tag proposes a PR instead of drifting silently.
            # Its llama.cpp is b11810 (e3797b18,
            # 2026-10-22, per the build args in the image config blob),
            # audited 2026-10-25 against ggml-org/llama.cpp@b11810 for
            # every flag used below (-ot, --load-mode, --cache-reuse,
            # --cache-ram, --n-cpu-moe, --no-mmproj, --flash-attn, --jinja,
            # -hfd, --spec-type, ...).
            repository: ghcr.io/mostlygeek/llama-swap
            # renovate: datasource=docker depName=ghcr.io/mostlygeek/llama-swap
            tag: unified-vulkan-266
          env:
            TZ: Etc/UTC
            # Cache downloaded models (-hf flag) on the models PVC
            LLAMA_CACHE: /models
            # run.sh (unified entrypoint) maps LLAMA_SWAP_* env to llama-swap
            # flags. Default config path is the image's bundled example at
            # /etc/llama-swap/config/config.yaml — point it at OUR rendered
            # config. WATCH_CONFIG defaults to true in run.sh; spelled out
            # here because it only pays off with the directory mount below
            # (subPath mounts never receive ConfigMap updates).
            LLAMA_SWAP_CONFIG: /app/config/config.yaml
            LLAMA_SWAP_WATCH_CONFIG: "true"
            # NOTE: HF_TOKEN is intentionally NOT set here. Gated -hf repos
            # need a token, but app-template's schema forbids optional
            # secretKeyRefs and clusters without bitwardenIds.hf-token (gpu)
            # have no hf-token secret. gpu-ai injects HF_TOKEN into this
            # container via its service values (secret is guaranteed there).
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
          resources:
            requests:
              cpu: 1000m
              memory: 4Gi
            limits:
              amd.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

        # Operator provisioning sidecar (LoRA conversion, artifact staging).
        # Disabled by default; gpu-ai enables it. No GPU, no port. Scripts are
        # mounted read-only from the llama-swap-tools ConfigMap at /app/tools;
        # /models arrives via the models persistence globalMounts.
        tools:
          enabled: false
          image:
            repository: python
            tag: 3.15.1-slim-bookworm
          command: ["sleep", "infinity"]
          env:
            TZ: Etc/UTC
          probes:
            liveness: {enabled: false}
            readiness: {enabled: false}
            startup: {enabled: false}
          resources:
            requests: {cpu: 10m, memory: 128Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

    # strata — the gpu-ai internal Strata engine pod (cf-77): the SECOND
    # controller of this Application, default OFF. Seven data flags flip
    # TOGETHER from the gpu-ai service values — this one, service.strata and
    # the five strata-* persistence entries below. A partial set fails the
    # render: advancedMounts onto a DISABLED controller is app-template's
    # canonical hard error, and the reverse gap (controller ON, persistence
    # OFF) is guarded in templates/configmap-strata.yaml. Strata's public
    # exposure happens THROUGH the gpu-ai llama-swap `peers:` route, never
    # from here: the deliberate trio-rule deviation — no ingress.subdomains
    # entry — is the operator's Q4 ruling (DECISIONS 2026-10-27; a host of
    # its own would publish the pod the peers hop exists to keep private).
    strata:
      enabled: false
      type: deployment
      # A ~47 GiB pinned arena must never ride a RollingUpdate overlap —
      # two pods would double-pin the node (#2257 class; the repo lived it
      # 2026-10-18/19, DECISIONS).
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      # Pod-shape keys ride per-controller: the tree-global pod defaults
      # would also re-shape the main pod, breaking the default-OFF
      # byte-parity contract (DECISIONS 2026-10-28, Q-C ruling).
      pod:
        # Invariant: 420 > unloadTimeout(180) + --shutdown-timeout drain(30
        # default, 0..300) + slack (RESEARCH §3 amendment). The kubelet
        # SIGKILL window must beat a clean arena stop or it leaves a
        # half-pinned arena.
        terminationGracePeriodSeconds: 420
        securityContext:
          # DOCKER.md runtime contract: group video+render on the device
          # nodes. Numeric GIDs are distro-local — the C04 runbook resolves
          # them on-target and sets this key (deep-merged via the service
          # block).
          supplementalGroups: []
          # ROCm/HIP needs the full ioctl surface. Privileged already skips
          # the default profile, so this key pins the Unconfined contract
          # explicitly — the promise survives the documented-not-built
          # fallback (naming GPU plugin + IPC_LOCK/SYS_RESOURCE, non-
          # privileged).
          seccompProfile:
            type: Unconfined
      # Weight staging as a first-class citizen: upstream provisions models
      # headlessly ONLY through the source-checkout installer — the packaged
      # CLI's `install` verb is a shim for the checkout's setup.py ("this
      # folder has no installer", first deploy 2026-10-28) and docs/
      # LLAMA_SWAP.md says the integration "needs a source checkout, not the
      # desktop installer". So the image embeds the pinned checkout
      # (containers/strata Dockerfile, strata-src stage) and this init copies
      # it onto the claim and runs the documented
      # `./setup.sh --family qwen --model <id> --no-start --yes`: setup owns
      # the whole artifact story (shards, tokenizer, pack, draft data, its
      # own engine fetch) and writes strata-<model>.json run configs beside
      # the checkout — hence the checkout lives under /models/strata, so
      # every output persists on the shared claim. --no-start keeps the RAM
      # law untouched (setup never serves); markers make it idempotent.
      initContainers:
        model-fetch:
          image:
            repository: ghcr.io/ownyourio/strata
            # Same rolling tag + PIN-ME habit as the main container of this
            # pod (brand-new in-repo image; :v<run> pin lands with the first
            # docker-build.yaml merge).
            tag: main
            pullPolicy: Always
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              fail() { echo "model-fetch: $*" >&2; exit 1; }
              [ -f /opt/strata/src/Strata/setup.sh ] \
                || fail "image carries no source checkout - containers/strata must be rebuilt (strata-src stage, 2026-10-29 contract)"
              mkdir -p /models/strata
              # /data/install stays the CLI's install-dir anchor, bound to the
              # claim so discovery tools (models list --install-dir default)
              # see what setup produced.
              rm -rf /data/install
              ln -sfn /models/strata /data/install
              SRC=/models/strata/Strata
              if [ ! -d "$SRC" ]; then
                cp -a /opt/strata/src/Strata "$SRC"
              else
                [ -f "$SRC/setup.sh" ] || fail "$SRC exists without setup.sh - refusing to overwrite"
              fi
              # setup.sh needs a python3 on PATH; this image ships only the
              # terminal's bundled interpreter — find it, else self-diagnose.
              if ! command -v python3 >/dev/null 2>&1; then
                for c in /opt/strata/terminal/bin/python3 /opt/strata/terminal/bin/python \
                         /opt/strata/terminal/usr/bin/python3 /opt/strata/terminal/python/bin/python3; do
                  if [ -x "$c" ]; then ln -sf "$c" /usr/local/bin/python3; break; fi
                done
              fi
              command -v python3 >/dev/null 2>&1 \
                || fail "no python3 to drive setup.sh; terminal layout: $(find /opt/strata/terminal -maxdepth 3 -name 'python*' 2>/dev/null | tr '\n' ' ')"
              # setup.sh Step 4 compiles the AMD engine for the checkout.
              # git + a C++ compiler are BAKED into the image (2026-10-29
              # owner ruling: runtime apt in an init container = pod-start
              # mirror dependency + non-reproducible layer); the Dockerfile
              # verify step pins the same two commands, so a missing tool
              # fails the build, not the boot.
              command -v git >/dev/null 2>&1 \
                && command -v c++ >/dev/null 2>&1 \
                || fail "image lacks git/c++ for the engine compile - containers/strata must be rebuilt (build-deps RUN, 2026-10-29 contract)"
              IFS=,
              for tok in ${STRATA_QUANTS:-q3}; do
                [ -n "$tok" ] || continue
                TOK=$(printf '%s' "$tok" | tr 'a-z' 'A-Z')
                case "$TOK" in
                  Q3) SIZE=IQ3_S ;;
                  *)  SIZE=$(printenv "STRATA_MODEL_$TOK" || true) ;;
                esac
                if [ -z "$SIZE" ]; then
                  echo "model-fetch: no model id mapped for quant '$tok' - set env STRATA_MODEL_$TOK (catalog: ./setup.sh --help in $SRC)" >&2
                  exit 1
                fi
                MARK="/models/strata/.setup-$TOK"
                if [ -f "$MARK" ]; then
                  echo "model-fetch: $tok already set up, skipping"
                  continue
                fi
                echo "model-fetch: setup.sh for $tok as $SIZE (family qwen, backend hip; downloads start here)"
                # --backend hip is mandatory, not a preference: setup.sh probes
                # NVIDIA by default and hard-stops "no NVIDIA GPU found" on this
                # AMD node (deploy 2026-10-29); SOURCE_INSTALL.md AMD section
                # names the explicit selector. The init container therefore
                # mounts /dev/kfd + /dev/dri (persistence advancedMounts below)
                # — the HIP probe must see the card, or it fails the same lie
                # in the other direction.
                ( cd "$SRC" && ./setup.sh --backend hip --family qwen --model "$SIZE" --context 262144 --vision no --no-start --yes )
                touch "$MARK"
              done
              ls -la "$SRC"/strata-*.json 2>/dev/null \
                || echo "model-fetch: WARNING no strata-*.json run config found - inspect $SRC before serving"
              echo "model-fetch: quants [${STRATA_QUANTS:-q3}] provisioned via checkout on the claim"
          env:
            # Quant set, comma-separated: "q3" today; "q3,q4,q5,q6" for the
            # full set once each token has a model id — only q3→IQ3_S is
            # catalog-confirmed (launch --plan, 2026-10-28); q4/q5/q6 map via
            # STRATA_MODEL_Q4/Q5/Q6 sidecars of this env (loud fail otherwise,
            # nothing half-guessed). Override deep-merges from the service
            # block: app-template.controllers.strata.initContainers.model-fetch.env.
            STRATA_QUANTS: "q3"
          resources:
            # limits.memory 1Gi OOM-KILLED the engine compile (exit 137, 8
            # restarts 2026-10-29: step 4 runs `ninja -j 16` clang jobs the
            # moment configure completes — the 1Gi cap was sized for pip and
            # downloads, not for a compile). 32Gi bounds the parallel clang
            # peak inside a cgroup so a runaway build can never eat into the
            # llama.cpp trio; 2Gi request keeps pod scheduling honest without
            # stacking on the main container's 96Gi reservation.
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              memory: 32Gi
          securityContext:
            # HIP GPU detection (setup.sh --backend hip) needs the same device
            # view as the main container, so the earlier download-only
            # non-privileged shape is lifted: privileged + /dev/kfd +
            # /dev/dri here mirrors the pod's already-accepted device
            # deviation (DECISIONS 2026-10-27). No serve, no pins —
            # --no-start keeps the RAM law out of init's way.
            privileged: true
      containers:
        strata:
          image:
            repository: ghcr.io/ownyourio/strata
            # PIN-ME: brand-new container, no :v<run> exists yet (repo
            # new-container rule) — docker-build.yaml publishes :v<run_number>
            # on the first merge; replace this rolling tag with the pin
            # (+ the renovate habit) as soon as one exists.
            tag: main
            pullPolicy: Always
          # C01 interface freeze (containers/strata README): PID 1 is the
          # harvested llama-swap binary; args override the image CMD, which
          # documents the same default config path.
          args:
            - "-config"
            - "/app/config/config.yaml"
          # No container env at all: the keyless ruling (C-A, DECISIONS
          # 2026-10-28) deleted this pod's whole secret chain rather than
          # gating it — do not re-add a secretKeyRef or env passthrough.
          # The engine's key posture ships in the profiles below (api_key
          # "none").
          probes:
            # Every probe hits the supervisor's own /health — a kubelet
            # probe at a model/upstream endpoint triggers loads (repo
            # lesson) and peers/`/upstream` passthrough is not probe-safe
            # (RESEARCH §3 caveat). llama-swap answers /health itself, so
            # probes never flap mid-swap (DECISIONS probes ruling).
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                # 150x10s absorbs the cold arena pin in parallel with
                # healthCheckTimeout (plan Goal, O2 pairing).
                periodSeconds: 10
                failureThreshold: 150
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
          resources:
            # 128 GB node (R3): pinned arena ~47 GiB + conversation cache
            # 24 GiB + KV/pack page-cache headroom (RESEARCH §4) against
            # node allocatable — the runbook's pre-sync MemAvailable check
            # owns the final sizing, and the node's llama.cpp trio must
            # stay evictable around this reservation (RAM law, plan Goal).
            requests:
              cpu: 8
              memory: 96Gi
            # NO limits.memory, deliberately: a cgroup cap kills the
            # page-locked arena (#1601 stays deferred while this holds;
            # DOCKER.md's runtime contract via the C01 README). No CPU
            # limit either — arena sizing wants every idle cycle.
          securityContext:
            # DECISIONS 2026-10-27 device-access ruling: privileged +
            # hostPath /dev/kfd + /dev/dri, NOT the amd-gpu device plugin —
            # the plugin advertises by count and cannot name gfx1201 vs the
            # 8060S on this mixed APU+dGPU node; chip hiding happens inside
            # via rocrVisibleDevices. Accepted deviation from the repo
            # drop-ALL standard, confined to this pod (the llama.cpp pod
            # keeps its unprivileged shape untouched). Documented-not-built
            # fallback once a naming-capable plugin exists: amd.com/gpu +
            # IPC_LOCK/SYS_RESOURCE + non-privileged.
            privileged: true

  service:
    llama-swap:
      controller: *chartName
      ports:
        http:
          port: 8080
    strata:
      enabled: false
      controller: strata
      ports:
        http:
          port: 8080
      # ClusterIP only, and NO ingress entry beside it or in the service
      # values: Q4 internal-only ruling, the deliberate trio deviation
      # (DECISIONS rework). The gpu-ai peers proxy URL is this controller's
      # rendered Service name — app-template fullname + controller key,
      # e.g. gpu-ai-llama-swap-strata — read it from NOTES, and keep the
      # no-/v1-suffix shape (the path appends verbatim, RESEARCH §3).

  persistence:
    config:
      # Mount the ConfigMap as a DIRECTORY (no subPath): subPath mounts never
      # receive ConfigMap updates, which silently disabled llama-swap's
      # -watch-config hot reload (the 2026-10-17 whisper incident needed a
      # manual pod restart for exactly this reason). With the directory mount
      # kubelet syncs ConfigMap changes (~1 min) and run.sh's default
      # -watch-config reloads llama-swap in place; the LLAMA_SWAP_CONFIG env
      # above points at the file inside the directory.
      # advancedMounts, not globalMounts: a globalMount attaches to EVERY
      # enabled controller, and the strata container owns its own
      # /app/config (strata-config below) — a collision. This enumerates
      # exactly the containers globalMounts reached before (main, tools),
      # so every per-container mount set renders byte-identical to the
      # pre-consolidation tree (mount-exactness law, DECISIONS 2026-10-28).
      type: configMap
      name: llama-swap-config
      advancedMounts:
        llama-swap:
          main:
            - path: /app/config
          tools:
            - path: /app/config
    tools:
      # advancedMounts for the same collision reason as `config` above —
      # enumerating the old globalMount consumers exactly: main keeps its
      # read-only /app/tools mount, the tools sidecar keeps its own.
      type: configMap
      name: llama-swap-tools
      advancedMounts:
        llama-swap:
          main:
            - path: /app/tools
              readOnly: true
          tools:
            - path: /app/tools
              readOnly: true
    models:
      # STAYS globalMounts: strata legitimately shares /models (Q3 ruling —
      # the EXISTING llama-swap claim mounted whole, this chart creates no
      # second PVC; tests pin that). RWO multi-pod same-node mount on
      # local-path is the single-node-cluster pattern; on-target verification
      # rides C04 along with the capacity check.
      existingClaim: *chartName
      globalMounts:
        - path: /models
    # --- strata controller volumes (default OFF; flip with the other six
    # strata flags — advancedMounts naming a DISABLED controller fails the
    # render, so these carry their own enabled gates) ---
    strata-config:
      # Mounted as a DIRECTORY, never subPath: subPath mounts do not receive
      # ConfigMap updates, which silently killed hot reload in the
      # 2026-10-17 llama-swap incident (repo lesson).
      enabled: false
      type: configMap
      name: strata-config
      advancedMounts:
        strata:
          strata:
            - path: /app/config
    strata-profile:
      # Directory for the same hot-reload reason; the cmd's --profile path
      # is inside here (strata-iq3_s.json).
      enabled: false
      type: configMap
      name: strata-profile
      advancedMounts:
        strata:
          strata:
            - path: /profile
    strata-kfd:
      enabled: false
      type: hostPath
      hostPath: /dev/kfd
      hostPathType: CharDevice
      advancedMounts:
        strata:
          strata:
            - path: /dev/kfd
          # model-fetch probes HIP hardware during setup (see init
          # container comment) — the card must be visible to it too.
          model-fetch:
            - path: /dev/kfd
    strata-dri:
      enabled: false
      type: hostPath
      hostPath: /dev/dri
      hostPathType: Directory
      advancedMounts:
        strata:
          strata:
            - path: /dev/dri
          model-fetch:
            - path: /dev/dri
    strata-shm:
      # DOCKER.md's --shm-size 2g equivalent (C01 README runtime contract).
      enabled: false
      type: emptyDir
      medium: Memory
      sizeLimit: 2Gi
      advancedMounts:
        strata:
          strata:
            - path: /dev/shm

# ---------------------------------------------------------------------------
# strata — workload DATA for the second app-template controller above. The
# gated templates (configmap-strata.yaml, configmap-strata-profile.yaml)
# render this subtree ONLY while the strata flags stay enabled; the inert-
# default render of the whole container changes nothing (byte-parity gate).
# The gpu-ai internal Strata engine pod (cf-77): one privileged pod whose
# llama-swap supervisor (from the containers/strata image,
# ghcr.io/ownyourio/strata) owns `strata serve` as a supervised child; public
# exposure happens THROUGH the existing gpu-ai llama-swap `peers:` route,
# never from here (Q4 internal-only ruling).
# ---------------------------------------------------------------------------
strata:
  # ROCr device index for the engine (PR #3636 hid the 8060S APU with 0).
  # Injected into every model's env at render; the on-target rocminfo gate
  # (C04 runbook) retargets it with a values edit, not a template edit.
  rocrVisibleDevices: "0"

  # Per-model ROCr overrides; a model absent here inherits the value above.
  # The strix fallback must name the OTHER silicon: the primary's index
  # deliberately hides the 8060S, so reusing that value would leave the
  # gfx1151 model with no device to bind. "1" mirrors PR #3636's
  # enumeration (dGPU first, chip second) — VERIFY at the same rocminfo
  # gate; on a chip-only node (the fallback's main scenario) the chip is 0,
  # so set "0" or "" to inherit there.
  rocrVisibleDevicesByModel:
    qwen3.8-flash-next-strata-strix: "1"

  # -------------------------------------------------------------------------
  # The INNER llama-swap declared config. configmap-strata.yaml renders this
  # subtree to /app/config/config.yaml; keys prefixed `engineProfile` are
  # chart-side layers (run-config JSON bodies consumed by the profile
  # ConfigMap, not llama-swap keys) and are stripped there. The result must
  # validate against the deployed supervisor's v266-pinned schema (the exact
  # tag the image was harvested from — main-only keys false-fail, RESEARCH
  # "Implications/Validation").
  # -------------------------------------------------------------------------
  config:
    # 1800 s absorbs the cold arena pin: 46.84 GiB at the PR's measured
    # 17.3 GiB/s plus engine init (RESEARCH §3/O2; llama-swap restarts the
    # countdown whenever /health reports new progress, so this bounds the
    # worst case, not the steady state).
    healthCheckTimeout: 1800

    # ${PORT} base — pod-local, mirrors the outer instance's numbering habit;
    # nothing else binds these ports (the engine stays on 127.0.0.1).
    startPort: 10001

    # Q2 lazy posture: nothing ever unloads on a timer.
    globalTTL: 0

    # Empty = default-allow. The keyless ruling (C-A) deleted the whole
    # secret chain — ExternalSecret, per-container env, per-model
    # passthrough — rather than gating it, so no landmine or dead guard
    # remains. The unauthenticated posture mirrors the OUTER llama-swap's
    # own apiKeys: [] and is cluster-internal only: the sanctioned route is
    # the peers hop and the engine binds loopback.
    apiKeys: []

    # Upstream engine lines (the pin progress log, the /health JSON) must
    # reach pod stdout — they are the C04 --plan-gate and unload-timing
    # evidence trail.
    logToStdout: "both"

    models:
      qwen3.8-flash-next-strata:
        name: Qwen3.8-Flash-Next IQ3_S (R9700 arena)
        description: Strata engine, experts pinned in a ~47 GiB page-locked RAM arena on the R9700; first request pays the cold pin (minutes), then residency is permanent (ttl 0).
        # serve takes only --profile/--host/--port (RESEARCH §2) — every
        # tuning knob lives in the run-config JSON below. `exec` hands the
        # process to llama-swap for stop/unload, and the ulimit wrapper is
        # load-bearing: no 0.2.x release self-raises nofile (PR #2399 open)
        # and HIP expert memory creation fails at ~1k FDs (RESEARCH §2,
        # contradiction #5). ${PORT} with no hardcoded port keeps this
        # SanitizeCommand-safe and needs no proxy key.
        cmd: bash -c 'ulimit -n 524288; exec /opt/strata/terminal/bin/strata serve --profile /profile/strata-iq3_s.json --host 127.0.0.1 --port ${PORT}'
        # ttl 0 = NEVER unload (the tri-state trap: 0 is permanent, not
        # immediate). The escape hatch while the arena is pinned is
        # POST /api/models/unload/qwen3.8-flash-next-strata (runbook).
        ttl: 0
        # llama-swap force-kills at unloadTimeout (global default 10 s) long
        # before the 420 s pod grace matters — a ~47 GiB page-locked unload
        # needs this raised window (RESEARCH §3, contradiction #4; timed
        # unload verification is a C04 on-target gate). terminationGrace-
        # PeriodSeconds(420) > this + the engine's 30 s drain is the
        # invariant — keep both values' pairing true when editing either.
        unloadTimeout: 180
        # Strata's /health answers only once the model is loaded and needs no
        # key (RESEARCH §3) — the upstream doc's integration shape.
        checkEndpoint: /health
        # PR #3636 one-at-a-time arm's switches (RESEARCH §5; the strix
        # eight-set is a superset and stays C05's) plus the chart-injected
        # ROCR entry. STRATA_KV_GROW stays off per the R4 ruling.
        env:
          - "STRATA_PF_FUSED=1"
          - "STRATA_PF_GEMM=1"
          - "STRATA_PA_FAST=1"
          - "STRATA_HIP_WMMA=1"
          - "STRATA_SELECT_WMMA=1"
          - "STRATA_PREFILL_CPU_SHARE=auto"
        # Lazy by ruling (Q2 + RESEARCH §3: preloading matrix alternatives
        # swap-loads each other — C05's (p|s) case). Preload flip, only if
        # on-target ever wants a boot-pinned arena:
        # hooks:
        #   on_startup:
        #     preload: [qwen3.8-flash-next-strata]

      qwen3.8-flash-next-strata-strix:
        name: Qwen3.8-Flash-Next IQ3_S (Strix Halo 8060S fallback)
        description: Strata engine, gfx1151 build on the 8060S iGPU; arena lives in shared LPDDR5X, manual/secondary use, unloads on idle (see the chart README, Strix-alone fallback).
        # Same serve wrapper as the primary (C01 interface freeze) — the
        # gfx1151-vs-gfx1201 switch is the exe key inside the second
        # profile, never the image or this flag list.
        cmd: bash -c 'ulimit -n 524288; exec /opt/strata/terminal/bin/strata serve --profile /profile/strata-strix-iq3_s.json --host 127.0.0.1 --port ${PORT}'
        # ttl > 0 = idle SECONDS before unload (the tri-state trap: 0 is
        # never, not immediately). Secondary use should hand the LPDDR5X
        # arena back when quiet instead of holding it like the primary's
        # pinned residency — 1800 is the operator-toggle default, set 0 to
        # pin forever once warm.
        ttl: 1800
        # Page-locked in LPDDR5X just like the primary's VRAM arena — the
        # same force-kill window logic applies (RESEARCH contradictions #4).
        unloadTimeout: 180
        checkEndpoint: /health
        # The §5 eight-set rides in the run-config profile below instead:
        # those literals are upstream-recipe constants, not values-gated,
        # so their single source is engineProfileStrix.env. No env list at
        # this layer — the keyless ruling (C-A) removed the last entry that
        # lived here; the absence is the posture, not an omission.
        # Rounds differ from the primary's output: the §5 switches are
        # KL-gated (STRIX_HALO §5 "changes bits") — never A/B the two
        # profiles token-for-token, compare on the bench suite instead.

    matrix:
      # The two engines are ALTERNATIVES, never co-loadable: the arenas pin
      # RAM additively on the 128 GB node and co-residency recreates #1715's
      # global OOM (RESEARCH §7). "(p | s)" expands to one-model combos, so
      # the solver evicts the resident arena before starting the other —
      # the preload-empty hook alone would not stop a request-driven
      # co-load. vars name model IDs, not aliases (llama-swap matrix
      # semantics). Both stay lazily reachable; nothing preloads.
      vars:
        p: qwen3.8-flash-next-strata
        s: qwen3.8-flash-next-strata-strix
      sets:
        main: "(p | s)"

    # -----------------------------------------------------------------------
    # The run-config JSON rendered VERBATIM to /profile/strata-iq3_s.json
    # (key vocabulary: RESEARCH §2, measured from profiles.py). SOURCE OF
    # TRUTH: the run-config setup GENERATED for this node
    # (/models/strata/Strata/strata-iq3_s.json, cat 2026-10-29) — it
    # supersedes the PR #3636 seed and corrects every seeded path guess:
    # weights/pack/MTP live under Strata-data, the tokenizer is a DIRECTORY
    # riding inside the pack (the seed's GGUF-file pointer was the crash
    # strata.py named), and the engine is the checkout's own gfx1201
    # compile. The on-target --plan gate (C04) is now verification, not
    # discovery; every deliberate deviation from the generated file is a
    # documented toggle below.
    # -----------------------------------------------------------------------
    engineProfile:
      # C-A keyless shipped default: "none" = the engine checks no key. It
      # binds loopback (see host below), so only the supervisor proxy can
      # reach it and the pod's auth posture is fully decided by the apiKeys
      # above — a key here would gate nothing reachable. (The generated file
      # omits the key; "none" states the same posture explicitly.)
      api_key: "none"
      # exe = the engine model-fetch's setup COMPILED for this machine
      # (gfx1201 via the checkout's venv ROCm SDK). The checkout lives on the
      # shared claim, so the path is pod-stable; the packaged /opt/strata
      # engines remain the strix fallback's runtime. Switching flavor =
      # switching profile file, never the image (C01 interface freeze).
      exe: /models/strata/Strata/engine/strata
      # serve's engine child inherits llama-swap's model env (the layer
      # above, single source of truth); a duplicate here would let serve
      # silently re-pin a value the chart gates (rocrVisibleDevices). C05's
      # strix profile carries its own §5 eight-set instead.
      env: {}
      # setup's own choices, kept verbatim: engine-relative cwd and the
      # progress log on the claim (the --plan-gate and unload-timing
      # evidence trail).
      cwd: /models/strata/Strata
      log: /models/strata/Strata/strata-iq3_s.log
      # Paths are SETUP's measured layout on the shared claim (2026-10-29):
      # weights/pack/MTP under Strata-data, expert-profile in the checkout's
      # data/. The prefix keeps this engine's files out of llama.cpp's
      # LLAMA_CACHE=/models layout on the same disk (DECISIONS Q3).
      args:
        - --pack /models/strata/Strata-data/packs/iq3_s
        # IQ3_S two-shard GGUF (ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF;
        # shard 2 is the PLE file, RESEARCH §4); setup's .done markers sit
        # beside them.
        - --native /models/strata/Strata-data/models/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf
        - --ple-gguf /models/strata/Strata-data/models/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00002-of-00002.gguf
        - --expert-profile /models/strata/Strata/data/expert-profile.bin
        # N in --expert-cache counts expert SLOTS, not MiB (RESEARCH §2);
        # `auto` is both the PR's and setup's choice — the --plan gate
        # verifies the resolved arena against real RAM (R1/R3).
        - --expert-cache auto
        - --spec 4
        - --spec-min-p 0.5
        - --mtp /models/strata/Strata-data/mtp/rt
        - --max-context 262144
        # int8 KV: the engine default AND the PR's explicit choice.
        - --kv int8
        # Machine-tuned by setup (adopted verbatim): the n-gram PLE table
        # stays RAM-resident — the quant card's own recommendation when RAM
        # allows — with a 32768-cell resident KV window, and prefill sized
        # automatically for the node instead of the PR's hand-picked 32768.
        - --ple-io ram
        - --kv-resident 32768
        - --prefill auto
        # Documented deviations/toggles, one values edit away (verbatim
        # provenance kept for the record):
        # --prefill 32768: the PR #3636 R9700-machine number; setup chose
        #   `auto` here — override only on --plan/bench evidence.
        # --conversation-cache-mib 24576 / --conversation-cache-slots 16:
        #   the PR's parked-conversation budget — the real home of the
        #   guide's "24576" (RESEARCH §5 contradiction #3). Setup ships its
        #   default instead (40% free RAM above floor, capped 8 GiB);
        #   re-add both lines to pin the PR budget.
        # --mtp-window 8192: guide-class long-context knob, absent from the
        #   generated config; re-add to restore it.
        # --kv-grow (R4 deferred, +2-3% @64K only): re-add "- --kv-grow";
        #   the cmd's ulimit wrapper already covers its fd dependency and
        #   the env alias is STRATA_KV_GROW=1 — the guide's hold-env is VOID
        #   (RESEARCH §2). Needs the on-target fd experiment (C04) first.
        # --vision (R2 off for v1): mmproj-Qwen3.8-Flash-Next-BF16.gguf
        #   ships at the quant repo root (~0.9 GB); the vision{} run-config
        #   key stays available for the flip.
        # --resident-budget-gib implies --mmap-experts, the opposite of the
        #   page-locked arena (contradiction #3) — strix/#1715 territory.
        # --prompt-cache-every: #4206 no-op at prefill edges; never adopted.
      # Person-wins layer that survives config rewrites (RESEARCH §2): empty
      # until an operator out-ranks the seed.
      user_args: []
      # A DIRECTORY, not the GGUF file (the seed's shard path was the
      # tokenizer-missing crash strata.py named): the tokenizer rides inside
      # the pack, measured 2026-10-29.
      tokenizer: /models/strata/Strata-data/packs/iq3_s/tokenizer
      model_name: qwen3.8-flash-next-iq3_s
      # The compiled engine's ROCm runtime = the checkout venv's SDK trees
      # (setup's own choice) — not the packaged image roots.
      lib_dirs:
        - /models/strata/Strata/.venv/lib/python3.12/site-packages/_rocm_sdk_devel/lib
        - /models/strata/Strata/.venv/lib/python3.12/site-packages/_rocm_sdk_libraries_gfx120X_all/lib
      backend: hip
      # The peer hop always rewrites the request model to this bare ID
      # (RESEARCH §3), so routing does not depend on aliases; these carry the
      # PR's family alias for direct/debug hits on the inner surface.
      aliases:
        - qwen3.8-flash-next
      gpu: [0]
      parallel: 4
      # The cmd's --host flag binds loopback (the supervisor is the pod's
      # only in-pod listener); the PR ran 0.0.0.0 on a laptop.
      host: "127.0.0.1"

    # -----------------------------------------------------------------------
    # The Strix-alone fallback's run-config, rendered VERBATIM to
    # /profile/strata-strix-iq3_s.json by the same profile ConfigMap. Seed:
    # UPSTREAM docs/STRIX_HALO.md §5 fast-config — the R1 ruling says NOT
    # the card's numbers, and not the primary's arena recipe either: the
    # 8060S runs on shared LPDDR5X, so the residency math is a different
    # fix-class (#1715). Final sizing: strata serve --plan --output json
    # (C04, human step 3).
    # -----------------------------------------------------------------------
    engineProfileStrix:
      # C-A keyless shipped default (same posture as the primary).
      api_key: "none"
      # C01 interface freeze (containers/strata README): halo label = the
      # gfx1151 root. Pointing the rx9070 exe at the 8060S loads the wrong
      # arch kernels; exe is the ONLY flavor switch (same image, same
      # terminal entry, same weights).
      exe: /opt/strata/components/engine/0.1.52-linux-x86_64-hip-halo/strata
      # RESEARCH §7 verbatim eight-set — the spellings ARE upstream literals
      # (normalizing case or names silently no-ops the engine's env parsing,
      # AC2's bar). gfx1151 auto-enables much of this from §4; §5 sets them
      # explicitly because they change bits (KL-gated rounds). To disable
      # the whole auto-set: STRATA_GFX1151_DEFAULTS=0.
      env:
        STRATA_PF_FUSED: "1"
        STRATA_PF_GEMM: "1"
        STRATA_HC_UPMIX: "1"
        STRATA_PA_FAST: "1"
        STRATA_HIP_WMMA: "1"
        STRATA_SELECT_WMMA: "1"
        STRATA_PF_SWITCH_MIN_T: "4096"
        STRATA_PREFILL_STREAM_MIN: "128"
        # STRATA_PF_FUSED_KQ=1 applies only to K-quant packs; the shipped
        # IQ3_S pack is not one — enable if the on-target pack ever changes.
        # STRATA_HC_UPMIX=1 carries the #2706 split-mode hazard history:
        # startup-log check gate in the fallback runbook (README), flip it
        # to "0" here if the hazard reproduces on this engine build.
      args:
        # Same Strata-data layout as the primary (measured 2026-10-29) — one
        # staged set serves both profiles; the matrix never runs them at once.
        - --pack /models/strata/Strata-data/packs/iq3_s
        - --native /models/strata/Strata-data/models/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf
        - --ple-gguf /models/strata/Strata-data/models/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00002-of-00002.gguf
        - --expert-profile /models/strata/Strata/data/expert-profile.bin
        # VERIFY (R1): the 24576/55 pair has NO upstream source — it is the
        # card guide's number pair, and 24576 also equals the model's total
        # expert count, the likely misattribution origin (RESEARCH §7).
        # They ship because #1715's fix-class is exactly this shape: on a
        # 128 GB Strix Halo, --expert-cache auto WITHOUT --resident-budget-gib
        # OOMs globally — the opposite of the primary, where resident-budget
        # would flip --mmap-experts and break the page-locked arena. Both
        # numbers are HYPOTHESES until the strata serve --plan --output json
        # gate (C04 human step 3) finalizes them against real RAM; note
        # --expert-cache N counts expert SLOTS, not MiB (RESEARCH §2).
        - --expert-cache 24576
        - --resident-budget-gib 55
        # STRIX_HALO §5/§6 fast-config-class prefill chunk for the chip
        # alone (the primary runs setup's --prefill auto).
        - --prefill 16384
        - --max-context 262144
        - --kv int8
        - --spec 4
        - --spec-min-p 0.5
        - --mtp-window 8192
        - --mtp /models/strata/Strata-data/mtp/rt
        # Deliberately absent: --kv-grow (R4 deferral covers strix too),
        # --vision (R2 off for both profiles), --conversation-cache* (the
        # primary's 24 GiB x 16 slots is the PR's R9700-machine budget —
        # the chip's share is the --plan gate's to size, not ours to seed).
      # Person-wins layer (RESEARCH §2), same rule as the primary.
      user_args: []
      # Tokenizer rides inside the pack — a DIRECTORY (strata.py appends
      # /vocab.json; same measured correction as the primary).
      tokenizer: /models/strata/Strata-data/packs/iq3_s/tokenizer
      model_name: qwen3.8-flash-next
      # The matching halo engine root for lib_dirs (the exe's ROCm runtime
      # ships inside it — same packaged-engine VERIFY as the primary).
      lib_dirs:
        - /opt/strata/components/engine/0.1.52-linux-x86_64-hip-halo
      backend: hip
      aliases:
        - qwen3.8-flash-next
      # The visible set is renumbered by the ROCr filter injected per model
      # above, so [0] is the first (only) visible GPU — the chip for this
      # profile, whatever its pre-filter index was.
      gpu: [0]
      # Mirrors the primary seed (same family recipe); the --plan gate
      # reviews it for the chip too.
      parallel: 4
      host: "127.0.0.1"
