domain: OVERRIDE_VIA_APPSET

# Bitwarden item IDs (uuids), injected per-cluster via custom-values or the
# cluster annotation. Empty by default: charts that render secrets guard on
# these keys so clusters without them render clean.
bitwardenIds: {}

# Models PVC size. gpu rides the 300Gi default; gpu-ai overrides to 500Gi
# (Qwen3.8-27B roster + MTP/mmproj auxiliaries + a converted cyber LoRA).
modelsPvcSize: 300Gi

# llama-swap application configuration
config:
  # Health check timeout for model readiness.
  # Generous (1h) on purpose: the first load of a large model includes the
  # -hf download (30B Q8 ~32 GB, 30B BF16 ~61 GB) and llama-server only opens
  # its port once download+load finish. At 500s llama-swap killed the process
  # mid-download ("health check timed out after 8m20s"). Cached loads are fast;
  # this only widens the window for cold downloads.
  healthCheckTimeout: 3600
  performance:
    enable: true
    every: 5s

  # Logging
  logLevel: info
  # llama-swap v259 split stdout into streams: HTTP access lines moved out of
  # "proxy" into "http". "proxy,http" keeps the pre-v259 stdout makeup so
  # request lines still reach Loki via pod logs.
  logToStdout: "proxy,http"

  # Start port for automatic ${PORT} macro
  startPort: 10001

  # Send loading state to clients
  sendLoadingState: true

  # Expose aliases in /v1/models (incl. the :tags/:caption workload aliases
  # below) so clients that enumerate models (Pictaria, OpenWebUI) can see them.
  includeAliasesInList: true

  # No API keys required (default allow)
  apiKeys: []

  # Global TTL (0 = never automatically unload)
  globalTTL: 0

  # Graceful timeout when unloading a model
  unloadTimeout: 30

  # Macros for reusable configuration
  macros:
    # Bare binary name: the unified image (v262+) ships llama-server in
    # /usr/local/bin — the old /app/llama-server path is gone.
    server-cmd: |
      llama-server
      --port ${PORT}
      --host 0.0.0.0
      --jinja
    threads: |
      -t 10
    # --no-mmap was removed upstream; --load-mode none is the equivalent
    # (read weights into RAM without mmap).
    moe: |
      -ngl 99 
      -ot "\.ffn_.*_exps\.=CPU" 
      --load-mode none
    # Expert placement for the 30B vision-MoE quants on the 8GB gpu card
    # (measured regime: Poor GPU Club runs Qwen3-30B-A3B Q4 on 8GB with
    # n-cpu-moe ~28-34 at 20-34 t/s; all-experts-on-CPU is the slow floor).
    # --n-cpu-moe N keeps experts of N layers on CPU, rest on GPU. These are
    # conservative starting points — sweep N down (more experts on GPU) while
    # load-time VRAM allows. BF16 has no expert headroom on 8GB, it keeps ${moe}.
    moe-vl-q4: |
      -ngl 99
      --n-cpu-moe 38
      --load-mode none
    moe-vl-q8: |
      -ngl 99
      --n-cpu-moe 44
      --load-mode none
    flash-and-q8: |
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0

    ctx-256k: |
      --ctx-size 262144
      -b 2048 
      -ub 2048
    big-ub: |
      -b 2048 
      -ub 2048


    # Trades throughput for fitting onto the 8GB card.
    ctx-1m: |
      -c 1010000 
      --rope-scaling yarn --rope-scale 4 --yarn-orig-ctx 262144
      -b 512 -ub 512


  # Named per-workload filter blocks, referenced from models by `filters:`
  # name; the renderer expands the reference into each model's `filters` map
  # (llama-swap has no presets key). Replaces the old &vlWorkloadFilters
  # YAML anchor.
  #
  # Per-workload aliases for a loaded VL model (no reload between workloads).
  # llama-swap substitutes ${MODEL_ID} in setParamsByID keys and
  # auto-registers each key as an alias (verified in upstream load.go), so
  # this single block serves every Qwen3-VL Instruct model:
  #   <model>:tags    -> Pictaria tag extraction. Forces thinking OFF
  #                      (llama.cpp #20345: with enable_thinking=true the
  #                      json_schema grammar is silently bypassed -> broken
  #                      JSON) + low temp for classification. Pictaria sends
  #                      response_format json_schema itself; llama-swap
  #                      passes it through untouched.
  #   <model>:caption -> Immich captioning. Free-text (no schema: constraints
  #                      hurt description quality), thinking off, low temp +
  #                      fixed seed for reproducible captions.
  filterPresets:
    vl-workload:
      setParamsByID:
        "${MODEL_ID}:tags":
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.2
        "${MODEL_ID}:caption":
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.1
          seed: 42

  # Quant-tag cultures (CR5): ladder-key -> GGUF quant TAG maps. A rung
  # without a full hf: literal composes its ref as {repo|hfRepo}:
  # {tag|tagCultures[tagCulture][quant-key]}. These are VALUES DATA, not a
  # regex: irregular rungs stay honest per-rung tag:/repo:/hf: exceptions
  # (variant keys, one-off tags, multi-repo families).
  tagCultures:
    standard:
      q4: Q4_K_M
      q5: Q5_K_M
      q6: Q6_K
      q8: Q8_0
      bf16: BF16
    unsloth-ud:
      q3: UD-Q3_K_XL
      q4: UD-Q4_K_XL
      q5: UD-Q5_K_XL
      q6: UD-Q6_K_XL

  # Model catalog (CA2, plan REPLAN CR1/CR2). Models are authored by FAMILY
  # with their quant ladder under `quants:`; the rendered llama-swap ID is
  # derived as `<family>-<quant>` (a rung-level `id:` replaces the derived
  # name - only home-3b-v3's base rung needs one, consumers pinned that ID
  # before family authoring existed). Field merge layering is family < rung
  # < raw config.models (deep merge; use/flags lists replace wholesale).
  #
  # CR5 DERIVATION: ladders author what is DATA (tag/repo exceptions, sizes,
  # enablement, tuned regimes, prose caveats); the shared composition lives
  # once in templates/_helpers-llama-swap.tpl. A rung resolves its -hf ref
  # from hfRepo/tagCulture (overridable per rung via repo:/tag:, escape with a
  # full hf: literal), and picker text composes from the family dispName/
  # descBase/descTail vocabulary - always derive-if-absent: an explicit
  # name:/description: (family, rung, or the models layer) wins, and display
  # is derived from the RUNG-level ref before the models layer merges, so a
  # models-layer hf: override never re-derives name/description.
  #
  # CATALOG PATTERN: every family ships `enabled: false` and services/gpu +
  # services/gpu-ai flip enablement for their subset (family-level or
  # per-rung). A not-enabled rung still renders - as the deviation-1 fail-fast
  # echo ("<id> is not enabled on this cluster - see the chart catalog";
  # routable, exits 1 with the reason instead of loading). That is deliberate:
  # un-enabled big rungs must never load by accident (the 2026-10-11/18 VRAM
  # node-freeze incidents), and /v1/models consumers see the full catalog.
  # A rung's `disabled:` message beats enablement, so the legacy byte-pinned
  # gpu echo strings live on in services/gpu `config.models.<id>.disabled`.
  #
  # Roster schema per entry (llama-swap.modelCmd composes each cmd; precedence
  # disabled > cmd > hf-composition, unchanged from C02):
  #   hf / draft   -hf / -hfd refs
  #   spec         --spec-type / --spec-draft-* speculative-decoding flags
  #   use          ordered ${macro} references (rendered as the reference;
  #                llama-swap expands macros at load)
  #   flags        verbatim lines, composed after use - llama.cpp is
  #                rightmost-wins, so a flag here can override a macro value
  #   cmd          raw escape hatch, passed through untouched
  #   disabled     fail-fast message (rendered as "<id> <message>" echo)
  #   enabled      catalog gate, family- or rung-level
  #   filters      a filterPresets name, expanded into the model map
  # name/description/ttl/aliases/capabilities/checkEndpoint/proxy/env pass
  # through as-is; omitted proxy defaults to http://localhost:${PORT},
  # omitted ttl inherits globalTTL.
  #   repo/tag     CR5 shorthand legs: composed ref = {repo|hfRepo}:{tag |
  #                config.tagCultures[tagCulture][quant]}; hfRepo/tagCulture
  #                live at family level, repo/tag are per-rung exceptions
  #   dispName/descBase/descTail  family display vocabulary; disp/suffix
  #                are per-rung name overrides (suffix = " - <text>" tail of
  #                the NAME); size is GiB data interpolated into descTail's
  #                {size} placeholder - descTail is appended VERBATIM (its
  #                leading punctuation is data; absent tail + size composes
  #                "; <size> weights")
  # name/description derive only where absent (see CR5 DERIVATION above).
  #
  # config.models remains in this map's meaning as the per-ID override +
  # escape-hatch layer, merged OVER the expansion (gpu's tuned regimes and
  # disabled messages, gpu-ai's MTP variants + rana raw cmd live there).
  # A duplicate derived ID fails the render (templates/_helpers-llama-swap.tpl).
  families:
    # Qwen 3.8 27B (plain/official). Q4/Q6/Q8 from unsloth's dynamic
    # imatrix builds (no plain K-quants published); the 16-bit entry comes
    # from ggml-org since unsloth ships no F16/BF16 for this model.
    # gpu-ai re-composes q4/q6/q8/bf16 with the ggml-org MTP draft via its
    # config.models override layer; the -visual/-1m siblings ride the
    # gpu-ai-only ${q38-common} macro (a service value), so they render
    # live only where gpu-ai enables them and as echoes everywhere else.
    qwen3.8-27b:
      enabled: false
      hfRepo: unsloth/Qwen3.8-27B-GGUF
      tagCulture: unsloth-ud
      dispName: Qwen 3.8 27B
      descBase: Qwen 3.8 27B dense model
      use: [threads, ctx-256k, flash-and-q8]
      ttl: 0
      quants:
        q4:
        q6:
        q8:
          tag: Q8_0
        bf16:
          repo: ggml-org/Qwen3.8-27B-GGUF
          tag: BF16
        # Vision sibling of gpu-ai's text-only caching q8 (Q8 split 2026-10-15:
        # llama.cpp hard-disables cache_reuse in multimodal mode, so the two
        # cannot be combined - full rationale in services/gpu-ai values).
        q8-visual:
          hf: "unsloth/Qwen3.8-27B-GGUF:Q8_0"
          draft: "ggml-org/Qwen3.8-27B-GGUF:mtp-Qwen3.8-27B-Q8_0.gguf"
          spec: {type: draft-mtp, draft_n_max: 2}
          use: [q38-common]
          flags: |
            -c 262144
          suffix: Visual
          description: "Plain Qwen 3.8 27B, Q8_0; MTP draft, vision on (auto mmproj), 256k ctx; cache_reuse disabled by llama.cpp in multimodal mode"
          ttl: 300
        # 1M context variant (2026-10-13): ${ctx-1m} = YaRN x4 over the native
        # 262144 ctx; --no-kv-offload parks the ~34GB 1M q8_0 KV in gpu-ai's
        # 125GB RAM (the 8GiB gpu box could never run this). No MTP on the 1m
        # variants: they trade speed for context, draft-mtp over CPU-resident
        # KV is untested. (${ctx-1m}'s 512 batches would be clobbered by
        # ${q38-common}'s -b/-ub, so q38-common is deliberately not reused.)
        q8-1m:
          hf: "unsloth/Qwen3.8-27B-GGUF:Q8_0"
          use: [ctx-1m]
          flags: |
            --no-kv-offload
            -ngl 999
            --flash-attn on
            --load-mode none
            -np 1
            --cache-type-k q8_0
            --cache-type-v q8_0
            --cache-reuse 1
            --no-context-shift
          suffix: 1M
          description: "Plain Qwen 3.8 27B, Q8_0; 1M ctx (YaRN x4), KV in system RAM"
          ttl: 300

    qwen3.6-27b:
      enabled: false
      hfRepo: unsloth/Qwen3.6-27B-GGUF
      tagCulture: standard
      dispName: Qwen 3.6 27B
      descBase: Qwen 3.6 27B general purpose model
      ttl: 0
      quants:
        q6:
          use: [threads, ctx-256k, flash-and-q8]
        q8:
          use: [threads, flash-and-q8, ctx-256k]

    qwen3.6-35b-a3b:
      enabled: false
      hfRepo: unsloth/Qwen3.6-35B-A3B-GGUF
      tagCulture: standard
      dispName: Qwen 3.6 35B A3B
      descBase: Qwen 3.6 35B with 3B active parameters (MoE)
      use: [threads, ctx-256k, flash-and-q8]
      ttl: 0
      quants:
        q6:
          tag: UD-Q6_K
        q8:
          use: [threads, ctx-256k, moe, flash-and-q8]
        1m:
          tag: Q8_0
          suffix: 1M
          use: [threads, ctx-1m, moe, flash-and-q8]
        bf16:
          use: [threads, ctx-256k, moe, flash-and-q8]
        # Vision-on sibling of gpu-ai's text-only caching q8 (chart cmd, no
        # cache flags); gpu-ai enables it, gpu keeps the caching q8 only.
        q8-visual:
          hf: "unsloth/Qwen3.6-35B-A3B-GGUF:Q8_0"
          use: [threads, ctx-256k, moe, flash-and-q8]
          suffix: Visual
          description: "Qwen 3.6 35B A3B (MoE), Q8_0; vision on (auto mmproj), experts on CPU, 256k ctx; cache_reuse disabled by llama.cpp in multimodal mode"

    # Ornith 1.5 35B A3B (qwen35moe arch, 256 experts/top-8 - verified in
    # the official GGUF header 2026-10-23; same family as the qwen3.6-35b-
    # a3b entries above, so ${moe}'s expert-on-CPU regime carries over).
    # Ladder = the operator-approved 7 rungs (DECISIONS 2026-10-22 "Plan
    # approval"): official Q4_K_M/Q5_K_M/Q6_K/Q8_0/BF16 + bartowski
    # Q3_K_XL/IQ2_XXS, one repo per rung so llama.cpp's hub-cache shares
    # downloads. Sizes are total GGUF bytes re-summed from the live HF API
    # at implementation.
    # BF16 rides the chart so gpu can keep the ID routable via its
    # `disabled` fail-fast override (same pattern as the qwen3.6 BF16/1M
    # disables there).
    ornith-1.5-35b-a3b:
      enabled: false
      hfRepo: ornith-ai/Ornith-1.5-35B-A3B-GGUF
      tagCulture: standard
      dispName: Ornith 1.5 35B A3B
      descBase: Ornith 1.5 35B with 3B active parameters (MoE)
      descTail: "; {size} weights, experts on CPU, 256k ctx"
      use: [threads, moe, ctx-256k, flash-and-q8]
      ttl: 0
      capabilities: {in: [text, image], out: [text]}
      quants:
        iq2xxs:
          repo: bartowski/Ornith-1.5-35B-A3B-GGUF
          tag: IQ2_XXS
          size: 9.6 GiB
        q3:
          repo: bartowski/Ornith-1.5-35B-A3B-GGUF
          tag: Q3_K_XL
          size: 16.6 GiB
        q4:
          size: 20.2 GiB
        q5:
          size: 23.6 GiB
        q6:
          size: 27.2 GiB
        q8:
          size: 35.2 GiB
        bf16:
          size: 66.2 GiB

    # Ornith 1.5 122B (arch qwen35moe, 256 experts/top-8, ~92% of weights
    # routed - expert-on-CPU offload is the serving regime). gpu-ai-only
    # BY ENABLEMENT (catalog echo on gpu). 122B ships WITHOUT MTP: the
    # unsloth repo has no mtp-* files and
    # prithivMLmods/Ornith-1.5-122B-MTP-GGUF holds full-model builds,
    # not a standalone draft to point -hfd at - recorded per the C04.md
    # conditional.
    ornith-1.5-122b:
      enabled: false
      hfRepo: unsloth/Ornith-1.5-122B-GGUF
      tagCulture: unsloth-ud
      dispName: Ornith 1.5 122B
      descBase: Ornith 1.5 122B MoE (qwen35moe, 256 experts/top-8, ~92% routed)
      descTail: "; {size} weights, experts on CPU, 256k ctx; SOLO; no MTP draft published (see the C04 family note)"
      use: [threads, moe, ctx-256k, flash-and-q8]
      ttl: 300
      capabilities: {in: [text, image], out: [text]}
      quants:
        q3:
          size: 55.7 GiB
        q4:
          size: 74.2 GiB
        q5:
          size: 88.1 GiB
        q6:
          size: 106.4 GiB
          descTail: "; {size} weights, marginal against the ~125 GiB budget - SOLO only; no MTP draft published (see the C04 family note)"

    # Home Assistant 3B v3 (HA intent pipeline). Family name is the
    # historical ID; the CPU rung therefore needs the catalog's ONLY
    # `id:` override (consumers - HA, MinusPod routing - pinned
    # home-3b-v3 before family authoring existed).
    home-3b-v3:
      enabled: false
      hfRepo: acon96/Home-3B-v3-GGUF
      dispName: Home 3B v3
      use: [threads]
      ttl: 0
      quants:
        gpu:
          tag: Q8_0
          suffix: GPU
          descBase: Home Assistant 3B v3 model on GPU
          flags: |
            -ngl 99
            -c 8192
        cpu:
          tag: Q4_K_M
          suffix: CPU
          descBase: Home Assistant 3B v3 model on CPU
          descTail: "; runs in parallel with GPU models"
          id: home-3b-v3
          flags: |
            -ngl 0
            -c 8192

    # Qwen3-VL Instruct/Thinking families for Immich/Pictaria. mmproj
    # auto-downloads from the -hf repo (hf:// in --mmproj is a literal
    # path, not a hub ref). filters: vl-workload = the named filterPresets
    # entry replacing the old &vlWorkloadFilters anchor (:tags/:caption
    # per-workload aliases, auto-registered by llama-swap).
    qwen3-vl-2b:
      enabled: false
      hfRepo: unsloth/Qwen3-VL-2B-Instruct-GGUF
      tagCulture: standard
      dispName: Qwen3 VL 2B Instruct
      descBase: Vision-language model for Immich image analysis
      descTail: "; faster processing for simpler descriptions"
      use: [threads]
      flags: |
        -c 16384
      ttl: 0
      capabilities: {in: [text, image], out: [text]}
      filters: vl-workload
      quants:
        q8:
        q4:
        bf16:

    # See qwen3-vl-2b family note (mmproj autoload + vl-workload filters).
    qwen3-vl-4b:
      enabled: false
      hfRepo: unsloth/Qwen3-VL-4B-Instruct-GGUF
      tagCulture: standard
      dispName: Qwen3 VL 4B Instruct
      descBase: Vision-language model for Immich image analysis
      use: [threads]
      flags: |
        -c 16384
      ttl: 0
      capabilities: {in: [text, image], out: [text]}
      filters: vl-workload
      quants:
        # Back-compat alias for consumers configured before quant suffixes
        # were added.
        q4:
          aliases: [qwen3-vl-4b]
        q8:
        bf16:

    # See qwen3-vl-2b family note (mmproj autoload + vl-workload filters).
    qwen3-vl-8b:
      enabled: false
      hfRepo: unsloth/Qwen3-VL-8B-Instruct-GGUF
      tagCulture: standard
      dispName: Qwen3 VL 8B Instruct
      descBase: Vision-language model for Immich image analysis
      use: [threads]
      flags: |
        -c 16384
      ttl: 0
      capabilities: {in: [text, image], out: [text]}
      filters: vl-workload
      quants:
        q4:
          aliases: [qwen3-vl-8b]
        q8:
        bf16:

    # See qwen3-vl-2b family note (mmproj autoload + vl-workload filters).
    # Per-quant expert placement: q4/q8 ride the 8GB-measured moe-vl
    # macros, bf16 keeps ${moe} (gpu disables it via its override).
    qwen3-vl-30b-a3b:
      enabled: false
      hfRepo: unsloth/Qwen3-VL-30B-A3B-Instruct-GGUF
      tagCulture: standard
      dispName: Qwen3 VL 30B A3B Instruct
      descBase: Vision-language MoE model for Immich image analysis
      descTail: ", CPU-offloaded experts"
      flags: |
        -c 16384
      ttl: 0
      capabilities: {in: [text, image], out: [text]}
      filters: vl-workload
      quants:
        # Back-compat alias for consumers configured before quant suffixes
        # were added.
        q4:
          use: [threads, moe-vl-q4, flash-and-q8, big-ub]
          aliases: [qwen3-vl-30b-a3b]
        q8:
          use: [threads, moe-vl-q8, flash-and-q8, big-ub]
        bf16:
          use: [threads, moe, flash-and-q8]

    # Qwen3-VL Thinking line: reasoning variants have NO vl-workload
    # filters (Pictaria/Immich drive them via chat params, not the
    # thinking-off setParamsByID aliases). mmproj auto-downloads.
    qwen3-vl-4b-thinking:
      enabled: false
      hfRepo: unsloth/Qwen3-VL-4B-Thinking-GGUF
      tagCulture: standard
      dispName: Qwen3 VL 4B Thinking
      descBase: Reasoning vision-language model for Immich image analysis
      descTail: "; good balance of speed and accuracy"
      use: [threads]
      flags: |
        -c 16384
      ttl: 0
      capabilities: {in: [text, image], out: [text]}
      quants:
        q8:
        q4:
        bf16:

    # See qwen3-vl-4b-thinking family note. q4/q8 on the moe-vl placement
    # macros, bf16 on ${moe}; mmproj auto-downloads.
    qwen3-vl-30b-a3b-thinking:
      enabled: false
      hfRepo: unsloth/Qwen3-VL-30B-A3B-Thinking-GGUF
      tagCulture: standard
      dispName: Qwen3 VL 30B A3B Thinking
      descBase: Reasoning vision-language MoE model for Immich image analysis
      descTail: ", CPU-offloaded experts; higher accuracy for complex images"
      flags: |
        -c 16384
      ttl: 0
      capabilities: {in: [text, image], out: [text]}
      quants:
        q8:
          use: [threads, moe-vl-q8, flash-and-q8, big-ub]
        q4:
          use: [threads, moe-vl-q4, flash-and-q8, big-ub]
        bf16:
          use: [threads, moe, flash-and-q8]

    # Audio transcription for MinusPod (media cluster) via whisper.cpp,
    # bundled in the unified image. Weights (~3.1GB) are fetched once from
    # HuggingFace into the models PVC on first load. Swaps 1:1 with the GPU
    # chat/VL models per the matrix below (one GPU model at a time on 8GB).
    # 2026-10-17: weights URL is ggerganov/whisper.cpp - the former home
    # ggml-org/whisper.cpp was removed from HuggingFace (401), which made
    # every load die in the curl bootstrap ("upstream command exited
    # prematurely"); ggerganov/whisper.cpp is where upstream's own
    # download-ggml-model.sh points.
    # 2026-10-17 (2nd): --inference-path below is REQUIRED. whisper.cpp's
    # server only ever registers request_path + inference_path (default
    # /inference) - it has NO /v1/audio/transcriptions route (verified in
    # the image's whisper.cpp 60c0be6a), while llama-swap forwards the
    # OpenAI path to upstreams unrewritten, so without the flag every
    # transcription 404'd with Server: whisper.cpp. /health stays put
    # (registered off request_path), so checkEndpoint keeps working.
    # NOTE on the /bin/sh -c bootstrap below: llama-swap's SanitizeCommand
    # strips trailing backslashes (keeping the newline) before shlex-splitting,
    # so inside the quoted script a command must be COMPLETE on one line -
    # continuation is only safe via a trailing &&/|| (a newline after an
    # operator is legal POSIX). Lines starting with # are also stripped.
    # The catalog converts this raw cmd to an ordinary disabled rung on
    # clusters that do not enable it (echo wins over cmd).
    whisper:
      enabled: false
      quants:
        large-v3:
          cmd: |
            /bin/sh -c "
              mkdir -p /models/whisper &&
              { test -f /models/whisper/ggml-large-v3.bin ||
                { curl -fL --retry 3 --retry-all-errors -o /models/whisper/ggml-large-v3.bin.part https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3.bin &&
                  mv /models/whisper/ggml-large-v3.bin.part /models/whisper/ggml-large-v3.bin; }; } &&
              exec whisper-server --host 0.0.0.0 --port ${PORT} --inference-path /v1/audio/transcriptions -m /models/whisper/ggml-large-v3.bin
            "
          name: Whisper Large v3
          description: Audio transcription (whisper.cpp ggml-large-v3) for podcast processing
          checkEndpoint: /health
          ttl: 0
          capabilities: {in: [audio], out: [text]}

    # Qwen3.8-27B derivative line (gpu-ai daily drivers, 2026-10-18 plan
    # gpu-ai-uncensored-qwen36-coder-next era): uncensored/abliterated
    # builds around the same base model. They compose ${q38-*} macros that
    # only exist in services/gpu-ai values, so gpu keeps these rungs
    # default-disabled (catalog echoes - the echo path never resolves a
    # macro, so an undefined-macro load error cannot leak to that box).
    qwen38:
      enabled: false
      dispName: Qwen3.8 27B Uncensored
      quants:
        # Daily driver, MTP + embedded vision. aliases qwen3.8 /
        # local/qwen3.8-27b are consumer-pinned (OpenWebUI/HA routing).
        orca:
          hf: "orcarouter/Qwen3.8-27B-Uncensored-GGUF:Q6_K"
          spec: {type: draft-mtp, draft_n_max: 2}
          use: [q38-common, q38-sampling, q38-think]
          flags: |
            -c 262144
          description: "Qwen3.8 27B daily driver; draft-MTP speculative decoding, 256k ctx"
          aliases: [qwen3.8, local/qwen3.8-27b]
          capabilities: {in: [text, image], out: [text]}
          ttl: 300
        # Max quality / coding (embedded MTP).
        ara:
          hf: "cygnal/Qwen3.8-27B-heretic-ara-Q4_K_M-MTP-GGUF:Q6_K-MTP"
          spec: {type: draft-mtp, draft_n_max: 3}
          use: [q38-common, q38-sampling, q38-think]
          flags: |
            -c 262144
          name: Qwen3.8 27B heretic-ara (Q6_K-MTP)
          description: "Max-quality/coding build; draft-MTP n-max 3, 256k ctx"
          capabilities: {in: [text, image], out: [text]}
          ttl: 300
        # Public mirror + borrowed official MTP draft. The RENDERED cmd is
        # gpu-ai's raw-cmd escape hatch (multi-curl mmproj bootstrap must stay
        # one physical line - SanitizeCommand rule, see the whisper family
        # note); the fields below document the refs (precedence cmd >
        # composition keeps them inert where the override renders).
        rana:
          hf: "mradermacher/Qwen3.8-27B-RANA-abliterated-GGUF:Q6_K"
          draft: "ggml-org/Qwen3.8-27B-GGUF:mtp-Qwen3.8-27B-Q8_0.gguf"
          spec: {type: draft-mtp, draft_n_max: 2, draft_p_min: 0.75}
          use: [q38-common, q38-sampling, q38-think]
          flags: |
            -c 262144
          name: "Qwen3.8 27B RANA abliterated (Q6_K, MTP)"
          description: "mradermacher mirror; borrowed ggml-org official MTP draft (experimental), 256k ctx"
          ttl: 300
          capabilities: {in: [text, image], out: [text]}
        # Text-only; official GGUF has no MTP -> no --spec-type.
        humanlike:
          hf: "LessThanThreeAI/Qwen3.8-27B-Humanlike-Chat-GGUF:Q6_K"
          use: [q38-common, q38-sampling]
          flags: |
            -c 131072
            --reasoning on
            --reasoning-effort low
          disp: Qwen3.8 27B Humanlike-Chat 2.0
          description: "Text-only humanlike chat; low reasoning effort, 128k ctx"
          ttl: 300
        # Reference quality (~20.8Gi, ~4-6 tok/s). F16 ships as two shards
        # (-00001-of-00002 / -00002-of-00002); the :F16 suffix matches both
        # and llama.cpp downloads them together (same mechanism the chart's
        # :BF16 models already use). ttl 180 - evicts fast.
        orca-f16:
          hf: "orcarouter/Qwen3.8-27B-Uncensored-GGUF:F16"
          spec: {type: draft-mtp, draft_n_max: 2}
          use: [q38-common, q38-sampling, q38-think]
          flags: |
            -c 262144
          description: Reference F16 build; ttl 180 so it evicts fast
          capabilities: {in: [text, image], out: [text]}
          ttl: 180
        # cf-86 C04 (2026-10-30): 0bserverx heretic-style abliteration of the
        # 27B line - chosen by the measured ablation ranking (heretic-style
        # stays ~0.019-0.035 KLD from the original where huihui-style sits at
        # 0.204 with +8-10% perplexity, RESEARCH [S17][S18]). Distinct from
        # ara above: ara is the heretic-ara Q6_K-MTP build; this is the
        # 0bserverx uncensored rung in the Q4_K_M size class (~17 GB, dense
        # weight class the main-set trio math already budgets). MTP head is
        # EMBEDDED in the RVN-Q4_K_M-mtp.gguf single file (source gate live,
        # 16,998,720,736 B, flat ladder, ungated) - no draft: sidecar unlike
        # rana's borrowed ggml-org draft. mmproj ships flat beside the
        # quants, so the sibling search resolves it: vision declared.
        heretic:
          hf: "0bserverx/Qwen3.8-27B-Heretic-Abliterated-Uncensored-GGUF:Q4_K_M-mtp"
          spec: {type: draft-mtp, draft_n_max: 2}
          use: [q38-common, q38-sampling, q38-think]
          flags: |
            -c 262144
          disp: Qwen3.8 27B Heretic Uncensored
          size: 15.8 GiB
          descTail: "; {size} weights (embedded MTP), heretic-style uncensored abliteration in the Q4_K_M size class"
          capabilities: {in: [text, image], out: [text]}
          ttl: 300

    # Always-ready embedding sidecar (2026-10-16, gpu-ai): coexists with
    # the dense + MoE trio via the matrix main set there, so RAG
    # workloads never evict the chat models. Own llama-server in
    # --embeddings mode; trivial footprint (~0.7 GiB weights + ~0.1 GiB
    # KV at 8k ctx). The 8GiB gpu box keeps its tight single-model budget
    # - this rung stays default-disabled there.
    qwen3-embedding:
      enabled: false
      hfRepo: Qwen/Qwen3-Embedding-0.6B-GGUF
      dispName: Qwen3 Embedding 0.6B
      descBase: Qwen3-Embedding 0.6B text embeddings via /v1/embeddings
      descTail: "; always-ready sidecar"
      quants:
        0.6b:
          tag: Q8_0
          use: [threads]
          flags: |
            --embeddings
            -c 8192
            -np 2
            --cache-ram 0
            -ngl 99
          ttl: 0

    # Qwen3.6-35B-A3B uncensored variants (2026-10-18, STORM run c93fd3a):
    # abliterations ALONGSIDE the chart's base qwen3.6-35b-a3b entries -
    # they replace nothing. Both keep native MTP heads -> draft-mtp
    # speculative decoding (n-max 2 per the RDNA4 measurement; expect only
    # ~1.15-1.25x on fine-grained MoE - measure on first load). Placement:
    # experts-on-CPU (Variant B, VRAM unpinned) via ${q36-common}. mmproj
    # confirmed in both repos -> vision declared.
    qwen36:
      enabled: false
      use: [q36-common, q36-sampling, q38-think]
      spec: {'type': 'draft-mtp', 'draft_n_max': 2}
      flags: |
        -c 262144
      ttl: 300
      capabilities: {in: [text, image], out: [text]}
      quants:
        # Evidence pick: KL 0.0015, MMLU 83.71->83.39. q38-think reuse is
        # intentional: the reasoning flags are generic (--reasoning
        # on/--reasoning-preserve/--reasoning-effort medium).
        heretic:
          hf: "mradermacher/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-GGUF:Q4_K_M"
          disp: Qwen3.6 35B A3B heretic
          description: "llmfan46 heretic abliteration, native MTP preserved; mradermacher mirror; experts-on-CPU; 256k ctx"
        # Stable-org fallback: HF PRO, 155 models.
        huihui:
          hf: "huihui-ai/Huihui-Qwen3.6-35B-A3B-abliterated-MTP-GGUF:Q4_K"
          disp: Qwen3.6 35B A3B huihui abliterated
          description: "huihui-ai classic abliteration, dedicated MTP GGUF; experts-on-CPU; 256k ctx"

    # C04 big families (2026-10-23): Qwen 3.8 Flash Next - 180B-class MoE
    # (arch qwen4exp, 512 experts/top-10). gpu-ai-only BY ENABLEMENT
    # (DECISIONS 2026-10-22 + REPLAN CR2: everywhere else it is a catalog
    # echo - no consumers on the gpu box and orcarouter is gated:auto with
    # HF_TOKEN gpu-ai-side only).
    # C03 regime fix (ticket 2026-10-debug-flash-next-vulkan-oom): the
    # ladder left ${moe}'s placement regime. Under ${moe}'s --load-mode none
    # the -ot-offloaded experts land as Vulkan_Host = GTT-pinned RAM; C01
    # measured those tensors at 51.99 GiB (144 of 1224) against the node's
    # 62.54 GiB GTT budget - the q3 load died mid-load_tensors with kernel
    # amdgpu_vm_validate ENOMEM (EVIDENCE.md §1-3). The flags below re-cut
    # the same -ngl 99/-ot leg with --load-mode mmap: identical placement,
    # but file-backed CPU_Mapped pages - reclaimable, no GTT pin (the
    # maintainers' own workaround, RESEARCH §4.3). ${moe} itself stays
    # byte-frozen: the q35/q36/ornith/vl-30b rungs load fine pinned because
    # their demand stays under that budget (DECISIONS 2026-10-26 blast
    # radius). The leg is a literal, not a new macro: the golden-era parity
    # contract pins the rendered macro map exactly (test_c02_2 - even a
    # family-scoped addition fails it), and the roster contract accepts the
    # emitted -ot token. C04 fallback knob: mmap -> dio in this one line.
    # --fit off is behavioral: llama.cpp defaults fit ON and the catalog
    # never injected --fit (C01 EVIDENCE.md §8.1); off skips the dry-loads
    # that mis-account GTT-backed buffers (RESEARCH §4.2(c)).
    # -ot regex effectiveness re-verified at name level by C01; shared
    # experts (_shexp) stay GPU-resident as intended.
    # MTP: re-added through C04 gate 2 (DECISIONS two-gate path) only after
    # the no-MTP mmap regime loads proved journal-clean live and the sidecar
    # passed C01's post-#28901 hc-layout check (EVIDENCE.md §5, §13.2-4).
    # The draft-mtp runtime DeviceLost class (#27306) stays under watch at
    # the gate-2 consented load; the long-prefill class measured clean
    # without it (EVIDENCE.md §13.6).
    qwen3.8-flash-next:
      enabled: false
      hfRepo: unsloth/Qwen3.8-Flash-Next-GGUF
      tagCulture: unsloth-ud
      dispName: Qwen 3.8 Flash Next
      descBase: Qwen 3.8 Flash Next 180B-class MoE (512 experts/top-10)
      use: [threads, ctx-256k, flash-and-q8, q38-sampling, q38-think]
      draft: unsloth/Qwen3.8-Flash-Next-GGUF:mtp-Qwen3.8-Flash-Next-Q8_0
      spec: {'type': 'draft-mtp', 'draft_n_max': 2}
      flags: |
        -ngl 99
        -ot "\.ffn_.*_exps\.=CPU"
        --load-mode mmap
        --fit off
      capabilities: {in: [text, image], out: [text]}
      ttl: 300
      quants:
        q3:
          size: 83.8 GiB
          descTail: "; {size} weights, experts on CPU, 256k ctx; SOLO - largest resident this node has attempted (RESEARCH §4A regime test)"
        q4:
          size: 103.7 GiB
          descTail: "; {size} weights, experts on CPU, 256k ctx; tight against the ~125 GiB node budget - SOLO only"
        # Over the ~125 GiB gpu-ai node RAM budget outright (147.4 GiB).
        # Declared ENABLED anyway per the operator's accepted OOM-churn
        # decision 2026-10-22; intentionally NO matrix var (run-alone
        # semantics) and never preloaded - a request for it evicts everything,
        # and a failed load surfaces as an upstream error, not a co-residency
        # surprise.
        q5:
          size: 147.4 GiB
          descTail: "; {size} weights, experts on CPU; OVER the ~125 GiB node budget - enabled by accepted operator decision 2026-10-22, may OOM on load; run-alone (no matrix), never preloaded"
        # Same over-budget treatment as q5 (157.5 GiB): enabled by accepted
        # operator decision, NO matrix var, never preloaded.
        q6:
          size: 157.5 GiB
          descTail: "; {size} weights, experts on CPU; OVER the ~125 GiB node budget - enabled by accepted operator decision 2026-10-22, may OOM on load; run-alone (no matrix), never preloaded"

    # orcarouter Uncensored Flash Next (gated:auto repo - downloads need
    # HF_TOKEN, which only gpu-ai injects). C03: rides the unsloth family's
    # mmap regime (same literal placement leg + --fit off, see that block's
    # header for why a literal). Gate-2 (C04) restored the rung-level spec
    # per the two-gate path; the header is still not anonymously inspectable
    # (401 GatedRepo, evidence in the C04 record), so on a load that reports
    # no MTP tensors: probe embedded first (the proven qwen38-orca publisher
    # convention), else wire the standalone sidecar
    # draft: orcarouter/Qwen3.8-Flash-Next-Uncensored-GGUF:MTP-draft.gguf
    # (file verified present live - NOTE the UPPERCASE name: llama.cpp's
    # mtp- sidecar match is case-sensitive, TEST_SPEC 7(F)).
    qwen3.8-flash-next-orca:
      enabled: false
      dispName: Qwen 3.8 Flash Next Uncensored
      flags: |
        -ngl 99
        -ot "\.ffn_.*_exps\.=CPU"
        --load-mode mmap
        --fit off
      quants:
        q6:
          hf: "orcarouter/Qwen3.8-Flash-Next-Uncensored-GGUF:Q6_K"
          spec: {type: draft-mtp, draft_n_max: 2}
          use: [threads, ctx-256k, flash-and-q8, q38-sampling, q38-think]
          description: "orcarouter uncensored Flash Next (gated, HF_TOKEN), 156.1 GiB weights; experts on CPU (mmap placement), 256k ctx; over the ~125 GiB node budget like flash-next q6 - SOLO, never preloaded, may OOM; C04 gate-2 spec re-added, embedded-MTP expected per the qwen38-orca pattern (miss-path note above)"
          capabilities: {in: [text, image], out: [text]}
          ttl: 300

    # heretic-style coding ablation of Flash Next (cf-86 C03): trohrbaugh's
    # heretic-2 (custom Heretic fork) republished as static quants by
    # spiritfather. Why this ablation and not another: the measured ranking
    # (RESEARCH [S17][S18]) puts heretic-style ~0.019-0.035 KLD from the
    # original where huihui-style sits at 0.204 with +8-10% perplexity, and a
    # second orcarouter rung is already served as orca/ara. Ungated repo, so
    # unlike the orca family the download path needs no HF_TOKEN; gpu-ai-only
    # BY ENABLEMENT, everywhere else it is the catalog echo.
    # Rides the same mmap regime as the unsloth/orca families - see the
    # flash-next header for why the placement leg is a literal and not a
    # macro. 130.8 GiB of trunk weights is over the ~125 GiB node budget like
    # orca-q6, so SOLO in the matrix, never preloaded, may still OOM on load.
    # MTP, two-gate shape (the orca family's miss-path note applies the same
    # way): the pack ships the NextN head both as mtp/mtp-*-Q8_0.gguf and as a
    # pre-grafted <QUANT>/MTP/ shard pair. Source-gate measurement, do not
    # re-derive: llama.cpp find_best_model (common/download.cpp, mirrored by
    # tests/hf_check.py) takes the FIRST case-insensitive "Q4_K_M[.-]" hit in
    # the tree listing; the MTP pair sorts before the trunk, its basename
    # carries uppercase "MTP-" which the case-sensitive sidecar filter does
    # NOT skip, and the repo publishes only shards 1 and 6 of that 6-shard
    # split (its README has users clone trunk shards 2..5 into the -MTP-
    # pattern by hand). A load that dies on missing -MTP- shards is escaped by
    # pinning a trunk shard with --hf-file in the models layer.
    # The head also needs llama.cpp PR #27836, unmerged at the pinned image -
    # a stock build ignores head tensors, so treat spec decode as expected-off
    # until the image carries it.
    # mmproj ships too (mmproj/), hence vision declared - but llama.cpp's
    # sibling search only accepts a sidecar sharing the model file's directory,
    # and here projector and quants live in different folders: image input
    # needs the projector staged on-target, text is what the routing uses.
    qwen3.8-flash-next-heretic:
      enabled: false
      dispName: Qwen 3.8 Flash Next Heretic
      flags: |
        -ngl 99
        -ot "\.ffn_.*_exps\.=CPU"
        --load-mode mmap
        --fit off
      quants:
        q4:
          hf: "spiritfather/Qwen3.8-Flash-Next-heretic-2-GGUF:Q4_K_M"
          spec: {type: draft-mtp, draft_n_max: 2}
          use: [threads, ctx-256k, flash-and-q8, q38-sampling, q38-think]
          size: 130.8 GiB
          descTail: "; {size} weights, experts on CPU (mmap placement), 256k ctx; heretic-style abliteration (KLD ~0.02-0.035 from the original against 0.204 huihui-style); over the ~125 GiB node budget like orca-q6 - SOLO, never preloaded, may OOM"
          capabilities: {in: [text, image], out: [text]}
          ttl: 300


  # Concurrency matrix (replaces legacy groups routing).
  # One GPU model at a time; homecpu (CPU) may run alongside any GPU model.
  matrix:
    vars:
      q38q4: qwen3.8-27b-q4
      q38q6: qwen3.8-27b-q6
      q38q8: qwen3.8-27b-q8
      q38bf16: qwen3.8-27b-bf16
      q27bq6: qwen3.6-27b-q6
      q27bq8: qwen3.6-27b-q8
      q35q6: qwen3.6-35b-a3b-q6
      q35q8: qwen3.6-35b-a3b-q8
      q35bf16: qwen3.6-35b-a3b-bf16
      q35b1m: qwen3.6-35b-a3b-1m
      homegpu: home-3b-v3-gpu
      homecpu: home-3b-v3
      vl2bq8: qwen3-vl-2b-q8
      vl2bq4: qwen3-vl-2b-q4
      vl2bbf: qwen3-vl-2b-bf16
      vl4bq4: qwen3-vl-4b-q4
      vl4bq8: qwen3-vl-4b-q8
      vl4bbf: qwen3-vl-4b-bf16
      vl8bq4: qwen3-vl-8b-q4
      vl8bq8: qwen3-vl-8b-q8
      vl8bbf: qwen3-vl-8b-bf16
      vl30bq4: qwen3-vl-30b-a3b-q4
      vl30bq8: qwen3-vl-30b-a3b-q8
      vl30bbf: qwen3-vl-30b-a3b-bf16
      v4tq8: qwen3-vl-4b-thinking-q8
      v4tq4: qwen3-vl-4b-thinking-q4
      v4tbf: qwen3-vl-4b-thinking-bf16
      v30tq8: qwen3-vl-30b-a3b-thinking-q8
      v30tq4: qwen3-vl-30b-a3b-thinking-q4
      v30tbf: qwen3-vl-30b-a3b-thinking-bf16
      ornqbf: ornith-1.5-35b-a3b-bf16
      ornq8: ornith-1.5-35b-a3b-q8
      ornq6: ornith-1.5-35b-a3b-q6
      ornq5: ornith-1.5-35b-a3b-q5
      ornq4: ornith-1.5-35b-a3b-q4
      ornq3: ornith-1.5-35b-a3b-q3
      orniq2: ornith-1.5-35b-a3b-iq2xxs
      wsp: whisper-large-v3
      # Catalog rungs (CA2): one var per gpu-ai-local catalog rung so the
      # chart set stays closed on EVERY render (echo IDs exist in all
      # clusters - closure holds trivially). Names are the ones
      # services/gpu-ai set expressions reference; on the gpu box these
      # vars are unreferenced (the rungs echo), which v262 tolerates.
      # flash-next q5/q6 get NO var at all on purpose, on any cluster:
      # a model in no matrix set can only run alone and is never admitted
      # under a co-residency promise (declared ENABLED per the operator's
      # accepted OOM risk, DECISIONS 2026-10-22).
      emb06: qwen3-embedding-0.6b
      q38orca: qwen38-orca
      q38ara: qwen38-ara
      q38rana: qwen38-rana
      q38hum: qwen38-humanlike
      q38f16: qwen38-orca-f16
      # cf-86 C04: 0bserverx heretic Q4_K_M-MTP (~17 GB) - the dense class
      # sits inside the one-dense-resident assumption the main-set trio math
      # already budgets, so it joins the dense alternation below.
      q38her: qwen38-heretic
      # 1M context + visual variants (2026-10-13/15): the base q38q8/q35q8
      # IDs are the text-only caching versions on gpu-ai (--no-mmproj +
      # cache_reuse), these siblings keep the mmproj / 1M ctx.
      q38q81m: qwen3.8-27b-q8-1m
      q38q8v: qwen3.8-27b-q8-visual
      q35q8v: qwen3.6-35b-a3b-q8-visual
      # Uncensored MoE additions (2026-10-18): join gpu-ai's main MoE
      # alternation.
      q36her: qwen36-heretic
      q36hui: qwen36-huihui
      # C04 big families (2026-10-23) - all solo-set on gpu-ai.
      fnq3: qwen3.8-flash-next-q3
      fnq4: qwen3.8-flash-next-q4
      fnorca: qwen3.8-flash-next-orca-q6
      # cf-86 C03: heretic-2 Q4_K_M ablation, same solo weight class (130.8
      # GiB trunk) as the other flash-next rungs - solo, never preloaded.
      fnher: qwen3.8-flash-next-heretic-q4
      o122q3: ornith-1.5-122b-q3
      o122q4: ornith-1.5-122b-q4
      o122q5: ornith-1.5-122b-q5
      o122q6: ornith-1.5-122b-q6
      # q38cyber: qwen38-cyber      # PHASE 2 (vars must not reference undefined models)
    sets:
      # C04 (2026-10-23): the Ornith 35B ladder joins the MoE alternation on
      # both clusters - one GPU model at a time still holds (gpu-ai narrows
      # this set with its own main/solo definitions; here it is the chart
      # default the gpu box rides). ornqbf is routable but fail-fast on gpu
      # (services/gpu disabled override) - matrix membership of a disabled
      # echo is the established pattern on that box.
      main: "(q38q4 | q38q6 | q38q8 | q38bf16 | q27bq6 | q27bq8 | q38her | q35q6 | q35q8 | q35bf16 | q35b1m | homegpu | vl2bq8 | vl2bq4 | vl2bbf | vl4bq4 | vl4bq8 | vl4bbf | vl8bq4 | vl8bq8 | vl8bbf | vl30bq4 | vl30bq8 | vl30bbf | v4tq8 | v4tq4 | v4tbf | v30tq8 | v30tq4 | v30tbf | orniq2 | ornq3 | ornq4 | ornq5 | ornq6 | ornq8 | ornqbf | wsp) & homecpu"

app-template:
  global:
    nameOverride: &chartName llama-swap

  controllers:
    llama-swap:
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        main:
          image:
            # unified pipeline (vs the old vNNN-vulkan-bNNNN lineage: pre-
            # #1071 Dockerfile, llama-server in /app, NO whisper.cpp,
            # entrypoint /app/llama-swap - verified from the
            # v262-vulkan-b11515 image history, 2026-10-17). whisper-server/
            # sd-server/llama-server land in /usr/local/bin, entrypoint
            # run.sh; the whisper bootstrap below dies without
            # /usr/local/bin/whisper-server ("exec: whisper-server: not
            # found" on the old lineage).
            #
            # unified-vulkan-266 = the llama-swap v266 release image.
            # Re-pinned 2026-10-25: unified-vulkan-262 was REBUILT IN PLACE
            # upstream - its digest moved to
            # sha256:038bb09388681895e9d51e5cf02aaa38178cd6571273cd73b7df2712c416b48d
            # and the rebuilt content carried the macros.go ${PORT}-proxy
            # check that crash-looped the gpu box. The old "pinned to the
            # release-versioned tag so the digest is stable" claim is
            # falsified: trust the recorded digest + re-verification, never
            # a tag's reputation. This tag's manifest digest:
            # sha256:0cc42f1024b54be3de100ae7a7a2730047ca5c27cf7a354f8a9f63142f00c045
            # (stable across two pulls, 2026-10-25). Freshness is
            # renovate-managed (the packageRule for this dep in renovate.json
            # scopes versioning to the unified-vulkan-<N> family the built-in
            # helm-values manager's docker versioning can't parse), so the
            # next release tag proposes a PR instead of drifting silently.
            # Its llama.cpp is b11810 (e3797b18,
            # 2026-10-22, per the build args in the image config blob),
            # audited 2026-10-25 against ggml-org/llama.cpp@b11810 for
            # every flag used below (-ot, --load-mode, --cache-reuse,
            # --cache-ram, --n-cpu-moe, --no-mmproj, --flash-attn, --jinja,
            # -hfd, --spec-type, ...).
            repository: ghcr.io/mostlygeek/llama-swap
            # renovate: datasource=docker depName=ghcr.io/mostlygeek/llama-swap
            tag: unified-vulkan-266
          env:
            TZ: Etc/UTC
            # Cache downloaded models (-hf flag) on the models PVC
            LLAMA_CACHE: /models
            # run.sh (unified entrypoint) maps LLAMA_SWAP_* env to llama-swap
            # flags. Default config path is the image's bundled example at
            # /etc/llama-swap/config/config.yaml — point it at OUR rendered
            # config. WATCH_CONFIG defaults to true in run.sh; spelled out
            # here because it only pays off with the directory mount below
            # (subPath mounts never receive ConfigMap updates).
            LLAMA_SWAP_CONFIG: /app/config/config.yaml
            LLAMA_SWAP_WATCH_CONFIG: "true"
            # NOTE: HF_TOKEN is intentionally NOT set here. Gated -hf repos
            # need a token, but app-template's schema forbids optional
            # secretKeyRefs and clusters without bitwardenIds.hf-token (gpu)
            # have no hf-token secret. gpu-ai injects HF_TOKEN into this
            # container via its service values (secret is guaranteed there).
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
          resources:
            requests:
              cpu: 1000m
              memory: 4Gi
            limits:
              amd.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

        # Operator provisioning sidecar (LoRA conversion, artifact staging).
        # Disabled by default; gpu-ai enables it. No GPU, no port. Scripts are
        # mounted read-only from the llama-swap-tools ConfigMap at /app/tools;
        # /models arrives via the models persistence globalMounts.
        tools:
          enabled: false
          image:
            repository: python
            tag: 3.15.1-slim-bookworm
          command: ["sleep", "infinity"]
          env:
            TZ: Etc/UTC
          probes:
            liveness: {enabled: false}
            readiness: {enabled: false}
            startup: {enabled: false}
          resources:
            requests: {cpu: 10m, memory: 128Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

    # strata — the gpu-ai internal Strata engine pod (cf-77): the SECOND
    # controller of this Application, default OFF. Seven data flags flip
    # TOGETHER from the gpu-ai service values — this one, service.strata and
    # the five strata-* persistence entries below. A partial set fails the
    # render: advancedMounts onto a DISABLED controller is app-template's
    # canonical hard error, and the reverse gap (controller ON, persistence
    # OFF) is guarded in templates/configmap-strata.yaml. Strata's public
    # exposure happens THROUGH the gpu-ai llama-swap `peers:` route, never
    # from here: the deliberate trio-rule deviation — no ingress.subdomains
    # entry — is the operator's Q4 ruling (DECISIONS 2026-10-27; a host of
    # its own would publish the pod the peers hop exists to keep private).
    strata:
      enabled: false
      type: deployment
      # A ~47 GiB pinned arena must never ride a RollingUpdate overlap —
      # two pods would double-pin the node (#2257 class; the repo lived it
      # 2026-10-18/19, DECISIONS).
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      # Pod-shape keys ride per-controller: the tree-global pod defaults
      # would also re-shape the main pod, breaking the default-OFF
      # byte-parity contract (DECISIONS 2026-10-28, Q-C ruling).
      pod:
        # Invariant: 420 > unloadTimeout(180) + --shutdown-timeout drain(30
        # default, 0..300) + slack (RESEARCH §3 amendment). The kubelet
        # SIGKILL window must beat a clean arena stop or it leaves a
        # half-pinned arena.
        terminationGracePeriodSeconds: 420
        securityContext:
          # DOCKER.md runtime contract: group video+render on the device
          # nodes. Numeric GIDs are distro-local — the C04 runbook resolves
          # them on-target and sets this key (deep-merged via the service
          # block).
          supplementalGroups: []
          # ROCm/HIP needs the full ioctl surface. Privileged already skips
          # the default profile, so this key pins the Unconfined contract
          # explicitly — the promise survives the documented-not-built
          # fallback (naming GPU plugin + IPC_LOCK/SYS_RESOURCE, non-
          # privileged).
          seccompProfile:
            type: Unconfined
      # Weight staging as a first-class citizen: upstream provisions models
      # headlessly ONLY through the source-checkout installer — the packaged
      # CLI's `install` verb is a shim for the checkout's setup.py ("this
      # folder has no installer", first deploy 2026-10-28) and docs/
      # LLAMA_SWAP.md says the integration "needs a source checkout, not the
      # desktop installer". So the image embeds the pinned checkout
      # (containers/strata Dockerfile, strata-src stage) and the staging
      # driver copies it onto the claim and runs the documented
      # `./setup.sh --family qwen --model <id> --no-start --yes`: setup owns
      # the whole artifact story (shards, tokenizer, pack, draft data, its
      # own engine fetch) and writes strata-<model>.json run configs beside
      # the checkout — hence the checkout lives under /models/strata, so
      # every output persists on the shared claim. --no-start keeps the RAM
      # law untouched (setup never serves); markers make it idempotent.
      #
      # WHERE that staging logic lives (cf-86 C07): all of it — the checkout
      # copy, the per-token setup.sh loop, the manual packs for the rungs the
      # pinned catalog has no entry for, the byte-pinned resumable downloads
      # and the idempotency markers — is
      # containers/strata/files/{fetch_models.sh,hf_fetch.py,byte_pins.env},
      # baked to /opt/strata/bin/ by the image build and verified there
      # (`sh -n`, `py_compile`, `test -x`/`-f`). This block states intent and
      # the env contract only; a ~330-line heredoc here was logic no build
      # ever parsed and no review could run.
      #
      # THE boot guard is the exec-form command: a pod replaced under this
      # chart against an image that predates the bake fails at container
      # START ("no such file"), with zero script executed and the claim's
      # markers untouched — loud, never half-provisioned. pullPolicy Always
      # plus restart backoff re-pull, so the attempt after docker-build's
      # :main push completes re-enters and finishes: one commit carrying
      # chart + image is bounded and self-healing by design. A chart-side
      # "[ -f new ] && new || old" fallback is the rejected alternative —
      # preferring stale logic at boot is exactly what the bake+verify law
      # forbids. Merge timing (or holding the sync) is the operator's call.
      initContainers:
        model-fetch:
          image:
            repository: ghcr.io/ownyourio/strata
            # Same rolling tag + pullPolicy as the main container of this
            # pod: the boot guard above rests on Always re-pulling, so the
            # next attempt after the CI build pushes :main is the one that
            # runs the baked driver. :v<run> pins exist for this image now;
            # switching to one is a Renovate chores decision, never a
            # hand-bump here (repo law).
            tag: main
            pullPolicy: Always
          # The baked driver: containers/strata/files/fetch_models.sh lands
          # at /opt/strata/bin/ (mode 0755). Exec form, one element, no
          # /bin/sh -c wrapper — a wrapper starts fine and quietly costs the
          # boot guard half its loudness. The driver's own header comment
          # carries the quant/marker/env contract it implements.
          command:
            - /opt/strata/bin/fetch_models.sh
          env:
            # Quant set, comma-separated: "q3" today. Only q3=IQ3_S carries
            # a built-in mapping (qwen family); further tokens need
            # STRATA_MODEL_Qx=[family/]model — the qwen family caps at the
            # four ISTA quants (Q2_0/IQ2_XS/IQ3_XXS/IQ3_S), so q4/q5 come
            # from the unsloth family (UD-Q4_K_XL ~104 GB incl. the shared
            # 28.8 GB n-gram shard; UD-Q5_K_XL ~147 GB — past this node's
            # arena model, see the runbook budget table). Loud fail for
            # unmapped tokens; markers keep each quant idempotent. Override
            # deep-merges from the service block:
            # app-template.controllers.strata.initContainers.model-fetch.env.
            STRATA_QUANTS: "q3"
          resources:
            # limits.memory 1Gi OOM-KILLED the engine compile (exit 137, 8
            # restarts 2026-10-29: step 4 runs `ninja -j 16` clang jobs the
            # moment configure completes — the 1Gi cap was sized for pip and
            # downloads, not for a compile). 32Gi bounds the parallel clang
            # peak inside a cgroup so a runaway build can never eat into the
            # llama.cpp trio; 2Gi request keeps pod scheduling honest without
            # stacking on the main container's 96Gi reservation.
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              memory: 32Gi
          securityContext:
            # HIP GPU detection (setup.sh --backend hip) needs the same device
            # view as the main container, so the earlier download-only
            # non-privileged shape is lifted: privileged + /dev/kfd +
            # /dev/dri here mirrors the pod's already-accepted device
            # deviation (DECISIONS 2026-10-27). No serve, no pins —
            # --no-start keeps the RAM law out of init's way.
            privileged: true
      containers:
        strata:
          image:
            repository: ghcr.io/ownyourio/strata
            # Deliberate rolling-tag posture, not a pending chore: :main +
            # pullPolicy Always is law — the boot guard's self-heal window
            # rests on the Always re-pull after CI's :main push.
            # test_strata_thin_init.py's rolling-pair arm enforces the pair
            # (init + main). :v<run> builds exist for this image; adopting
            # one is a Renovate chores decision, never a hand-bump here
            # (repo law).
            tag: main
            pullPolicy: Always
          # C01 interface freeze (containers/strata README): PID 1 is the
          # harvested llama-swap binary; args override the image CMD, which
          # documents the same default config path.
          args:
            - "-config"
            - "/app/config/config.yaml"
          # No container env at all: the keyless ruling (C-A, DECISIONS
          # 2026-10-28) deleted this pod's whole secret chain rather than
          # gating it — do not re-add a secretKeyRef or env passthrough.
          # The engine's key posture ships in the profiles below (api_key
          # "none").
          probes:
            # Every probe hits the supervisor's own /health — a kubelet
            # probe at a model/upstream endpoint triggers loads (repo
            # lesson) and peers/`/upstream` passthrough is not probe-safe
            # (RESEARCH §3 caveat). llama-swap answers /health itself, so
            # probes never flap mid-swap (DECISIONS probes ruling).
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                # 150x10s absorbs the cold arena pin in parallel with
                # healthCheckTimeout (plan Goal, O2 pairing).
                periodSeconds: 10
                failureThreshold: 150
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
          resources:
            # 128 GB node (R3). OOM post-mortem 2026-10-29: the setup-chosen
            # `--ple-io ram` (+28.8 GiB resident) atop a ~47 GiB arena with
            # the llama.cpp trio warm blew node RAM and the kernel harvested
            # cluster system pods. Caps bound the blast radius: the container
            # cgroup stops strata (kernel victims stay inside THIS cgroup)
            # and the engine's --memory-limit-mib (PR #1601 pairing: a
            # cgroup limit must be declared to the engine) sizes arena +
            # conversation cache + KV inside the rung's declared cap —
            # supervisor and venv headroom fill the rest of the cgroup.
            # Coexistence is time-shared (ttl
            # below), not simultaneous residency.
            requests:
              cpu: 8
              memory: 64Gi
            # The original 96Gi ceiling = ~50 GiB IQ3_S arena + 32 GiB conversation
            # cache + ~13 GiB worst-case 4-slot KV + engine/supervisor headroom
            # (owner budget ruling 2026-10-29). Node is 125 GiB: a fully
            # warm strata pod leaves the llama.cpp trio NO real headroom —
            # the ttl:3600 time-share and the cgroup cap are what keep the
            # next collision inside this container instead of the whole
            # node. The direction of the lockstep matters: a rung's declared
            # cap may never exceed this number, but raising THIS number does
            # not raise any cap — each rung declares its own (U14 grew the
            # ceiling to 116Gi and moved only the flagship, whose terms never
            # fitted 92160; q4 and orca kept their numbers).
            # cf-86 C06 raised the ceiling to 100Gi for the UD-Q4_K_XL rung;
            # the 2026-11-01 first boot moved it to 108Gi with the pair's conv
            # term (8192 was only affordable because disk session files were to
            # absorb the big parks, and the HIP engine compiled that feature
            # out), and the SAME DAY's U14 ruling raised it again to 116Gi so
            # the flagship's own term-sum fits inside what it declares — the
            # primary had been declaring 90 GiB against terms of ~91.8 GiB
            # from 2026-10-29 until that raise (see its profile note).
            # Declared caps are
            # PER-RUNG inside this one cgroup: 110592 primary, 103680 q4
            # (71.7 pinned experts + 16 conv + ~13 KV ≈ 100.7, the owner-ruled
            # half-restore), 92160 orca (U9.2 zero-growth law) — each leg stays
            # ≥ its terms and ≤ this limit, which is the #1601 pairing.
            # Why 110Gi (owner ruling 2026-11-10, supersedes U14's 116Gi): the
            # container must die BEFORE the node. 110Gi + the measured node
            # floor ~7-8 GiB (all non-strata workloads ~7.3 GiB on the
            # 2026-11-01 Grafana reads, kube-system peaking 0.31 GiB over 7 d;
            # OS + k3s + containerd + kernel ≈ 2-3 GiB of it) + a transient
            # margin fits the 125.1 GiB allocatable — 116Gi plus that floor did
            # not. On 2026-11-10 two concurrent ~99k-token prefills on the q4
            # arena stacked ~25 GiB of parking/heap transient on its ~90-99 GiB
            # steady working set; node MemAvailable bottomed at 0.7 GiB; the
            # kernel harvested strata 11 times (four node-wide SystemOOM
            # events) and took metrics-server, argocd, alloy and toolhive
            # with it. Every declared per-rung cap stays inside: 110592
            # primary (= 108 GiB), 103680 q4 (= 101.25 GiB), 92160 orca
            # (= 90 GiB). Two standing
            # caveats the operator owns: swap is 2.0 GiB with 1.7 free, so this
            # cgroup is the ONLY containment; and requests stay 64Gi, so the
            # scheduler can still pack a neighbour here — the time-share
            # discipline (ttl 3600 + the matrix alternation) is what keeps the
            # big llama.cpp rungs off a warm arena, not this number. Observed
            # worst steady set stays the 99.2 GiB of the 288 GB provisioning
            # boot (then inside the 108Gi cap).
            limits:
              memory: 110Gi
          securityContext:
            # DECISIONS 2026-10-27 device-access ruling: privileged +
            # hostPath /dev/kfd + /dev/dri, NOT the amd-gpu device plugin —
            # the plugin advertises by count and cannot name gfx1201 vs the
            # 8060S on this mixed APU+dGPU node; chip hiding happens inside
            # via rocrVisibleDevices. Accepted deviation from the repo
            # drop-ALL standard, confined to this pod (the llama.cpp pod
            # keeps its unprivileged shape untouched). Documented-not-built
            # fallback once a naming-capable plugin exists: amd.com/gpu +
            # IPC_LOCK/SYS_RESOURCE + non-privileged.
            privileged: true

  service:
    llama-swap:
      controller: *chartName
      ports:
        http:
          port: 8080
    strata:
      enabled: false
      controller: strata
      ports:
        http:
          port: 8080
      # ClusterIP only, and NO ingress entry beside it or in the service
      # values: Q4 internal-only ruling, the deliberate trio deviation
      # (DECISIONS rework). The gpu-ai peers proxy URL is this controller's
      # rendered Service name — app-template fullname + controller key,
      # e.g. gpu-ai-llama-swap-strata — read it from NOTES, and keep the
      # no-/v1-suffix shape (the path appends verbatim, RESEARCH §3).

  persistence:
    config:
      # Mount the ConfigMap as a DIRECTORY (no subPath): subPath mounts never
      # receive ConfigMap updates, which silently disabled llama-swap's
      # -watch-config hot reload (the 2026-10-17 whisper incident needed a
      # manual pod restart for exactly this reason). With the directory mount
      # kubelet syncs ConfigMap changes (~1 min) and run.sh's default
      # -watch-config reloads llama-swap in place; the LLAMA_SWAP_CONFIG env
      # above points at the file inside the directory.
      # advancedMounts, not globalMounts: a globalMount attaches to EVERY
      # enabled controller, and the strata container owns its own
      # /app/config (strata-config below) — a collision. This enumerates
      # exactly the containers globalMounts reached before (main, tools),
      # so every per-container mount set renders byte-identical to the
      # pre-consolidation tree (mount-exactness law, DECISIONS 2026-10-28).
      type: configMap
      name: llama-swap-config
      advancedMounts:
        llama-swap:
          main:
            - path: /app/config
          tools:
            - path: /app/config
    tools:
      # advancedMounts for the same collision reason as `config` above —
      # enumerating the old globalMount consumers exactly: main keeps its
      # read-only /app/tools mount, the tools sidecar keeps its own.
      type: configMap
      name: llama-swap-tools
      advancedMounts:
        llama-swap:
          main:
            - path: /app/tools
              readOnly: true
          tools:
            - path: /app/tools
              readOnly: true
    models:
      # STAYS globalMounts: strata legitimately shares /models (Q3 ruling —
      # the EXISTING llama-swap claim mounted whole, this chart creates no
      # second PVC; tests pin that). RWO multi-pod same-node mount on
      # local-path is the single-node-cluster pattern; on-target verification
      # rides C04 along with the capacity check.
      existingClaim: *chartName
      globalMounts:
        - path: /models
    # --- strata controller volumes (default OFF; flip with the other six
    # strata flags — advancedMounts naming a DISABLED controller fails the
    # render, so these carry their own enabled gates) ---
    strata-config:
      # Mounted as a DIRECTORY, never subPath: subPath mounts do not receive
      # ConfigMap updates, which silently killed hot reload in the
      # 2026-10-17 llama-swap incident (repo lesson).
      enabled: false
      type: configMap
      name: strata-config
      advancedMounts:
        strata:
          strata:
            - path: /app/config
    strata-profile:
      # Directory for the same hot-reload reason; the cmd's --profile path
      # is inside here (strata-iq3_s.json).
      enabled: false
      type: configMap
      name: strata-profile
      advancedMounts:
        strata:
          strata:
            - path: /profile
    strata-kfd:
      enabled: false
      type: hostPath
      hostPath: /dev/kfd
      hostPathType: CharDevice
      advancedMounts:
        strata:
          strata:
            - path: /dev/kfd
          # model-fetch probes HIP hardware during setup (see init
          # container comment) — the card must be visible to it too.
          model-fetch:
            - path: /dev/kfd
    strata-dri:
      enabled: false
      type: hostPath
      hostPath: /dev/dri
      hostPathType: Directory
      advancedMounts:
        strata:
          strata:
            - path: /dev/dri
          model-fetch:
            - path: /dev/dri
    strata-shm:
      # DOCKER.md's --shm-size 2g equivalent (C01 README runtime contract).
      enabled: false
      type: emptyDir
      medium: Memory
      sizeLimit: 2Gi
      advancedMounts:
        strata:
          strata:
            - path: /dev/shm

# ---------------------------------------------------------------------------
# strata — workload DATA for the second app-template controller above. The
# gated templates (configmap-strata.yaml, configmap-strata-profile.yaml)
# render this subtree ONLY while the strata flags stay enabled; the inert-
# default render of the whole container changes nothing (byte-parity gate).
# The gpu-ai internal Strata engine pod (cf-77): one privileged pod whose
# llama-swap supervisor (from the containers/strata image,
# ghcr.io/ownyourio/strata) owns `strata serve` as a supervised child; public
# exposure happens THROUGH the existing gpu-ai llama-swap `peers:` route,
# never from here (Q4 internal-only ruling).
# ---------------------------------------------------------------------------
strata:
  # ROCr device index for the engine (PR #3636 hid the 8060S APU with 0).
  # Injected into every model's env at render; the on-target rocminfo gate
  # (C04 runbook) retargets it with a values edit, not a template edit.
  rocrVisibleDevices: "0"

  # Per-model ROCr overrides; a model absent here inherits the value above.
  # The strix fallback must name the OTHER silicon: the primary's index
  # deliberately hides the 8060S, so reusing that value would leave the
  # gfx1151 model with no device to bind. "1" mirrors PR #3636's
  # enumeration (dGPU first, chip second) — VERIFY at the same rocminfo
  # gate; on a chip-only node (the fallback's main scenario) the chip is 0,
  # so set "0" or "" to inherit there.
  # New R9700 rungs (the orca Uncensored arena, the Q4 rung) get NO
  # entry here on purpose: they target the same dGPU as the primary and
  # inherit the global index — per-rung entries would multiply the
  # retargeting surface at the rocminfo gate without naming a difference.
  rocrVisibleDevicesByModel:
    qwen3.8-flash-next-strata-strix: "1"

  # -------------------------------------------------------------------------
  # The INNER llama-swap declared config. configmap-strata.yaml renders this
  # subtree to /app/config/config.yaml; keys prefixed `engineProfile` are
  # chart-side layers (run-config JSON bodies consumed by the profile
  # ConfigMap, not llama-swap keys) and are stripped there. The result must
  # validate against the deployed supervisor's v266-pinned schema (the exact
  # tag the image was harvested from — main-only keys false-fail, RESEARCH
  # "Implications/Validation").
  # -------------------------------------------------------------------------
  config:
    # 1800 s absorbs the cold arena pin: 46.84 GiB at the PR's measured
    # 17.3 GiB/s plus engine init (RESEARCH §3/O2; llama-swap restarts the
    # countdown whenever /health reports new progress, so this bounds the
    # worst case, not the steady state).
    healthCheckTimeout: 1800

    # ${PORT} base — pod-local, mirrors the outer instance's numbering habit;
    # nothing else binds these ports (the engine stays on 127.0.0.1).
    startPort: 10001

    # Q2 lazy posture: nothing ever unloads on a timer.
    globalTTL: 0

    # Empty = default-allow. The keyless ruling (C-A) deleted the whole
    # secret chain — ExternalSecret, per-container env, per-model
    # passthrough — rather than gating it, so no landmine or dead guard
    # remains. The unauthenticated posture mirrors the OUTER llama-swap's
    # own apiKeys: [] and is cluster-internal only: the sanctioned route is
    # the peers hop and the engine binds loopback.
    apiKeys: []

    # Upstream engine lines (the pin progress log, the /health JSON) must
    # reach pod stdout — they are the C04 --plan-gate and unload-timing
    # evidence trail.
    logToStdout: "both"

    models:
      qwen3.8-flash-next-strata:
        name: Qwen3.8-Flash-Next IQ3_S (R9700 arena)
        description: Strata engine, experts pinned in a page-locked RAM arena on the R9700, capped at 110592 MiB engine-side inside the 110Gi pod cgroup with a 32 GiB conversation-cache budget over 16 slots; first request pays the cold pin (minutes), then residency is time-shared — the arena unloads after 1h idle so the llama.cpp trio gets its RAM back (set ttl 0 to pin forever).
        # serve takes only --profile/--host/--port (RESEARCH §2) — every
        # tuning knob lives in the run-config JSON below. `exec` hands the
        # process to llama-swap for stop/unload, and the ulimit wrapper is
        # load-bearing: no 0.2.x release self-raises nofile (PR #2399 open)
        # and HIP expert memory creation fails at ~1k FDs (RESEARCH §2,
        # contradiction #5). ${PORT} with no hardcoded port keeps this
        # SanitizeCommand-safe and needs no proxy key.
        cmd: bash -c 'ulimit -n 524288; exec /opt/strata/terminal/bin/strata serve --profile /profile/strata-iq3_s.json --host 127.0.0.1 --port ${PORT}'
        # ttl 3600 = unload after 1h idle (tri-state: 0 = never, -1 =
        # globalTTL). The 2026-10-29 OOM post-mortem settled the residency
        # policy: with the arena capped but uncapped-by-default llama.cpp
        # models wanting the same 125 GB, PERMANENT residency (the run-1
        # Q2 posture) turns every cold strata load into a coin-flip for the
        # trio. Time-sharing hands the budgeted ~50-90 GiB back after quiet;
        # the cost is re-paying the minutes-long cold pin after an idle hour.
        # Set ttl: 0 to pin forever (dedicated-window mode); manual escape
        # remains POST /api/models/unload/qwen3.8-flash-next-strata.
        ttl: 3600
        # llama-swap force-kills at unloadTimeout (global default 10 s) long
        # before the 420 s pod grace matters — a ~47 GiB page-locked unload
        # needs this raised window (RESEARCH §3, contradiction #4; timed
        # unload verification is a C04 on-target gate). terminationGrace-
        # PeriodSeconds(420) > this + the engine's 30 s drain is the
        # invariant — keep both values' pairing true when editing either.
        unloadTimeout: 180
        # Strata's /health answers only once the model is loaded and needs no
        # key (RESEARCH §3) — the upstream doc's integration shape.
        checkEndpoint: /health
        # PR #3636 one-at-a-time arm's switches (RESEARCH §5; the strix
        # eight-set is a superset and stays C05's) plus the chart-injected
        # ROCR entry. STRATA_KV_GROW stays off per the R4 ruling.
        # Strata's DNS-rebinding guard sees the peers-forwarded Service
        # Host (llama-swap passes the client Host through; docs/
        # LLAMA_SWAP.md "Host is not allowed") — with the api_key
        # deliberately absent (C-A), the allow-list is the documented
        # other answer. The engine ignores ports, so the Service-DNS
        # shapes cover in-cluster callers; localhost always passes.
        env:
          # Engine-side request accounting (T0, owner ruling 2026-11-01): one
          # line per finished request — `request prompt P cached C output O
          # prompt_read R ms total S ms prefill X tok/s decode Y tok/s`. The
          # progress chatter everyone read as a rate ("reading the prompt:
          # 63,456 of 63,461 tokens, 10 s so far") counts a REUSED prefix in
          # its position and times from request admission, so it is not a
          # measurement; `prefill` here is fresh tokens over engine time, the
          # same definition the published R9700 numbers use. Logging only —
          # changes no serving behavior.
          - "STRATA_REQUEST_LINES=1"
          # Shared by all five arena envs: glibc retains evicted conversation-
          # cache parks in the heap, so the engine's RAM gate refuses forever
          # (Strata #5697, open); this makes large allocations mmap-backed and
          # returnable on free.
          - "MALLOC_MMAP_THRESHOLD_=1048576"
          - "STRATA_PF_FUSED=1"
          - "STRATA_PF_GEMM=1"
          - "STRATA_PA_FAST=1"
          - "STRATA_HIP_WMMA=1"
          - "STRATA_SELECT_WMMA=1"
          - "STRATA_PREFILL_CPU_SHARE=auto"
          - "STRATA_ALLOWED_HOSTS=gpu-ai-llama-swap-strata,gpu-ai-llama-swap-strata.default.svc,gpu-ai-llama-swap-strata.default.svc.cluster.local"
        # Lazy by ruling (Q2 + RESEARCH §3: preloading matrix alternatives
        # swap-loads each other — C05's (p|s) case). Preload flip, only if
        # on-target ever wants a boot-pinned arena:
        # hooks:
        #   on_startup:
        #     preload: [qwen3.8-flash-next-strata]

      qwen3.8-flash-next-strata-strix:
        name: Qwen3.8-Flash-Next IQ3_S (Strix Halo 8060S fallback)
        description: Strata engine, gfx1151 build on the 8060S iGPU; arena lives in shared LPDDR5X, manual/secondary use, unloads on idle (see the chart README, Strix-alone fallback).
        # Same serve wrapper as the primary (C01 interface freeze) — the
        # gfx1151-vs-gfx1201 switch is the exe key inside the second
        # profile, never the image or this flag list.
        cmd: bash -c 'ulimit -n 524288; exec /opt/strata/terminal/bin/strata serve --profile /profile/strata-strix-iq3_s.json --host 127.0.0.1 --port ${PORT}'
        # ttl > 0 = idle SECONDS before unload (the tri-state trap: 0 is
        # never, not immediately). Secondary use should hand the LPDDR5X
        # arena back when quiet instead of holding it like the primary's
        # pinned residency — 1800 is the operator-toggle default, set 0 to
        # pin forever once warm.
        ttl: 1800
        # Page-locked in LPDDR5X just like the primary's VRAM arena — the
        # same force-kill window logic applies (RESEARCH contradictions #4).
        unloadTimeout: 180
        checkEndpoint: /health
        # The §5 eight-set rides in the run-config profile below instead:
        # those literals are upstream-recipe constants, not values-gated,
        # so their single source is engineProfileStrix.env. No SECRETS at
        # this layer — the keyless ruling (C-A) removed the last entry that
        # lived here; the absence is the posture, not an omission. The one
        # non-secret this layer carries is the peers-forwarded Host
        # allow-list (same DNS-rebinding reason as the primary).
        env:
          - "STRATA_REQUEST_LINES=1"
          - "MALLOC_MMAP_THRESHOLD_=1048576"
          - "STRATA_ALLOWED_HOSTS=gpu-ai-llama-swap-strata,gpu-ai-llama-swap-strata.default.svc,gpu-ai-llama-swap-strata.default.svc.cluster.local"
        # Rounds differ from the primary's output: the §5 switches are
        # KL-gated (STRIX_HALO §5 "changes bits") — never A/B the two
        # profiles token-for-token, compare on the bench suite instead.

      qwen3.8-flash-next-strata-orca:
        name: Qwen3.8-Flash-Next Uncensored IQ4_XS (R9700 arena)
        description: Strata engine on the gated orcarouter Uncensored pack at IQ4_XS via the ORCA.md-shape manual pack — plain IQ4_XS experts are kernel-supported on the q38 path (unsloth's UD-IQ4_XS is catalog-served on AMD since engine 0.1.31/0.1.32), so the U9.2 ladder shift from IQ3_XXS changed rung, not flags; 57.7 GiB pinned-expert arena inside the 90 GiB engine cap with the conversation-cache trimmed to 8 GiB; first request pays the cold pin (minutes), then residency is time-shared — the arena unloads after 1h idle so the llama.cpp trio gets its RAM back.
        # Same serve wrapper as the primary (C01 interface freeze); the pack
        # switch lives entirely in the profile file.
        cmd: bash -c 'ulimit -n 524288; exec /opt/strata/terminal/bin/strata serve --profile /profile/strata-orca-iq4_xs.json --host 127.0.0.1 --port ${PORT}'
        # Residency contract copied from the primary verbatim (same law as
        # the q4 rung): ttl/unloadTimeout/checkEndpoint equality
        # keeps the time-share discipline and the 420 s grace invariant
        # rung-wide.
        ttl: 3600
        unloadTimeout: 180
        checkEndpoint: /health
        # Engine defaults like the other R9700 rungs: no PR/strix switch
        # set (silicon/recipe-specific), only the peers-forwarded Host
        # allow-list; ROCR entry injected by the template from the global
        # index.
        env:
          - "STRATA_REQUEST_LINES=1"
          - "MALLOC_MMAP_THRESHOLD_=1048576"
          - "STRATA_ALLOWED_HOSTS=gpu-ai-llama-swap-strata,gpu-ai-llama-swap-strata.default.svc,gpu-ai-llama-swap-strata.default.svc.cluster.local"

      qwen3.8-flash-next-strata-q4:
        name: Qwen3.8-Flash-Next Unsloth UD-Q4_K_XL (R9700 arena)
        description: Strata engine on the public unsloth UD-Q4_K_XL pack — the wave's quality rung at 93.1% Q8_0 top-token match against the IQ3_S flagship's 87.7%, paid for with a 71.7 GiB pinned-expert arena and a conversation cache held at 16 GiB — half the fleet uplift, since the HIP engine compiles the disk session files out and the full 32 GiB restore would not fit the node; ~10-30% slower decode than IQ3_S on this card class is the cost the U8 ruling accepts knowingly. Experts pinned in the page-locked RAM arena on the R9700 inside its own 103680 declaration under the pod's 110Gi cgroup; the arena unloads after 1h idle so the llama.cpp trio gets its RAM back.
        # Same serve wrapper as the primary, byte-for-byte except the profile
        # file (the suite asserts exactly this equality — the ulimit wrapper is
        # load-bearing, and a per-rung wrapper drift is invisible until fd
        # exhaustion): the pack/quant/memory switch lives entirely in the
        # profile file; serve takes no tuning flags.
        cmd: bash -c 'ulimit -n 524288; exec /opt/strata/terminal/bin/strata serve --profile /profile/strata-q4.json --host 127.0.0.1 --port ${PORT}'
        # Residency contract copied from the primary verbatim (rung-wide law,
        # same as the orca rung): ttl/unloadTimeout/checkEndpoint
        # equality keeps the time-share discipline and the 420 s grace
        # invariant, which C06 must not touch.
        ttl: 3600
        unloadTimeout: 180
        checkEndpoint: /health
        # Engine defaults like the other R9700 rungs: no PR/strix switch set
        # (silicon/recipe-specific), only the peers-forwarded Host allow-list;
        # the ROCR entry is injected by the template from the global index.
        env:
          - "STRATA_REQUEST_LINES=1"
          - "MALLOC_MMAP_THRESHOLD_=1048576"
          - "STRATA_ALLOWED_HOSTS=gpu-ai-llama-swap-strata,gpu-ai-llama-swap-strata.default.svc,gpu-ai-llama-swap-strata.default.svc.cluster.local"

      ornith-1.5-122b-strata-q4:
        name: Ornith-1.5-122B Unsloth UD-Q4_K_XL (R9700 arena, Strata q36 path)
        description: Strata engine on the public unsloth Ornith-1.5-122B UD-Q4_K_XL trio through its Qwen3.6 (qwen35moe) engine path — GGUF-direct, no pack, no token, the three shards joined by the loader itself. Runs on the vendored two-hunk constants carry (containers/strata carry/ornith-q36.patch, upstream issue #3574, closed not_planned): upstream does not support this model, so the claim-compiled engine carries the fix and the packaged engines do not — R9700 only, a Strix-only node cannot serve this rung. Weights stream from the file into VRAM expert slots (flat routing, unlike Flash-Next's ~92% pinned arena), so decode is CPU-pool-dominated and honestly UNMEASURED against our llama.cpp ornith UD-Q4 rung; the on-target A/B decides preference, the rung's presence is not in question. The arena unloads after 1h idle so the llama.cpp trio gets its RAM back.
        # Same serve wrapper as the other arenas, byte-for-byte except the
        # profile file (the suite asserts that equality): the model/quant/
        # engine-path switch lives entirely in the profile, and the q36
        # surface carries no serve-side tuning flags.
        cmd: bash -c 'ulimit -n 524288; exec /opt/strata/terminal/bin/strata serve --profile /profile/strata-ornith-q4.json --host 127.0.0.1 --port ${PORT}'
        # Residency contract equal to the other R9700 rungs (the time-share
        # discipline and the 420 s grace are rung-wide, C06 law).
        ttl: 3600
        unloadTimeout: 180
        checkEndpoint: /health
        env:
          - "STRATA_REQUEST_LINES=1"
          - "MALLOC_MMAP_THRESHOLD_=1048576"
          - "STRATA_ALLOWED_HOSTS=gpu-ai-llama-swap-strata,gpu-ai-llama-swap-strata.default.svc,gpu-ai-llama-swap-strata.default.svc.cluster.local"
          # q36's dense projections take the int8 MMQ path when this is on:
          # +47-67 % prompts measured on q36 HIP hardware (upstream #3926),
          # which is the same prompt path this rung's flat routing leans on.
          # It is an engine env var, not a profile flag — nothing here touches
          # the other arenas.
          - STRATA_DENSE_MMQ=1

    matrix:
      # The engines are ALTERNATIVES, never co-loadable: the arenas pin
      # RAM additively on the 128 GB node and co-residency recreates #1715's
      # global OOM (RESEARCH §7). "(p | s | o | q | n)" expands to one-model
      # combos, so the solver evicts the resident arena before starting the
      # other — the preload-empty hook alone would not stop a request-driven
      # co-load. The Q4 arena is the largest of the five (71.7 GiB pinned
      # experts), which is exactly why it rides the alternation instead of a
      # slot of its own; ornith (~40-48 GiB class) is the second largest, so
      # the two biggest never co-load either. vars name model IDs, not aliases
      # (llama-swap matrix semantics). All stay lazily reachable; nothing
      # preloads.
      vars:
        p: qwen3.8-flash-next-strata
        s: qwen3.8-flash-next-strata-strix
        o: qwen3.8-flash-next-strata-orca
        q: qwen3.8-flash-next-strata-q4
        # QUOTED on purpose: helm parses values as YAML 1.1, where a bare `n:`
        # is the boolean False — the ConfigMap would carry vars {"false": …}
        # and the set token n would never resolve (probe-proven, TEST_SPEC
        # §9.19). The C08-retired letter c is NOT reused (frozen-table hygiene:
        # a fresh letter names a fresh rung).
        "n": ornith-1.5-122b-strata-q4
      sets:
        main: "(p | s | o | q | n)"

    # -----------------------------------------------------------------------
    # The run-config JSON rendered VERBATIM to /profile/strata-iq3_s.json
    # (key vocabulary: RESEARCH §2, measured from profiles.py). SOURCE OF
    # TRUTH: the run-config setup GENERATED for this node
    # (/models/strata/Strata/strata-iq3_s.json, cat 2026-10-29) — it
    # supersedes the PR #3636 seed and corrects every seeded path guess:
    # weights/pack/MTP live under Strata-data, the tokenizer is a DIRECTORY
    # riding inside the pack (the seed's GGUF-file pointer was the crash
    # strata.py named), and the engine is the checkout's own gfx1201
    # compile. The on-target --plan gate (C04) is now verification, not
    # discovery; every deliberate deviation from the generated file is a
    # documented toggle below.
    # -----------------------------------------------------------------------
    engineProfile:
      # C-A keyless shipped default: "none" = the engine checks no key. It
      # binds loopback (see host below), so only the supervisor proxy can
      # reach it and the pod's auth posture is fully decided by the apiKeys
      # above — a key here would gate nothing reachable. (The generated file
      # omits the key; "none" states the same posture explicitly.)
      api_key: "none"
      # exe = the engine model-fetch's setup COMPILED for this machine
      # (gfx1201 via the checkout's venv ROCm SDK). The checkout lives on the
      # shared claim, so the path is pod-stable; the packaged /opt/strata
      # engines remain the strix fallback's runtime. Switching flavor =
      # switching profile file, never the image (C01 interface freeze).
      exe: /models/strata/Strata/engine/strata
      # serve's engine child inherits llama-swap's model env (the layer
      # above, single source of truth); a duplicate here would let serve
      # silently re-pin a value the chart gates (rocrVisibleDevices). C05's
      # strix profile carries its own §5 eight-set instead.
      env: {}
      # setup's own choices, kept verbatim: engine-relative cwd and the
      # progress log on the claim (the --plan-gate and unload-timing
      # evidence trail).
      cwd: /models/strata/Strata
      log: /models/strata/Strata/strata-iq3_s.log
      # Paths are SETUP's measured layout on the shared claim (2026-10-29):
      # weights/pack/MTP under Strata-data, expert-profile in the checkout's
      # data/. The prefix keeps this engine's files out of llama.cpp's
      # LLAMA_CACHE=/models layout on the same disk (DECISIONS Q3).
      args:
        - --pack /models/strata/Strata-data/packs/iq3_s
        # IQ3_S two-shard GGUF (ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF;
        # shard 2 is the PLE file, RESEARCH §4); setup's .done markers sit
        # beside them.
        - --native /models/strata/Strata-data/models/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf
        - --ple-gguf /models/strata/Strata-data/models/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00002-of-00002.gguf
        - --expert-profile /models/strata/Strata/data/expert-profile.bin
        # N in --expert-cache counts expert SLOTS, not MiB (RESEARCH §2);
        # `auto` is both the PR's and setup's choice — the --plan gate
        # verifies the resolved arena against real RAM (R1/R3).
        - --expert-cache auto
        - --spec 4
        - --spec-min-p 0.5
        - --mtp /models/strata/Strata-data/mtp/rt
        - --max-context 262144
        # int8 KV: the engine default AND the PR's explicit choice.
        - --kv int8
        # Machine-tuned by setup, adopted with the 2026-10-29 post-OOM edits.
        # --ple-io ram was REMOVED here, and the note written that day called
        # the fallback "the engine's file/mmap default" — the 2026-11-01 boot
        # measured the actual resolution instead: `PLE on, table 320001536 rows
        # of …IQ3_S-00002-of-00002.gguf` in DIRECT mode (320,015,536 × 90 B
        # ≈ 26.8 GiB read unbuffered), the gfx12 auto-RAM policy having
        # correctly declined while only ~3.2 GiB sat spare inside the declared
        # cap. Direct is fine on this disk: the engine's own startup probe read
        # 120,960 rows/s against its 15,000-row warning line, i.e. 8× clear.
        # That measurement RETIRES `--ple-io mmap` (R6's T2): its page cache
        # would live in this same cgroup and eat the parking room below, to buy
        # a documented ~11% on a device that is not the bottleneck.
        # --memory-limit-mib is declared so the engine sizes its page-locked
        # arena inside the container cgroup instead of guessing at free node
        # RAM (PR #1601 pairing). U14 (2026-11-01) moved 92160 → 110592: the
        # rung's own terms are arena 46.84 + conversation cache 32 +
        # worst-case 4-slot KV ~13 ≈ 91.84 GiB, which the old 90 GiB
        # declaration never covered — the comment here once read "90 GiB =
        # arena ~50 + conversation cache 32 + KV ~13", an arithmetic slip
        # summing to 95 — and the engine reported the consequence at its first
        # parking attempt: "need 1960 MiB plus 2560 MiB floor, 3259 MiB
        # available". 108 GiB (110592 MiB) declared inside the 110Gi cgroup.
        # Host-RAM KV law (int8): 13 KV-bearing layers (the 12 full-attention
        # QSA layers + the MTP draft) × 1,056 B = 13,728 B per context token
        # per slot — 1.28 GiB per 100k tokens, 3.35 GiB a full 262k park,
        # 13.4 GiB at the 4-slot worst case (4 × 262,144 × 13,728 B — the
        # budget's counted "~13 GiB", now derived). --kv-resident below is NOT
        # that budget: it keeps 32,768 KV cells per QSA layer in VRAM
        # (~0.4 GiB VRAM/slot), and the host-RAM cost is context × 13,728 B
        # per slot regardless of it. The 32768 MiB conversation-cache budget
        # below parks roughly 9-10 full-262k sessions — or dozens of typical
        # 30-50k turns.
        - --kv-resident 32768
        # T3 (owner ruling 2026-11-01): bare `auto` on gfx12 Linux means
        # 16,384-token chunks; 32,768 is the prompt chunk PR #3636 ran on
        # THIS node class (~2,519 tok/s @64-200K, the ladder rung-4 bar) and
        # the strix progression row scored `auto:32768` at +23% @74K. Chunks
        # above 8,192 are exact on gfx12, so this is a rate knob only — no
        # numerics change (RESEARCH R6 [R6-1][R6-2]). The form is `auto:N`
        # rather than bare N so the engine still auto-shrinks when the prompt
        # buffers do not fit: it silently re-picks a smaller chunk (#4164),
        # which is why the startup `prompt chunk …` line is a load-bearing
        # verification step, not decoration. q4/orca/ornith stay at `auto`
        # for this round — one variable at a time on the arena with headroom.
        - --prefill auto:32768
        - --memory-limit-mib 110592
        - --conversation-cache-mib 32768
        - --conversation-cache-slots 16
        # Context-extension toggle (EXPERIMENTAL, off by policy): the
        # engine answers past the trained 262144 with llama.cpp-style rope
        # scaling — add
        #   "- --max-context 524288" (replacing 262144)
        #   "- --rope-scaling yarn"
        #   "- --rope-scale 2"
        # Costs, all documented upstream: yarn's mscale (~1.069 at factor 2)
        # makes EVERY run a slightly different model (a 64-token greedy
        # prompt diverges ~19 tokens in — short-context quality is not
        # "native"); KV doubles per parked session (~6.5 GiB/park → half the
        # park count on the 32 GiB budget) and the rope tables add ~0.26
        # KiB/token; KV is allocated before expert-cache auto-sizing, so the
        # arena shrinks to make room (#765 budgeting order). One scaling
        # setting per process — never mix scaled and unscaled sessions on
        # one cache. Verify with a needle probe before trusting recall.
        # Documented deviations/toggles, one values edit away (verbatim
        # provenance kept for the record):
        # --prefill 32768: TAKEN above as `auto:32768` (owner T3 ruling
        #   2026-11-01 — the --plan/bench evidence the override asked for
        #   arrived: PR #3636's ~2,519 tok/s ran this node class at 32,768).
        # --conversation-cache-mib 24576 / --conversation-cache-slots 16:
        #   the PR's parked budget — superseded by the owner's 32768×16
        #   above; the real home of the guide's "24576" (RESEARCH §5
        #   contradiction #3).
        # --ple-io ram: put the 28.8 GiB n-gram table back in RAM — only
        #   sane with the trio idle (the OOM post-mortem above); re-add
        #   after loading, never alongside residency.
        # --conversation-cache-mib 24576 / --conversation-cache-slots 16:
        #   the PR's parked-conversation budget — the real home of the
        #   guide's "24576" (RESEARCH §5 contradiction #3). Setup ships its
        #   default instead (40% free RAM above floor, capped 8 GiB);
        #   re-add both lines to pin the PR budget.
        # --mtp-window 8192: guide-class long-context knob, absent from the
        #   generated config; re-add to restore it.
        # --kv-grow (R4 deferred, +2-3% @64K only): re-add "- --kv-grow";
        #   the cmd's ulimit wrapper already covers its fd dependency and
        #   the env alias is STRATA_KV_GROW=1 — the guide's hold-env is VOID
        #   (RESEARCH §2). Needs the on-target fd experiment (C04) first.
        # --vision (R2 off for v1): mmproj-Qwen3.8-Flash-Next-BF16.gguf
        #   ships at the quant repo root (~0.9 GB); the vision{} run-config
        #   key stays available for the flip.
        # --resident-budget-gib implies --mmap-experts, the opposite of the
        #   page-locked arena (contradiction #3) — strix/#1715 territory.
        # --prompt-cache-every: #4206 no-op at prefill edges; never adopted.
      # Person-wins layer that survives config rewrites (RESEARCH §2): empty
      # until an operator out-ranks the seed.
      user_args: []
      # A DIRECTORY, not the GGUF file (the seed's shard path was the
      # tokenizer-missing crash strata.py named): the tokenizer rides inside
      # the pack, measured 2026-10-29.
      tokenizer: /models/strata/Strata-data/packs/iq3_s/tokenizer
      model_name: qwen3.8-flash-next-iq3_s
      # The compiled engine's ROCm runtime = the checkout venv's SDK trees
      # (setup's own choice) — not the packaged image roots.
      lib_dirs:
        - /models/strata/Strata/.venv/lib/python3.12/site-packages/_rocm_sdk_devel/lib
        - /models/strata/Strata/.venv/lib/python3.12/site-packages/_rocm_sdk_libraries_gfx120X_all/lib
      backend: hip
      # The peer hop always rewrites the request model to this bare ID
      # (RESEARCH §3), so routing does not depend on aliases; these carry the
      # PR's family alias for direct/debug hits on the inner surface.
      aliases:
        - qwen3.8-flash-next
      gpu: [0]
      parallel: 4
      # The cmd's --host flag binds loopback (the supervisor is the pod's
      # only in-pod listener); the PR ran 0.0.0.0 on a laptop.
      host: "127.0.0.1"

    # -----------------------------------------------------------------------
    # The Strix-alone fallback's run-config, rendered VERBATIM to
    # /profile/strata-strix-iq3_s.json by the same profile ConfigMap. Seed:
    # UPSTREAM docs/STRIX_HALO.md §5 fast-config — the R1 ruling says NOT
    # the card's numbers, and not the primary's arena recipe either: the
    # 8060S runs on shared LPDDR5X, so the residency math is a different
    # fix-class (#1715). Final sizing: strata serve --plan --output json
    # (C04, human step 3).
    # -----------------------------------------------------------------------
    engineProfileStrix:
      # C-A keyless shipped default (same posture as the primary).
      api_key: "none"
      # C01 interface freeze (containers/strata README): halo label = the
      # gfx1151 root. Pointing the rx9070 exe at the 8060S loads the wrong
      # arch kernels; exe is the ONLY flavor switch (same image, same
      # terminal entry, same weights). The label dir follows the image's
      # flavor pin (containers/strata README ledger; the packaged dirs are
      # what that build's verify step test -x's — a root that drifts from
      # the image is a profile pointing at a path that does not exist).
      #
      # The engine package version is the IMAGE pin, not a knob: the 0.2.9
      # flavor bump (cf-86 C09) is what makes this dir 0.1.55, because that
      # release's engine packages carry #4708 (the q36 warm-up no longer
      # writes past the KV cache) and the chunked DeltaNet prompt kernels
      # default-on for all-gfx12 Radeon (+3.5-6.1 % prompts on our card
      # class), on top of what 0.2.8 already brought (#4518 conv cache vs the
      # locked PLE table, #4051 engine memory handoff, #4420 idle-slot prefix
      # keep). The off-unless-you-turn-it-on flag list is unchanged across the
      # bump, so no profile args move with it. Only THIS profile runs a
      # packaged root: the other arenas exec the engine setup compiles into
      # the claim checkout, and since cf-86 C09 that checkout is refreshed by
      # the image's own marker-keyed migration step on first boot after a bump
      # (sources synced, build-hip wiped, engine recompiled), so the
      # claim-compiled arenas follow the image pin without an operator step.
      # That recompiled engine is also the only one carrying the vendored
      # #3574 constants, which is why the ornith arena names it and this
      # packaged halo root cannot serve that rung.
      exe: /opt/strata/components/engine/0.1.55-linux-x86_64-hip-halo/strata
      # RESEARCH §7 verbatim eight-set — the spellings ARE upstream literals
      # (normalizing case or names silently no-ops the engine's env parsing,
      # AC2's bar). gfx1151 auto-enables much of this from §4; §5 sets them
      # explicitly because they change bits (KL-gated rounds). To disable
      # the whole auto-set: STRATA_GFX1151_DEFAULTS=0.
      env:
        STRATA_PF_FUSED: "1"
        STRATA_PF_GEMM: "1"
        STRATA_HC_UPMIX: "1"
        STRATA_PA_FAST: "1"
        STRATA_HIP_WMMA: "1"
        STRATA_SELECT_WMMA: "1"
        STRATA_PF_SWITCH_MIN_T: "4096"
        STRATA_PREFILL_STREAM_MIN: "128"
        # STRATA_PF_FUSED_KQ=1 applies only to K-quant packs; the shipped
        # IQ3_S pack is not one — enable if the on-target pack ever changes.
        # STRATA_HC_UPMIX=1 carries the #2706 split-mode hazard history:
        # startup-log check gate in the fallback runbook (README), flip it
        # to "0" here if the hazard reproduces on this engine build.
      args:
        # Same Strata-data layout as the primary (measured 2026-10-29) — one
        # staged set serves both profiles; the matrix never runs them at once.
        - --pack /models/strata/Strata-data/packs/iq3_s
        - --native /models/strata/Strata-data/models/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf
        - --ple-gguf /models/strata/Strata-data/models/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00002-of-00002.gguf
        - --expert-profile /models/strata/Strata/data/expert-profile.bin
        # VERIFY (R1): the 24576/55 pair has NO upstream source — it is the
        # card guide's number pair, and 24576 also equals the model's total
        # expert count, the likely misattribution origin (RESEARCH §7).
        # They ship because #1715's fix-class is exactly this shape: on a
        # 128 GB Strix Halo, --expert-cache auto WITHOUT --resident-budget-gib
        # OOMs globally — the opposite of the primary, where resident-budget
        # would flip --mmap-experts and break the page-locked arena. Both
        # numbers are HYPOTHESES until the strata serve --plan --output json
        # gate (C04 human step 3) finalizes them against real RAM; note
        # --expert-cache N counts expert SLOTS, not MiB (RESEARCH §2).
        - --expert-cache 24576
        - --resident-budget-gib 55
        # STRIX_HALO §5/§6 fast-config-class prefill chunk for the chip
        # alone (the primary runs setup's --prefill auto).
        - --prefill 16384
        - --max-context 262144
        - --kv int8
        - --spec 4
        - --spec-min-p 0.5
        - --mtp-window 8192
        - --mtp /models/strata/Strata-data/mtp/rt
        # Deliberately absent: --kv-grow (R4 deferral covers strix too),
        # --vision (R2 off for both profiles), --conversation-cache* (the
        # primary's 24 GiB x 16 slots is the PR's R9700-machine budget —
        # the chip's share is the --plan gate's to size, not ours to seed).
      # Person-wins layer (RESEARCH §2), same rule as the primary.
      user_args: []
      # Tokenizer rides inside the pack — a DIRECTORY (strata.py appends
      # /vocab.json; same measured correction as the primary).
      tokenizer: /models/strata/Strata-data/packs/iq3_s/tokenizer
      model_name: qwen3.8-flash-next
      # The matching halo engine root for lib_dirs (the exe's ROCm runtime
      # ships inside it — same packaged-engine VERIFY as the primary).
      lib_dirs:
        - /opt/strata/components/engine/0.1.55-linux-x86_64-hip-halo
      backend: hip
      aliases:
        - qwen3.8-flash-next
      # The visible set is renumbered by the ROCr filter injected per model
      # above, so [0] is the first (only) visible GPU — the chip for this
      # profile, whatever its pre-filter index was.
      gpu: [0]
      # Mirrors the primary seed (same family recipe); the --plan gate
      # reviews it for the chip too.
      parallel: 4
      host: "127.0.0.1"

    # -----------------------------------------------------------------------
    # The gated orcarouter Uncensored IQ4_XS swap rung's run-config, rendered
    # VERBATIM to /profile/strata-orca-iq4_xs.json by the same profile
    # ConfigMap (the U9.2 owner ruling moved this arena up the orcarouter
    # quant ladder — same frozen id, rung replace, no matrix growth). Shape:
    # data paths on the three IQ4_XS shards staged by model-fetch's gated
    # orca step, and the memory pair MOVED: the 57.7 GiB pinned-expert arena
    # (97.47 GB x the 0.635 setup-calibrated expert share, RESEARCH R4) fits
    # this rung's 92160 declared cap ONLY with the conversation cache trimmed
    # to 8192 — 57.7 arena + 8 conv + ~13 worst-case KV + ~6 supervisor ≈
    # 84.7 GiB, while conv 32 would declare 108.7 — past this rung's own 90
    # GiB declaration (the pod cgroup is now 110Gi, but the cap is
    # what bounds an arena, and U9.2 pinned orca's envelope as zero-growth).
    # Slots stay 16 and the cap stays 92160 (the #1601 law is
    # declared ≤ cgroup, and the cgroup raises were the Q4 arm's lockstep);
    # the trim follows the sibling Q4 arm's U8 precedent and upstream's own
    # default ceiling (DETAILS.md@v0.2.8). Two Orca-specific carry-overs from
    # docs/ORCA.md, both per-quantizer decisions: the pack is built with
    # --compat-bf16 (this is the same publisher/quantizer pipeline whose
    # IQ3_XXS shards provably compressed the BF16 hyper-connections — the
    # first IQ4_XS provisioning's iq_pack log plus serve --plan is the human
    # fidelity gate; a flag flip + repack there is a follow-up, not a
    # pre-trim here), and the PLE lookup table rides INSIDE shard 1 (its
    # example config points --native and --ple-gguf at the same file) — the
    # placement across three shards is confirmed at that same on-target
    # gate. There is no Strata doc page for this tier: ORCA.md validated
    # IQ3_XXS and ORCA_Q4_K_S.md the Q4_K_S trio, but plain IQ4_XS experts
    # are kernel-supported on the q38 path since engine 0.1.31/0.1.32
    # (RESEARCH R4) — zero build flags. The IQ3_S pair's files stay off this
    # arena (serving the flagship's weights under an uncensored id is the
    # failure the distinctness arms catch).
    # -----------------------------------------------------------------------
    engineProfileOrca:
      # Keyless SERVE posture, identical to the other profiles (C-A): the
      # hf-token Secret the R-d ruling sanctions is consumed by the model-
      # fetch INIT for the gated download and stops there — this profile
      # carries no secret reference of any kind.
      api_key: "none"
      # Per-node engine, not per-rung: byte-identical exe/cwd/lib_dirs/
      # backend/gpu/parallel/host to the primary and the Q4 rung.
      exe: /models/strata/Strata/engine/strata
      env: {}
      cwd: /models/strata/Strata
      # Own progress log on the claim (the --plan-gate and unload-timing
      # evidence trail for THIS rung).
      log: /models/strata/Strata/strata-orca-iq4_xs.log
      args:
        # Fresh iq_pack --compat-bf16 pack built from the Orca shards by
        # model-fetch (pack dir named by the tier, ORCA.md's scheme); the
        # tokenizer directory rides inside it.
        - --pack /models/strata/Strata-data/packs/orca-iq4_xs
        # ORCA.md's pattern carried to the 3-shard tier: both file pointers
        # take the SAME first shard — this pack family's PLE lookup table
        # lives inside shard 1 and stays on disk (unchanged by
        # --compat-bf16). The 3-shard placement is confirmed at the
        # on-target serve --plan gate; a PLE-not-found in the plan output
        # flips the pointer there as a follow-up, never improvisationally.
        - --native /models/strata/Strata-data/models/IQ4_XS-orca/Qwen3.8-Flash-Next-Uncensored-IQ4_XS-00001-of-00003.gguf
        - --ple-gguf /models/strata/Strata-data/models/IQ4_XS-orca/Qwen3.8-Flash-Next-Uncensored-IQ4_XS-00001-of-00003.gguf
        # Same qwen-architecture expert profile as the other profiles.
        - --expert-profile /models/strata/Strata/data/expert-profile.bin
        - --expert-cache auto
        - --spec 4
        - --spec-min-p 0.5
        # Shared stock draft-head runtime staged by the q3 provisioning —
        # ORCA.md's own Preparation section uses the ORIGINAL model's MTP rt
        # for this foreign pack ("the target model verifies every proposal");
        # the ablation never touched the draft head.
        - --mtp /models/strata/Strata-data/mtp/rt
        - --max-context 262144
        - --kv int8
        # Byte-equal to the serving rungs; the rung shift moved only the
        # conversation-cache term below. The flag is a VRAM cell window —
        # 32,768 KV cells per QSA layer, ~0.4 GiB VRAM/slot — not a host-RAM
        # budget: host-RAM KV is context × 13,728 B per slot regardless (int8:
        # 13 KV-bearing layers × 1,056 B), so the counted ~13 GiB worst-case
        # 4-slot KV is 13.4 GiB derived.
        - --kv-resident 32768
        - --prefill auto
        # THE DECLARED CAP stays 92160 for this rung (the #1601 law is
        # declared ≤ cgroup, not equal — the 100Gi cgroup raise was the Q4
        # arm's pair). Fit math (RESEARCH R4): 57.7 GiB arena + 8 conv +
        # ~13 worst-case KV + ~6 supervisor ≈ 84.7 GiB inside 92160.
        - --memory-limit-mib 92160
        # Conversation-cache trim 32→8 GiB (slots unchanged at 16) is the
        # arithmetic of the 57.7 GiB arena, not tuning: conv 32 declares
        # 108.7 GiB, past its own 92160 declaration. Same trim the sibling Q4
        # arm ships (U8 precedent) and upstream's own default ceiling
        # ("40% of the RAM left above min-free, at most 8192 MiB",
        # DETAILS.md@v0.2.8).
        - --conversation-cache-mib 8192
        - --conversation-cache-slots 16
      # Person-wins layer (RESEARCH §2), same rule as the other profiles.
      user_args: []
      tokenizer: /models/strata/Strata-data/packs/orca-iq4_xs/tokenizer
      model_name: qwen3.8-flash-next-orca-iq4_xs
      lib_dirs:
        - /models/strata/Strata/.venv/lib/python3.12/site-packages/_rocm_sdk_devel/lib
        - /models/strata/Strata/.venv/lib/python3.12/site-packages/_rocm_sdk_libraries_gfx120X_all/lib
      backend: hip
      # UNIQUE inner alias per the frozen-id rule: NOT the family alias
      # (primary/strix hold that legitimately together) and NOT the OUTER
      # llama.cpp id qwen3.8-flash-next-orca-q6 — one name on two engines
      # would split the orca family across surfaces invisibly.
      aliases:
        - qwen3.8-flash-next-orca
      gpu: [0]
      parallel: 4
      host: "127.0.0.1"

    # -----------------------------------------------------------------------
    # The unsloth UD-Q4_K_XL Q4 rung's run-config, rendered VERBATIM to
    # /profile/strata-q4.json by the same profile ConfigMap (cf-86 C06).
    # Shape: the primary's engine/paths layer byte-unchanged, data paths and
    # the memory pair moved — this is the wave's only Shape-A TWEAK rather than
    # a Shape-A copy. Authority for every number: DECISIONS "Research verdicts
    # + final rulings" (R-b OVERTURN: it fits; U8: this rung + this trim),
    # RESEARCH Rounds 2-3 [A1][A2][A11].
    # Paths are setup v0.2.8's own naming for a catalog family install (read at
    # the pinned tag, 639,798 B, sha256 0eba1327…c94079ae): family tag "unsloth-" prefixes
    # BOTH the staged-shard dir and the lowercased pack dir, and step 7 of the
    # installer emits --pack + --native(shard 1) ONLY — for a 4-shard pack it
    # deliberately writes no --ple-gguf, because the engine finds the PLE
    # table's shard itself from shard 1. The MTP runtime is the shared one the
    # q3 provisioning already staged.
    # -----------------------------------------------------------------------
    engineProfileStrataQ4:
      # Keyless serve posture (C-A), identical to the other three profiles:
      # unsloth's files are public/ungated, so C02's download-only hf-token
      # exception must NOT spread here — no secret reference anywhere in this
      # arm.
      api_key: "none"
      # Per-node engine, not per-rung: byte-identical exe/cwd/lib_dirs/
      # backend/gpu/parallel/host to the primary and the orca rung (the
      # suite asserts this equality; only data paths may differ).
      exe: /models/strata/Strata/engine/strata
      # L2 arm (owner Q1 2026-11-10): K-quant prompt kernels — R9700
      # +10.3/14.3/16.8% prompts at 4K/8K/32K [36]; opt-in at 0.2.9 via
      # getenv("STRATA_MMQ_KQ")[0]=='1' [32], hence the quoted "1" — the
      # int form never fires the switch. Chunk rounding flips near-tie
      # answers: retain-vs-revert rides the tuning runbook's §7 L2 round on
      # fleet-agent traffic. At 0.1.59 this is the engine's own Linux-gfx12
      # default for UD-Q4-class packs [61][62] (user-set wins; the IQ3_S
      # primary sits outside that flip) — kept present as an experimental
      # pin per owner Q16, not settled intent. Revert = delete this entry.
      env:
        STRATA_MMQ_KQ: "1"
      cwd: /models/strata/Strata
      # Own progress log on the claim (the on-target --plan gate and the
      # session round-trip gate both read this file).
      log: /models/strata/Strata/strata-q4.log
      args:
        # Pack iq_pack built by setup from the four unsloth shards with
        # --compat-bf16 (the unsloth family's own pack_args — unlike SC117's
        # GSQ-RCO files, unsloth's quants compress the projections Strata's
        # kernels read as BF16); the tokenizer directory rides inside it.
        - --pack /models/strata/Strata-data/packs/unsloth-ud-q4_k_xl
        # Shard 1 of four: 10,946,624 B (embeddings + first layers); shards 2-3
        # are the 49,859,583,136 B and 49,376,141,504 B expert halves, shard 4
        # the 12,087,983,520 B tail. Those four byte counts are setup's own
        # UNSLOTH_SHARDS pins, and they sum to 111,334,654,784 B — the total
        # the RAM envelope is sized against. Sum them from the shards rather
        # than trusting a label: setup's `download_gb: 111.3` is a rounded
        # figure. No --ple-gguf line here on purpose: setup's step 7 emits it
        # only for ≤2-shard packs (verified in setup.py@v0.2.8:
        # `["--ple-gguf", ple] if len(shards) <= 2 else []`), and pointing one
        # at a guessed shard would be the wrong-weights failure.
        - --native /models/strata/Strata-data/models/unsloth-UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
        # Same qwen-architecture expert profile (the unsloth family carries no
        # family-specific profile file of its own).
        - --expert-profile /models/strata/Strata/data/expert-profile.bin
        - --expert-cache auto
        - --spec 4
        - --spec-min-p 0.5
        # Shared stock draft-head runtime staged by the q3 provisioning — the
        # unsloth quantization never touched the draft head, and the target
        # model verifies every proposal.
        - --mtp /models/strata/Strata-data/mtp/rt
        - --max-context 262144
        - --kv int8
        # Byte-equal to the serving rungs; C06's ruling moved only the
        # conversation-cache term. The flag is a VRAM cell window — 32,768 KV
        # cells per QSA layer, ~0.4 GiB VRAM/slot — not a host-RAM budget:
        # host-RAM KV is context × 13,728 B per slot regardless (int8: 13 KV-
        # bearing layers × 1,056 B) — 3.35 GiB a full 262k park, 13.4 GiB at
        # this rung's 4-slot worst case.
        - --kv-resident 32768
        - --prefill auto
        # THE LOCKSTEP PAIR (PR #1601): cgroup limits.memory above, this cap
        # inside it. cf-86 post-boot revision (2026-11-01): the conv term was
        # written 8192 because disk session files were supposed to absorb the
        # big parks (Round 2/3 [A1]: 71.7 pinned experts + 8 conv + ~13
        # worst-case 4-slot KV ≈ 92.7) — the on-node HIP engine rejected
        # --slot-save-path at argv (a CUDA-side feature compiled out), so conv
        # is back to 16384 and the pair to 103680 inside the pod cgroup
        # (71.7 + 16 + 13 ≈ 100.7). The pair value itself is PER-RUNG and does
        # NOT move when the cgroup does: U14 raised the container to 116Gi the
        # same day (for the flagship's term-sum, see its profile), and q4 keeps
        # 103680 — its envelope gains nothing from a ceiling it was never
        # bumping against, and the reserve above it grows from ~7 to ~12 GiB.
        # The full 32768 conv restore stays CLOSED, not deferred: it still
        # computes 71.7 + 32 + 13 = 116.7 — over the pod's largest declared
        # cap (108 GiB) and over the cgroup itself (116Gi when this was ruled,
        # 110Gi since the 2026-11-10 round), so U12's half-restore was never
        # an artifact of a timid ceiling. The orca
        # profile keeps its 92160 declaration inside the same cgroup.
        - --memory-limit-mib 103680
        # Conversation-cache 16384 (slots unchanged at 16). History: the rung
        # shipped trimmed to 8192 as the price of the 71.7 GiB arena — the
        # owner's U8 trade, sound ONLY because disk session files were to
        # absorb the big parks the trim evicted. The on-node HIP engine
        # compiled that feature out (the flag below, rejected at argv), so the
        # trim lost its compensation: restored halfway — 16 GiB, inside the
        # pair raised above — because the full 32768 uplift would put the
        # envelope at ~116.7 of the 125 GiB node (the Oct-29 OOM shape, refused
        # at the owner gate 2026-11-01). At 16 GiB the fleet's typical 30-50k
        # turns park ~24-42 of them; ≥256k parks stay scarce and re-prefill
        # 1.7-3 min for now.
        - --conversation-cache-mib 16384
        - --conversation-cache-slots 16
        # Session files are NOT passed: the claim-compiled HIP engine rejects
        # --slot-save-path with "unknown argument" (exit 2 before ready,
        # 2026-11-01 first boot), while the checkout's own DETAILS.md@0.2.9
        # still documents it — the CUDA trial class the Round-3 caveat predicted
        # at DECISIONS, now measured rather than assumed. Revisit only if
        # upstream ships the feature for HIP builds.
        # NEGATIVE PINS — flags that stay OUT of this arm (suite-pinned;
        # RESEARCH Round 3 §4):
        #   --ple-io ram would make the 28.8 GiB n-gram table RAM-resident —
        #   the exact +28.8 GiB that blew node RAM and got cluster system pods
        #   OOM-harvested on 2026-10-29. This is a hazard, not a theoretical
        #   worry: setup's own installer AUTO-ADDS --ple-io ram here, because
        #   its SSD-path test is `ram >= ram_gb(48) + table_gb(28.8) + 16`
        #   = 92.8 GB and this node has 128 — so whatever the claim's setup-
        #   generated config says, THIS file is the serving authority and it
        #   pins the engine's mmap default. PLE-RAM-vs-mmap is confirmed at the
        #   human-owned on-target `strata serve --plan` gate, never from here.
        #   (--layer-split / --prompt-cache 0 were pinned out as session-file
        #   killers; with the feature compiled out of the HIP build that
        #   rationale is retired — they stay out as untouched defaults, not as
        #   guard rails.)
        # Fallback executed at the owner gate 2026-11-01: the pre-registered
        # HIP failure arrived one step early — the engine refused the flag at
        # argv, so no round-trip ever ran. The full Round-2 envelope (conv
        # 32768) was DECLINED on measurement: sized against the smaller
        # IQ4_XS pack, on this pack it computes ~116.7 of the 125 GiB node.
        # The owner chose the half-restore instead — conv 16384 with the pair
        # raised above. This paragraph is the record of that gate, not an
        # open option.
      # Person-wins layer (RESEARCH §2), same rule as the other profiles.
      user_args: []
      tokenizer: /models/strata/Strata-data/packs/unsloth-ud-q4_k_xl/tokenizer
      model_name: qwen3.8-flash-next-unsloth-ud-q4_k_xl
      lib_dirs:
        - /models/strata/Strata/.venv/lib/python3.12/site-packages/_rocm_sdk_devel/lib
        - /models/strata/Strata/.venv/lib/python3.12/site-packages/_rocm_sdk_libraries_gfx120X_all/lib
      backend: hip
      # UNIQUE inner alias per the frozen-id rule: NOT the family alias
      # (primary/strix hold that legitimately together) and NOT the outer
      # llama.cpp ids of the same quant class (qwen3.8-flash-next-q4 /
      # qwen3.8-flash-next-heretic-q4) — one name on two engines would split
      # the flash-next Q4 family across surfaces invisibly. The name is
      # setup's own family name for this repo (fam["name"] =
      # qwen3.8-flash-next-unsloth), so a direct/debug hit reads as the
      # quantization source, which is the distinction an operator needs.
      aliases:
        - qwen3.8-flash-next-unsloth
      gpu: [0]
      # Owner ruling 2026-11-10 (reverts the envelope round's 4→2): q4 keeps parallel 4,
      # NO concurrencyLimit; protections = 110Gi cgroup + MALLOC_MMAP_THRESHOLD_ (#5697)
      # + the serialized-deep-prompts law — two concurrent deep prefills is accepted risk.
      parallel: 4
      host: "127.0.0.1"

    # -----------------------------------------------------------------------
    # Ornith-1.5-122B on the engine's Qwen3.6 (qwen35moe) path — a DIFFERENT
    # engine surface from the four flash-next profiles above, so the shape
    # here follows what setup.py@v0.2.9 GENERATES for the qwen36 family
    # (install_own_path step 7): `--native <gguf> --max-context N --prefill
    # auto --mtp N` plus a tokenizer DIRECTORY and no pack. The flash-next
    # profile grammar deliberately does NOT appear here:
    # --conversation-cache*/--slot-save-path/--memory-limit-mib and the pack/
    # PLE/expert-cache family are qwen4exp-only flags (engine.hpp's q36 list
    # is --native/--serve/--max-context/--prefill/--chunk/--mtp/--pool-workers/
    # --expert-vram/--expert-slots/--hybrid-rows/--cpu-threads), and passing a
    # flag the parser does not know would look like tuning discipline while
    # being noise. No --serve here either: serve/server.py adds it to the
    # child's argv itself.
    # -----------------------------------------------------------------------
    engineProfileStrataOrnith:
      # Keyless posture, same as the other four: unsloth's Ornith files are
      # public (the anonymous tree read + ranged resolve proved it), so no
      # secret reference belongs anywhere on this arm.
      api_key: "none"
      # The CLAIM-COMPILED engine, deliberately: the carry patch is a source
      # patch, so only the engine this checkout compiles carries the widened
      # pool buffer and the Q4_K (fmt 12) down instantiation. The packaged
      # /opt/strata/components/engine roots are upstream binaries and refuse
      # this model — pointing here is the gfx120x-only law made executable.
      exe: /models/strata/Strata/engine/strata
      env: {}
      cwd: /models/strata/Strata
      log: /models/strata/Strata/strata-ornith-q4.log
      args:
        # Shard 1 of three, staged under the repo's ORIGINAL names by the
        # model-fetch driver's GGUF-direct leg: q36's load() opens the GGUF and
        # walks the shards from the first file itself, so this pointer is a
        # join entry, not a merged file. Bytes 10,942,929 / 49,971,099,680 /
        # 29,731,729,056 (Σ 79,713,771,665) are the byte_pins.env literals the
        # legs verify against.
        - --native /models/strata/Strata-data/unsloth/Ornith-1.5-122B-GGUF/UD-Q4_K_XL/Ornith-1.5-122B-UD-Q4_K_XL-00001-of-00003.gguf
        # 131072, not the 262K the other arenas serve: the cost on this path
        # is fp32 KV (no quantized KV on q36 yet, upstream #3678 open) at
        # ~53 KB/token — at 262144 the first on-target load died exactly here
        # ("5088 MiB needed, 3040 MiB free after the weights, the context and
        # the sessions"): ~13.1 GiB KV + ~10.2 GiB dense leaves no room for
        # the hybrid experts' buffers and slots. Halving the window frees
        # ~6.5 GiB against a ~2 GiB deficit; the experts' default sizing stays
        # unpinned for the serve --plan gate to measure honestly.
        - --max-context 131072
        # setup's own generated choice for this family (its step 7 writes
        # `--prefill auto`); `auto` lets the engine pick the prefill path for
        # the card instead of freezing a guess here.
        - --prefill auto
        # Draft count, not a path — on this engine path the MTP layer rides
        # inside the GGUF (blk.48, types clean per the shard-3 scan) and setup
        # writes the same 2, its comment: "measured best on the R9700".
        - --mtp 2
        # NOT pinned here, on purpose: --expert-slots/--expert-vram are sized
        # against real VRAM+RAM at the human on-target `serve --plan` gate
        # (RESEARCH R5 sizes the slots budget at ~10-14 GiB / 300-400 slots on
        # this node; a guessed number would be a fake pin). The engine's
        # defaults stay in force until that measurement lands.
      user_args: []
      # Built by the driver with setup's own tool (its GGUF-direct step builds
      # ONLY the tokenizer, because the engine reads the weights from the
      # GGUF); pointing at a pack path here would name a directory that does
      # not exist on this rung.
      tokenizer: /models/strata/Strata-data/unsloth/Ornith-1.5-122B-GGUF/UD-Q4_K_XL/tokenizer
      # Honest about the rung (frozen arena id is the routing name; this is
      # what the engine reports): ornith, q4 class, and NOT a flash-next
      # family name.
      model_name: ornith-1.5-122b-unsloth-ud-q4_k_xl
      # UNIQUE inner alias: the distinguishing fact for an operator is the
      # ENGINE, not the quant — the outer llama.cpp ladder already serves
      # ornith-1.5-122b-q4 from the same unsloth files, so a quant-named alias
      # here would split one model across two engines invisibly. Not equal to
      # any model id on either surface.
      aliases:
        - ornith-1.5-122b-strata
      gpu: [0]
      # One request at a time until the on-target gate measures it: q36 keeps a
      # full fp32 KV per slot (~13.1 GiB at 262K), so the parallel 4 the
      # flash-next q4 arena runs (int8 KV) would multiply a KV cost this path
      # cannot pay yet.
      parallel: 1
      host: "127.0.0.1"
      lib_dirs:
        - /models/strata/Strata/.venv/lib/python3.12/site-packages/_rocm_sdk_devel/lib
        - /models/strata/Strata/.venv/lib/python3.12/site-packages/_rocm_sdk_libraries_gfx120X_all/lib
      backend: hip
