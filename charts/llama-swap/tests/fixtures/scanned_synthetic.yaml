# Synthetic stand-in for one `llama-swap-config-autogen generate` output
# (scanned half). Shape is source-verified against the pinned commit
# c7357e68 by an actual generate run 2026-10-22: per model exactly
# ttl/cmd/name (+ optional metadata/capabilities), IDs `<dir>:<QUANT>`,
# macros restricted to those the cmd references, cmd template
# `${binary} -m <abs path> --port ${PORT} --host 0.0.0.0`.
#
# Used by the merge-safety tests WITHOUT running the tool: it pins the
# identity-namespace contract (dash IDs vs colon IDs) that keeps the two
# config files from colliding under v262 -config-dir merge. The real-merge
# proof (llama-swap -validate on the fleet image) lives in
# test_autogen_integration.py (evidence-gated).
models:
  immich-mini:Q4_K_M:
    ttl: 300
    cmd: |-
      ${binary} -m /models/scanned/immich-mini/mini-Q4_K_M.gguf --port ${PORT} --host 0.0.0.0
    name: immich-mini:Q4_K_M
  qwen3-test:BF16:
    ttl: 300
    cmd: |-
      ${binary} -m /models/scanned/qwen3-test/big-BF16.gguf --port ${PORT} --host 0.0.0.0
    name: qwen3-test:BF16
macros:
  binary: /usr/local/bin/llama-server
