  kind: ConfigMap
  metadata:
    name: strata-profile
    namespace: default
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    annotations:
      reloader.stakater.com/auto: 'true'
    labels:
      app.kubernetes.io/controller: strata
      app.kubernetes.io/instance: gpu-ai-llama-swap
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/name: llama-swap
      helm.sh/chart: app-template-5.0.1
    name: gpu-ai-llama-swap-strata
    namespace: default
  spec:
    replicas: 1
    revisionHistoryLimit: 3
    selector:
      matchLabels:
        app.kubernetes.io/controller: strata
        app.kubernetes.io/instance: gpu-ai-llama-swap
        app.kubernetes.io/name: llama-swap
    strategy:
      type: Recreate
    template:
      metadata:
        labels:
          app.kubernetes.io/controller: strata
          app.kubernetes.io/instance: gpu-ai-llama-swap
          app.kubernetes.io/name: llama-swap
      spec:
        automountServiceAccountToken: false
        containers:
        - args:
          - -config
          - /app/config/config.yaml
          image: ghcr.io/ownyourio/strata:main
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          name: strata
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            limits:
              memory: 110Gi
            requests:
              cpu: 8
              memory: 64Gi
          securityContext:
            privileged: true
          startupProbe:
            failureThreshold: 150
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          volumeMounts:
          - mountPath: /models
            name: models
          - mountPath: /app/config
            name: strata-config
          - mountPath: /dev/dri
            name: strata-dri
          - mountPath: /dev/kfd
            name: strata-kfd
          - mountPath: /profile
            name: strata-profile
          - mountPath: /dev/shm
            name: strata-shm
        dnsPolicy: ClusterFirst
        enableServiceLinks: false
        hostIPC: false
        hostNetwork: false
        hostPID: false
        initContainers:
        - command:
          - /opt/strata/bin/fetch_models.sh
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                key: token
                name: hf-token
          - name: STRATA_MODEL_ORCA
            value: orca/IQ4_XS
          - name: STRATA_MODEL_ORN
            value: orn/UD-Q4_K_XL
          - name: STRATA_MODEL_Q4
            value: unsloth/UD-Q4_K_XL
          - name: STRATA_QUANTS
            value: q3,orca,q4,orn
          image: ghcr.io/ownyourio/strata:main
          imagePullPolicy: Always
          name: model-fetch
          resources:
            limits:
              memory: 32Gi
            requests:
              cpu: 200m
              memory: 2Gi
          securityContext:
            privileged: true
          volumeMounts:
          - mountPath: /models
            name: models
          - mountPath: /dev/dri
            name: strata-dri
          - mountPath: /dev/kfd
            name: strata-kfd
        securityContext:
          seccompProfile:
            type: Unconfined
          supplementalGroups: []
        serviceAccountName: gpu-ai-llama-swap
        terminationGracePeriodSeconds: 420
        volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-swap
        - configMap:
            name: strata-config
          name: strata-config
        - hostPath:
            path: /dev/dri
            type: Directory
          name: strata-dri
        - hostPath:
            path: /dev/kfd
            type: CharDevice
          name: strata-kfd
        - configMap:
            name: strata-profile
          name: strata-profile
        - emptyDir:
            medium: Memory
            sizeLimit: 2Gi
          name: strata-shm
- apiVersion: v1
  kind: Service
  metadata:
    labels:
      app.kubernetes.io/instance: gpu-ai-llama-swap
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/name: llama-swap
      app.kubernetes.io/service: gpu-ai-llama-swap-strata
      helm.sh/chart: app-template-5.0.1
    name: gpu-ai-llama-swap-strata
    namespace: default
  spec:
    ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
    selector:
      app.kubernetes.io/controller: strata
      app.kubernetes.io/instance: gpu-ai-llama-swap
      app.kubernetes.io/name: llama-swap
    type: ClusterIP
