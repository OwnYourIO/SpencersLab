# cf-143 pre-TICKET strata render baseline (test-session capture, 2026-11-11).
# The Q5 guarantee made executable: peers.strata and every strata render leg
# (controller Deployment, Service, config/profile ConfigMaps) must stay
# byte-identical through C01/C04/C05/C07 — the radiance waves are ADDITIVE.
# Captured via strata_testlib.render_service_overlay('gpu-ai') — the real
# appset release name (gpu-ai-llama-swap), the live llama-swap: subtree from
# services/gpu-ai/prod/values.yaml, domain/clusterName as the appset injects —
# at branch tip ee102d959 (clean tree, zero cf-143 code edits), helm v3.16.4 +
# app-template 5.0.1; docs sorted by kind/name, keys sorted. test_coexistence_
# wiring.py compares the same parsed docs against this file. Editing this
# fixture outside a test session is fixture breakage — the red, not a fix.
- apiVersion: v1
  data:
    config.yaml: "apiKeys: []\nglobalTTL: 0\nhealthCheckTimeout: 1800\nlogToStdout: both\nmatrix:\n  sets:\n    main: (p | s | o | q | n)\n  vars:\n    \"n\": ornith-1.5-122b-strata-q4\n    o: qwen3.8-flash-next-strata-orca\n    p: qwen3.8-flash-next-strata\n    q: qwen3.8-flash-next-strata-q4\n    s: qwen3.8-flash-next-strata-strix\nmodels:\n  ornith-1.5-122b-strata-q4:\n    checkEndpoint: /health\n    cmd: bash -c 'ulimit -n 524288; exec /opt/strata/terminal/bin/strata serve --profile\n      /profile/strata-ornith-q4.json --host 127.0.0.1 --port ${PORT}'\n    description: Strata engine on the public unsloth Ornith-1.5-122B UD-Q4_K_XL trio\n      through its Qwen3.6 (qwen35moe) engine path \u2014 GGUF-direct, no pack, no token,\n      the three shards joined by the loader itself. Runs on the vendored two-hunk\n      constants carry (containers/strata carry/ornith-q36.patch, upstream issue\n    env:\n    - STRATA_REQUEST_LINES=1\n    - MALLOC_MMAP_THRESHOLD_=1048576\n    - STRATA_ALLOWED_HOSTS=gpu-ai-llama-swap-strata,gpu-ai-llama-swap-strata.default.svc,gpu-ai-llama-swap-strata.default.svc.cluster.local\n    - STRATA_DENSE_MMQ=1\n    - ROCR_VISIBLE_DEVICES=0\n    name: Ornith-1.5-122B Unsloth UD-Q4_K_XL (R9700 arena, Strata q36 path)\n    ttl: 3600\n    unloadTimeout: 180\n  qwen3.8-flash-next-strata:\n    checkEndpoint: /health\n    cmd: bash -c 'ulimit -n 524288; exec /opt/strata/terminal/bin/strata serve --profile\n      /profile/strata-iq3_s.json --host 127.0.0.1 --port ${PORT}'\n    description: Strata engine, experts pinned in a page-locked RAM arena on the R9700,\n      capped at 110592 MiB engine-side inside the 110Gi pod cgroup with a 16 GiB conversation-cache\n      budget over 16 slots; first request pays the cold pin (minutes), then residency\n      is time-shared \u2014 the arena unloads after 1h idle so the llama.cpp trio gets\n      its RAM back (set ttl 0 to pin forever).\n    env:\n    - STRATA_REQUEST_LINES=1\n    - MALLOC_MMAP_THRESHOLD_=1048576\n    - STRATA_PF_FUSED=1\n    - STRATA_PF_GEMM=1\n    - STRATA_PA_FAST=1\n    - STRATA_HIP_WMMA=1\n    - STRATA_SELECT_WMMA=1\n    - STRATA_PREFILL_CPU_SHARE=auto\n    - STRATA_ALLOWED_HOSTS=gpu-ai-llama-swap-strata,gpu-ai-llama-swap-strata.default.svc,gpu-ai-llama-swap-strata.default.svc.cluster.local\n    - ROCR_VISIBLE_DEVICES=0\n    name: Qwen3.8-Flash-Next IQ3_S (R9700 arena)\n    ttl: 3600\n    unloadTimeout: 180\n  qwen3.8-flash-next-strata-orca:\n    checkEndpoint: /health\n    cmd: bash -c 'ulimit -n 524288; exec /opt/strata/terminal/bin/strata serve --profile\n      /profile/strata-orca-iq4_xs.json --host 127.0.0.1 --port ${PORT}'\n    description: Strata engine on the gated orcarouter Uncensored pack at IQ4_XS via\n      the ORCA.md-shape manual pack \u2014 plain IQ4_XS experts are kernel-supported on\n      the q38 path (unsloth's UD-IQ4_XS is catalog-served on AMD since engine 0.1.31/0.1.32),\n      so the U9.2 ladder shift from IQ3_XXS changed rung, not flags; 57.7 GiB pinned-expert\n      arena inside the 90 GiB engine cap with the conversation-cache trimmed to 8\n      GiB; first request pays the cold pin (minutes), then residency is time-shared\n      \u2014 the arena unloads after 1h idle so the llama.cpp trio gets its RAM back.\n    env:\n    - STRATA_REQUEST_LINES=1\n    - MALLOC_MMAP_THRESHOLD_=1048576\n    - STRATA_ALLOWED_HOSTS=gpu-ai-llama-swap-strata,gpu-ai-llama-swap-strata.default.svc,gpu-ai-llama-swap-strata.default.svc.cluster.local\n    - ROCR_VISIBLE_DEVICES=0\n    name: Qwen3.8-Flash-Next Uncensored IQ4_XS (R9700 arena)\n    ttl: 3600\n    unloadTimeout: 180\n  qwen3.8-flash-next-strata-q4:\n    checkEndpoint: /health\n    cmd: bash -c 'ulimit -n 524288; exec /opt/strata/terminal/bin/strata serve --profile\n      /profile/strata-q4.json --host 127.0.0.1 --port ${PORT}'\n    description: Strata engine on the public unsloth UD-Q4_K_XL pack \u2014 the wave's\n      quality rung at 93.1% Q8_0 top-token match against the IQ3_S flagship's 87.7%,\n      paid for with a 71.7 GiB pinned-expert arena and a conversation cache held at\n      16 GiB \u2014 the U8 half-restore, the value the primary itself now runs at row-H\n      \u2014 since the HIP engine compiles the disk session files out and the full 32 GiB\n      restore would not fit the node; ~10-30% slower decode than IQ3_S on this card\n      class is the cost the U8 ruling accepts knowingly. Experts pinned in the page-locked\n      RAM arena on the R9700 inside its own 103680 declaration under the pod's 110Gi\n      cgroup; the arena unloads after 1h idle so the llama.cpp trio gets its RAM back.\n    env:\n    - STRATA_REQUEST_LINES=1\n    - MALLOC_MMAP_THRESHOLD_=1048576\n    - STRATA_ALLOWED_HOSTS=gpu-ai-llama-swap-strata,gpu-ai-llama-swap-strata.default.svc,gpu-ai-llama-swap-strata.default.svc.cluster.local\n    - ROCR_VISIBLE_DEVICES=0\n    name: Qwen3.8-Flash-Next Unsloth UD-Q4_K_XL (R9700 arena)\n    ttl: 3600\n    unloadTimeout: 180\n  qwen3.8-flash-next-strata-strix:\n    checkEndpoint: /health\n    cmd: bash -c 'ulimit -n 524288; exec /opt/strata/terminal/bin/strata serve --profile\n      /profile/strata-strix-iq3_s.json --host 127.0.0.1 --port ${PORT}'\n    description: Strata engine, gfx1151 build on the 8060S iGPU; arena lives in shared\n      LPDDR5X, manual/secondary use, unloads on idle (see the chart README, Strix-alone\n      fallback).\n    env:\n    - STRATA_REQUEST_LINES=1\n    - MALLOC_MMAP_THRESHOLD_=1048576\n    - STRATA_ALLOWED_HOSTS=gpu-ai-llama-swap-strata,gpu-ai-llama-swap-strata.default.svc,gpu-ai-llama-swap-strata.default.svc.cluster.local\n    - ROCR_VISIBLE_DEVICES=1\n    name: Qwen3.8-Flash-Next IQ3_S (Strix Halo 8060S fallback)\n    ttl: 1800\n    unloadTimeout: 180\nstartPort: 10001\n"
