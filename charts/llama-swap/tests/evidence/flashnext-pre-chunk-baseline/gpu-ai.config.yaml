apiKeys: []
globalTTL: 0
healthCheckTimeout: 3600
# hooks preloaded list: annotation-only change (2026-10-29 OOM ruling, cf-77
# strata) — qwen3.8-27b-q8 left the preload; everything else in this file
# remains the frozen 2026-10-26 flashnext-era anchor.
hooks:
  on_startup:
    preload:
    - qwen3-embedding-0.6b
includeAliasesInList: true
logLevel: info
logToStdout: proxy,http
macros:
  big-ub: "-b 2048 \n-ub 2048\n"
  ctx-1m: "-c 1010000 \n--rope-scaling yarn --rope-scale 4 --yarn-orig-ctx 262144\n-b
    512 -ub 512\n"
  ctx-256k: "--ctx-size 262144\n-b 2048 \n-ub 2048\n"
  flash-and-q8: |
    --flash-attn on
    --cache-type-k q8_0
    --cache-type-v q8_0
  moe: "-ngl 99 \n-ot \"\\.ffn_.*_exps\\.=CPU\" \n--load-mode none\n"
  moe-vl-q4: |
    -ngl 99
    --n-cpu-moe 38
    --load-mode none
  moe-vl-q8: |
    -ngl 99
    --n-cpu-moe 44
    --load-mode none
  q36-common: |
    -ngl 99
    -ot "\.ffn_.*_exps\.=CPU"
    --load-mode none
    -t 10
    -np 1
    -b 2048
    -ub 2048
    --flash-attn on
    --cache-type-k q8_0
    --cache-type-v q8_0
    --cache-reuse 1
    --no-context-shift
  q36-sampling: |
    --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0
  q38-common: |
    -ngl 999
    --flash-attn on
    --load-mode none
    -np 1
    -b 2048
    -ub 2048
    --cache-type-k q8_0
    --cache-type-v q8_0
    --cache-reuse 1
    --no-context-shift
  q38-sampling: |
    --temp 0.7 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0
  q38-think: |
    --reasoning on
    --reasoning-preserve
    --reasoning-effort medium
  server-cmd: |
    llama-server
    --port ${PORT}
    --host 0.0.0.0
    --jinja
  threads: |
    -t 10
matrix:
  sets:
    main: (q38q4 | q38q6 | q38q8 | q38q8v | q27bq6 | q27bq8 | q38orca | q38ara | q38rana
      | q38hum | homegpu) & (q35q8 | q35q8v | q35q6 | q36her | q36hui | orniq2 | ornq3
      | ornq4 | ornq5 | ornq6 | ornq8) & emb06 & homecpu
    solo: (q35bf16 | q35b1m | q38f16 | q38bf16 | q38q81m | fnq3 | fnq4 | fnorca |
      o122q3 | o122q4 | o122q5 | o122q6 | ornqbf | vl2bq8 | vl2bq4 | vl2bbf | vl4bq4
      | vl4bq8 | vl4bbf | vl8bq4 | vl8bq8 | vl8bbf | vl30bq4 | vl30bq8 | vl30bbf |
      v4tq8 | v4tq4 | v4tbf | v30tq8 | v30tq4 | v30tbf | wsp) & homecpu
  vars:
    emb06: qwen3-embedding-0.6b
    fnorca: qwen3.8-flash-next-orca-q6
    fnq3: qwen3.8-flash-next-q3
    fnq4: qwen3.8-flash-next-q4
    homecpu: home-3b-v3
    homegpu: home-3b-v3-gpu
    o122q3: ornith-1.5-122b-q3
    o122q4: ornith-1.5-122b-q4
    o122q5: ornith-1.5-122b-q5
    o122q6: ornith-1.5-122b-q6
    orniq2: ornith-1.5-35b-a3b-iq2xxs
    ornq3: ornith-1.5-35b-a3b-q3
    ornq4: ornith-1.5-35b-a3b-q4
    ornq5: ornith-1.5-35b-a3b-q5
    ornq6: ornith-1.5-35b-a3b-q6
    ornq8: ornith-1.5-35b-a3b-q8
    ornqbf: ornith-1.5-35b-a3b-bf16
    q27bq6: qwen3.6-27b-q6
    q27bq8: qwen3.6-27b-q8
    q35b1m: qwen3.6-35b-a3b-1m
    q35bf16: qwen3.6-35b-a3b-bf16
    q35q6: qwen3.6-35b-a3b-q6
    q35q8: qwen3.6-35b-a3b-q8
    q35q8v: qwen3.6-35b-a3b-q8-visual
    q36her: qwen36-heretic
    q36hui: qwen36-huihui
    q38ara: qwen38-ara
    q38bf16: qwen3.8-27b-bf16
