    description: Home Assistant 3B v3 model on GPU, Q8_0 quant
    name: Home 3B v3 (Q8_0) - GPU
    proxy: http://localhost:${PORT}
    ttl: 0
  ornith-1.5-35b-a3b-bf16:
    capabilities:
      in:
      - text
      - image
      out:
      - text
    cmd: |
      /bin/sh -c "echo 'ornith-1.5-35b-a3b-bf16 disabled on the 8GiB gpu box: BF16 non-expert weights + 256k q8_0 KV + mmproj exceed the card (66.2 GiB total; same qwen35moe class as the disabled qwen3.6-35b-a3b-bf16). Use ornith-1.5-35b-a3b-q8 (tuned) or gpu-ai.' >&2; exit 1"
