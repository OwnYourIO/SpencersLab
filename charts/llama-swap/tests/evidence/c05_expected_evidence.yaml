# C05 expected-evidence checklist - RE-BALANCED 2026-10-24 (CC1, CR6): autogen machinery
# retired by user ruling, so the initContainer/entrypoint/scanned-half/reloader-new-CM items and
# the autogen-rebuild prerequisite are DROPPED (item-by-item diff in TEST_SPEC 7quinquies); the
# merged-validate wording became POD-BOOT-IS-THE-FLEET-PROOF (user ruling); a single declared-CM
# hot-reload observation replaces the two-CM reloader coverage. Everything else KEPT verbatim,
# plus the CR5 picker-vs-display-table line. Observation channels: readonly-gpu-kubernetes MCP +
# pod logs only (NEVER kubectl apply; NO admin-* without explicit user approval; gpu-ai is
# log-level confirmation only - DECISIONS). Pre-written for mechanical OBSERVED-vs-EXPECTED diff
# after the user lands the PR; no pytest automates this pre-merge.
prerequisites:
- check: PR landed on main and release.yaml bumped charts/llama-swap version
  source: git log origin/main + charts/llama-swap/Chart.yaml
  expect: version > 1.0.21 after merge; image tags unmodified by hand
- check: CA3 consumer sweep landed as ruled (in-PR, delete-only)
  source: git diff main -- .rulesync/skills/pipeline-models/SKILL.md .opencode/skills/pipeline-models/SKILL.md
    charts/minuspod/values.yaml
  expect: two kat rows removed from source + regenerated mirror (AGENTS.md pairing); minuspod OPENAI_MODEL
    qwen3.6-27b-q6 UNCHANGED (survivor under ruling B - verified, not edited)
gpu_box:
- check: ArgoCD Application gpu
  source: readonly-gpu-kubernetes
  expect: Sync=Synced Health=Healthy, no OutOfSync on the llama-swap Application
- check: config load + model count (single declared file, CR6)
  source: llama-swap main container startup logs
  expect: 'clean load of /app/config/config.yaml (no merge surface anymore); registration count 58 (34
    live cmds + 24 echoes on gpu). POD BOOT IS THE FLEET -VALIDATE PROOF (CR6 user ruling 2026-10-24:
    a bad rendered config shows up as crashloop evidence here, not as a docker -validate gate); an operator-side
    `llama-swap -validate` of the mounted file remains a runbook step, never a test'
- check: /v1/models completeness (superset - rebased)
  source: cluster-internal service read gpu-llama-swap.default.svc via MCP service proxy
  expect: ALL 58 catalog IDs listed - echo IDs present and routable (ruling-B survivors + gpu-ai-local
    rungs echo on gpu); removed 13 IDs absent under any name; consumer aliases qwen3-vl-4b/-8b/-30b-a3b
    resolve as before; picker list matches the user-approved CR5 before/after display table
- check: echo behavior spot-proof (no download, instant fail)
  source: one request against an off-cluster echo ID (e.g. qwen38-rana) via the ingress
  expect: fast failure (~seconds), upstream log shows the disabled/not-enabled echo message, NO llama-server
    process, NO HF download traffic
- check: declared-CM watch-config hot-reload observation (single ConfigMap post-CR6)
  source: llama-swap container logs + pod rollouts on an observed llama-swap-config data change
  expect: kubelet syncs the mounted dir (~1 min) then -watch-config hot-reloads the declared file IN PLACE,
    or the stakater auto-reloader rolls the pod as coarse backstop; a bad reload keeps the old config
    running (v262). No second ConfigMap, no restart-to-reload generated half - reload semantics are the
    pre-ticket single mechanism
- check: serve smoke (ONLY with explicit user approval at run time, before any download)
  source: ingress llama.gpu.<domain> /v1/chat/completions
  expect: qwen3-vl-2b-q4 regression OK; ornith-1.5-35b-a3b-iq2xxs end-to-end with unload between; any
    fit-params probe failure => declare disabled on gpu + follow-up (abort criteria)
gpu_ai_box:
- check: post-its-own-sync config-level confirmation only
  source: readonly-ai-gpu-kubernetes pod logs
  expect: startup merged load with 58 models, ALL live (zero echoes on gpu-ai per ENABLEMENT); NO requests,
    NO restart nudging, NO serve tests
- check: flash-next q5/q6 routable but unpreloaded and set-less
  source: rendered config + logs
  expect: IDs registered; never loaded at startup; absent from every matrix set (user ruling preserved
    through CA2)
removals:
- check: REMOVED_IDS (13) fully stripped in-repo
  source: grep -rn over services/ custom-values/ charts/ skills/ .rulesync/ .opencode/ containers/ .github/
  expect: zero hits for any of qwen3-coder-next-q6/-q8, coder-next-ablit, kat-coder-q4/-q6/-q8, kat-coder-q4-1m/-q6-1m/-q8-1m,
    qwen3-30b-a3b-q4/-q8, qwen3-8b-q4/-q8 (golden fixtures excluded)
- check: matrix closure both clusters
  source: renders
  expect: every vars value and set token resolves in models (v262 matrix.go:71) - the standing pytest
    bar re-verifies; zero dangling coder/kat/qwen3-text vars
machine_global_user_owned:
- check: dangling modelIDs the USER must clear (NOT fixable from the repo - enumerate exactly)
  source: ~/.config/opencode/opencode.json + ~/.config/kilo/kilo.jsonc + coder-workspace flows
  expect: provider gpu-ai 13 entries + provider gpu-moe 9 entries referencing removed IDs (verified 2026-10-24
    at replan time); all qwen3.6 provider entries survive ruling B
