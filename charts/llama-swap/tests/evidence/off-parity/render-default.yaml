---
# Source: llama-swap/charts/app-template/templates/common.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-ai-llama-swap
  labels:
    app.kubernetes.io/instance: gpu-ai-llama-swap
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: llama-swap
    helm.sh/chart: app-template-5.0.1
  namespace: default
---
# Source: llama-swap/templates/configmap-llama-swap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-config
  namespace: default
data:
  config.yaml: |
    apiKeys: []
    globalTTL: 0
    healthCheckTimeout: 3600
    includeAliasesInList: true
    logLevel: info
    logToStdout: proxy,http
    macros:
      big-ub: "-b 2048 \n-ub 2048\n"
      ctx-1m: "-c 1010000 \n--rope-scaling yarn --rope-scale 4 --yarn-orig-ctx 262144\n-b
        512 -ub 512\n"
      ctx-256k: "--ctx-size 262144\n-b 2048 \n-ub 2048\n"
      flash-and-q8: |
        --flash-attn on
        --cache-type-k q8_0
        --cache-type-v q8_0
      moe: "-ngl 99 \n-ot \"\\.ffn_.*_exps\\.=CPU\" \n--load-mode none\n"
      moe-vl-q4: |
        -ngl 99
        --n-cpu-moe 38
        --load-mode none
      moe-vl-q8: |
        -ngl 99
        --n-cpu-moe 44
        --load-mode none
      server-cmd: |
        llama-server
        --port ${PORT}
        --host 0.0.0.0
        --jinja
      threads: |
        -t 10
    matrix:
      sets:
        main: (q38q4 | q38q6 | q38q8 | q38bf16 | q27bq6 | q27bq8 | q38her | q35q6 | q35q8
          | q35bf16 | q35b1m | homegpu | vl2bq8 | vl2bq4 | vl2bbf | vl4bq4 | vl4bq8 |
          vl4bbf | vl8bq4 | vl8bq8 | vl8bbf | vl30bq4 | vl30bq8 | vl30bbf | v4tq8 | v4tq4
          | v4tbf | v30tq8 | v30tq4 | v30tbf | orniq2 | ornq3 | ornq4 | ornq5 | ornq6
          | ornq8 | ornqbf | wsp) & homecpu
      vars:
        emb06: qwen3-embedding-0.6b
        fnher: qwen3.8-flash-next-heretic-q4
        fnorca: qwen3.8-flash-next-orca-q6
        fnq3: qwen3.8-flash-next-q3
        fnq4: qwen3.8-flash-next-q4
        homecpu: home-3b-v3
        homegpu: home-3b-v3-gpu
        o122q3: ornith-1.5-122b-q3
        o122q4: ornith-1.5-122b-q4
        o122q5: ornith-1.5-122b-q5
        o122q6: ornith-1.5-122b-q6
        orniq2: ornith-1.5-35b-a3b-iq2xxs
        ornq3: ornith-1.5-35b-a3b-q3
        ornq4: ornith-1.5-35b-a3b-q4
        ornq5: ornith-1.5-35b-a3b-q5
        ornq6: ornith-1.5-35b-a3b-q6
        ornq8: ornith-1.5-35b-a3b-q8
        ornqbf: ornith-1.5-35b-a3b-bf16
        q27bq6: qwen3.6-27b-q6
        q27bq8: qwen3.6-27b-q8
        q35b1m: qwen3.6-35b-a3b-1m
        q35bf16: qwen3.6-35b-a3b-bf16
        q35q6: qwen3.6-35b-a3b-q6
        q35q8: qwen3.6-35b-a3b-q8
        q35q8v: qwen3.6-35b-a3b-q8-visual
        q36her: qwen36-heretic
        q36hui: qwen36-huihui
        q38ara: qwen38-ara
        q38bf16: qwen3.8-27b-bf16
        q38f16: qwen38-orca-f16
        q38her: qwen38-heretic
        q38hum: qwen38-humanlike
        q38orca: qwen38-orca
        q38q4: qwen3.8-27b-q4
        q38q6: qwen3.8-27b-q6
        q38q8: qwen3.8-27b-q8
        q38q81m: qwen3.8-27b-q8-1m
        q38q8v: qwen3.8-27b-q8-visual
        q38rana: qwen38-rana
        v4tbf: qwen3-vl-4b-thinking-bf16
        v4tq4: qwen3-vl-4b-thinking-q4
        v4tq8: qwen3-vl-4b-thinking-q8
        v30tbf: qwen3-vl-30b-a3b-thinking-bf16
        v30tq4: qwen3-vl-30b-a3b-thinking-q4
        v30tq8: qwen3-vl-30b-a3b-thinking-q8
        vl2bbf: qwen3-vl-2b-bf16
        vl2bq4: qwen3-vl-2b-q4
        vl2bq8: qwen3-vl-2b-q8
        vl4bbf: qwen3-vl-4b-bf16
        vl4bq4: qwen3-vl-4b-q4
        vl4bq8: qwen3-vl-4b-q8
        vl8bbf: qwen3-vl-8b-bf16
