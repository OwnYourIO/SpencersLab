apiKeys: []
globalTTL: 0
healthCheckTimeout: 3600
hooks:
  on_startup:
    preload:
    - qwen3.8-27b-q8
    - qwen3-embedding-0.6b
includeAliasesInList: true
logLevel: info
logToStdout: proxy,http
macros:
  big-ub: "-b 2048 \n-ub 2048\n"
  ctx-1m: "-c 1010000 \n--rope-scaling yarn --rope-scale 4 --yarn-orig-ctx 262144\n-b
    512 -ub 512\n"
  ctx-256k: "--ctx-size 262144\n-b 2048 \n-ub 2048\n"
  flash-and-q8: |
    --flash-attn on
    --cache-type-k q8_0
    --cache-type-v q8_0
  moe: "-ngl 99 \n-ot \"\\.ffn_.*_exps\\.=CPU\" \n--load-mode none\n"
  moe-vl-q4: |
    -ngl 99
    --n-cpu-moe 38
    --load-mode none
  moe-vl-q8: |
    -ngl 99
    --n-cpu-moe 44
    --load-mode none
  q36-common: |
    -ngl 99
    -ot "\.ffn_.*_exps\.=CPU"
    --load-mode none
    -t 10
    -np 1
    -b 2048
    -ub 2048
    --flash-attn on
    --cache-type-k q8_0
    --cache-type-v q8_0
    --cache-reuse 1
    --no-context-shift
  q36-sampling: |
    --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0
  q38-common: |
    -ngl 999
    --flash-attn on
    --load-mode none
    -np 1
    -b 2048
    -ub 2048
    --cache-type-k q8_0
    --cache-type-v q8_0
    --cache-reuse 1
    --no-context-shift
  q38-sampling: |
    --temp 0.7 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0
  q38-think: |
    --reasoning on
    --reasoning-preserve
    --reasoning-effort medium
  server-cmd: |
    llama-server
    --port ${PORT}
    --host 0.0.0.0
    --jinja
  threads: |
    -t 10
matrix:
  sets:
    main: (q38q4 | q38q6 | q38q8 | q38q8v | q27bq6 | q27bq8 | coderq6 | coderq8 |
      q38orca | q38ara | q38rana | q38hum | q8bq4 | q8bq8 | homegpu) & (q35q8 | q35q8v
      | q35q6 | q36her | q36hui | q30q4 | q30q8) & emb06 & homecpu
    solo: (q35bf16 | q35b1m | q38f16 | q38bf16 | katq4 | katq6 | katq8 | q38q81m |
      katq41m | katq61m | katq81m | cnxabl | vl2bq8 | vl2bq4 | vl2bbf | vl4bq4 | vl4bq8
      | vl4bbf | vl8bq4 | vl8bq8 | vl8bbf | vl30bq4 | vl30bq8 | vl30bbf | v4tq8 |
      v4tq4 | v4tbf | v30tq8 | v30tq4 | v30tbf | wsp) & homecpu
  vars:
    cnxabl: coder-next-ablit
    coderq6: qwen3-coder-next-q6
    coderq8: qwen3-coder-next-q8
    emb06: qwen3-embedding-0.6b
    homecpu: home-3b-v3
    homegpu: home-3b-v3-gpu
    katq4: kat-coder-q4
    katq6: kat-coder-q6
    katq8: kat-coder-q8
    katq41m: kat-coder-q4-1m
    katq61m: kat-coder-q6-1m
    katq81m: kat-coder-q8-1m
    q8bq4: qwen3-8b-q4
    q8bq8: qwen3-8b-q8
    q27bq6: qwen3.6-27b-q6
    q27bq8: qwen3.6-27b-q8
    q30q4: qwen3-30b-a3b-q4
    q30q8: qwen3-30b-a3b-q8
    q35b1m: qwen3.6-35b-a3b-1m
    q35bf16: qwen3.6-35b-a3b-bf16
    q35q6: qwen3.6-35b-a3b-q6
    q35q8: qwen3.6-35b-a3b-q8
    q35q8v: qwen3.6-35b-a3b-q8-visual
    q36her: qwen36-heretic
    q36hui: qwen36-huihui
    q38ara: qwen38-ara
    q38bf16: qwen3.8-27b-bf16
    q38f16: qwen38-orca-f16
    q38hum: qwen38-humanlike
    q38orca: qwen38-orca
    q38q4: qwen3.8-27b-q4
    q38q6: qwen3.8-27b-q6
    q38q8: qwen3.8-27b-q8
    q38q81m: qwen3.8-27b-q8-1m
    q38q8v: qwen3.8-27b-q8-visual
    q38rana: qwen38-rana
    v4tbf: qwen3-vl-4b-thinking-bf16
    v4tq4: qwen3-vl-4b-thinking-q4
    v4tq8: qwen3-vl-4b-thinking-q8
    v30tbf: qwen3-vl-30b-a3b-thinking-bf16
    v30tq4: qwen3-vl-30b-a3b-thinking-q4
    v30tq8: qwen3-vl-30b-a3b-thinking-q8
    vl2bbf: qwen3-vl-2b-bf16
    vl2bq4: qwen3-vl-2b-q4
    vl2bq8: qwen3-vl-2b-q8
    vl4bbf: qwen3-vl-4b-bf16
    vl4bq4: qwen3-vl-4b-q4
    vl4bq8: qwen3-vl-4b-q8
    vl8bbf: qwen3-vl-8b-bf16
    vl8bq4: qwen3-vl-8b-q4
    vl8bq8: qwen3-vl-8b-q8
    vl30bbf: qwen3-vl-30b-a3b-bf16
    vl30bq4: qwen3-vl-30b-a3b-q4
    vl30bq8: qwen3-vl-30b-a3b-q8
    wsp: whisper-large-v3
models:
  coder-next-ablit:
    cmd: |
      ${server-cmd}
      ${threads}
      -hf bartowski/huihui-ai_Qwen3-Coder-Next-abliterated-GGUF:Q4_K_M
      -c 262144
      ${moe}
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --cache-reuse 1
      --no-context-shift
      -np 1
      -b 2048
      -ub 2048
      --temp 0.2 --top-p 0.95 --top-k 20
    description: huihui abliteration, bartowski GGUF; experts-on-CPU; non-thinking,
      tight sampling; 256k ctx
    name: Qwen3-Coder-Next 80B A3B abliterated (Q4_K_M)
    proxy: http://localhost:${PORT}
    ttl: 300
  home-3b-v3:
    cmd: |
      ${server-cmd}
      ${threads}
      -hf acon96/Home-3B-v3-GGUF:Q4_K_M
      -ngl 0
      -c 8192
    description: Home Assistant 3B v3 model on CPU, Q4_K_M quant; runs in parallel
