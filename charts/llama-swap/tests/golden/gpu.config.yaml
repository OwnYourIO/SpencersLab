apiKeys: []
globalTTL: 0
healthCheckTimeout: 3600
includeAliasesInList: true
logLevel: info
logToStdout: proxy,http
macros:
  big-ub: "-b 2048 \n-ub 2048\n"
  ctx-1m: "-c 1010000 \n--rope-scaling yarn --rope-scale 4 --yarn-orig-ctx 262144\n-b
    512 -ub 512\n"
  ctx-256k: "--ctx-size 262144\n-b 2048 \n-ub 2048\n"
  flash-and-q8: |
    --flash-attn on
    --cache-type-k q8_0
    --cache-type-v q8_0
  moe: "-ngl 99 \n-ot \"\\.ffn_.*_exps\\.=CPU\" \n--load-mode none\n"
  moe-vl-q4: |
    -ngl 99
    --n-cpu-moe 38
    --load-mode none
  moe-vl-q8: |
    -ngl 99
    --n-cpu-moe 44
    --load-mode none
  server-cmd: |
    llama-server
    --port ${PORT}
    --host 0.0.0.0
    --jinja
  threads: |
    -t 10
matrix:
  sets:
    main: (q38q4 | q38q6 | q38q8 | q38bf16 | q27bq6 | q27bq8 | coderq6 | coderq8 |
      q35q6 | q35q8 | q35bf16 | q35b1m | q30q4 | q30q8 | q8bq4 | q8bq8 | katq4 | katq6
      | katq8 | homegpu | vl2bq8 | vl2bq4 | vl2bbf | vl4bq4 | vl4bq8 | vl4bbf | vl8bq4
      | vl8bq8 | vl8bbf | vl30bq4 | vl30bq8 | vl30bbf | v4tq8 | v4tq4 | v4tbf | v30tq8
      | v30tq4 | v30tbf | wsp) & homecpu
  vars:
    coderq6: qwen3-coder-next-q6
    coderq8: qwen3-coder-next-q8
    homecpu: home-3b-v3
    homegpu: home-3b-v3-gpu
    katq4: kat-coder-q4
    katq6: kat-coder-q6
    katq8: kat-coder-q8
    q8bq4: qwen3-8b-q4
    q8bq8: qwen3-8b-q8
    q27bq6: qwen3.6-27b-q6
    q27bq8: qwen3.6-27b-q8
    q30q4: qwen3-30b-a3b-q4
    q30q8: qwen3-30b-a3b-q8
    q35b1m: qwen3.6-35b-a3b-1m
    q35bf16: qwen3.6-35b-a3b-bf16
    q35q6: qwen3.6-35b-a3b-q6
    q35q8: qwen3.6-35b-a3b-q8
    q38bf16: qwen3.8-27b-bf16
    q38q4: qwen3.8-27b-q4
    q38q6: qwen3.8-27b-q6
    q38q8: qwen3.8-27b-q8
    v4tbf: qwen3-vl-4b-thinking-bf16
    v4tq4: qwen3-vl-4b-thinking-q4
    v4tq8: qwen3-vl-4b-thinking-q8
    v30tbf: qwen3-vl-30b-a3b-thinking-bf16
    v30tq4: qwen3-vl-30b-a3b-thinking-q4
    v30tq8: qwen3-vl-30b-a3b-thinking-q8
    vl2bbf: qwen3-vl-2b-bf16
    vl2bq4: qwen3-vl-2b-q4
    vl2bq8: qwen3-vl-2b-q8
    vl4bbf: qwen3-vl-4b-bf16
    vl4bq4: qwen3-vl-4b-q4
    vl4bq8: qwen3-vl-4b-q8
    vl8bbf: qwen3-vl-8b-bf16
    vl8bq4: qwen3-vl-8b-q4
    vl8bq8: qwen3-vl-8b-q8
    vl30bbf: qwen3-vl-30b-a3b-bf16
    vl30bq4: qwen3-vl-30b-a3b-q4
    vl30bq8: qwen3-vl-30b-a3b-q8
    wsp: whisper-large-v3
models:
  home-3b-v3:
    cmd: |
      ${server-cmd}
      ${threads}
      -hf acon96/Home-3B-v3-GGUF:Q4_K_M
      -ngl 0
      -c 8192
    description: Home Assistant 3B v3 model on CPU, Q4_K_M quant; runs in parallel
      with GPU models
    name: Home 3B v3 (Q4_K_M) - CPU
    proxy: http://localhost:${PORT}
    ttl: 0
  home-3b-v3-gpu:
    cmd: |
      ${server-cmd}
      ${threads}
      -hf acon96/Home-3B-v3-GGUF:Q8_0
      -ngl 99
      -c 8192
    description: Home Assistant 3B v3 model on GPU, Q8_0 quant
    name: Home 3B v3 (Q8_0) - GPU
    proxy: http://localhost:${PORT}
    ttl: 0
  kat-coder-q4:
    cmd: |
      /bin/sh -c "echo 'kat-coder-q4 disabled on the 8GiB gpu box: ~80B-A3B MoE cannot fit; load attempts exhaust VRAM and freeze the node (2026-10-18 kat-coder-q6 incident). Use gpu-ai.' >&2; exit 1"
    description: DISABLED on 8GiB gpu (VRAM-exhaustion node freeze) — available on
      gpu-ai
    name: KAT Coder V2.5 Dev (Q4_K_M)
    proxy: http://localhost:${PORT}
    ttl: 0
  kat-coder-q6:
    cmd: |
      /bin/sh -c "echo 'kat-coder-q6 disabled on the 8GiB gpu box: loading it exhausted VRAM, lost the Vulkan device and froze the node 2026-10-18. Use gpu-ai.' >&2; exit 1"
    description: DISABLED on 8GiB gpu (caused 2026-10-18 node freeze) — available
      on gpu-ai
    name: KAT Coder V2.5 Dev (Q6_K)
    proxy: http://localhost:${PORT}
    ttl: 0
