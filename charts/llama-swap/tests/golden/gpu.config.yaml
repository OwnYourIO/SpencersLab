      -hf unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q6_K
      ${ctx-256k}
      ${flash-and-q8}
    description: Qwen 3.6 35B with 3B active parameters (MoE), UD-Q6_K quant
    name: Qwen 3.6 35B A3B (UD-Q6_K)
