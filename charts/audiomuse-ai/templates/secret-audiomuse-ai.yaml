# AudioMuse-AI bundled-Postgres credentials. The upstream chart consumes an
# existing Secret named via postgres.existingSecret with keys
# POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB (its existingSecretKeys
# defaults). POSTGRES_USER/DB are static to match the chart's postgres.user/db
# defaults; the password comes from the Bitwarden `audiomuse-ai` Login item.
#
# Jellyfin user-id/token are NOT pulled here: this chart version has no
# jellyfin.* values, so those credentials are entered manually in the app's
# Setup Wizard (plan phase 8i). Store them in the same Bitwarden item for
# reference, but they are not consumed by GitOps.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audiomuse-ai
spec:
  refreshInterval: 1h
  target:
    name: audiomuse-ai
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_USER: "audiomuse"
        POSTGRES_PASSWORD: "{{ `{{ .password }}` }}"
        POSTGRES_DB: "audiomusedb"
  data:
    - secretKey: password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "audiomuse-ai" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
