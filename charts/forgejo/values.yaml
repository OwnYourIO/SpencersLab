# Wrapper around the official Forgejo chart (oci://code.forgejo.org/forgejo-helm).
# Secrets live here (Bitwarden ExternalSecrets in templates/), the database is
# CNPG (templates/pg-forgejo.yaml). Chart 17.x bundles no Redis/PostgreSQL
# subcharts anymore — built-in memory cache is fine at lab scale.
# Serves BOTH the dev and infra instances: per-instance identity (APP_NAME,
# admin email, server DOMAIN/ROOT_URL, mailer) lives in each cluster's
# custom-values/<cluster>/prod-values.yaml under the `forgejo:` app key and
# deep-merges over the neutral defaults below.
# OIDC goes to the shared LAB Keycloak at login.spencerslab.com (realm
# SpencersLab) — hosted on the infra cluster; both instances join it with
# per-instance clients.
#
# Ingress stays disabled in the subchart; each service umbrella's
# generic-ingress routes its top-level git host at the <fullname>-http
# service (port 3000).

bitwardenIds:
  # SECRET_KEY for Forgejo (item's login password).
  forgejo: OVERRIDE_VIA_CUSTOM_VALUES
  # Initial admin user (username/password).
  forgejo-admin: OVERRIDE_VIA_CUSTOM_VALUES
  # CNPG database credentials — only the password is read; the username is
  # hardcoded to the initdb owner `forgejo` in the ExternalSecret (dev reuses
  # the shared dev DB item, which can't carry per-DB usernames; infra uses a
  # dedicated item).
  forgejo-pg: OVERRIDE_VIA_CUSTOM_VALUES
  # OIDC client key/secret — the instance's SSO item on the LAB Keycloak
  # (dev: shared dev SSO client, infra: client infra-forgejo; read as
  # username/password).
  forgejo-sso: OVERRIDE_VIA_CUSTOM_VALUES

domain: OVERRIDE_VIA_APPSET

forgejo:
  # Rootless image (chart default) — runs as uid 1000.
  image:
    rootless: true

  # Wrapper-named data PVC; the chart creates it (persistence.create) with
  # helm.sh/resource-policy: keep so data survives a release deletion.
  persistence:
    enabled: true
    create: true
    claimName: forgejo
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    storageClass: local-path

  service:
    http:
      type: ClusterIP
      port: 3000

  # Routed via the service umbrella's generic-ingress.
  ingress:
    enabled: false

  gitea:
    config:
      # Per-instance display name — dev and infra set their own in their
      # custom-values (forgejo.forgejo.gitea.config.APP_NAME).
      APP_NAME: "Forgejo"
      # Public identity (server.DOMAIN / ROOT_URL) is per-instance, so it
      # rides each cluster's custom-values under
      # forgejo.forgejo.gitea.config.server — not hardcoded in the chart.
      # (The chart renders gitea.config into a Secret — <fullname>-inline-
      # config — and additionalConfigFromEnvs supports secretKeyRef sources,
      # but the values themselves must live in a values file either way.)
      # External CNPG database (templates/pg-forgejo.yaml). The password is
      # NOT inline here — it arrives via additionalConfigFromEnvs below so it
      # never sits in the chart-rendered inline-config values.
      database:
        DB_TYPE: postgres
        HOST: pg-forgejo-rw:5432
        NAME: forgejo
        USER: forgejo
      # SSH port advertised in clone URLs. Must stay equal to gitSshPort in
      # the dev/infra umbrella values (the Gateway listener port it fronts);
      # the subchart falls back to its own service.ssh port (22) when unset,
      # so the external port has to be pinned here.
      server:
        SSH_PORT: 22222
      # Local sign-up stays closed; ALLOW_ONLY_EXTERNAL_REGISTRATION lets
      # Keycloak OIDC users get accounts (created on first SSO login).
      service:
        DISABLE_REGISTRATION: false
        ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      # First-login auto-registration: Keycloak users land without seeing the
      # sign-up form. Forgejo 15 accepts USERNAME of userid|nickname|email
      # only (preferred_username is invalid and silently falls back to
      # nickname). email = the email's local part as username; the email
      # claim is always present when the client has the email scope, while
      # nickname only ships if set on the Keycloak user and userid is the
      # opaque user UUID.
      oauth2_client:
        ENABLE_AUTO_REGISTRATION: true
        USERNAME: email
        UPDATE_AVATAR: false
        # `login` shows an account-linking prompt if a matching local account
        # exists; `auto` would link silently by email.
        ACCOUNT_LINKING: login

    # Preset envs override the inline config during env2ini. This is how the
    # ExternalSecret-backed values reach app.ini.
    additionalConfigFromEnvs:
      - name: FORGEJO__DATABASE__PASSWD
        valueFrom:
          secretKeyRef:
            name: pg-forgejo-secret
            key: password
      # Bitwarden-managed SECRET_KEY (forgejo item). The chart would
      # auto-generate one, but keeping it in the vault matches the lab's
      # secrets-in-Bitwarden convention.
      - name: FORGEJO__SECURITY__SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: forgejo-secret
            key: SECRET_KEY

    # Initial admin user from ExternalSecret forgejo-admin-secret
    # (keys: username/password). passwordMode keepUpdated (chart default)
    # re-applies the vault password on every pod start.
    admin:
      existingSecret: forgejo-admin-secret
      # Initial admin's contact email — per-instance; dev and infra set
      # their own in their custom-values (forgejo.forgejo.gitea.admin.email).
      email: forgejo@example.com

    # One OIDC source: the LAB Keycloak realm (login.spencerslab.com) — the
    # shared instance is hosted on the infra cluster. The key/secret keys of
    # forgejo-secret carry the instance's SSO client credentials (dev:
    # shared dev SSO client, infra: client infra-forgejo), created in the
    # SpencersLab realm.
    oauth:
      - name: "SpencersLab"
        provider: openidConnect
        existingSecret: forgejo-secret
        autoDiscoverUrl: "https://login.spencerslab.com/realms/SpencersLab/.well-known/openid-configuration"

  # Attach the <fullname>-ssh Service to the cluster's traefik Gateway
  # gitssh listener (rendered by charts/base on dev/infra, where the
  # umbrella sets gitSshPort). Port omitted → the subchart's service.ssh
  # port (22), the ClusterIP backend the route forwards raw TCP to.
  tcpRoute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: kube-system
        sectionName: gitssh
