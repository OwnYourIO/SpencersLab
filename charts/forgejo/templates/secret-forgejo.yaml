# Forgejo app secret: SECRET_KEY plus the OIDC client key/secret for the
# shared dev Keycloak client. All three values ride ONE target secret because
# the forgejo chart reads gitea.oauth[].existingSecret keys `key`/`secret`
# and the wrapper wires FORGEJO__SECURITY__SECRET_KEY from the same secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-secret
spec:
  refreshInterval: 1h
  target:
    name: forgejo-secret
    creationPolicy: Owner
  data:
    # SECRET_KEY = login password of the `dev-forgejo` item.
    - secretKey: SECRET_KEY
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "forgejo" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # OIDC client-id = username of the shared dev Keycloak client item.
    - secretKey: key
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "forgejo-sso" }}'
        property: username
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # OIDC client-secret = password of the shared dev Keycloak client item.
    - secretKey: secret
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "forgejo-sso" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
