{{- if eq (include "forgejo.lfs.s3.enabled" .) "true" }}
# Bucket shape of the S3 LFS object store, rendered only for instances that
# declare S3 storage. The four constants are template-injected here as their
# single source — an opting-in slice carries only the three activation keys,
# and no values file can fork the shape.
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-lfs-shape
type: Opaque
stringData:
  # Set explicitly — the code default is `gitea`, a bucket this lab does
  # not create.
  MINIO_BUCKET: git-lfs
  # `auto` decides from the endpoint, and an AWS-shaped endpoint gets
  # virtual-host; the virtual-host form needs git-lfs.<endpoint>, a name
  # no certificate covers.
  MINIO_BUCKET_LOOKUP: path
  # `default` is what an unset key does — only `md5` sends Content-MD5 —
  # written out so the choice is visible instead of inherited.
  MINIO_CHECKSUM_ALGORITHM: default
  # Quoted: env values are strings. false keeps every LFS download behind
  # Forgejo, so no git client ever has to reach the storage endpoint.
  SERVE_DIRECT: "false"
{{- end }}
