# Initial Forgejo admin user — the chart's gitea.admin.existingSecret
# reads keys `username`/`password` from this secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: forgejo-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "forgejo-admin" }}'
        property: username
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "forgejo-admin" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
