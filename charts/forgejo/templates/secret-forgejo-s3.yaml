# Git LFS object-store credentials on the SeaweedFS S3 gateway (Bitwarden item
# forgejo-s3). The item is a Login, so the pair is read as username/password
# and mapped onto the access_key_id/secret_access_key keys the two
# FORGEJO__LFS__MINIO_ACCESS_KEY_ID / ..._SECRET_ACCESS_KEY legs in values.yaml
# consume. One item serves every instance deploying this chart: the gateway
# grants access per bucket, so dev and infra authenticate as the same S3 user.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-s3-secret
spec:
  refreshInterval: 1h
  target:
    name: forgejo-s3-secret
    creationPolicy: Owner
  data:
    - secretKey: access_key_id
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "forgejo-s3" }}'
        property: username
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: secret_access_key
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "forgejo-s3" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
