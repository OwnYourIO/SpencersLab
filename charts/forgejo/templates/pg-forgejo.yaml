---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-forgejo
  annotations:
    # The forgejo Applications now apply server-side (cf-122
    # follow-up, user directive 2026-11-09), so this per-resource
    # override is redundant for them — it stays because it is
    # decisive if the app-level flag is ever reverted: CNPG's
    # mutating webhook defaults drift against the last-applied
    # annotation under client-side apply — the pg-coder cluster keeps
    # the same override for this reason.
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: local-path

  monitoring:
    enablePodMonitor: true

  postgresql:
    parameters:
      max_connections: "600"
      shared_buffers: 512MB

  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      secret:
        name: pg-forgejo-secret
