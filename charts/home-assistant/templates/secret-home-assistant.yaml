# HA app-side DB credentials; the recorder integration itself is owner-side
# (nothing in the chart consumes this Secret today). pg_username is forced to
# the CNPG initdb owner, same law as the pg-<release>-secret; the Bitwarden
# item contributes only the password (owner ruling 2026-11-01, mcp-secrets
# target.template pattern).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "{{ .Release.Name }}"
spec:
  refreshInterval: 1h
  target:
    name: "{{ .Release.Name }}"
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        pg_username: home-assistant
        pg_password: '{{ `{{ .pg_password }}` }}'
  data:
    - secretKey: pg_password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: SecretStore
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "home-assistant-pg" }}'
        property: password
        # Boiler plate needed for ArgoCD to not complain about a mismatch.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
