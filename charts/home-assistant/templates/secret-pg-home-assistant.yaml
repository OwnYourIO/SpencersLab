# CNPG initdb credentials, SHARED by the home-assistant and sensors clusters
# (both bootstrap with owner home-assistant). Username is forced to that initdb
# owner — the repo law is that the item's username equals the owner, so only
# the password is read from Bitwarden (owner ruling 2026-11-01; same
# target.template pattern as the mcp secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "pg-{{ .Release.Name }}-secret"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: "pg-{{ .Release.Name }}-secret"
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: home-assistant
        password: '{{ `{{ .password }}` }}'
  data:
    - secretKey: password
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "home-assistant-pg" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
