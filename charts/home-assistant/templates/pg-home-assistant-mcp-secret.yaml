# CNPG managed-role password for the postgres-<release> ToolHive MCP server.
# Username is hardcoded to the role name (readonly); only the password comes
# from Bitwarden. The LOGIN item's username must equal the role name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "pg-{{ .Release.Name }}-mcp-secret"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: "pg-{{ .Release.Name }}-mcp-secret"
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: readonly
        password: '{{ `{{ .password }}` }}'
  data:
    - secretKey: password
      remoteRef:
        key: '{{ index .Values "bitwardenIds" "mcp-pg-grow-assistant" }}'
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
