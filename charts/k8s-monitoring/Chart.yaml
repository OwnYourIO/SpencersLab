apiVersion: v2
name: k8s-monitoring
version: 1.0.18
appVersion: 1.0.0
dependencies:
- name: k8s-monitoring
  version: 4.5.5
  repository: https://grafana.github.io/helm-charts
# k8s-monitoring v4 no longer bundles the prometheus-operator CRDs; this
# dependency keeps them in the release so ArgoCD does not prune the live
# CRDs from clusters that have no kube-prometheus-stack. Pinned to the chart
# version previously bundled, so the rendered CRDs are unchanged.
- name: prometheus-operator-crds
  version: 26.0.1
  repository: https://prometheus-community.github.io/helm-charts
  condition: k8s-monitoring.prometheusOperatorObjects.enabled
