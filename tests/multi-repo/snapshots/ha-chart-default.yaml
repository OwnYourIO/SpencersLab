# cf-93 C10-era golden (post-delta default render, release ha-test, normalized by the
# suite pipeline); captured via the AUTHORIZED re-capture flow — see the suite
# header; the pre-C10 diff authority stays at ha-chart-default-preC10.yaml.
# previous-file-sha: (none)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-ha-test
spec:
  instances: 1
  imageName: ghcr.io/imusmanmalik/timescaledb-postgis:17-3.5
  primaryUpdateStrategy: unsupervised
  storage:
    size: 20Gi
    storageClass: local-path
  monitoring:
    enablePodMonitor: true
  postgresql:
    parameters:
      max_connections: '600'
      shared_buffers: 512MB
  bootstrap:
    initdb:
      database: home-assistant
      owner: home-assistant
      secret:
        name: pg-ha-test-secret
  managed:
    roles:
    - name: readonly
      ensure: present
      login: true
      inherit: true
      inRoles:
      - pg_read_all_data
      connectionLimit: 5
      passwordSecret:
        name: pg-ha-test-mcp-secret
    services:
      additional:
      - selectorType: rw
        updateStrategy: patch
        serviceTemplate:
          metadata:
            name: pg-ha-test-external
          spec:
            type: LoadBalancer
            externalTrafficPolicy: Local
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-ha-test-sensors
spec:
  instances: 1
  imageName: ghcr.io/imusmanmalik/timescaledb-postgis:17-3.5
  primaryUpdateStrategy: unsupervised
  storage:
    size: 500Gi
    storageClass: local-path
  monitoring:
    enablePodMonitor: true
  postgresql:
    parameters:
      max_locks_per_transaction: '1024'
      max_connections: '600'
      shared_buffers: 2048MB
    shared_preload_libraries:
    - timescaledb
  bootstrap:
    initdb:
      database: sensors
      owner: home-assistant
      secret:
        name: pg-ha-test-secret
      postInitTemplateSQL:
      - CREATE EXTENSION timescaledb;
      - CREATE EXTENSION postgis;
      - CREATE EXTENSION postgis_topology;
  managed:
    roles:
    - name: readonly
      ensure: present
      login: true
      inherit: true
      inRoles:
      - pg_read_all_data
      connectionLimit: 5
      passwordSecret:
        name: pg-ha-test-sensors-mcp-secret
    services:
      additional:
      - selectorType: rw
        updateStrategy: patch
        serviceTemplate:
          metadata:
            name: pg-ha-test-tsdb-external
          spec:
            type: LoadBalancer
            ports:
            - name: postgres
              port: 5433
              targetPort: 5432
              protocol: TCP
            externalTrafficPolicy: Local
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-test
spec:
  refreshInterval: 1h
  target:
    name: ha-test
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        pg_username: home-assistant
        pg_password: '{{ .pg_password }}'
  data:
  - secretKey: pg_password
    sourceRef:
      storeRef:
        name: bitwarden-login
        kind: SecretStore
    remoteRef:
      key: OVERRIDE_VIA_CUSTOM_VALUES
      property: password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-ha-test-mcp-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: pg-ha-test-mcp-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: readonly
        password: '{{ .password }}'
  data:
  - secretKey: password
    remoteRef:
      key: OVERRIDE_VIA_CUSTOM_VALUES
      property: password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-ha-test-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
