  target:
    name: pg-ha-test-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: home-assistant
        password: '{{ .password }}'
  data:
  - secretKey: password
    remoteRef:
      key: OVERRIDE_VIA_CUSTOM_VALUES
