      metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-ha-test-sensors-mcp-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-login
    kind: SecretStore
  target:
    name: pg-ha-test-sensors-mcp-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: readonly
        password: '{{ .password }}'
  data:
  - secretKey: password
    remoteRef:
      key: OVERRIDE_VIA_CUSTOM_VALUES
      property: password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ha-test
  namespace: default
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
