# Drift check: the committed generated surfaces (AGENTS.md, .opencode/agents/,
# .opencode/commands/, .opencode/skills/) must match the .rulesync/ sources.
# Runs on every PR; failures mean someone hand-edited a generated file or
# forgot to run `rulesync generate`.
name: rulesync
on:
  pull_request:

jobs:
  drift:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Pinned rulesync version — bump deliberately, read the release notes'
      # "Behavior changes", then regenerate and review the diff.
      - name: Check generated surfaces for drift
        run: npx --yes rulesync@37.0.0 generate --check
