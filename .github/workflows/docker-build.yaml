name: Build and Push Docker Containers

on:
  push:
    branches:
      - main
    paths:
      - 'containers/**'

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed-containers: ${{ steps.changed-files.outputs.all_changed_files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed containers
        id: changed-files
        run: |
          # Get all changed files in containers directory
          if [ "${{ github.event_name }}" == "push" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep "^containers/" || true)
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD | grep "^containers/" || true)
          fi
          
          # Extract unique container directories
          CONTAINERS=$(echo "$CHANGED_FILES" | cut -d'/' -f1-2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "all_changed_files=$CONTAINERS" >> $GITHUB_OUTPUT
          echo "Changed containers: $CONTAINERS"

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed-containers != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container: ${{ fromJson(needs.detect-changes.outputs.changed-containers) }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get container name
        id: container-info
        run: |
          CONTAINER_NAME=$(basename ${{ matrix.container }})
          echo "name=$CONTAINER_NAME" >> $GITHUB_OUTPUT

      - name: Derive version from git tags
        id: version
        run: |
          CONTAINER_NAME="${{ steps.container-info.outputs.name }}"

          # Version is derived from the latest git tag "<name>-v<semver>".
          # There is no VERSION file — git tags are the source of truth.
          LATEST_TAG=$(git tag -l "${CONTAINER_NAME}-v*" | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            CURRENT_VERSION="0.0.0"
            echo "No existing tags for ${CONTAINER_NAME}; starting from 0.0.0"
          else
            CURRENT_VERSION="${LATEST_TAG#${CONTAINER_NAME}-v}"
            echo "Current version (from tag ${LATEST_TAG}): ${CURRENT_VERSION}"
          fi

          # Parse semantic version and bump the patch number
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ steps.container-info.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.container }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git tag
        run: |
          # This tag is the version source for the next build; push it so
          # subsequent runs bump from it.
          git tag "${{ steps.container-info.outputs.name }}-v${{ steps.version.outputs.version }}"
          git push origin "${{ steps.container-info.outputs.name }}-v${{ steps.version.outputs.version }}"
