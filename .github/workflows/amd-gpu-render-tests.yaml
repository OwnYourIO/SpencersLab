# Render-contract tests for the FIRST-PARTY amd-gpu chart (cf-143 C08,
# DECISIONS D23 superseding D19): the app-template values subtree must keep
# rendering the restated image CMD plus the product-naming flag, the patched
# amdgpu.ids ConfigMap must mount over the plugin's const IDsPath, and the
# gpu-ai Application entry must keep its internal git-path shape — both
# trigger this ladder. `helm dependency update` runs first because C08's
# chart declares the app-template dep and the vendored tgz is gitignored
# (the fresh-tree render law, same step as radiance-render-tests.yaml).
name: amd-gpu render tests

on:
  push:
    branches:
      - main
    paths:
      - 'charts/amd-gpu/**'
      - 'services/gpu-ai/prod/values.yaml'
      - '.github/workflows/amd-gpu-render-tests.yaml'
  pull_request:
    paths:
      - 'charts/amd-gpu/**'
      - 'services/gpu-ai/prod/values.yaml'
      - '.github/workflows/amd-gpu-render-tests.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install Python dependencies
        run: pip install pytest pyyaml

      - name: Fetch chart dependencies
        run: helm dependency update charts/amd-gpu

      - name: Run test suite
        run: pytest charts/amd-gpu/tests -v

      - name: helm lint (chart)
        run: helm lint charts/amd-gpu

      - name: helm template (chart defaults)
        run: helm template amd-gpu charts/amd-gpu --set domain=spencerslab.com --set clusterName=gpu-ai
